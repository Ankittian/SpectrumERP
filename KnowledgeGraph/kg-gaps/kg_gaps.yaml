- id: G-012
  title: GRN grid columns are not nodes; "Received Qty." editability cannot be found by search
  status: open
  layer: A
  type: missing-node
  found: 2026-11-06
  found_by: Claude (Sonnet 5.5) + user
  question: Where is the Received Qty. column of the GRN form editable (especially when GRN is created against gate entry)?
  nodes:
  - form:fGRN
  - control:fGRN.ugdItemDetails
  - method:fGRN.GRNAgainst
  - method:fGRN.ugdItemDetails_InitializeLayout
  - method:fGRN.ugdItemDetails_BeforeCellActivate
  evidence: >
    Searching "GRN form received quantity editable gate entry" returned no node for the Received Qty. column. Grid columns exist
    only as string keys inside fGRN.vb (e.g. Band.Columns("Received Qty.")); Control nodes stop at the grid (ugdItemDetails,
    ugdGateEntryDetails). The search surfaced only the BR-46 rule text, which names Challan Qty., so Claude concluded no
    "Received Qty." column existed (see G-014). The real behaviour: nothing in GRNAgainst or ugdItemDetails_InitializeLayout sets
    Received Qty. to NoEdit, so it is editable for every source including Gate Entry; only BeforeCellActivate locks it
    (bIsInspectionDone). The lot grid ugdLotDetail locks it the same way. Editing it drives Accepted Qty. = Received - Rejected
    - FOC, Amount, Excess Qty., and ValidateItemDetail balance/tolerance checks.
  fix: >
    Extractor: emit a GridColumn node (id like gridcol:fGRN.ugdItemDetails.Received Qty.) for each Band.Columns("<key>") reference,
    with edges HAS_COLUMN from the grid Control and SETS_ACTIVATION / READS / WRITES from the FormMethods, carrying the
    activation value (AllowEdit/NoEdit/ActivateOnly/Hidden) and the guarding condition (source document, inspection state).
    Interim: add a domain rule for column editability (see G-013). Verify with search("Received Qty. editable") returning it.

- id: G-013
  title: GRN source-dependent-fields rule omits Received Qty. and the dispatch-challan and inspection exceptions
  status: open
  layer: B
  type: missing-doc
  found: 2026-11-06
  found_by: Claude (Sonnet 5.5) + user
  question: Where is the Received Qty. column of the GRN form editable (especially when GRN is created against gate entry)?
  nodes:
  - rule:material-receipt-note-source-dependent-fields
  - form:fGRN
  evidence: >
    Rule text (Functional_Doc_fGRN.md BR-46) says "Challan Qty. is not editable for Gate Entry". Code (GRNAgainst, gate-entry branch)
    sets Challan Qty. NoEdit but flips it to AllowEdit when a selected gate entry has GateEntrySourceNo=5 (dispatch challan).
    The rule never mentions Received Qty., which is the editable quantity for gate-entry GRNs, nor Accepted Qty. (editable only
    when btGRNQtyValidateOn=2 or the item has IsMultiRateInGRN), nor the post-inspection lock in ugdItemDetails_BeforeCellActivate.
    IMPLEMENTED_BY lists only GRNAgainst and ugdItemDetails_AfterCellUpdate; InitializeLayout, InitializeRow and BeforeCellActivate
    (where the activation is actually decided) are not linked.
  fix: >
    Rewrite the rule in domain/rules.yaml with a per-source table of Challan/Received/Accepted Qty. activation, the
    GateEntrySourceNo=5 exception, btGRNQtyValidateOn and IsMultiRateInGRN conditions and the inspection lock. Add implemented_by
    for method:fGRN.ugdItemDetails_InitializeLayout, ugdItemDetails_InitializeRow, ugdItemDetails_BeforeCellActivate. Consider a
    separate rule grn-received-qty-editability so it ranks for this question.

- id: G-014
  title: First answers wrongly said the GRN grid has no Received Qty. column (self-correction)
  status: noted
  layer: D
  type: answer-quality
  found: 2026-11-06
  found_by: Claude (Sonnet 5.5)
  question: Where is the Received Qty. column of the GRN form editable (especially when GRN is created against gate entry)?
  nodes:
  - form:fGRN
  - method:fGRN.GRNAgainst
  evidence: >
    The first answer treated the KG as complete: it said the grid had no column literally keyed "Received Qty." and answered for
    Challan/Accepted Qty. instead. The user pointed out the column exists; direct reading of fGRN.vb confirmed it (lines 269, 1276,
    2234, 4537, 6700). Partly a KG gap (G-012) and partly a method error: a graph search that returns nothing for a column name is
    not proof the column is absent, and the search/get_node reads were never checked against the source. The KG server also dropped
    mid-session, so the confirming read was done on the source file.
  fix: >
    Lesson, no KG change: for "is column X editable" questions, grep the form source for the column key
    (Band.Columns("X")) and check every handler that sets CellActivation (GRNAgainst, InitializeLayout, BeforeCellActivate)
    before answering; tell the user when a graph miss may be an extraction gap.

