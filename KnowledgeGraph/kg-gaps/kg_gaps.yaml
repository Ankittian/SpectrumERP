# KG gap log - SOURCE OF TRUTH. Edit this file, never KG_GAP_LOG.md / kg_gaps.csv (generated).
#   python kg-gaps/gaps.py check     validate schema, ids and gap references
#   python kg-gaps/gaps.py render    check, then write KG_GAP_LOG.md and kg_gaps.csv
#
# gaps[]: id (G-nnn, unique), title, status, layer, type, found, found_by, question, nodes[], evidence, fix
#   status: open | in-progress | fixed | noted        layer: A extraction | B functional (YAML) | C cross-layer links | D doc quality
#   type:   missing-node | missing-edge | wrong-edge | missing-doc | stale | ambiguous | answer-quality
#   fixed:  also set `fixed: <date>` and `build: <kg build id or date>`
#   nodes:  KG node ids affected. form:/concept:/rule:/process:/module: ids are checked against domain/*.yaml;
#           sp:/table:/column:/method: ids are format-checked only (live check needs Neo4j).
# form_map[]: one block per form (module, manages, uses, processes, rules[], gaps[]).
#   rules[]: key, type, implemented_by[] (full node ids), governs[] (process keys), gaps[] (optional)

gaps:
- id: G-001
  title: Lot-stock SPs called by Purchase Bill authorization are not in the graph
  status: open
  layer: A
  type: missing-node
  found: 2026-11-06
  found_by: Claude (Sonnet 5.5) + user
  question: How does lot rate change in purchase bill?
  nodes:
  - sp:finance.pbpbauthorize
  - sp:finance.fifiauthorize
  - sp:inventory.igrnauthorize
  - sp:inventory.invlotmaterialtransaction
  - sp:inventory.invlotbilltaxtransaction
  - sp:inventory.invlotbillmapcalculation
  evidence: >
    sp:finance.pbpbauthorize code EXECs Inventory.InvLotMaterialTransaction, Inventory.InvLotBillTaxTransaction,
    Inventory.InvLotBillMapCalculation (and masterdata.TDSTCSThreholdStatus). None exists as a node, and pbpbauthorize has no
    outgoing CALLS_SP. The three SPs appear only inside the code text of pbpbauthorize, fifiauthorize and igrnauthorize.
    Impact: the lot rate math (ItemRate/DiffRate/VRate/LRate/DiffInLRate on InvLotSummary/InvLotBillDetail) for GRN-based
    bills cannot be answered from the KG.
  fix: >
    The extractor loads only SPs bundled per form (source_files phase-1/.../fPurchaseBill/StoredProcedures). Add a transitive SP
    closure step: parse each SP's EXEC targets and pull any missing SP into the graph from the DB scripts folder with a bundle
    tag such as shared-inventory-lot. Re-run `kg build` and check pbpbauthorize -CALLS_SP-> returns the 4 SPs.

- id: G-002
  title: Lot tables have almost no writer SPs; lot rate column lineage is incomplete
  status: open
  layer: A
  type: missing-edge
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - table:inventory.invlotsummary
  - table:inventory.invlotdetail
  - table:inventory.invlotbilldetail
  - table:inventory.invlottaxdetail
  - column:inventory.invlotdetail.lrate
  - column:inventory.invlotbilldetail.vrate
  - column:inventory.invlotbilldetail.diffinlrate
  evidence: >
    Writers found: InvLotSummary <- igrnauthorize, fifiauthorize, pbpbauthorize; InvLotBillDetail <- vouchersavefortransaction,
    fifiauthorize (not pbpbauthorize); InvLotTaxDetail <- fifiauthorize only. For PBPB the writes happen inside the missing SPs
    (G-001). column:inventory.invlotdetail.lrate is written only by fifiauthorize, so it looks as if only the freight invoice
    changes the landed rate. Impact analysis and field lineage on lot columns are misleading.
  fix: >
    Resolved by G-001. Then verify WRITES on the 4 lot tables include the three lot SPs and USES_COLUMN shows ops=[write]
    for lrate, vrate, diffinlrate, itemrate.

- id: G-003
  title: No Freight Invoice form, concept, or process step
  status: open
  layer: B
  type: missing-node
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
