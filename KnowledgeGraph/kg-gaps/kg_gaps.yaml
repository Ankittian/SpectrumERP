  - table:finance.freightinvoicemain
  - rule:shared-write-finance-freightinvoicemain
  evidence: >
    Name search over Form/BusinessConcept/BusinessProcess for freight, lot, landed, invoice, stock valu returns nothing.
    sp:finance.fifiauthorize (tag FIFI, tables Finance.FreightInvoiceMain/Detail) changes lot rates and is called from
    igrnauthorize and ilpusave. The rule shared-write-finance-freightinvoicemain exists but no form owns the concept.
  fix: >
    Add the freight invoice form YAML (domain/forms/<form>.yaml; find the form from Finance.FreightInvoiceMain writers via
    USES_TABLE), add concept:freight-invoice, and attach it to the P2P / payment-flow process.

- id: G-004
  title: No concepts for stock lot / landed rate / valuation rate
  status: open
  layer: B
  type: missing-node
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - form:fPurchaseBill
  - concept:purchase-bill
  evidence: >
    62 concepts exist, none for Stock Lot, Landed Rate (LRate), Valuation Rate (VRate), Rate difference (DiffRate) or PO rate
    validation. fPurchaseBill MANAGES only concept:purchase-bill and USES_CONCEPT lists 28 concepts, none about lots or rates.
    Functional-layer search for "lot rate" hits only rules and columns; PERSISTED_IN cannot map the lot tables.
  fix: >
    Add concepts stock-lot, landed-rate, valuation-rate (synonyms LRate, VRate, MAP rate, lot rate) to domain/concepts.yaml,
    RELATED_TO goods-receipt-note, purchase-bill, purchase-order, and PERSISTED_IN the Inventory.InvLot* tables. Link the
    rules in G-005 to them via applies_to.

- id: G-005
  title: Lot-rate rule text is thin and IMPLEMENTED_BY is incomplete
  status: open
  layer: B
  type: missing-doc
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - rule:purchase-bill-stock-on-authorization
  - rule:purchase-bill-voucher-vs-lot-and-po-rate
  - rule:purchase-bill-authorization-limit
  - sp:finance.pbpbauthorize
  - sp:customize.iskconporatevalidation
  evidence: >
    (1) stock-on-authorization says rate = basic amount / billed quantity. Code (PBPBAuthorize) also divides by ChallanQty when
    QtybasedOn=1 else Qty, rounds to 2 decimals (decimal(12,2)), and only does this for PBSourceDocumentNo=1 AND IsUpdateStock=1.
    (2) It is IMPLEMENTED_BY only pbpbauthorize; the lot SPs (G-001) are not linked.
    (3) The GRN/SIN path (percentage split by ReceivedQty x (MAPRate or VRate), then InvLotBillTaxTransaction and
    InvLotBillMapCalculation) is one sentence.
    (4) voucher-vs-lot-and-po-rate mentions "client rule 118"; the code gates on POMain.IsPORateValidationRequired = 1 and
    FreightTypeNo = 1 (To Pay) in schema Customize, and rule number 118 is not traceable in the code that was read.
    (5) The PO-rate cap formula (ItemRate + sum DiffRate other doc + sum DiffRate this doc > POItemDetail.Rate) is not in any
    rule text.
    (6) Verify purchase-bill-authorization-limit describes the PO LRate comparison (form 202, POAmendmentItemLRate.LRate,
    LimitFrom/LimitTo).
  fix: >
    Rewrite these rule descriptions in domain/rules.yaml with the formulas and conditions; add implemented_by for the lot SPs
    after G-001; confirm what "rule 118" means with a domain owner.

- id: G-006
  title: Freight-driven rate change has no rule
  status: open
  layer: B
  type: missing-doc
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - sp:finance.fifiauthorize
  - process:payment-flow
  evidence: >
    FIFIAuthorize allocates freight to lots by value, sets DiffRate, VRate, DiffInLRate and does InvLotSummary.VRate += DiffRate,
    LRate += DiffInLRate. @SetRateZero=0 zeroes all rate changes when the PO is "Against DO" (PORefDocumentTypeNo=9).
    No BusinessRule describes this.
  fix: >
    Add rules freight-invoice-lot-rate-allocation and against-do-po-no-rate-change; applies_to the freight form (G-003) and the
    concepts (G-004); implemented_by sp:finance.fifiauthorize; governs payment-flow.

- id: G-007
  title: Most Purchase Bill rules do not GOVERN any process
  status: open
  layer: B
  type: missing-edge
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - form:fPurchaseBill
  - process:payment-flow
  - process:gst-tax-determination
  evidence: >
    Of 119 rules that APPLY_TO form:fPurchaseBill, among the purchase-bill-* rules only stock-on-authorization,
    update-stock-and-dropshipment and voucher-vs-lot-and-po-rate have a GOVERNS edge (to gst-tax-determination and
    payment-flow). The rest have none, so top-down navigation (Process -> rules) misses almost all bill rules.
  fix: >
    Set processes: for each purchase-bill rule in the rule YAML (usually payment-flow; GST ones also gst-tax-determination).
    Script it: default every rule whose only applies_to form is fPurchaseBill to payment-flow, then review GST rules by hand.

- id: G-008
  title: fPurchaseBill is not a step of procure-to-pay
  status: open
  layer: B
  type: missing-edge
  found: 2026-11-06
  found_by: Claude
  question: How does lot rate change in purchase bill?
  nodes:
  - form:fPurchaseBill
  - process:procure-to-pay
  - process:payment-flow
  evidence: >
    process:procure-to-pay has no HAS_STEP to form:fPurchaseBill; the form is a step only of gst-tax-determination and
    payment-flow. The module is FI while the PO flow lives in MM.
  fix: >
    Decide whether the bill belongs in P2P (probably yes, the step after GRN). If yes, add the step to
    domain/processes/procure-to-pay.yaml; if no, document the hand-off (LEADS_TO) to payment-flow.

