- key: master-auto-authorization
  name: Master records are saved as authorized
  type: workflow
  summary: Master records are stamped as authorized by the saving user on save.
  description: 'Evidence: code

    Master records are stamped as authorized by the saving user on save.

    Per form:

    - fChapterHeading (BR-04 Authorised, All Companies): Headings are saved as authorised by the saving user; a new heading
    is made available, active, in every company

    - fCityMaster (BR-06 Authorised and Distributed): Saves are authorised by the saver; a new city is made available to all
    companies with Inactive not set

    - fCostCenterMaster (BR-06 Authorised and Distributed): Every save marks the cost center authorised by the saver; a new
    one is made available to all companies with Inactive not set

    - fCurrencyMaster (BR-07 Authorised, All Companies): Currencies are saved as authorised by the saving user and a new currency
    is made available, active, in every company

    - fExpenseHead (BR-06 Authorised and Distributed): Saves are authorised by the saver; a new head is made available to
    all companies with Inactive not set

    - fItemMaster (BR-27 Immediate Authorisation): Every save sets the item to authorised status with the saving user and
    time as authoriser

    - fMakeMaster (BR-06 Authorised on Save): Every save sets the make status to authorised and records the saving user and
    time as authoriser

    - fPermitMaster (BR-06 Automatic Authorization): Every save sets status to authorized (30), with the saving user and current
    date as authorizer

    - fQCParameter (BR-11 Automatic Authorization): Every save sets status authorized (30) with the saving user as authorizer

    - fQualityParameter (BR-13 Automatic Authorization and Company Copy): Every save sets status authorized with the saving
    user; a new parameter is linked to every company as active

    - fSingleFieldMaster (BR-12 Automatic Authorisation): Saved entries get document status 30 with the saving user and time
    as authoriser (not for Technical Grade)

    - fSpecification (BR-11 Distribution and Authorization): A new specification is made available to every company; every
    save sets status authorized with the saving user

    - fTechSpecificationHeadMaster (BR-07 Authorised on Save, All Companies): Heads are saved as authorised by the saving
    user; a new head is made available, active, in every company

    - fVendorContactPerson (BR-10 Automatic Authorization and Company Copy): Every save sets status authorized with the saving
    user; a new contact is linked to every company as active

    - fWarehouse (BR-08 Automatic Authorization): Every save sets status authorized with the saving user

    '
  applies_to:
  - form:fChapterHeading
  - form:fCityMaster
  - form:fCostCenterMaster
  - form:fCurrencyMaster
  - form:fExpenseHead
  - form:fItemMaster
  - form:fMakeMaster
