- key: head-office-master-governance
  name: Masters are maintained at the head office
  type: control
  summary: At non-head-office companies the master screens are read-only or restricted.
  description: 'Evidence: code

    At non-head-office companies the master screens are read-only or restricted.

    Per form:

    - fAccountGroupMaster (BR-01 Head Office Authority): Save and Delete are allowed only when the login company is the head
    office; elsewhere the loaded record is fully locked (MSG-13, MSG-14); messages: "Permission denied to save.", "Permission
    denied to delete."

    - fAccountMaster (BR-19 Head Office Authority): Outside head office, new accounts cannot be saved (MSG-31), accounts cannot
    be deleted (MSG-35), and loaded accounts are locked; messages: "Permission denied to save.", "Permission denied to delete."

    - fAccountRuleDefinition (BR-03 Account Fixed After Save; Branch Lock): When an existing rule is loaded, "Account Name"
    is read-only; when the user''s company is not head office, all controls are locked on load

    - fActivityMaster (BR-24 Branch Lock): When the user''s company is not head office, all controls are locked when the screen
    opens

    - fBINCard (BR-02 Not at Head Office): A bin cannot be saved when the login company is a head office (MSG-12); messages:
    "BIN can''t be save in Head Office"

    - fChangeItemUnitWeight (BR-01 Head Office Authority): Outside head office all controls are locked

    - fChapterHeading (BR-06 Head Office Governance): At non-head-office companies all controls are locked

    - fCityMaster (BR-01 Head Office Authority): Outside head office all controls are locked after New and after a record
    is loaded; no lock is applied on first opening

    - fCostCenterMaster (BR-01 Head Office Authority): Outside head office all controls are locked

    - fCostCenterMaster (BR-07 Company Inactive at Head Office): With multi-company enabled at head office, save deletes all
    company rows and recreates them from the Company Inactive grid, which lists active companies only

    - fCurrencyConversion (BR-01 Head Office Authority): Outside the head office all controls are locked

    - fCurrencyMaster (BR-01 Head Office Governance): At non-head-office companies all controls are locked when the screen
    opens

    - fExpenseHead (BR-01 Head Office Authority): Outside head office all controls are locked on load, after record load and
    after New

    - fHSNCode (BR-07 Head Office Governance): At non-head-office companies all controls are locked

    - fItemMaster (BR-01 Head Office Authority): When the logged-in company is not the head office, every control on the screen
    is locked. Key fields are unlocked on New only for the head office

    - fMakeMaster (BR-01 Head Office Authority): When the logged-in company is not the head office, every control on the screen
    is locked on load

    - fPaymentPlan (BR-03 Head Office View): In the head office company, units include all active branch companies and Unit
    Name and HO Current Balance are shown; elsewhere only the own company and these columns are hidden

    - fProductionUnit (BR-07 Head Office Governance): At non-head-office companies a loaded unit is locked except Inactive

    - fPurchaseOrganization (BR-08 Head Office Governance): At non-head-office companies a loaded organization is locked except
    Inactive

    - fQCParameter (BR-12 Branch Lock): For a non-head-office login, a loaded parameter is fully locked; the Inactive checkbox
    is always disabled

    - fSingleFieldMaster (BR-02 Head Office Authority): Only the head office company may create (MSG-01) or delete (MSG-02)
    entries; in other companies all controls are locked on opening

    - fTDCAccountRule (BR-01 Head Office Lock After Load): Outside head office all controls are locked after a rule is loaded;
    New unlocks them again

    - fVendorCard (BR-01 Head Office Authority): In a branch company every control is locked when the screen opens, and Delete
    is refused with MSG-46. Save itself has no company check (see Section 13); messages: "Permission denied to delete Vendor
    Card."

    - fVendorContactPerson (BR-13 Branch Access and Search Scope): For a non-head-office login all controls are locked on
    load; search lists contacts linked to the login company

    - fVendorLocation (BR-01 Head Office Authority): Outside the head office every control is locked on opening and delete
    is refused (MSG-22); save has no separate authority check; messages: "Permission denied to delete Vendor Location."

    - fWarehouse (BR-12 Branch Access): For a non-head-office login a loaded warehouse is locked except Inactive; Save is
    still allowed

    '
  applies_to:
  - form:fAccountGroupMaster
