- key: master-per-company-activation
  name: Masters are created once and activated per company
  type: integrity
  summary: A new master is made available in the companies listed per form, with per-company detail rows.
  description: 'Evidence: code

    A new master is made available in the companies listed per form, with per-company detail rows.

    Per form:

    - fActivityMaster (BR-05 Uniqueness within Company): Activity name (MSG-02), alias (MSG-04) and sequence number above
    zero (MSG-05) must be unique among activities available to the user''s company, checked in that order; messages: "Duplicate
    Activity Name is not allowed.", "Duplicate Alias is not allowed.", "Duplicate Sequence No. is not allowed."

    - fChapterHeading (BR-04 Authorised, All Companies): Headings are saved as authorised by the saving user; a new heading
    is made available, active, in every company

    - fCityMaster (BR-06 Authorised and Distributed): Saves are authorised by the saver; a new city is made available to all
    companies with Inactive not set

    - fCostCenterMaster (BR-03 Unique Name per Company): The trimmed name may not equal another cost center''s name available
    in the logged-in company (MSG-02); messages: "Duplicate CostCenter Name not allowed."

    - fCostCenterMaster (BR-06 Authorised and Distributed): Every save marks the cost center authorised by the saver; a new
    one is made available to all companies with Inactive not set

    - fCurrencyMaster (BR-07 Authorised, All Companies): Currencies are saved as authorised by the saving user and a new currency
    is made available, active, in every company

    - fExpenseHead (BR-06 Authorised and Distributed): Saves are authorised by the saver; a new head is made available to
    all companies with Inactive not set

    - fFBPeriodMapping (BR-01 No Company Restriction on Editing): The screen applies no head office lock; any user with access
    may save

    - fFinanceBook (BR-05 Unit Level Company): A Unit Level book must have a Company Name; the list hides companies already
    used by any other book (MSG-05); messages: "Select valid Company Name."

    - fItemMaster (BR-25 Company Availability): A new item is created active in every company. In multi-company mode, the
    head office sees the Company tab and each save replaces the item''s company rows with the grid''s rows and Inactive flags.
    The header Inactive checkbox is display-only

    - fMakeMaster (BR-04 Unique Make Name per Company): A make name may not match another make available in the logged-in
    company when both names are reduced to letters and digits only; the make being edited is excluded (MSG-02); messages:
    "Duplicate Make Name not allowed."

    - fMakeMaster (BR-07 Distribution to All Companies): A new make is made available to every company with Inactive not set

    - fPermitMaster (BR-05 All-company Distribution): A new permit is made available, active, to every company

    - fQCParameter (BR-10 All-company Distribution): A new parameter is made available, active, to every company

    - fQualityParameter (BR-13 Automatic Authorization and Company Copy): Every save sets status authorized with the saving
    user; a new parameter is linked to every company as active

    - fSingleFieldMaster (BR-11 Company Availability): On creation, Location, Category, Tech Specification and Quality Parameter
    Type entries receive an active availability row for every company; Technical Grade has no company rows. The Location city
    is left empty

    - fSpecification (BR-11 Distribution and Authorization): A new specification is made available to every company; every
    save sets status authorized with the saving user

    - fTDCMaster (BR-08 All-company Distribution): A new charge is made available, active, to every company

    - fTechSpecificationHeadMaster (BR-03 Name Unique per Company): The name must not exist on another head available in the
    current company (MSG-03); messages: "Duplicate Technical Specification Head name not allowed"

    - fTechSpecificationHeadMaster (BR-07 Authorised on Save, All Companies): Heads are saved as authorised by the saving
    user; a new head is made available, active, in every company

    - fVendorCard (BR-04 Unique Vendor Name per Company): The name, compared on letters and digits only, must not match another
    vendor present in the current company; the vendor itself is excluded; the type is not considered; MSG-03; messages: "Duplicate
    Vendor Name not allowed."

    - fVendorCard (BR-07 Company Vendor): For Vendor Type Company:; messages: "Select valid Company Name."

    - fVendorCard (BR-23 Company Availability): On creation the vendor, location, contacts and banks are made active in every
    company. At a multi-company head office the "Company" tab is shown and its rows replace the vendor''s company rows on
    each save

    - fVendorCard (BR-32 Divisions for Company Vendors): The "Division" tab is shown, and its ticked rows with their default
    flag saved, only when Vendor Type is Company and the linked company has divisions

    - fVendorContactPerson (BR-10 Automatic Authorization and Company Copy): Every save sets status authorized with the saving
    user; a new contact is linked to every company as active

    - fVendorLocation (BR-17 Company Availability): A new location is made available, active, to all companies. At head office
    in a multi-company setup, the "Company" grid replaces all company rows of the location on every save

    - fWarehouse (BR-05 Company/Division Assignment): At least one company/division must be ticked; the list holds active
    companies under the head office and, where the head office uses divisions, their active divisions (MSG-06); messages:
    "Select atleast one Company/Division."

    '
