- key: atomic-save
  name: Header and details are saved in one transaction
  type: integrity
  summary: Header and detail rows are saved inside one database transaction and rolled back together on error.
  description: 'Evidence: code

    Header and detail rows are saved inside one database transaction and rolled back together on error.

    Per form:

    - fDocumentReceipt (BR-21 All or Nothing Save): Header, links, custom fields and notes are saved in one transaction; any
    failure rolls back all of them and shows the error

    - fGRN (BR-38 Concurrency): A GRN changed by another user since load is refused (MSG-102); messages: "Reload GRN, this
    GRN is modified by someone else. "

    - fIndent (BR-32 Single Transaction Save): Header and all child rows are saved in one transaction and rolled back on error;
    only notes with print area and text are saved; messages: "Document No. <number> saved successfully."

    - fIndentRequisition (BR-28 Single Transaction Save): Header, lines, sub-details, custom fields and notes are saved in
    one transaction; any error rolls back all of them. Only notes with both a print area and text are saved; messages: "Document
    No. <number> saved successfully.", "Authorize Indent Requisition No. can''t be update."

    - fPaymentPlan (BR-22 All or Nothing Save): Header, items, allocations, splits and cash entries are saved in one transaction;
    messages: "Document No. ", " saved successfully."

    - fPaymentRequest (BR-13 All or Nothing Save): Header and tax rows are saved in one transaction; any failure rolls back
    and shows the error. On update, existing tax rows are deleted first

    - fPurchaseOrder (BR-53 Concurrency): If the order or its amendment changed since it was loaded, the save is rejected
    (MSG-141, MSG-142); messages: "Someone updated this Purchase Order Amendment , please reload.", "Someone updated this
    Purchase Order, please reload."

    '
  applies_to:
  - form:fDocumentReceipt
  - form:fGRN
  - form:fIndent
  - form:fIndentRequisition
  - form:fPaymentPlan
  - form:fPaymentRequest
  - form:fPurchaseOrder
  implemented_by:
  - method:fDocumentReceipt.Save
  - method:fIndent.Save
  - method:fIndent.SaveNotesDetail
  - method:fIndentRequisition.Save
