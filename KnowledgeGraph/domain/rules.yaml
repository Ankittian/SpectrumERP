- key: detail-replacement-on-save
  name: Detail rows are replaced on save
  type: integrity
  summary: On update the detail rows are deleted and re-inserted from the screen.
  description: 'Evidence: code

    On update the detail rows are deleted and re-inserted from the screen.

    Per form:

    - fAccountRuleDefinition (BR-23 Replace on Modify): Saving an existing rule deletes all its mappings and re-inserts them
    from current ticks

    - fBINCard (BR-06 Mapping Replacement): On modify the bin''s items are always deleted and re-inserted; sub groups are
    deleted only in Sub Group Wise mode

    - fFBPeriodMapping (BR-11 Full Replacement on Save): Save deletes all existing period rows of the selected book and inserts
    every row of the period grid

    - fFinanceBook (BR-16 Detail Replacement): On modify all account, division, tax book and transaction book links are deleted
    and re-inserted, and the operative account on the header is reset then recomputed

    - fGRN (BR-27 FOC and Replaceable): FOC Qty. cannot exceed Received Qty. (MSG-55). Replaceable is editable only with rejected
    quantity; ticking it defaults Replaceable Qty. to Rejected Qty.; it must be above zero and not above Received Qty. (MSG-56,
    MSG-57); messages: "FOC Qty. can''t be greater than Received Qty. in row ", "Replaceable Qty. can''t be empty or zero
    in row ", "Replaceable Qty. can''t be greater than Received Qty. in row "

    - fGateEntry (BR-29 Update Replaces Details and GRN Guard): An entry with a GRN cannot be updated (MSG-58). On update
    all references, items, notes and custom fields are deleted and re-saved from the screen; messages: "Can''t be deleted
    as some record exist against this entry."

    - fInspectionIntimation (BR-12 Update Replaces Details): On update, notes, custom fields and lines are deleted and re-inserted

    - fItemMaster (BR-32 Child Detail Replacement on Edit): On update, bins, technical grades, chapter heading, makes, QC
    parameters, substitutes, unit conversions, vendor parts, warehouses and supplementary fields are deleted and re-inserted
    from the screen

    - fItemStandardAttributeValue (BR-16 Replacement and Sub Group Copy): An All Combination save first deletes the sub group''s
    or item''s existing values; a sub group save then copies its values to every item of the sub group for attributes the
    item lacks

    - fItemTechGradeMapping (BR-06 Full Replacement): Save first removes the stored grades: for an item, that item''s grades;
    for a subgroup, the subgroup''s grades and the grades of every item in the subgroup

    - fMakeMaster (BR-09 Item Mapping Replacement): On save, items ticked at item level in the item tree are stored against
    the make; on modification all previous mappings are deleted first

    - fPermitMaster (BR-12 Child Replacement): On modify all five child lists are deleted and re-inserted from the grids

    - fPurchaseBill (BR-61 Modification rewrite): On update, all child rows are removed and rewritten, the document receipt
    is reopened then re-marked used, excise posting is removed if unticked

    - fReportingCOASetup (BR-05 Full Replacement Save): Save removes all mapping lines of the selected COA, then writes only
    rows that have both a reporting account and a posting account

    - fRequestforQuotation (BR-20 Edit Replaces Children): Saving an existing RFQ deletes and re-inserts all technical parameters,
    items, source links, custom fields, sizes, vendors and notes, overwrites the header and resets the "CS prepared" marker

    - fSpecification (BR-12 Child Replacement): On modify all parameter, party and coverage rows are deleted and re-inserted

    - fVendorCard (BR-30 Replace-on-Save Collections): On modification, all item part numbers of the vendor, and the location''s
    group memberships, custom field values and divisions are deleted and re-inserted from the screen

    '
  applies_to:
  - form:fAccountRuleDefinition
  - form:fBINCard
  - form:fFBPeriodMapping
  - form:fFinanceBook
  - form:fGRN
  - form:fGateEntry
  - form:fInspectionIntimation
