- key: request-for-quotation-vendor-selection
  name: 'Request For Quotation: Vendor Selection'
  type: validation
  summary: Vendor Selection is mandatory (MSG-14) and defaults to All.
  description: 'Evidence: code

    Vendor Selection is mandatory (MSG-14) and defaults to All. All lists authorized, active supplier-type vendors of the
    company; Item-Vendor Mapping lists vendors mapped to the items currently in the item grid; Vendor Group (enables Vendor
    Group field) lists vendors whose locations belong to the group. Changing either field clears the vendor grid. Vendor Group
    is saved only when the field is enabled.

    Messages: "Select valid Vendor Selection."

    Source: Functional_Doc_fRequestforQuotation.md BR-11.

