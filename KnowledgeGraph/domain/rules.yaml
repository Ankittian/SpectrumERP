- key: master-code-generation
  name: Master codes are generated automatically
  type: derivation
  summary: New master records get a system generated code as listed per form.
  description: 'Evidence: code

    New master records get a system generated code as listed per form.

    Per form:

    - fAccountGroupMaster (BR-06 Automatic Code): On create the code is "AG" plus a four-digit number, one more than the highest
    existing

    - fAccountMaster (BR-02 Code, Sequence and Layout): A new account gets code "AM" plus a 6-digit running number (highest
    existing plus one) and the next sequence number; it is linked to every financial statement layout design of its group

    - fActivityMaster (BR-02 Code and Availability): A new activity gets code "AM" plus a 4-digit running number (highest
    existing plus one), is authorised automatically, and is made available and active in every company

    - fBINCard (BR-05 Automatic Code): On create the code is "BN" plus five digits, one more than the highest existing across
    all companies

    - fChartOfAccount (BR-04 Automatic Code): A new chart gets "CA" plus the next four-digit number

    - fCityMaster (BR-05 Automatic Code): New cities get "CM" plus a four-digit number, one higher than the highest existing

    - fCostCenterMaster (BR-05 Automatic Code): New cost centers get "CC" plus a six-digit number, one higher than the highest
    existing number

    - fCurrencyMaster (BR-06 Automatic Code): A new currency gets "CM" plus the next four-digit number

    - fExpenseHead (BR-05 Automatic Code): New heads get "EH" plus a four-digit number, one higher than the highest existing

    - fFinanceBook (BR-07 Automatic Code): On create the code is "FB" plus a four-digit number, one more than the highest
    existing

    - fHSNCode (BR-02 Code Required): Code is mandatory, up to 8 characters (MSG-02); messages: "Enter HSN SAC Code."

    - fHSNCode (BR-03 Code Unique): The trimmed code must not exist on another record, enterprise-wide (MSG-03); messages:
    "Duplicate HSN & SAC Code is not allowed"

    - fItemMaster (BR-05 Full Code Composition): Full Code = Category code + Group code + Subgroup code + Item Code. It is
    shown on screen as codes change and is rebuilt by the database from the Subgroup''s hierarchy at save

    - fItemMaster (BR-06 Full Code Uniqueness): Full Code must be unique, case-insensitive. The pre-save check covers items
    of the current company; the save itself checks all items in the enterprise (MSG-07); messages: "Duplicate Item Code not
    allowed."

    - fMakeMaster (BR-05 Automatic Code): A new make gets code "MM" plus a four-digit number, one higher than the highest
    existing number across all makes

    - fPermitMaster (BR-04 Automatic Code): On create the code is "PR" plus four digits, one more than the highest existing

    - fProductionUnit (BR-06 Automatic Code): A new unit gets "PU" plus the next four-digit number

    - fPurchaseOrganization (BR-03 Automatic Code): A new organization gets code "PO" plus the next four-digit number after
    the highest existing code

    - fQCParameter (BR-09 Automatic Code): On create the code is "QP" plus four digits, one more than the highest existing

    - fQualityParameter (BR-12 Automatic Code): On create the code is "QP" plus six digits, one more than the highest existing

    - fSingleFieldMaster (BR-04 Code Mandatory When Typed): When the configuration lets the user type the code (Category only),
    the code is mandatory in detail mode (MSG-03); the check is not applied in fast entry; messages: "Enter Code."

    - fSingleFieldMaster (BR-06 Code Length): The code box and the fast entry "Code" column accept at most 2 characters

    - fSingleFieldMaster (BR-09 Code Assignment): - Location: "LM" + next four-digit number when no code is given

    - fSingleFieldMaster (BR-10 Code on Modification): Location, Tech Specification and Quality Parameter Type codes do not
    change on update; a Category code is overwritten and all item full codes under the category are rebuilt as category +
    group + sub group + item code

    - fSpecification (BR-10 Automatic Code): On create the code is "SP" plus four digits, one more than the highest existing

    - fTDCAccountRule (BR-05 Automatic Code and Authorisation): New rules get "TC" plus a four-digit number; every save sets
    the saver as authoriser and Inactive to No

    - fTDCGroup (BR-02 Code Format and Uniqueness): Code must be exactly 6 characters after trimming and unique across all
    groups (MSG-02, MSG-06); messages: "Code length should be 6", "Group Code should be 6 in length", "Duplicate Code is not
    allowed."

    - fTDCMaster (BR-07 Automatic Code): On create the code is "MC" plus five digits, one more than the highest existing

    - fTechSpecificationHeadMaster (BR-04 Automatic Code): A new head gets "SH" plus the next four-digit number

    - fVendorCard (BR-22 Automatic Codes): New records get the next sequential code: vendor VC + 5 digits, location VL + 5
    digits, contact CP + 5 digits, bank BD + 5 digits, ledger account AM + 6 digits

    - fVendorContactPerson (BR-08 Automatic Code): On create the code is "CP" plus five digits, one more than the highest
    existing

    - fWarehouse (BR-07 Automatic Code): On create the code is "WH" plus four digits, one more than the highest existing

    '
  applies_to:
  - form:fAccountGroupMaster
  - form:fAccountMaster
  - form:fActivityMaster
  - form:fBINCard
  - form:fChartOfAccount
  - form:fCityMaster
  - form:fCostCenterMaster
  - form:fCurrencyMaster
