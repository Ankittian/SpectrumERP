- key: master-delete-cascade
  name: Deleting a master removes its details and company rows
  type: integrity
  summary: Delete removes the master with its detail and company rows, subject to the checks listed per form.
  description: 'Evidence: code

    Delete removes the master with its detail and company rows, subject to the checks listed per form.

    Per form:

    - fAccountGroupMaster (BR-13 Deletion): Delete requires confirmation and physically removes the group; no usage check
    is made (MSG-09, MSG-11)

    - fAccountMaster (BR-27 Delete Cascade): Deleting an "Additional Accounts" account removes its party account rule, rule
    header and party; then inactive rows, layout links, bank, interest, mappings and header are deleted. Voucher or opening
    balance usage is not checked by the delete itself

    - fAccountRuleDefinition (BR-22 Delete Scope): Delete removes all mappings and the header with no usage check

    - fActivityMaster (BR-23 Delete Scope): Delete removes all child data, aggregate links in both directions, company rows
    and the header, with no in-use check

    - fBINCard (BR-14 Deletion): Delete requires confirmation and removes items, sub groups and the bin; no usage check (MSG-10,
    MSG-11)

    - fChapterHeading (BR-09 Deletion): Delete removes item links, company availability and the heading with no usage check
    (MSG-10 to MSG-12)

    - fChartOfAccount (BR-08 Deletion): Delete removes account placements, account groups and the chart with no check of finance
    book links or postings (MSG-07 to MSG-09)

    - fCityMaster (BR-13 Delete): Delete removes the linked location, the company rows and the city with no usage check

    - fCostCenterMaster (BR-09 Delete): Delete removes company rows and the cost center; the procedure does not check usage

    - fCurrencyConversion (BR-14 Delete): Delete removes the single loaded rate without usage checks

    - fCurrencyMaster (BR-09 Deletion): Delete removes country links, company availability and the currency with no usage
    check (MSG-10 to MSG-12)

    - fExpenseHead (BR-13 Delete): Delete removes company rows, tax charges and the head with no usage check

    - fFinanceBook (BR-17 Deletion): Delete requires confirmation and removes the book with all its links and period details;
    no usage check is made before deleting (MSG-19, MSG-20)

    - fHSNCode (BR-08 Deletion): Delete removes item links and the code with no usage check (MSG-07 to MSG-09)

    - fItemMaster (BR-33 Deletion): After confirmation, the item, its company rows, other information, all child details,
    accounting rules, HSN history, rename history, rate valuation and attribute data are deleted, and linked requests reopened.
    No usage check is made before deletion

    - fItemStandardAttributeValue (BR-18 Delete): Delete removes the opened combination and its details with no usage check

    - fMakeMaster (BR-13 Delete Scope): Delete removes the item mapping, all company rows and the make itself for all companies;
    the procedure performs no usage check

    - fPermitMaster (BR-14 Deletion): Delete requires confirmation and removes company rows, child rows and the header; no
    usage check (MSG-14, MSG-15)

    - fProductionUnit (BR-08 Deletion): Delete removes coverage and the unit with no usage check (MSG-07 to MSG-09)

    - fPurchaseOrganization (BR-09 Deletion): Delete removes member lines and the header with no usage check (MSG-09 to MSG-11)

    - fQCParameter (BR-14 Deletion Authority): Only the head office may delete, after confirmation (MSG-18, MSG-19); messages:
    "Permission denied to delete QC Parameter."

    - fQualityParameter (BR-18 Deletion): Delete requires confirmation and removes the QC Parameter twin, company rows, standard
    values, variable links and the parameter without a usage check (MSG-19, MSG-20)

    - fSingleFieldMaster (BR-15 Deletion): Delete removes the entry and its availability rows for all companies in one transaction;
    no usage check is made by the operation, references from other records can make the database refuse (MSG-18)

    - fSpecification (BR-14 Deletion): Delete requires confirmation and removes company rows, children and header; no usage
    check (MSG-14, MSG-15)

    - fTDCAccountRule (BR-15 Delete Cascade): Delete removes the rule''s account rule definition links, screens, taxation
    rows, charges and header with no further check

    - fTDCGroup (BR-07 Deletion Without Usage Check): Delete physically removes the group with no check of use (MSG-11 to
    MSG-13)

    - fTDCMaster (BR-15 Deletion): Delete requires confirmation and removes account rules, tax code links, company rows and
    the charge; no usage check (MSG-13, MSG-14)

    - fTechSpecificationHeadMaster (BR-08 Deletion): Delete removes availability, item lines and head with no usage check
    (MSG-08 to MSG-11); messages: "Technical Specification not found."

    - fVendorCard (BR-29 Vendor Deletion): Only the head office can delete (MSG-46); after confirmation, deletion is refused
    when the vendor''s locations are linked to more than one account rule entry (MSG-49); otherwise the vendor and all locations,
    contacts, banks, information, custom fields, group memberships, company rows, part numbers, divisions and supplier-portal
    mappings are removed in one transaction; messages: "Permission denied to delete Vendor Card.", "Unable to delete this
    entry,used in ARD"

    - fVendorContactPerson (BR-14 Deletion): Only head office may delete; delete requires confirmation and removes the company
    rows and the contact without a usage check (MSG-08, MSG-09); messages: "Permission denied to delete Contact Person."

    - fVendorLocation (BR-24 Deletion Rules): A vendor''s only location cannot be deleted (MSG-25); a location that is the
    only location of an account rule cannot be deleted (MSG-26); otherwise all dependants are removed and the request is reopened;
    messages: "Unable to delete this entry.", "Unable to delete this entry,used in ARD"

    - fWarehouse (BR-14 Deletion): Delete requires confirmation and removes assignments, item links, valuation detail and
    the warehouse (MSG-08, MSG-09)

    '
  applies_to:
