  name: Document numbers are generated and must be unique
  type: derivation
  summary: Documents are numbered from the form's numbering series and manual numbers must be unique, as listed per form.
  description: 'Evidence: code

    Documents are numbered from the form''s numbering series and manual numbers must be unique, as listed per form.

    Per form:

    - fDocumentReceipt (BR-07 Receipt Entry Numbering): A new receipt gets the next six-digit zero-padded number (highest
    existing plus one) within the company and financial year; the number never changes on update; messages: "Document No.
    ", " saved successfully."

    - fGRN (BR-02 Numbering and Uniqueness): With a number setting, the number is generated on insert and regenerated until
    unique; a manual number must be unique per company, year and form (MSG-03). The document number control validates its
    own fields (MSG-98); messages: "Duplicate GRN No. is not allowed.", "Document No. ", " saved successfully."

    - fGRN (BR-29 Serial Numbers): For serial items, the count of serials must equal Accepted + Rejected (MSG-58); serials
    must be unique (MSG-82); expiry date is required per serial for expiry items (MSG-61); messages: "Serial Number Detail
    should be equal to [Accepted Qty. + Rejected Qty.] ", "Select Expiry Date in row ", "Duplicate Serial Number is not allowed."

    - fGateEntry (BR-02 Document Number): Number, date, division and status come from the shared document number control,
    which validates first (MSG-54). With a numbering series the number is generated at save; without a series a manually entered
    number must be unique within company, year and module 2 (MSG-03); messages: "Duplicate Document No. not allowed.", "Document
    No. <number> saved successfully."

    - fIndent (BR-02 Numbering): With a prefix, the number is generated at first save; failure stops the save

    - fIndent (BR-03 Unique Manual Number): A manual Document No. must be unique in company and year among manually numbered
    requests (MSG-03); messages: "Duplicate Indent No. is not allowed."

    - fIndentRequisition (BR-02 Document Numbering): When a numbering prefix is selected for a new request, the Document No.
    is generated from the prefix and document date at save; a generation failure stops the save with the numbering message

    - fIndentRequisition (BR-03 Unique Manual Number): A manually entered Document No. (no prefix) must be unique within the
    company and year among manually numbered requests. Generated numbers are not checked here; messages: "Duplicate Indent
    Requisition No. is not allowed."

    - fInspectionEntry (BR-02 Document Number): Number, date, division and status come from the shared document number control,
    validated first (MSG-13); with a series the number is generated at save; messages: "Document No. <number> saved successfully."

    - fInspectionIntimation (BR-02 Document Number): Number, date, division and status come from the shared document number
    control, which validates first (MSG-06); with a series the number is generated at save, otherwise the entered number is
    stored as is; messages: "Document No. <number> saved successfully."

    - fPaymentAdvice (BR-02 Numbering): With a prefix, a new advice''s number comes from the numbering service; a manual number
    must be unique among manually numbered advices of the company and year (MSG-13). The server check is repeated only after
    the number or advice changes; messages: "Duplicate Document No. not allowed."

    - fPaymentPlan (BR-02 Numbering): With a prefix, a new plan''s number comes from the numbering service for the document
    date; a manual number must be unique among manually numbered plans of the company and year (MSG-07); messages: "Duplicate
    Document No. not allowed."

    - fPaymentRequest (BR-10 Automatic Numbering): When a numbering prefix is chosen, a new request gets its number from the
    document numbering service for the document date; a numbering failure stops the save with that service''s message (MSG-18);
    messages: "Document No. ", " saved successfully."

    - fPaymentRequest (BR-11 Unique Manual Number): A manually entered document number must be unique among manually numbered
    requests of the company and financial year (MSG-12); messages: "Duplicate Document No. not allowed."

    - fPaymentVoucher (BR-02 Numbering): With a prefix the number comes from the numbering service and is regenerated while
    a duplicate exists; a manual number must be unique for the voucher type and company among manually numbered vouchers (MSG-03);
    messages: "Duplicate Document No. not allowed."

    - fPermitMaster (BR-09 Check List Numbering): SNo is set automatically when a check item is entered and renumbered after
    deletion; on reload SNo follows entry order

    - fPurchaseBill (BR-01 Document numbering): The number is generated on save from the selected prefix and date; otherwise
    the typed number is used. The header control validates first (MSG-38) and save asks for confirmation (MSG-75); messages:
    "Document No. <number> saved successfully."

    - fPurchaseBill (BR-02 Unique manual number): A manually numbered bill (no prefix) must not repeat a Document No. in the
    same company and year (MSG-02); messages: "Duplicate Document No. not allowed."

    - fPurchaseBill (BR-35 Serial numbers): For Direct lines of serial-tracked items, the number of serial numbers must equal
    the line quantity (MSG-56, MSG-84); serial numbers cannot repeat (MSG-83); expiry is required per serial for expiry-tracked
    items (MSG-82); messages: "Serial No. detail should be same as Quantity in row <n>.", "Select Expiry Date in row <n>.",
    "Duplicate Serial No. is not allowed.", "Serial No. Detail should be equal to  Quantity <qty> ."

    - fPurchaseBill (BR-69 TP Number uniqueness): Every save checks that the "TP Number" custom field is not used on another
    bill (MSG-49); messages: "Same TP Number already exists for another Purchase Bill", "Do you want to continue?"

    - fPurchaseOrder (BR-52 Save, Status and Numbering): - Save asks for confirmation (MSG-140); messages: "Document No. X
    saved successfully."

    - fQuotation (BR-01 Numbering and Status): A new quotation gets its number from the numbering series and document date;
    document status Initial, Release, Authorized maps to internal status 5, 6, 1; Release stamps releaser and date; Authorized
    stamps the saving user and date; messages: "Financial Year is not defined for selected document date."

    - fQuotation (BR-03 Unique Number): The quotation document number must be unique within company and financial year (MSG-03);
    messages: "Duplicate Quotation No. is not allowed."

    - fRequestforQuotation (BR-01 Numbering and Status): The document number is generated from the form''s numbering series
    and document date on first save; status Initial, Release, Authorized maps to internal status 5, 6, 1. Release stamps the
    releasing user and date; Authorized stamps the authorizer (the saving user) and date

    - fVendorCard (BR-31 Item Part Numbers): Each item ticked in "Item Detail" is saved with its "Part No." (maximum 25 characters)
    for this vendor and location

    - fVendorLocation (BR-15 MSME Number): "MSME No." is editable only for MSME Registration "Registered" and is then mandatory
    (MSG-12); the default registration type is applied on New; messages: "Enter a valid MSME No.."

    '
  applies_to:
