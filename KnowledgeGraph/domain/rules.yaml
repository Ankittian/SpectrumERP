- key: unique-master-names
  name: Names, codes and aliases must be unique
  type: validation
  summary: Names, codes and aliases must be unique in the scope listed per form.
  description: 'Evidence: code

    Names, codes and aliases must be unique in the scope listed per form.

    Per form:

    - fAccountGroupMaster (BR-04 Name Unique per COA): Group Name must be unique within the same COA (MSG-03); messages: "Duplicate
    Group Name not allowed."

    - fAccountMaster (BR-10 Duplicate Name): The name must be unique within the same COA (MSG-13) and within all charts of
    the same COA type (MSG-14); messages: "Duplicate Account Name  not allowed.(Check Finance)", "Duplicate Account Name not
    allowed."

    - fAccountRuleDefinition (BR-04 Duplicate and Already-Mapped Checks): - The same account with the same effective date
    cannot exist in another rule (MSG-02); messages: "Duplicate Account Name and Effective Date can''t be saved.", "Account
    is already mapped. Do You want to continue?"

    - fAccountRuleDefinition (BR-18 Intermediate Item Duplicate): After saving, if an item of this rule is also in another
    rule that uses the same intermediate account type for account type 54, the save fails listing the items (MSG-18); messages:
    "Duplicate ARD mapping not possible for Items "

    - fActivityMaster (BR-05 Uniqueness within Company): Activity name (MSG-02), alias (MSG-04) and sequence number above
    zero (MSG-05) must be unique among activities available to the user''s company, checked in that order; messages: "Duplicate
    Activity Name is not allowed.", "Duplicate Alias is not allowed.", "Duplicate Sequence No. is not allowed."

    - fActivityMaster (BR-16 Duplicate Resource Line): The same "Sub Activity Name", "Assign To" and "Resource/Category" combination
    cannot repeat (MSG-26); messages: "Duplicate Sub Activity Name,Assign To and Resource/Category is not allowed."

    - fBINCard (BR-01 Mandatory and Unique BIN Card No.): BIN Card No. (maximum 25) and Location (maximum 100) are mandatory
    and trimmed; BIN Card No. must be unique within the login company (MSG-01 to MSG-03); messages: "Enter BIN Card No.",
    "Duplicate BIN Card No. is not allowed.", "Enter Location."

    - fChapterHeading (BR-02 Normalised Uniqueness): A heading must not equal, after reducing both to letters and digits,
    another heading available in the current company (MSG-02); messages: "Duplicate Chapter Heading No not allowed."

    - fChartOfAccount (BR-02 Name Unique): COA Name must be unique across all charts; checked before mandatory fields (MSG-03);
    messages: "Duplicate COA Name is not allowed."

    - fCityMaster (BR-04 Unique Name per State): The trimmed city name may not equal another city''s name in the same state
    (MSG-04); messages: "Duplicate City Name is not allowed."

    - fCostCenterMaster (BR-03 Unique Name per Company): The trimmed name may not equal another cost center''s name available
    in the logged-in company (MSG-02); messages: "Duplicate CostCenter Name not allowed."

    - fCurrencyConversion (BR-06 Rows Required and Unique): At least one row must have Exchange Rate Type (MSG-04); a combination
    of Exchange Rate Type and Exchange Currency may appear only once in the grid (MSG-05); messages: "Select atleast one Exchange
    Rate Type.", "Duplicate Exchange Rate Type and Exchange Currency is not allowed."

    - fDocumentReceipt (BR-09 Unique Party Document No.): Document No. must be unique per company and party (across all locations
    of the party) within the financial year that contains Document Date; the current receipt is excluded (MSG-06). If the
    Document Date has no defined financial year, the year is derived from the calendar pattern of defined years; messages:
    "Duplicate Document No. not allowed for this Party Name."

    - fExpenseHead (BR-07 Unique Name Enterprise-Wide): The trimmed name may not equal another head''s name in any company
    (MSG-02); the comparison uses only the first 30 characters of the entered name; messages: "Duplicate Expense Head not
    allowed."

    - fFinanceBook (BR-02 Name Unique): Finance Book Name must be unique across all books of all companies (MSG-02); messages:
    "Duplicate Finance Book Name not allowed."

    - fGateEntry (BR-07 Challan Uniqueness): The same Challan No. cannot be used twice for the same vendor location in the
    same company, year and module (MSG-05); messages: "Duplicate Challan No. not allowed."

    - fGateEntry (BR-19 Duplicate Items): The same Item Code with the same Make and Tech. Grade cannot appear twice (MSG-46,
    MSG-47); messages: "Duplicate Item Name and Make is not allowed."

    - fIndent (BR-14 Items and Duplicates): At least one item (MSG-15); no duplicate Item Code, Make and Tech. Grade (MSG-16).
    Items offered exclude Phantom, Lift, Product Group, Intermediate and Finished Goods types. Make, Unit and Tech. Grade
    lists are filtered to the item; messages: "Select atleast one Item.", "Duplicate Item Name ,Make and Tech. Grade is not
    allowed."

    - fIndentRequisition (BR-18 No Duplicate Lines): The same Item Code, Make and Tech. Grade may appear only once (MSG-17);
    messages: "Duplicate Item Name ,Make and Tech. Grade is not allowed."

    - fItemMaster (BR-07 Item Description Generation and Uniqueness): Item Description = Item Name, then Size, then Grade,
    each trimmed and joined by a space when present; the field is read-only. It must match no other item''s description exactly:
    pre-save within the current company, at save across all companies (MSG-08); messages: "Duplicate Item Description not
    allowed."

    - fMakeMaster (BR-04 Unique Make Name per Company): A make name may not match another make available in the logged-in
    company when both names are reduced to letters and digits only; the make being edited is excluded (MSG-02); messages:
    "Duplicate Make Name not allowed."

    - fPaymentVoucher (BR-09 Cash or Bank Required and Unique): At least one cash or bank account is required (MSG-16); the
    same type of cash or bank account cannot appear twice, and cash and bank cannot be mixed (MSG-29, MSG-30, MSG-31); messages:
    "Select atleast one cash/ bank account.", "Duplicate Account with same bank account type can''t be selected.", "Duplicate
    Account with same cash account type can''t be selected.", "Duplicate Account with same cash/bank account type can''t be
    selected."

    - fPermitMaster (BR-03 Name Unique): Permit Name must be unique across all permits of all companies (MSG-02); messages:
    "Duplicate Permit Name not allowed."

    - fPermitMaster (BR-07 No Duplicates in Lists): Task Name, Equipment/Location, Safety Instruction, Category Name and Check
    List text may not repeat within their grid (MSG-08 to MSG-12); messages: "Duplicate Task Name not allowed.", "Duplicate
    Equipment/Location not allowed.", "Duplicate Safety Instruction not allowed.", "Duplicate Category Name not allowed.",
    "Duplicate Check List not allowed."

    - fPurchaseBill (BR-28 Duplicate items in Direct): In Direct, the same Item Description with the same Make and Tech. Grade
    cannot repeat (MSG-44); in the grid, the same Item Description and Make is refused at entry (MSG-62); messages: "Duplicate
    Item Description is not allowed."

    - fPurchaseOrder (BR-10 Document Uniqueness and Agreement Period): The document number must be unique for the company
    and year when no document number setting governs it (MSG-24). Document Date must fall within the selected material agreement
    period (MSG-25); messages: "Duplicate PO No. is not allowed.", "Unable to Save, Document Date should between the selected
    Material Agreement Period."

    - fPurchaseOrder (BR-17 Item Presence and Uniqueness): At least one item line is required (MSG-41). The same Item Description
    with the same Make and Tech. Grade may not repeat (MSG-40); messages: "Duplicate Item Description is not allowed for same
    Make and Tech. Grade.", "Select atleast one Item Description."

    - fPurchaseOrganization (BR-02 Name Unique): The name must be unique across all organizations (MSG-02); messages: "Duplicate
    Purchase Organization Name"

    - fQCParameter (BR-01 Name Mandatory and Unique): Parameter Name is mandatory, trimmed, maximum 30 characters, and unique
    among parameters available to the login company (MSG-01, MSG-03); messages: "Enter Parameter Name.", "Duplicate QC Parameter
    not allowed."

    - fQualityParameter (BR-01 Description Mandatory and Unique): Description is mandatory, trimmed, maximum 100 characters,
    and unique among parameters of the login company (MSG-01, MSG-02); messages: "Enter Description.", "Duplicate quality
    parameter not allowed."

    - fSingleFieldMaster (BR-07 Name Uniqueness): Names must be unique:; messages: "Duplicate Location Name not allowed.",
    "Duplicate Technical Grade Name not allowed.", "Duplicate Category Name not allowed.", "Duplicate Tech Specification Category
    Name not allowed.", "Duplicate quality parameter type not allowed."

    - fSingleFieldMaster (BR-08 Category Code Uniqueness): Category codes must be unique within the current company, ignoring
    surrounding spaces (MSG-10); messages: "Duplicate Category Code not allowed."

    - fSpecification (BR-01 Name Mandatory and Unique): Specification is mandatory, trimmed, maximum 100 characters, and unique
    among specifications of the login company (MSG-01, MSG-03); messages: "Enter Specification.", "Duplicate specification
    not allowed."

    - fTDCAccountRule (BR-03 Unique Description): The trimmed description may not equal another rule''s description (MSG-14);
    messages: "Duplicate TDC Account Rule not allowed."

    - fTDCGroup (BR-05 Name Uniqueness): Group Name (max 50) must be unique across all groups (MSG-07); messages: "Duplicate
    Group Name is not allowed."

    - fTDCMaster (BR-03 Name Unique): Charge Name must be unique across all charges of all companies and tax groups (MSG-03);
    messages: "Duplicate MiscCharge Name is not allowed."

    - fTechSpecificationHeadMaster (BR-03 Name Unique per Company): The name must not exist on another head available in the
    current company (MSG-03); messages: "Duplicate Technical Specification Head name not allowed"

    - fVendorCard (BR-04 Unique Vendor Name per Company): The name, compared on letters and digits only, must not match another
    vendor present in the current company; the vendor itself is excluded; the type is not considered; MSG-03; messages: "Duplicate
    Vendor Name not allowed."

    - fVendorCard (BR-14 Duplicate GSTIN Warning): If the GSTIN is already on another vendor location (any company), a warning
    is shown (MSG-04); answering No stops the save, Yes continues; messages: "Duplicate GSTINo ,Want to continue?."

    - fVendorCard (BR-16 Duplicate Location Address): The location check rejects an address (three lines, letters and digits
    only) already used by another location in the company (MSG-05); the screen does not pass the address or company to this
    check, so it does not work as intended (Section 13); messages: "Duplicate Location is not allowed."

    - fVendorLocation (BR-08 Duplicate Address): A location whose combined address lines (letters and digits only) equal another
    location''s in the same company is refused (MSG-13); see Section 13 on effectiveness; messages: "Duplicate Location is
    not allowed."

    - fVendorLocation (BR-10 Duplicate GSTIN Warning): A GSTIN already held by another location gives a warning; the user
    may continue or stop (MSG-29); messages: "Duplicate GSTINo ,Want to continue?."

    - fWarehouse (BR-01 Name Mandatory and Unique): Warehouse Name is mandatory, trimmed, maximum 50 characters, and unique
    across all warehouses (MSG-01, MSG-02); messages: "Enter Warehouse Name.", "Duplicate Warehouse Name is not allowed."

    '
