- key: fast-entry-excel-import
  name: Fast entry and Excel import follow fixed formats
  type: control
  summary: Bulk entry (fast entry grid, Excel import, repeat entry) follows the column format and checks listed per form.
  description: 'Evidence: code

    Bulk entry (fast entry grid, Excel import, repeat entry) follows the column format and checks listed per form.

    Per form:

    - fAccountGroupMaster (BR-14 Fast Entry Processing): Only rows with a COA are processed; each row is validated and saved
    separately; the result is written to Remarks; one summary message closes the run (MSG-06, MSG-07); messages: "Successfully
    Created.", "Refer remarks for saved status."

    - fAccountGroupMaster (BR-15 Import Format): The Excel sheet must be named as the screen code and contain the columns
    COA, Group Name, Parent Group, Alternate Group, Maintain Reference, Maintain Cost Center (MSG-10); messages: "Your excel
    should consists of sheet with name AIAG. Do you want to continue?"

    - fAccountMaster (BR-26 Fast Entry and Import): Fast entry rows with a "COA" are loaded into the header, validated with
    the same checks and saved one by one; the "Remarks" column receives "Successfully Created." or the validation text. Import
    reads a sheet named after the screen code with the fast entry columns. Bank columns apply only when the row''s type shows
    the "Bank" tab; party columns only when it shows "Additional Information"; messages: "Your excel should consists of sheet
    with name ", ". Do you want to continue?", "Refer remarks for saved status.", "Successfully Created."

    - fBINCard (BR-11 Fast Entry Grouping): Rows sharing a BIN Card No form one bin; the first such row is saved with all
    its items (matched by Item Name); later rows are skipped; Remarks shows the outcome (MSG-06, MSG-09); messages: "Successfully
    Created.", "Refer remarks for saved status."

    - fBINCard (BR-12 Import Format): The Excel sheet must be named as the screen code and contain the six Fast Entry columns
    (MSG-07); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fChapterHeading (BR-07 Fast Entry): In fast entry each row with a Chapter is validated and saved on its own; the outcome
    is written to Remarks; messages: "Refer remarks for saved status.", "Successfully Created."

    - fChapterHeading (BR-08 Import Format): Import reads the sheet named after the screen code, columns Chapter and Description,
    into the fast entry grid; messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fChartOfAccount (BR-05 Import Same Type): Import COA lists other charts of the selected type only; the copy option is
    enabled only with an import chart

    - fCityMaster (BR-11 Fast Entry Processing): Rows with blank Country are skipped; Country and State are matched by name;
    each row is validated and saved separately; Remarks shows "Successfully Created." (MSG-05) or the validation text. District
    settings are not available in Fast Entry; messages: "Successfully Created.", "Refer remarks for saved status."

    - fCityMaster (BR-12 Import Format): Import reads "Country", "State" and "City Name" from the sheet named after the screen
    tag (MSG-07); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fCostCenterMaster (BR-10 Fast Entry Processing): Rows with blank name are skipped; each other row is validated and saved
    separately and Remarks receives "Successfully Created." (MSG-05) or the validation text. The parent is matched by cost
    center name; messages: "Successfully Created.", "Refer remarks for saved status."

    - fCostCenterMaster (BR-11 Import Format): Import reads "Cost Center Name" and "Parent Cost Center" from the sheet named
    after the screen tag (MSG-07); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fExpenseHead (BR-10 Fast Entry Processing): Rows with blank Expense Head are skipped; each row is validated and saved
    separately; Nature is matched by name; Remarks shows "Successfully Created." (MSG-05) or the validation text; messages:
    "Successfully Created.", "Refer remarks for saved status."

    - fExpenseHead (BR-11 Import Format): Import reads "Expense Head", "Nature" and "Manage Acc Item Wise" from the sheet
    named after the screen tag (MSG-07); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fGateEntry (BR-30 Repeat Entry): Repeat entry works only in new mode; it loads the chosen entry, then sets date to default,
    status Initial, clears the number and restores the series

    - fIndent (BR-35 Repeated Entry): Only on a new request; loads the chosen request and resets date, Status to Initial,
    prefix and Document No

    - fIndentRequisition (BR-31 Repeated Entry): Repeated Entry works only on a new request; it loads the chosen request and
    resets date, Status (Initial), prefix and Document No. so the copy saves as new

    - fItemMaster (BR-34 Fast Entry Processing): Only rows with a Category Name are processed. Each row is copied into the
    detail fields, validated with the same routine as detail mode (warehouse check skipped) and saved in its own transaction;
    Remarks receives the result. QC Applicable, Maintain Serial Number, Returnable, Maintain Expiry Date and Inactive are
    set off; tolerances and stock levels are cleared. A blank Code keeps the proposed code. A Measurement ID ticks "Maintain
    Item Dimension". Purchase, sales and production conversions are applied only when "Allow Multiple CF" is ticked; messages:
    "Successfully Created.", "Refer remarks for saved status."

    - fItemMaster (BR-35 Excel Import): The workbook must contain a sheet named "MMMM" with all required columns (GST Category
    only where GST applies, coil columns only for mill companies, secondary unit columns only when secondary units are used).
    Rows are appended to the Fast Entry grid; messages: "Your excel should consists of sheet with name MMMM. Do you want to
    continue?"

    - fItemMaster (BR-37 Fast Entry Standard Item): For Capital and Intermediate rows, Standard Item is forced off regardless
    of the grid value

    - fItemStandardAttributeValue (BR-15 Import Format): Import reads "Attribute Name", "Value" and "Base Attribute Value"
    from a sheet named "Sheet1" and matches attributes by name

    - fMakeMaster (BR-11 Fast Entry Row Processing): In Fast Entry, rows with blank Make Name are skipped; each remaining
    row is validated and saved on its own, and Remarks receives "Successfully Created." or the validation text (MSG-05); messages:
    "Successfully Created.", "Refer remarks for saved status."

    - fMakeMaster (BR-12 Import Format): Import reads only the "Make Name" column from a sheet whose name equals the screen''s
    tag, after confirmation (MSG-07); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fPaymentVoucher (BR-17 Repeat Entry): On a new voucher only, the repeat entry button copies a chosen voucher with the
    default date, status Initial and no number, keeping the numbering prefix; it is shown only when voucher copy is enabled

    - fPurchaseOrder (BR-58 Repeat Order): Ctrl+Y copies a selected earlier order into a new record only. Date, status (Initial),
    number and prefix are reset

    - fSingleFieldMaster (BR-16 Fast Entry Processing): Rows with empty "Name" are skipped; each other row is validated and
    saved separately, with the result written to "Remarks" (MSG-13 to MSG-15); messages: "Refer Remarks for data saved status.",
    "Successfully Created."

    - fSingleFieldMaster (BR-17 Import Format): Import reads the sheet named as the form code, with columns "Code" and "Name"
    when codes are typed, otherwise "Name" (MSG-20)

    - fTDCMaster (BR-12 Fast Entry Processing): Only rows with a Tax Group are processed; each is validated and saved separately;
    Remarks receives "Successfully Created." or the validation text (MSG-09, MSG-12); messages: "Successfully Created.", "Refer
    remarks for saved status."

    - fTDCMaster (BR-13 Import Format): The Excel sheet must be named as the screen code and contain the seven Fast Entry
    columns (MSG-11); messages: "Your excel should consists of sheet with name ", ". Do you want to continue?"

    - fVendorCard (BR-34 Fast Entry and Import): In Fast Entry Mode one confirmation covers all rows; each row with a Vendor
    Type is copied into the detail fields, validated with BR-02 to BR-19 and saved separately; "Remarks" receives "Successfully
    Created." or the validation text; Import reads the sheet named after the screen with the fixed column list; messages:
    "Refer remarks for saved status.", "Successfully Created.", "Your excel should consists of sheet with name <screen tag>.
    Do you want to continue?"

    - fVendorContactPerson (BR-11 Fast Entry): Rows with a Vendor Name are each loaded into the detail fields, validated by
    BR-01 to BR-03 and saved; the Remarks column shows *"Successfully Created."*, the error text, or the validation text;
    a closing message follows (MSG-07); messages: "Refer remarks for saved status."

    - fVendorContactPerson (BR-12 Excel Import): Import asks for confirmation, then reads the sheet named after the screen
    with columns Vendor Name, Location, Contact Person Name, Designation, Address1 to Address3, City, State, Country, Mobile
    No, Phone No, Fax No, Email, and adds Remarks (MSG-06); messages: "Your excel should consists of sheet with name ", ".
    Do you want to continue?"

    - fVendorLocation (BR-25 Fast Entry): Rows with a vendor name are processed one by one through the detail validation and
    save; the result is written to "Remarks" (MSG-27, MSG-39); messages: "Refer remarks for saved status.", "Successfully
    Created."

    - fVendorLocation (BR-26 Import Format): Import reads the sheet named as the form code with the fast entry columns (MSG-28);
    messages: "Your excel should consists of sheet with name VIVL. Do you want to continue?"

    '
