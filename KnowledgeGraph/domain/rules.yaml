  processes:
  - procure-to-pay
- key: request-for-quotation-source-modes
  name: 'Request For Quotation: Source Modes'
  type: default
  summary: Source Document offers Direct, Purchase Request, GRC and Sales Order and defaults to Direct.
  description: 'Evidence: code

    Source Document offers Direct, Purchase Request, GRC and Sales Order and defaults to Direct. For Direct the source tab
    is hidden and items are entered freely; for other sources the source tab is shown and Item Code, Item Description, Make,
    Unit and RFQ Qty. are locked, the item search button hidden and item rows cannot be deleted. Changing the source clears
    items, sizes and technical parameters.

    Source: Functional_Doc_fRequestforQuotation.md BR-05.

    '
  applies_to:
  - form:fRequestforQuotation
  - concept:rfq
  implemented_by:
  - method:fRequestforQuotation.FillValues
  - method:fRequestforQuotation.ucmbSourceDocument_ValueChanged
  - sp:purchase.prfqfillvalues
  processes:
  - procure-to-pay
- key: request-for-quotation-unit-conversion
  name: 'Request For Quotation: Unit Conversion'
  type: validation
  summary: In the CF popup a unit must be chosen (MSG-13) and First CF and Second CF must be non-zero (MSG-11, MSG-12); factors
    are editable only when the item conversion type is 2, otherwise taken from the item conversion.
  description: 'Evidence: code

    In the CF popup a unit must be chosen (MSG-13) and First CF and Second CF must be non-zero (MSG-11, MSG-12); factors are
    editable only when the item conversion type is 2, otherwise taken from the item conversion. Qty. = Indent Qty. x Second
    CF / First CF, rounded to 3 decimals.

    Messages: "First CF can''t be empty or zero.", "Second CF can''t be empty or zero.", "Select valid Unit."

    Source: Functional_Doc_fRequestforQuotation.md BR-10.

    '
  applies_to:
  - form:fRequestforQuotation
  - concept:rfq
  implemented_by:
  - method:fRequestforQuotation.ubtnOKCF_Click
  - method:fRequestforQuotation.ucmbIndentUnit_ValueChanged
  processes:
  - procure-to-pay
- key: request-for-quotation-vendor-rows
  name: 'Request For Quotation: Vendor Rows'
  type: default
  summary: At least one vendor is required (MSG-15); every vendor row needs a Location (MSG-16); Location defaults to the
    vendor's first location and is filtered by vendor; Contact Person is optional and filtered by location; the same Vendor
    Name and Location cannot be entered twice (MSG-17).
  description: 'Evidence: code

    At least one vendor is required (MSG-15); every vendor row needs a Location (MSG-16); Location defaults to the vendor''s
    first location and is filtered by vendor; Contact Person is optional and filtered by location; the same Vendor Name and
    Location cannot be entered twice (MSG-17).

