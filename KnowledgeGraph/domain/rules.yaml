- key: authorized-document-lock
  name: Authorized or in-use records are locked
  type: workflow
  summary: Once a record is authorized, used or closed, it can no longer be edited as listed per form.
  description: 'Evidence: code

    Once a record is authorized, used or closed, it can no longer be edited as listed per form.

    Per form:

    - fAccountGroupMaster (BR-12 Reporting COA Lock): For a COA of type Reporting, Maintain Reference and Maintain Cost Center
    are disabled; a loaded group of such a COA has COA, Parent Group, Group Name and Alternate Group locked

    - fAccountMaster (BR-06 Inactive Account Locked): An account inactive in any company cannot be updated (MSG-39); messages:
    "Inactive Account can''t be updated."

    - fAccountRuleDefinition (BR-16 Item Exclusivity and Lock): Items already mapped to another rule of the same account type
    (sharing the ticked scenario where applicable) are not listed. Items of this rule already used in purchase order, subcontract
    order or sales order account assignment, or in vouchers of this stock account, are locked and their tick cannot be changed

    - fActivityMaster (BR-21 In-Use Lock): If the activity is used in process plans, BOM activity summaries, work order process
    plans, BOM revision marks, or as another activity''s category, then name, alias, category, type, basis, unit, "Inspection
    Required", "Aggregate Activity" and "Assembling Activity" are locked

    - fChangeItemUnitWeight (BR-04 Measurement Lock): Unticking Maintain Item Dimension clears and locks Measurement; the
    measurement unit is editable only when Measurement is chosen

    - fChangeItemUnitWeight (BR-05 Weight Unit Lock): Changing Unit Weight clears its unit; the unit is editable only for
    a non-zero weight. Unit Weight is stored with three decimals

    - fCityMaster (BR-09 District Flag Lock): Is District cannot be unticked while other cities point to this city as their
    district

    - fCostCenterMaster (BR-08 Usage Lock): If the cost center is used in stock lots, finance voucher cost center lines, equipment
    or functional locations, Cost Center Name becomes read-only and Parent Cost Center becomes read-only when it already has
    a value

    - fFinanceBook (BR-15 Hierarchy Lock): When a loaded book is the parent of another book or part of a Consolidate book,
    FB Type, Company Name and Parent FB become read-only

    - fGRN (BR-01 Authorized Lock): An Authorized GRN cannot be saved again. The screen refuses when status is Authorized
    and read-only (MSG-01); the database refuses any GRN with an authorizer (MSG-01, MSG-02); messages: "Authorized GRN can''t
    be updated.", "Authorized GRN No. can''t be updated."

    - fGateEntry (BR-01 Authorized Lock): An authorized gate entry cannot be saved again. Checked on screen when the loaded
    status is Authorized (MSG-01), by the validation call (MSG-02) and by the header save (MSG-57); messages: "Authorized
    Gate Entry can''t be updated.", "Authorized data can''t be updated.", "Authorized Entry can''t be updated."

    - fIndent (BR-04 Authorised Lock): An authorised request cannot be saved: screen check when Status is Authorized and read-only
    (MSG-01), validation check (MSG-02) and two save checks (MSG-35); messages: "Authorized Indent can''t be updated.", "Authorize
    Indent No. can''t be update.", "Authorize Indent No. can''t be update.", "Authorized Indent can''t be updated", "Selected
    Division is not matching with department division"

    - fIndent (BR-28 Release Lock under Multi-Level): A released request with an approval route is loaded with Status, header
    and grid read-only; choosing Release under multi-level also disables header and grid

    - fIndentRequisition (BR-04 Authorised Lock): An authorised request cannot be saved again: the screen refuses when Status
    was loaded as Authorized (MSG-01), the validation check refuses when it has an authoriser (MSG-02), and the save itself
    raises an error (MSG-38); messages: "Authorized Indent Requisition can''t be updated.", "Authorize Indent Requisition
    No. can''t be update.", "Authorize Indent Requisition No. can''t be update."

    - fInspectionEntry (BR-01 Authorized Lock): A loaded authorized entry cannot be saved (MSG-03); the header save also refuses
    an already authorized entry (MSG-17); messages: "Authorized Entry can''t be updated.", "Authorized Entry can''t be updated."

    - fInspectionIntimation (BR-01 Authorized Lock): An authorized intimation cannot be saved again: the screen refuses when
    the loaded status is Authorized (MSG-05) and the header save refuses when the letter is already authorized (MSG-09); messages:
    "Authorized Inspection Intimation can''t be updated.", "Authorized Entry can''t be updated."

    - fItemMaster (BR-26 In-Use Locking): When a loaded item appears in indents, stock lots, purchase agreements, PO or subcontract
    amendments, BOM revisions, gate entries, sales orders or invoices, Category, Group, Subgroup, Unit, Item Name, Item Code,
    Grade, Material Type, Item Nature, Size, Chapter Heading, Unit Weight and its unit, Measurement and its unit, "Allow Multiple
    Conversion Factor" and the UOM grid are locked

    - fPaymentAdvice (BR-01 Authorised Advices Locked): An opened Authorized advice has status locked and cannot be saved
    (MSG-01); the server also refuses updates of an advice with an approver (MSG-02); messages: "Authorized PaymentAdvice
    can''t be updated.", "Authorized entry can''t be updated."

    - fPaymentPlan (BR-01 Authorised Plans Locked): An opened Authorized plan has status locked and cannot be saved (MSG-02);
    the server also refuses updates of a plan with an approver (MSG-06); messages: "Authorized Payment Plan can''t be updated.",
    "Authorized entry can''t be updated."

    - fPaymentRequest (BR-02 Authorised Requests Locked): An opened request with status Authorized has its status locked and
    cannot be saved (MSG-01); the server also refuses to update a request that already has an approver (MSG-02); messages:
    "Authorized Payment Request can''t be updated.", "Authorized entry can''t be updated."

    - fPaymentVoucher (BR-01 Authorised Vouchers Locked): An opened Authorized voucher has its status locked and cannot be
    saved (MSG-01); the server refuses updates of an authorised voucher (MSG-01) and authorisation of a rejected voucher (MSG-02);
    messages: "Authorized entry can''t be updated.", "Can''t authorize, Voucher is Rejected."

    - fPaymentVoucher (BR-16 Bank Journal Lock): An unauthorised voucher created from Bank Journal with bank commission opens
    with lines and payment details read-only and currency and voucher type disabled

    - fPurchaseBill (BR-03 Authorized lock): An authorized bill cannot be saved again; checked on screen and in the database
    (MSG-01, MSG-76, MSG-77); messages: "Authorized entry can''t be updated.", "Authorized Purchase Bill can''t be updated.",
    "Authorized Purchase Bill can''t be updated.", "Document Receipt Already used in Purchase Bill."

    - fPurchaseOrder (BR-01 Authorized Lock): An order that is Authorized and loaded with a read-only status cannot be saved
    (MSG-01). The database also rejects updates to authorized orders and authorized entries (MSG-02, MSG-03); messages: "Authorized
    Purchase Order can''t be updated.", "Authorized PO No. can''t be updated.", "Authorized Entry can''t be updated."

    - fPurchaseOrder (BR-26 Closed Line Lock): On an amendment, the quantity of a line whose status is Completed, Cancel or
    Short Close cannot change (MSG-62)

    - fQCParameter (BR-15 Sequence Lock Flag): A loaded parameter''s QC Para. Sequence becomes read-only when the lock flag
    is set

    - fQualityParameter (BR-14 In-Use Lock): If the parameter appears in a quality test, specification, variable link, instrument,
    inspection plan or inspection result, Description, Type, Data Type, Reporting Length, Decimal Precision, Unit, Method,
    Define Standard Values and Value Type become read-only

    - fQuotation (BR-02 Authorized Lock): An authorized quotation cannot be saved: screen check (MSG-01), server validation
    (MSG-02) and save procedure (MSG-23); messages: "Authorized Quotation can''t be updated.", "Authorized Quotation No. can''t
    be Update.", "Authorized Entry can''t be updated."

    - fQuotation (BR-16 PO Lock): A quotation cannot be saved once any purchase order references one of its revisions (MSG-24);
    a financial year must exist for the date (MSG-25); messages: "PO is Prepared against this quoation,so you can''t save
    this entry.", "Financial Year is not defined for selected document date."

    - fRequestforQuotation (BR-02 Authorized Lock): An RFQ loaded with status Authorized has its status locked and cannot
    be saved again (MSG-01). The check is on the screen only; messages: "Authorized RFQ can''t be updated."

    - fTDCAccountRule (BR-10 Header Lock After Charges): When a loaded rule has linked charges, description, category, basis,
    account type and effective date are locked

    - fTDCMaster (BR-11 Mapping Removal and Lock): A previously linked row that is unticked is removed on save; ticked rows
    cannot be deleted (MSG-10) and are intended to be non-editable; messages: "Selected row can''t be deleted."

    - fVendorCard (BR-25 Locks on Loaded Vendors): "Vendor Type" becomes read-only once a vendor is loaded. If the vendor''s
    location is used in sales service orders, sales orders, quotations, invoices, dispatch challans, commercial invoices,
    purchase orders, purchase bills or vouchers, "Vendor Name", "Alias", "Mailing Name" and the Communication names are read-only

    - fVendorLocation (BR-14 Transaction Lock): When the loaded location is used in sales orders and amendments, consignee
    details, quotations, invoices, dispatch challans, commercial invoices, purchase order consignee, purchase bills or vouchers,
    "Vendor Name", "Name" and "Mailing Name" become read-only

    - fWarehouse (BR-09 Transaction Lock): When goods receipts, receipt lines or stock transfers (from or to) reference the
    warehouse, Type and Ownership become read-only

    '
