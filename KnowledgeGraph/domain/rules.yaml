rules:
- key: account-group-master-always-active
  name: 'Account Group Master: Always Active'
  type: control
  summary: Every save sets the group to active.
  description: 'Evidence: code

    Every save sets the group to active.

    Source: Functional_Doc_fAccountGroupMaster.md BR-10.

    '
  applies_to:
  - form:fAccountGroupMaster
  - concept:account-group
  implemented_by:
  - method:fAccountGroupMaster.SaveMain
  processes:
  - finance-master-setup
- key: account-group-master-default-group-protection
  name: 'Account Group Master: Default Group Protection'
  type: default
  summary: A system default group cannot change COA, Parent Group or Group Name, cannot be deleted (MSG-12), and keeps its
    group type on modify.
  description: 'Evidence: code

    A system default group cannot change COA, Parent Group or Group Name, cannot be deleted (MSG-12), and keeps its group
    type on modify.

    Messages: "Default Account Group can''t deleted."

    Source: Functional_Doc_fAccountGroupMaster.md BR-11.

    '
  applies_to:
  - form:fAccountGroupMaster
  - concept:account-group
  implemented_by:
  - method:fAccountGroupMaster.Delete
  - method:fAccountGroupMaster.LoadData
  - sp:masterdata.aiagsave
  processes:
  - finance-master-setup
- key: account-group-master-inheritance-from-parent
  name: 'Account Group Master: Inheritance from Parent'
  type: default
  summary: Nature, Maintain Reference and Maintain Cost Center default from the parent; group type and order are copied from
    the parent; level is parent level + 1.
  description: 'Evidence: code

    Nature, Maintain Reference and Maintain Cost Center default from the parent; group type and order are copied from the
    parent; level is parent level + 1.

    Source: Functional_Doc_fAccountGroupMaster.md BR-07.

    '
  applies_to:
  - form:fAccountGroupMaster
  - concept:account-group
  implemented_by:
  - method:fAccountGroupMaster.SaveMain
  - method:fAccountGroupMaster.ucmbUnderGroup_ValueChanged
  - sp:masterdata.aiagsave
  processes:
  - finance-master-setup
- key: account-group-master-nature-cascade
  name: 'Account Group Master: Nature Cascade'
  type: integrity
  summary: On modify, the group's nature is written to the group and all its descendants.
  description: 'Evidence: code

    On modify, the group''s nature is written to the group and all its descendants.

    Source: Functional_Doc_fAccountGroupMaster.md BR-09.

    '
  applies_to:
  - form:fAccountGroupMaster
  - concept:account-group
  implemented_by:
  - sp:masterdata.aiagsave
  processes:
  - finance-master-setup
- key: account-master-account-mapping-for-reporting-charts
  name: 'Account Master: Account Mapping for Reporting Charts'
  type: validation
  summary: For a reporting chart, at least one operative account must be mapped (MSG-11), without duplicates (MSG-12).
  description: 'Evidence: code

    For a reporting chart, at least one operative account must be mapped (MSG-11), without duplicates (MSG-12). Only operative
    accounts not already mapped in the chart by another account are offered. On save, each COA mapping row is stored once
    per mapped account by copying that account''s own group mappings.

    Messages: "Select atleast one Account Name in Account Mapping.", "Duplicate Account Name is not allowed."

    Source: Functional_Doc_fAccountMaster.md BR-17.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.FillValues
  - method:fAccountMaster.ValidateForm
  - sp:masterdata.fiamfillvaluesdependent
  - sp:masterdata.fiamsaveaccountgroupdetail
  processes:
  - finance-master-setup
- key: account-master-account-type-change-after-save
  name: 'Account Master: Account Type Change after Save'
  type: control
  summary: On load, "Account Type" stays editable only when the type is a supplier, customer or additional account type (4
    to 10) and no party account rule exists; otherwise it is read-only.
  description: 'Evidence: code

    On load, "Account Type" stays editable only when the type is a supplier, customer or additional account type (4 to 10)
    and no party account rule exists; otherwise it is read-only.

    Source: Functional_Doc_fAccountMaster.md BR-14.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.LoadData
  - sp:masterdata.fiamloaddata
  processes:
  - finance-master-setup
- key: account-master-additional-information-tab
  name: 'Account Master: Additional Information Tab'
  type: validation
  summary: The "Additional Information" tab is shown only for "Additional Accounts".
  description: 'Evidence: code

    The "Additional Information" tab is shown only for "Additional Accounts".

    Source: Functional_Doc_fAccountMaster.md BR-13.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ucmbAccountType_ValueChanged
  processes:
  - finance-master-setup
- key: account-master-address-cascade
  name: 'Account Master: Address Cascade'
  type: workflow
  summary: Choosing a city sets and locks state and country; choosing a state sets and locks country (both bank and party
    addresses).
  description: 'Evidence: code

    Choosing a city sets and locks state and country; choosing a state sets and locks country (both bank and party addresses).

    Source: Functional_Doc_fAccountMaster.md BR-23.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ucmbBankCity_ValueChanged
  processes:
  - finance-master-setup
- key: account-master-bank-details
  name: 'Account Master: Bank Details'
  type: validation
  summary: When the "Bank" tab is visible, "Bank Name" (MSG-15), "Bank Account No." (MSG-16), "Bank Branch Code" (MSG-17),
    "IFSC Code" (MSG-18) and "GST Registration Type" (MSG-19) are mandatory; "GSTIN No." is mandatory unless the type is "UnRegistered"
    or "Foreign" (MSG-20).
  description: 'Evidence: code

    When the "Bank" tab is visible, "Bank Name" (MSG-15), "Bank Account No." (MSG-16), "Bank Branch Code" (MSG-17), "IFSC
    Code" (MSG-18) and "GST Registration Type" (MSG-19) are mandatory; "GSTIN No." is mandatory unless the type is "UnRegistered"
    or "Foreign" (MSG-20).

    Messages: "Enter Bank Name.", "Enter Bank Account No.", "Enter Bank Branch Code.", "Enter IFSC Code.", "Select valid registration
    type.", "GSTIN No. can''t be empty"

    Source: Functional_Doc_fAccountMaster.md BR-11.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ValidateForm
  processes:
  - finance-master-setup
- key: account-master-bank-interest
  name: 'Account Master: Bank Interest'
  type: calculation
  summary: A row with "From Date" needs a non-zero "Interest Rate" (MSG-10); interest rows are saved for any account type.
  description: 'Evidence: code

    A row with "From Date" needs a non-zero "Interest Rate" (MSG-10); interest rows are saved for any account type.

    Messages: "Interest Rate can''t be empty or 0"

    Source: Functional_Doc_fAccountMaster.md BR-18.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.SaveMain
  - method:fAccountMaster.ValidateForm
  processes:
  - finance-master-setup
- key: account-master-bank-tab
  name: 'Account Master: Bank Tab'
  type: control
  summary: The "Bank" tab is shown only for "Bank Account" type in an operative chart.
  description: 'Evidence: code

    The "Bank" tab is shown only for "Bank Account" type in an operative chart. Bank detail is saved only while it is shown.

    Source: Functional_Doc_fAccountMaster.md BR-12.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.SaveMain
  - method:fAccountMaster.ucmbAccountType_ValueChanged
  processes:
  - finance-master-setup
- key: account-master-coa-mapping
  name: 'Account Master: COA Mapping'
  type: validation
  summary: Each COA mapping row needs a "Group Name" (MSG-08); COA list is limited to charts of the same type as the account's
    COA; "Group Name" is filtered by the row's COA; duplicate COA rows are blocked (MSG-09); the account's own COA and group
    row cannot be edited or deleted.
  description: 'Evidence: code

    Each COA mapping row needs a "Group Name" (MSG-08); COA list is limited to charts of the same type as the account''s COA;
    "Group Name" is filtered by the row''s COA; duplicate COA rows are blocked (MSG-09); the account''s own COA and group
    row cannot be edited or deleted.

    Messages: "Select valid Group Name in row ", "Duplicate COA Name is not allowed."

    Source: Functional_Doc_fAccountMaster.md BR-15.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.FillValues
  - method:fAccountMaster.ValidateForm
  - method:fAccountMaster.ugdCOAMapping_BeforeCellActivate
  - sp:masterdata.fiamfillvaluesdependent
  processes:
  - finance-master-setup
- key: account-master-cost-center
  name: 'Account Master: Cost Center'
  type: validation
  summary: When "Maintain Cost Center" is ticked, "Cost Center" is shown and mandatory (MSG-06).
  description: 'Evidence: code

    When "Maintain Cost Center" is ticked, "Cost Center" is shown and mandatory (MSG-06).

    Messages: "Select valid Cost Center."

    Source: Functional_Doc_fAccountMaster.md BR-07.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ValidateForm
  - method:fAccountMaster.uchkCostCenterApp_CheckedChanged
  processes:
  - finance-master-setup
- key: account-master-currency
  name: 'Account Master: Currency'
  type: validation
  summary: The shared currency control must validate (MSG-05).
  description: 'Evidence: code

    The shared currency control must validate (MSG-05).

    Source: Functional_Doc_fAccountMaster.md BR-09.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ValidateForm
  processes:
  - finance-master-setup
- key: account-master-msme
  name: 'Account Master: MSME'
  type: validation
  summary: When "MSME Registration" is "Registered", "MSME No." is mandatory (MSG-29).
  description: 'Evidence: code

    When "MSME Registration" is "Registered", "MSME No." is mandatory (MSG-29). "Is PAN Operative" is shown only for party
    accounts of "Additional Accounts" type.

    Messages: "Enter MSME No."

    Source: Functional_Doc_fAccountMaster.md BR-25.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.IsPANOperativeVisible
  - method:fAccountMaster.ValidateForm
  processes:
  - finance-master-setup
- key: account-master-own-mapping-row
  name: 'Account Master: Own Mapping Row'
  type: control
  summary: Selecting a group pre-fills the mapping grid with the account's own COA and group.
  description: 'Evidence: code

    Selecting a group pre-fills the mapping grid with the account''s own COA and group.

    Source: Functional_Doc_fAccountMaster.md BR-16.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ucmbAccountGroup_ValueChanged
  - sp:masterdata.fiamfillvaluesdependent
  processes:
  - finance-master-setup
- key: account-master-party-address-and-gst
  name: 'Account Master: Party Address and GST'
  type: validation
  summary: 'With "Party Account" ticked on the visible "Additional Information" tab: "State" (MSG-21) and "GST Registration
    Type" (MSG-22) are mandatory.'
  description: 'Evidence: code

    With "Party Account" ticked on the visible "Additional Information" tab: "State" (MSG-21) and "GST Registration Type"
    (MSG-22) are mandatory. Unless the type is "UnRegistered" or "Foreign": the state must have a GST state code (MSG-23),
    "PAN No." is mandatory (MSG-24) and exactly 10 characters (MSG-25), "GSTIN No." or "UIN No." is required (MSG-26), a GSTIN
    must be 15 characters (MSG-27) and contain the state code followed by the PAN (MSG-28).

    Messages: "Select valid State", "Select valid GST Register Type", "GSTStateCode is not updated in Selected State", "Enter
    PAN No.", "Invalid PAN No.", "Enter GSTIN No. Or UIN No.", "Enter UIN  No.", "GSTIN No. should be 15 letters.", "Invalid
    GSTIN No."

    Source: Functional_Doc_fAccountMaster.md BR-22.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ValidateForm
  processes:
  - finance-master-setup
- key: account-master-party-creation
  name: 'Account Master: Party Creation'
  type: validation
  summary: Saving a party account creates or updates a party card of internal type 9 with the account name, a location with
    the address and GST data, location information with PAN, STC, payer category, MSME and PAN-operative flag, and an account
    rule linking the location to the account.
  description: 'Evidence: code

    Saving a party account creates or updates a party card of internal type 9 with the account name, a location with the address
    and GST data, location information with PAN, STC, payer category, MSME and PAN-operative flag, and an account rule linking
    the location to the account. New cards and locations are made available in every company.

    Source: Functional_Doc_fAccountMaster.md BR-24.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.SaveARD
  - method:fAccountMaster.SaveMain
  - method:fAccountMaster.SaveVendor
  - sp:masterdata.vivcsave
  - sp:masterdata.vivcsavelocation
  processes:
  - finance-master-setup
- key: account-master-quantity-tracking
  name: 'Account Master: Quantity Tracking'
  type: validation
  summary: '"Maintain Qty.'
  description: 'Evidence: code

    "Maintain Qty. Wise" is enabled only for "Additional Accounts"; when ticked, "Unit Name" is mandatory (MSG-07).

    Messages: "Select valid Unit Name."

    Source: Functional_Doc_fAccountMaster.md BR-08.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - method:fAccountMaster.ValidateForm
  - method:fAccountMaster.ucmbAccountType_ValueChanged
  processes:
  - finance-master-setup
- key: account-master-reference-creation-on-update
  name: 'Account Master: Reference Creation on Update'
  type: control
  summary: When an existing account is saved with "Maintain References" on, missing voucher references are created.
  description: 'Evidence: code

    When an existing account is saved with "Maintain References" on, missing voucher references are created.

    Source: Functional_Doc_fAccountMaster.md BR-21.

    '
  applies_to:
  - form:fAccountMaster
  - concept:ledger-account
  implemented_by:
  - sp:masterdata.fiamsavemain
  processes:
  - finance-master-setup
- key: account-rule-definition-capital-item-mixing
  name: 'Account Rule Definition: Capital Item Mixing'
  type: default
  summary: Except for CD accounts (type 21), capital items and other item types cannot both be ticked when any ticked intermediate
    basis has an id other than 4 or 11 (MSG-08).
  description: 'Evidence: code

    Except for CD accounts (type 21), capital items and other item types cannot both be ticked when any ticked intermediate
    basis has an id other than 4 or 11 (MSG-08). The default item list excludes capital items for non-CD types, and the intermediate
    list excludes them when basis 4 or 11 is ticked.

    Messages: "Capital Item can''t be mapped with other item type item."

    Source: Functional_Doc_fAccountRuleDefinition.md BR-17.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ValidateItemRule
  - method:fAccountRuleDefinition.ugdItem_BeforeCellUpdate
  - sp:finance.fardfillvaluesdependent
  - sp:finance.fardfillvaluesintermediateaccount
  processes:
  - finance-master-setup
- key: account-rule-definition-date-filter
  name: 'Account Rule Definition: Date Filter'
  type: calculation
  summary: The "Sale" list shows sale posting rules with effective date on or before "Effective From"; the "TDC" list shows
    tax codes effective on or before it.
  description: 'Evidence: code

    The "Sale" list shows sale posting rules with effective date on or before "Effective From"; the "TDC" list shows tax codes
    effective on or before it. Changing the date reloads both lists.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-07.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.dtpEffectiveFrom_ValueChanged
  - sp:finance.fardfillvaluesdatewise
  processes:
  - finance-master-setup
- key: account-rule-definition-effective-from
  name: 'Account Rule Definition: Effective From'
  type: control
  summary: '"Effective From" is shown only for account types 11, 13, 60, 21, 35, 36, 42, 43.'
  description: 'Evidence: code

    "Effective From" is shown only for account types 11, 13, 60, 21, 35, 36, 42, 43. When hidden, the saved effective date
    is the earliest financial year start date.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-06.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ucmbAccountName_ValueChanged
  - sp:finance.fardsavemain
  processes:
  - finance-master-setup
- key: account-rule-definition-eligible-accounts
  name: 'Account Rule Definition: Eligible Accounts'
  type: default
  summary: '"Account Name" lists accounts whose default chart of accounts is of the posting chart type, excluding account
    types 2, 3 and 10.'
  description: 'Evidence: code

    "Account Name" lists accounts whose default chart of accounts is of the posting chart type, excluding account types 2,
    3 and 10. Accounts that already have a rule are excluded, except account types 11, 13, 21, 35, 36, 42 and 43.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-02.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - sp:finance.fardfillvalues
  processes:
  - finance-master-setup
- key: account-rule-definition-finance-book-pair
  name: 'Account Rule Definition: Finance Book Pair'
  type: validation
  summary: Exactly two finance books of the primary book type must be ticked (MSG-11).
  description: 'Evidence: code

    Exactly two finance books of the primary book type must be ticked (MSG-11). The same pair must not exist in another rule
    (MSG-12), and both books'' charts of accounts must contain the account (MSG-13).

    Messages: "Select two Finance Books.", "Selected Finance Book combination already exists in another Account.", "Account
    is not mapped with selected Finance Book COA."

    Source: Functional_Doc_fAccountRuleDefinition.md BR-20.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ValidateFBAccountRule
  - sp:finance.fardvalidatefb
  processes:
  - finance-master-setup
- key: account-rule-definition-intermediate-basis-selection
  name: 'Account Rule Definition: Intermediate Basis Selection'
  type: validation
  summary: When the tab is visible at least one basis must be ticked (MSG-14).
  description: 'Evidence: code

    When the tab is visible at least one basis must be ticked (MSG-14). If any ticked row is an intermediate account type,
    exactly one row in total may be ticked (MSG-15). Intermediate account types are not offered for account type 39.

    Messages: "Select atleast one Intermediate Account Type", "you can select only one Intermediate Account Type"

    Source: Functional_Doc_fAccountRuleDefinition.md BR-19.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ValidateIntermediateAccountRule
  - sp:finance.fardfillvaluesdependent
  processes:
  - finance-master-setup
- key: account-rule-definition-item-tab-triggered-by-selections
  name: 'Account Rule Definition: Item Tab Triggered by Selections'
  type: control
  summary: The "Item" tab is shown when a ticked TDC row has the item-wise account basis (basis 1) or a ticked intermediate
    basis is item-wise, and hidden again when no such TDC or intermediate row remains ticked.
  description: 'Evidence: code

    The "Item" tab is shown when a ticked TDC row has the item-wise account basis (basis 1) or a ticked intermediate basis
    is item-wise, and hidden again when no such TDC or intermediate row remains ticked.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-08.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ucmbAccountName_ValueChanged
  - method:fAccountRuleDefinition.ugdIntermediateAccountType_AfterCellUpdate
  - method:fAccountRuleDefinition.ugdTDCAccountRule_AfterCellUpdate
  processes:
  - finance-master-setup
- key: account-rule-definition-other-selections-and-exclusivity
  name: 'Account Rule Definition: Other Selections and Exclusivity'
  type: control
  summary: '- "Supplier/ Customer": at least one location (MSG-06).'
  description: 'Evidence: code

    - "Supplier/ Customer": at least one location (MSG-06). Lists non-shipping locations of the head office company, excluding
    party type 9, and hides locations mapped to another rule of the same account type depending on the multiple-account finance
    setting.

    Messages: "Select atleast one Supplier/ Customer Account Rule", "Select atleast one Payroll Account Rule", "Select atleast
    one Employee."

    Source: Functional_Doc_fAccountRuleDefinition.md BR-13.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ValidateVendorCustomerAccountRule
  - sp:finance.fardfillvaluesdependent
  processes:
  - finance-master-setup
- key: account-rule-definition-sale-rule-selection
  name: 'Account Rule Definition: Sale Rule Selection'
  type: validation
  summary: When the "Sale" tab is visible and has at least one rule listed, at least one must be ticked (MSG-04).
  description: 'Evidence: code

    When the "Sale" tab is visible and has at least one rule listed, at least one must be ticked (MSG-04).

    Messages: "Select atleast one Sale Account Rule"

    Source: Functional_Doc_fAccountRuleDefinition.md BR-10.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ValidateSaleAccountRule
  processes:
  - finance-master-setup
- key: account-rule-definition-sub-group-default-and-item-selection
  name: 'Account Rule Definition: Sub Group Default and Item Selection'
  type: validation
  summary: Ticking "Set Default" on a sub group sets "Select" on all its items that are not locked.
  description: 'Evidence: code

    Ticking "Set Default" on a sub group sets "Select" on all its items that are not locked. When the "Item" tab is visible
    at least one item must be ticked (MSG-07). Sub groups with "Set Default" and ticked items are saved as separate sets.

    Messages: "Select atleast one Item"

    Source: Functional_Doc_fAccountRuleDefinition.md BR-14.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.SaveItemSubGroupRule
  - method:fAccountRuleDefinition.ValidateItemRule
  - method:fAccountRuleDefinition.ugdItem_AfterCellUpdate
  processes:
  - finance-master-setup
- key: account-rule-definition-sub-group-default-transfer
  name: 'Account Rule Definition: Sub Group Default Transfer'
  type: default
  summary: Saving a sub group default removes the same sub group's default from other rules of the same account type; for
    tax types only where those rules share a ticked TDC row, for types 11 and 13 only where they share a ticked sale rule,
    for type 54 only where they share a ticked intermediate account type o
  description: 'Evidence: code

    Saving a sub group default removes the same sub group''s default from other rules of the same account type; for tax types
    only where those rules share a ticked TDC row, for types 11 and 13 only where they share a ticked sale rule, for type
    54 only where they share a ticked intermediate account type or expense head.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-15.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - sp:finance.fardsaveitemsubgroupruletable
  processes:
  - finance-master-setup
- key: account-rule-definition-tabs-by-account-type
  name: 'Account Rule Definition: Tabs by Account Type'
  type: control
  summary: 'After account selection all tabs are hidden, then shown by account type: 11, 13, 60 "Sale" and "Item"; 21 and
    35, 36, 42, 43 "TDC"; 4 to 9, 71, 72 "Supplier/ Customer"; 12, 14, 15, 17 to 20, 45, 46, 55 "Item"; 47, 48, 49, 51 "Payroll
    Component"; 1 "Finance Book"; 50, 57 "Employee"; 39, 54 "Intermedi'
  description: 'Evidence: code

    After account selection all tabs are hidden, then shown by account type: 11, 13, 60 "Sale" and "Item"; 21 and 35, 36,
    42, 43 "TDC"; 4 to 9, 71, 72 "Supplier/ Customer"; 12, 14, 15, 17 to 20, 45, 46, 55 "Item"; 47, 48, 49, 51 "Payroll Component";
    1 "Finance Book"; 50, 57 "Employee"; 39, 54 "Intermediate Account Type". Other types show no tab and save only the header.

    Source: Functional_Doc_fAccountRuleDefinition.md BR-05.

    '
  applies_to:
  - form:fAccountRuleDefinition
  - concept:account-determination-rule
  implemented_by:
  - method:fAccountRuleDefinition.ucmbAccountName_ValueChanged
  processes:
  - finance-master-setup
- key: account-rule-definition-tdc-consistency
  name: 'Account Rule Definition: TDC Consistency'
  type: calculation
