    where this company is the execution unit; item line open (status 1) and not already on any RFQ or purchase order for the
    same item, make and technical grade.

    Source: Functional_Doc_fRequestforQuotation.md BR-08.

    '
  applies_to:
  - form:fRequestforQuotation
  - concept:rfq
  implemented_by:
