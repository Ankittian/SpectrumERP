- key: transaction-delete-rules
  name: Deleting a document is restricted and reverses its links
  type: integrity
  summary: A document can be deleted only in the states listed per form, and deletion reverses its stock, status and ledger
    links.
  description: 'Evidence: code

    A document can be deleted only in the states listed per form, and deletion reverses its stock, status and ledger links.

    Per form:

    - fDocumentReceipt (BR-22 Delete Removes Everything): Delete removes custom fields, notes, links and header together after
    confirmation; no usage or authorisation check is made

    - fGRN (BR-43 Deletion): Delete asks confirmation; blocked by tyre repair entries (MSG-108), stock issued from the lots
    (MSG-109), or a locked stock month (MSG-101); otherwise removes lots, voucher, excise posting, children and header and
    restores statuses. No status check: an Authorized GRN can be deleted if its stock is unused; messages: "Month is locked
    via Stock Monthly Closing(ISML)", "Can not delete this Service Receipt Note as Tyre Repair Entry exists.", "Material is
    Issue against this Lot.,So you Can''t Delete this Entry - Issue No "

    - fGateEntry (BR-28 Deletion Guard): Delete is refused if a GRN exists (MSG-64), a weighment slip exists (MSG-65) or a
    vehicle gate-out exists (MSG-66). Otherwise the gate-in link is cleared, a delete log is written when the company delete-log
    setting is on, and all child rows and the header are removed; messages: "Can''t be deleted as some record exist against
    this entry.", "Unable to delete,weighment entry exists against this entry.", "Unable to delete, Vehicle gate out exists
    against SGPI entries"

    - fIndent (BR-33 Delete): Delete removes the request, its children and approval rows in one transaction; the referenced
    Material Request lines are recalculated from issues and the material plan status restored. There is no status or purchase
    order check in the screen or delete operation

    - fIndentRequisition (BR-29 Delete Restrictions): A request cannot be deleted when an indent prepared against requisition
    (MSG-40) or a material issue against it (MSG-41) exists; otherwise header and children are deleted in one transaction;
    messages: "Indent is prepared against this requisition,so you can''t delete this", "Material is issued against this requisition,so
    you can''t delete this"

    - fInspectionEntry (BR-16 Deletion Guard and Reversal): Delete is refused if any GRN on the entry is authorized (MSG-22).
    For an authorized entry, rejected quantity is added back to accepted quantity at lot, indent and item level and to reserve
    quantity, and rejected quantity is cleared, before records are removed; messages: "some GRN is Authorized,so you can''t
    delete this entry"

    - fInspectionIntimation (BR-13 Deletion Guard): Delete is refused when any GRN on the letter is authorized (MSG-12); otherwise
    notes, custom fields, lines and header are removed; messages: "some GRN is Authorized,so you can''t delete this entry"

    - fPaymentAdvice (BR-11 Delete): Delete removes lines and header after confirmation; no status check; database links from
    payment plans block the delete with the database error

    - fPaymentPlan (BR-21 Delete): Delete reverses reference in-process amounts and payment advice consumption, removes cash
    counter entries and all plan rows; there is no status or voucher check; messages: "Contact your vendor,Reference getting
    -ve"

    - fPaymentRequest (BR-14 Delete): Delete removes tax rows and header after confirmation; there is no status check, but
    database links (for example a sundry payment using the request) block the delete and return the database error

    - fPaymentVoucher (BR-15 Delete): Delete asks for confirmation; it is refused when the finance book period is closed (MSG-25);
    otherwise it logs the voucher, deletes child vouchers, reverses payment plan reference effects (refusing if a reference
    would go negative, MSG-28) and removes the voucher. No status check is made; messages: "Finance Book is closed for this
    Document Date.", "Contact your vendor,Reference getting -ve"

    - fPurchaseBill (BR-71 Delete scope): Delete removes stock lots, advance rows, both vouchers, cash counter entry, excise
    posting, schedule, taxes, custom fields, serials, items, notes, summary, concession forms and header, reopens the document
    receipt and updates TDS thresholds

    - fPurchaseBill (BR-72 Delete GR suspense check): An authorized bill cannot be deleted when its voucher''s GR suspense
    account differs from the PO account assignment (MSG-87)

    - fPurchaseBill (BR-73 Delete confirmation): Delete asks for confirmation and requires a loaded bill (MSG-86, MSG-88)

    - fPurchaseOrder (BR-57 Deletion): - Delete requires confirmation (MSG-149); messages: "PO Amendment is done againt this
    PO,so you can''t delete this entry.", "PO is Prepared against this LOI,so you can''t delete this entry.", "Advance request
    is prepared against this PO,so you can''t delete this entry.", "BG is prepared against this PO,so you can''t delete this
    entry."

    - fQuotation (BR-18 Revised Quotation Not Deletable): A quotation that has been revised cannot be deleted (MSG-26), checked
    on screen and in the delete procedure; messages: "Can''t be deleted as some record exist against this entry."

    - fQuotation (BR-19 Delete): Delete requires confirmation (MSG-27); it is refused when a PO references the revision (MSG-28);
    otherwise the RFQ is reset to partly quoted (other quotations remain) or open, the revision and quotation with all children
    are deleted and success is shown (MSG-29); messages: "PO is Prepared against this quoation,so you can''t delete this entry."

    - fRequestforQuotation (BR-22 Delete): Delete requires a loaded RFQ and confirmation (MSG-29); it removes all children
    and the header in one transaction and recalculates indent status for linked indents; database errors are shown (MSG-30);
    success shows MSG-31. There is no authorized or usage check on the screen

    '
  applies_to:
  - form:fDocumentReceipt
  - form:fGRN
  - form:fGateEntry
  - form:fIndent
  - form:fIndentRequisition
  - form:fInspectionEntry
  - form:fInspectionIntimation
  - form:fPaymentAdvice
  - form:fPaymentPlan
  - form:fPaymentRequest
  - form:fPaymentVoucher
  - form:fPurchaseBill
  - form:fPurchaseOrder
  - form:fQuotation
  - form:fRequestforQuotation
  - form:fMaterialIssue
