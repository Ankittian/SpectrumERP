- key: mandatory-master-fields
  name: Mandatory fields and valid selections on master forms
  type: validation
  summary: Master forms refuse to save until the mandatory fields listed per form are filled with valid values.
  description: 'Evidence: code

    Master forms refuse to save until the mandatory fields listed per form are filled with valid values.

    Per form:

    - fAccountGroupMaster (BR-02 COA Mandatory): COA must be selected (MSG-01); messages: "Select valid COA."

    - fAccountGroupMaster (BR-03 Name Mandatory): Group Name is mandatory and trimmed (MSG-02); messages: "Enter Group Name."

    - fAccountGroupMaster (BR-05 Parent Mandatory, Same COA): Parent Group is mandatory and is chosen from groups of the same
    COA that themselves have a parent (MSG-04); messages: "Select valid Parent Group."

    - fAccountGroupMaster (BR-08 Nature Mandatory): Nature must be filled in the main layout (MSG-05); it is read-only and
    not checked in Fast Entry; messages: "Select valid Nature."

    - fAccountMaster (BR-01 Account Name Mandatory): "Account Name" must not be blank (MSG-03); it is trimmed on save. "Account
    Type", "Account Name", "Account Group", "Bank Name", "Bank Account No.", "Bank Branch Code", "IFSC Code" are marked compulsory;
    messages: "Enter Account Name.", "Record exist against this record,so entry can''t be deleted."

    - fAccountMaster (BR-03 COA Mandatory and Nature): "COA" must be selected (MSG-01). A reporting chart shows "Non-Posting"
    and the "Account Mapping" tab; an operative chart shows "Posting"; messages: "Select valid COA."

    - fAccountMaster (BR-04 Account Type Mandatory): "Account Type" must be selected (MSG-02); messages: "Select valid Account
    Type."

    - fAccountMaster (BR-05 Account Group Mandatory and Filter): "Account Group" must be selected (MSG-04). Groups offered
    are child groups of the selected COA whose group type is allowed for the account type; types with no group types get groups
    of unassigned group types; "Additional Accounts" also get a fixed list of group types. Group selection defaults "Maintain
    References" and "Maintain Cost Center"; messages: "Select valid Account Group."

    - fAccountRuleDefinition (BR-01 Account Mandatory): An account must be selected from "Account Name" before save (MSG-01);
    messages: "Select valid Account Name."

    - fActivityMaster (BR-01 Mandatory Header Fields): "Activity Name" (MSG-01), "Alias" (MSG-03) and "Sequence No." (MSG-09)
    must not be blank; "Activity Name", "Alias", "Activity Basis", "Activity Type", "Sequence No." are marked compulsory;
    messages: "Enter Activity Name.", "Enter Alias.", "Enter Sequence No."

    - fActivityMaster (BR-10 Run Time Mandatory; Time Format): The "Run Time" row must have a non-zero duration (MSG-12).
    Minutes after the decimal point must be below 60 (MSG-13); messages: "Enter Duartion (Hrs) in row ", "Invalid Time : minute
    should be less than 60."

    - fBINCard (BR-01 Mandatory and Unique BIN Card No.): BIN Card No. (maximum 25) and Location (maximum 100) are mandatory
    and trimmed; BIN Card No. must be unique within the login company (MSG-01 to MSG-03); messages: "Enter BIN Card No.",
    "Duplicate BIN Card No. is not allowed.", "Enter Location."

    - fBINCard (BR-03 Warehouse Mandatory): Warehouse Name must be selected from authorized warehouses that are active (or
    already used by the bin) and have item warehouse details for the company (MSG-04); messages: "Select valid Warehouse Name."

    - fChangeItemUnitWeight (BR-02 Item Required and Synchronised): Item Code and Item Description are required (MSG-01, MSG-02)
    and kept in step; selecting an item loads its current settings. Items listed are all items of the company; messages: "Select
    valid Item Code.", "Select valid Item Description."

    - fChapterHeading (BR-01 Chapter Required): Chapter is mandatory, up to 25 characters; checked after the duplicate check
    (MSG-01); messages: "Enter Chapter."

    - fChartOfAccount (BR-01 Mandatory Fields): COA Name and COA Type are required (MSG-01, MSG-02); messages: "Enter COA
    Name .", "Select valid COA Type."

    - fCityMaster (BR-02 Mandatory Fields): Country (MSG-01), State (MSG-02) and City Name (MSG-03) are required; messages:
    "Select valid Country Name.", "Select valid State Name.", "Enter City Name."

    - fCostCenterMaster (BR-02 Name Mandatory): Cost Center Name is required after trimming (MSG-01); maximum 50 characters;
    messages: "Enter Cost Center Name."

    - fCurrencyConversion (BR-06 Rows Required and Unique): At least one row must have Exchange Rate Type (MSG-04); a combination
    of Exchange Rate Type and Exchange Currency may appear only once in the grid (MSG-05); messages: "Select atleast one Exchange
    Rate Type.", "Duplicate Exchange Rate Type and Exchange Currency is not allowed."

    - fCurrencyMaster (BR-03 Mandatory Descriptors): Fractional Currency Name (max 10) and Notation (max 5) are required;
    Symbol (max 5) is optional (MSG-03, MSG-04); messages: "Enter Fractional Currency Name.", "Enter Notation."

    - fExpenseHead (BR-02 Name Mandatory): Expense Head is required after trimming (MSG-01); maximum 100 characters; messages:
    "Enter Expense Head name."

    - fExpenseHead (BR-03 Nature Mandatory): Nature must be selected (MSG-03); messages: "Select valid Nature."

    - fExpenseHead (BR-04 Item-Wise Accounting Required): Manage Acc. Item wise must be ticked to save (MSG-04); messages:
    "Manage Acc. Item Wise must be selected."

    - fFBPeriodMapping (BR-02 Calendar Type Mandatory): A Calendar Type must be selected (MSG-01); messages: "Select valid
    Calendar Type."

    - fFBPeriodMapping (BR-08 Status Required): Every period row needs Status Open or Close (MSG-05); messages: "Select valid
    Status in row "

    - fFinanceBook (BR-01 Name Mandatory): Finance Book Name is mandatory, trimmed, maximum 100 characters (MSG-01); messages:
    "Enter Finance Book Name."

    - fFinanceBook (BR-03 Type Mandatory): FB Type must be selected from Transaction, Unit Level, Consolidate (MSG-03); messages:
    "Select valid FB Type."

    - fHSNCode (BR-01 HSN Type Required): HSN Type must be chosen; values are Goods and Service (MSG-01); messages: "Select
    HSN Type."

    - fItemMaster (BR-02 Mandatory Header Fields): Category Name, Group Name, Subgroup Name, Item Code, Unit, Item Nature,
    Material Type and Item Name are marked compulsory. Save checks, in order: Material Type, Category Name, Group Name, Subgroup
    Name, Item Code (not blank after trim), Item Name (not blank after trim), then uniqueness (BR-06, BR-07), then Unit and
    Item Nature (MSG-01 to MSG-06, MSG-09, MSG-10); messages: "Select valid Material Type.", "Select valid Category Name.",
    "Select valid Group Name.", "Select valid Subgroup Name.", "Enter Item Code.", "Enter Item Name.", "Select valid Unit.",
    "Select valid Item nature."

    - fItemStandardAttributeValue (BR-01 Type Mandatory): Type must be selected (MSG-01); messages: "Select valid Type."

    - fItemStandardAttributeValue (BR-02 Scope Required): Either Subgroup Name or Item Name must be selected (MSG-02); without
    an item, values are saved at sub group level; messages: "Select valid Subgroup Name or Item Name."

    - fItemStandardAttributeValue (BR-10 Generation Required): For an item in All Combination mode, after attribute rows change,
    combinations must be regenerated before save (MSG-11); messages: "Click on Generate Combination."

    - fItemTechGradeMapping (BR-01 Mandatory Header): Mapping and the item/subgroup field are mandatory (MSG-01, MSG-02);
    messages: "Select valid Mapping.", "Select valid Item Description.", "Select valid Subgroup."

    - fMakeMaster (BR-02 Make Name Mandatory): Make Name must not be blank after trimming; in detail mode MSG-01 is shown,
    in Fast Entry the text goes to Remarks; messages: "Enter Make Name."

    - fPermitMaster (BR-01 Permit Name Mandatory): Permit Name is mandatory, trimmed, maximum 100 characters (MSG-01); messages:
    "Enter Permit Name."

    - fPermitMaster (BR-02 Other Mandatory Fields): Permit Description (maximum 300), LOTO, Permit Type and Authorized Person
    (maximum 100) are mandatory (MSG-03 to MSG-06); messages: "Enter Permit Description.", "Select valid LOTO.", "Select valid
    Permit Type.", "Enter or Select valid Authorized person."

    - fProductionUnit (BR-01 Name Mandatory): Production Unit is required, up to 50 characters (MSG-01). No uniqueness check
    exists; messages: "Enter Production Unit."

    - fProductionUnit (BR-03 Parent Required): A unit that is not a planning unit must have a Planning Unit (MSG-02); the
    list shows every unit flagged as planning unit; messages: "Select valid Planning Unit."

    - fProductionUnit (BR-04 Coverage Required and Exclusive): At least one company row must be ticked (MSG-03). For planning
    units the grid offers active group companies, or their active divisions when the current company uses divisions, that
    no unit covers yet; messages: "Select atleast one Company Name."

    - fPurchaseOrganization (BR-01 Name Mandatory): Purchase Organization is required after trimming (MSG-01); messages: "Enter
    Purchase Organization Name."

    - fQCParameter (BR-01 Name Mandatory and Unique): Parameter Name is mandatory, trimmed, maximum 30 characters, and unique
    among parameters available to the login company (MSG-01, MSG-03); messages: "Enter Parameter Name.", "Duplicate QC Parameter
    not allowed."

    - fQCParameter (BR-02 Unit Mandatory): Unit must be selected (MSG-06); messages: "Select valid Unit."

    - fQCParameter (BR-04 Tolerance Mandatory): Tolerance Value, Tolerance Unit and Tolerance Type are mandatory (MSG-08 to
    MSG-10); messages: "Enter Tolerance Value.", "Select valid Tolerance Unit.", "Select valid Tolerance Type."

    - fQCParameter (BR-05 Deduction Fields Mandatory): When deduction fields are shown, Deduction On, Formula Type, Deduction
    Rate and Deduction Type are mandatory; Deduction Calculation On is mandatory whenever Deduction On is selected (MSG-11
    to MSG-14, MSG-16); messages: "Select valid Deduction On.", "Select valid Formula Type.", "Select valid Deduction Rate.",
    "Select valid Deduction Type.", "Select Valid Deduction Calculation On."

    - fQualityParameter (BR-01 Description Mandatory and Unique): Description is mandatory, trimmed, maximum 100 characters,
    and unique among parameters of the login company (MSG-01, MSG-02); messages: "Enter Description.", "Duplicate quality
    parameter not allowed."

    - fQualityParameter (BR-02 Type and Data Type Mandatory): Type and Data Type must be selected; Data Type offers Numeric,
    Alpha Numeric and Date (MSG-03, MSG-04); messages: "Select valid Type.", "Select valid Data Type."

    - fQualityParameter (BR-05 Unit and Method Mandatory): Unit and Method must be selected; for Alpha Numeric and Date only
    Fixed and Variable methods are offered (MSG-11, MSG-12); messages: "Select valid Unit.", "Select valid Method."

    - fReportingCOASetup (BR-01 COA Name Mandatory): A valid COA Name must be selected before Save (MSG-01); messages: "Select
    valid COA Name."

    - fSingleFieldMaster (BR-03 Name Mandatory): The name must not be blank after trimming (MSG-04); messages: "Enter Location
    Name."

    - fSpecification (BR-01 Name Mandatory and Unique): Specification is mandatory, trimmed, maximum 100 characters, and unique
    among specifications of the login company (MSG-01, MSG-03); messages: "Enter Specification.", "Duplicate specification
    not allowed."

    - fSpecification (BR-02 Type Mandatory): Specification Type must be Item, Customer or Supplier (MSG-02); messages: "Select
    valid Specification Type."

    - fTDCAccountRule (BR-02 Mandatory Header): TDC Rule Description (MSG-01), Tax Category (MSG-02) and Account Basis (MSG-03)
    are required; description up to 100 characters; messages: "Enter TDC Rule Description.", "Select valid Tax Category.",
    "Select valid Account Basis."

    - fTDCAccountRule (BR-09 Charges Required): At least one charge must be ticked (MSG-08); charges listed are those available
    to the head office in active tax groups of the category, plus already linked ones; messages: "Select atleast one Miscellaneous
    Charge."

    - fTDCAccountRule (BR-12 Screens Required): At least one screen must be ticked in Form Detail (MSG-10); new rules list
    only visible tax-applicable screens; messages: "Select atleast one Form."

    - fTDCGroup (BR-01 Mandatory Fields): Code, Category, Group Name and Rounding are required, checked in that order (MSG-01,
    MSG-03, MSG-04, MSG-05); messages: "Enter Code.", "Select valid Category.", "Enter Group Name.", "Select valid Rounding."

    - fTDCGroup (BR-04 Rounding Required): A rounding method must be chosen (MSG-05); messages: "Select valid Rounding."

    - fTDCMaster (BR-01 Tax Group Mandatory): A Tax Group must be selected (MSG-01); messages: "Select valid Tax Group."

    - fTDCMaster (BR-02 Names Mandatory): Charge Name and Display Name are mandatory, trimmed, maximum 50 characters; Display
    Name is overwritten from Charge Name whenever Charge Name changes (MSG-02, MSG-06); messages: "Enter Misc Charge Name.",
    "Enter Display Name."

    - fTDCMaster (BR-04 Charge Nature Mandatory): Charge Nature must be Misc Charge or Taxes (MSG-05); messages: "Select valid
    Charge Name."

    - fTDCMaster (BR-05 Charge Value Mandatory): Charge Value is mandatory, numeric with up to 3 decimals on screen and 2
    in Fast Entry (MSG-04); messages: "Enter Rate."

    - fTDCMaster (BR-06 Calculation Nature Mandatory): Calculation Nature must be Add, Subtract or Neutral (MSG-07); messages:
    "Select valid Calculation Nature."

    - fTechSpecificationHeadMaster (BR-01 Mandatory Fields): Head Name and Category are required (MSG-01, MSG-02); messages:
    "Enter Head Name.", "Select valid Category."

    - fVendorCard (BR-02 Vendor Type Mandatory): A valid "Vendor Type" must be selected; MSG-01; messages: "Select valid Vendor
    Type."

    - fVendorCard (BR-03 Vendor Name Mandatory): "Vendor Name" must not be blank after trimming; maximum 100 characters; MSG-02;
    messages: "Enter Vendor Name."

    - fVendorCard (BR-05 Mailing Name Mandatory): "Mailing Name" must not be blank; MSG-08; messages: "Enter Mailing Name."

    - fVendorCard (BR-08 Communication Mandatory Fields): Communication "Name", "Mailing Name", the first "Address" line and
    a valid "State" are mandatory; MSG-10 to MSG-13; messages: "Enter Communication Name.", "Enter Communication Mailing Name.",
    "Enter Address.", "Select valid State."

    - fVendorCard (BR-18 Client-Specific Mandatory Checks): For Transporter, Agent, Customer, Supplier and Contractor, three
    client-specific validations make Phone No. and E-Mail (MSG-31, MSG-32), MSME Registration (MSG-33) and at least one bank
    row (MSG-34) hard mandatory when switched on; messages: "Phone Number is mandatory.", "Email is mandatory.", "MSME registration
    is mandatory.", "Bank Detail is Empty."

    - fVendorContactPerson (BR-01 Vendor Mandatory): A Vendor Name must be selected from authorized vendors active for the
    login company, or already linked to the contact (MSG-01); messages: "Select valid Vendor Name."

    - fVendorContactPerson (BR-02 Location Mandatory): A Location of the selected vendor must be selected; changing Vendor
    Name clears and reloads Location (MSG-02); messages: "Select valid Location."

    - fVendorContactPerson (BR-03 Contact Name Mandatory): Contact Person Name is mandatory, trimmed, maximum 100 characters;
    duplicates are not checked (MSG-03); messages: "Enter Contact Person Name."

    - fVendorLocation (BR-02 Mandatory Identity): A valid "Vendor Name", "Name" and "Mailing Name" are mandatory (MSG-01 to
    MSG-03); messages: "Select valid Vendor Name.", "Enter Name.", "Enter Mailing Name."

    - fVendorLocation (BR-03 Mandatory Address): First address line and a valid "State" are mandatory (MSG-04, MSG-05); messages:
    "Enter Address.", "Select valid State."

    - fVendorLocation (BR-06 GST Registration Type Mandatory): In the GST layout "GST Registration Type" is mandatory (MSG-06);
    messages: "Select valid GST Registration Type."

    - fWarehouse (BR-01 Name Mandatory and Unique): Warehouse Name is mandatory, trimmed, maximum 50 characters, and unique
    across all warehouses (MSG-01, MSG-02); messages: "Enter Warehouse Name.", "Duplicate Warehouse Name is not allowed."

    - fWarehouse (BR-02 Location Mandatory): Location is mandatory, maximum 200 characters (MSG-03); messages: "Enter Location."

    - fWarehouse (BR-03 Type and Ownership Mandatory): Type (Inhouse, External) and Ownership (Own, Party) must be selected
    (MSG-04, MSG-05); messages: "Select valid Type.", "Select valid Ownership."

    '
