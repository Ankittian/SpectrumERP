  type: control
  summary: How the Inactive flag is shown and saved, as listed per form.
  description: 'Evidence: code

    How the Inactive flag is shown and saved, as listed per form.

    Per form:

    - fActivityMaster (BR-04 Inactive Not Maintained): "Inactive" is disabled and is not passed on save

    - fChartOfAccount (BR-07 Inactive Propagation): The chart''s inactive flag is passed to every group generated at creation

    - fMakeMaster (BR-10 Inactive Not Maintained Here): Inactive is displayed on load but cannot be edited and is not sent
    on save

    - fPurchaseBill (BR-33 Inactive item): A ticked line whose item is no longer in the active list is refused (MSG-55); messages:
    "Item is Inactive in row <n>."

    - fSingleFieldMaster (BR-13 Inactive Flag): "Inactive" is display only and is never sent on save; Technical Grade save
    resets the grade to active

