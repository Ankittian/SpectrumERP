- key: search-scope
  name: Search lists are restricted to the user's scope
  type: control
  summary: Search and lookup lists show only the records the current company, status and type filters allow.
  description: 'Evidence: code

    Search and lookup lists show only the records the current company, status and type filters allow.

    Per form:

    - fAccountGroupMaster (BR-16 Search Scope): Search lists all groups of all COAs except nature 1 groups

    - fAccountMaster (BR-20 Search Scope): Search lists every account in all charts, ordered by name

    - fAccountRuleDefinition (BR-21 Search Scope): Search lists all rules enterprise-wide for account types other than 2,
    3 and 10, ordered by account name; the company passed is not used

    - fActivityMaster (BR-22 Search Scope): Search lists activities available to the user''s company that have sub activity
    times, ordered by name

    - fBINCard (BR-13 Search): Search runs the procedure configured for this screen with the login company

    - fCityMaster (BR-14 Search Scope): Search lists cities available in the logged-in company, ordered by city name

    - fCostCenterMaster (BR-12 Search Scope): Search lists cost centers available in the logged-in company, ordered by name

    - fCurrencyConversion (BR-13 Search Scope): Search lists rates whose exchange currency is linked to the logged-in company

    - fExpenseHead (BR-12 Search Scope): Search lists heads available in the logged-in company, ordered by name

    - fFinanceBook (BR-18 Search Scope): Search lists all books of all companies

    - fItemMaster (BR-36 Search Scope): Search lists only items mapped to the current company, ordered by description

    - fItemStandardAttributeValue (BR-17 Search Scope and View-Only): Search lists latest combinations of all items regardless
    of company; an opened combination is shown in single layout with all controls locked

    - fMakeMaster (BR-14 Search Scope): Search lists only makes available in the logged-in company, with item count and audit
    details

    - fPermitMaster (BR-13 Search Scope): Search lists permits available to the login company, ordered by name

    - fPurchaseOrganization (BR-07 Search Scope): Search lists all organizations, including inactive ones, regardless of company

    - fQCParameter (BR-13 Search Scope): Search lists parameters available to the login company, ordered by name

    - fQualityParameter (BR-17 Search Scope and Access): Search lists parameters linked to the login company; there is no
    head office restriction on save or delete

    - fQuotation (BR-20 Search and Load Scope): Search lists quotations of the company and year; loading always shows the
    current revision of the quotation

    - fRequestforQuotation (BR-24 Search Scope): Search lists RFQs of the logged-in company and financial year; the active
    search variant also restricts by division for users with division-wise roles

    - fSingleFieldMaster (BR-18 Search Scope): Search lists entries available to the current company; Technical Grade lists
    all grades

    - fSingleFieldMaster (BR-19 Category Search Layout): Category search runs the active search layout from the search configuration:
    the default layout includes "Created Date"; an alternative customer layout (tag NIPL, inactive in the export) omits it

    - fSpecification (BR-13 Search Scope): Search lists specifications of the login company, ordered by name

    - fTDCAccountRule (BR-14 Search Scope): Search lists all rules regardless of company, ordered by description

    - fTDCMaster (BR-14 Search Scope): Search shows charges available to the login company whose tax group is active

    - fWarehouse (BR-13 Search Scope): Search lists all warehouses of all companies with their business units

    '
  applies_to:
  - form:fAccountGroupMaster
  - form:fAccountMaster
  - form:fAccountRuleDefinition
  - form:fActivityMaster
  - form:fBINCard
  - form:fCityMaster
  - form:fCostCenterMaster
  - form:fCurrencyConversion
  - form:fExpenseHead
  - form:fFinanceBook
