- key: mandatory-document-fields
  name: Mandatory fields and valid selections on documents
  type: validation
  summary: Documents refuse to save until the mandatory fields listed per form are filled with valid values.
  description: 'Evidence: code

    Documents refuse to save until the mandatory fields listed per form are filled with valid values.

    Per form:

    - fDocumentReceipt (BR-01 Compulsory Fields Highlighted): Document Type, Party Name, Location, Document No. and Document
    Date are marked as compulsory on screen

    - fDocumentReceipt (BR-03 Document Type Required): A Document Type from the active list must be selected (MSG-02). Only
    types not flagged inactive are listed; messages: "Select valid Document Type."

    - fDocumentReceipt (BR-04 Party, Location and Document No. Required): Party Name and Location must be selected and Document
    No. must not be blank after trimming (MSG-03, MSG-04, MSG-05); messages: "Select valid Party Name.", "Select valid Location.",
    "Enter Document No.."

    - fGRN (BR-04 Mandatory Header): Source Document, Vendor Name and Vendor Location must be selected (MSG-09 to MSG-11);
    messages: "Select valid Source Document.", "Select valid Vendor Name.", "Select valid Vendor Location."

    - fGRN (BR-17 Reference Required and Dated): Non-Direct receipts need at least one selected reference (MSG-38); a reference
    dated after the GRN date is refused (MSG-39); a reference currency different from the GRN currency is refused (MSG-40);
    messages: "Select atleast one Gate Entry.", "GRN Date can''t be less than ", "Currency is Different than select Reference
    "

    - fGRN (BR-41 Purchase Bill Not Required): The flag is set when Return through Dispatch Challan is off and accepted quantity
    is zero; the database recalculates it on every save

    - fIndent (BR-09 Reference Required): For sources other than Direct and Auto Procurement a Ref. Document No. is mandatory
    (MSG-07), and the document date must not be before the reference date (MSG-08). Material Requests offered are authorised,
    of the same company and division, open or partly covered, with outstanding quantity after issues and earlier indents;
    messages: "Qty. in Purchase Request cannot be more than Qty. in Material Planning for Item ", "Select valid Reference
    Doc No.", "Document Date can''t be less than Ref Doc Date."

    - fIndent (BR-11 Mandatory Header): Indent Type (MSG-09), Department (MSG-10) and Requested By (MSG-11) are mandatory.
    Indent Types offered: Capital, Revenue, RawMaterial; default Revenue; messages: "Select valid Indent Type.", "Select valid
    Department.", "Enter or select valid Requested By."

    - fIndentRequisition (BR-07 Source Document Mandatory): A Source Document must be selected (MSG-04); messages: "Select
    valid Source Document."

    - fIndentRequisition (BR-09 Mandatory Header Fields): Request Type, Department and Requested By are mandatory (MSG-06,
    MSG-07, MSG-08). Request Type and Department must also be chosen before an item is entered on a line. Only Capital, Revenue
    and RawMaterial are offered as Request Type, with the default one pre-selected; messages: "Select valid Requisition Type.",
    "Select valid Department.", "Enter or select valid Requested By."

    - fIndentRequisition (BR-10 Request For Mandatory by Configuration): When the company''s custom validation "Request For
    compulsory" is active, Request For must be selected (MSG-10). In the current configuration it is active; messages: "Select
    valid Request For."

    - fIndentRequisition (BR-13 Issue To Mandatory): For Material Issue an Issue To value is mandatory (MSG-14); messages:
    "Select valid Issue to."

    - fIndentRequisition (BR-14 Recipient Mandatory): For Material Issue with Issue To selected, the recipient is mandatory
    (MSG-15). Employee saves as employee; Contractor and Vendor save as vendor. Contractors are vendors of contractor type;
    messages: "Select valid ", "Select valid Employee Name."

    - fPaymentAdvice (BR-04 Account Required and Filtered): Account Name is mandatory (MSG-04); after a finance book is chosen
    only accounts of that book are shown; messages: "Select valid Account Name."

    - fPaymentPlan (BR-06 Selection Required): At least one ticked item or one account line is required (MSG-04). If a ticked
    item has other details, it must be the only ticked item (MSG-05); messages: "Select atleast one Reference/ Account Name.",
    "Can''t select more than one Reference with other details applicable."

    - fPaymentPlan (BR-18 Payee Name Required): A ticked item without a payee name is refused (MSG-28); messages: "Payee Name
    is missing in row ", ". Select Valid Account Name in Order Account Assignment for this order."

    - fPaymentRequest (BR-01 Compulsory Fields Highlighted): Request Type, Payee Type, Payee Name, Amount, Payment Mode and
    Requested By are marked compulsory

    - fPaymentRequest (BR-03 Mandatory Selections): Request Type, Payee Type and Payment Mode must be selected from their
    lists and Requested By must not be blank (MSG-03, MSG-04, MSG-10, MSG-11); messages: "Select valid Request Type.", "Select
    valid Payee Type.", "Select valid Payment Mode.", "Enter Requested By."

    - fPaymentRequest (BR-07 Amount Required): Amount must be non-empty and not zero, two decimals, at most 12 characters
    (MSG-09); messages: "Amount can''t be empty or zero."

    - fPaymentVoucher (BR-04 Voucher Type Required): Voucher Type must be chosen (MSG-08); for Inter FB, more than one finance
    book account together with more than one regular account is refused (MSG-09); messages: "Select valid Voucher Type.",
    "In InterFB Voucher can''t select multiple InterFB Account and multiple Regular Account."

    - fPaymentVoucher (BR-09 Cash or Bank Required and Unique): At least one cash or bank account is required (MSG-16); the
    same type of cash or bank account cannot appear twice, and cash and bank cannot be mixed (MSG-29, MSG-30, MSG-31); messages:
    "Select atleast one cash/ bank account.", "Duplicate Account with same bank account type can''t be selected.", "Duplicate
    Account with same cash account type can''t be selected.", "Duplicate Account with same cash/bank account type can''t be
    selected."

    - fPurchaseBill (BR-04 Source Document mandatory): Source Document must be a valid list entry (MSG-04); messages: "Select
    valid Source Document."

    - fPurchaseBill (BR-05 Vendor and Location mandatory): Vendor Name and Location must be selected (MSG-05, MSG-06); messages:
    "Select valid Vendor Name.", "Select valid Location."

    - fPurchaseBill (BR-07 Pay To mandatory): Pay To must be selected; it defaults to the vendor (MSG-09); messages: "Select
    valid Pay to."

    - fPurchaseBill (BR-15 Shipping parties mandatory): Shipped From Party, Shipped From Location, Shipped To Party and Shipped
    To Location are required (MSG-16 to MSG-19). Shipped From defaults to the vendor and location; Shipped To Party defaults
    to the company''s own vendor record; messages: "Select valid Shipped from Party.", "Select valid Shipped from Location.",
    "Select valid Shipped To Party.", "Select valid Shipped To Location."

    - fPurchaseBill (BR-19 Advance adjustment compulsory, client rule): When custom rule 43 is active and advances exist but
    none is adjusted, its configured description is shown as warning or error (MSG-25); messages: "Advance Adjustment is compulsory"

    - fPurchaseOrder (BR-05 Mandatory Header): Document Type, Purchase Type, Purchase Category, Ref. Doc. Type, Vendor Name,
    Location and Validity Date are mandatory (MSG-08 to MSG-14); messages: "Select valid Document Type.", "Select valid Purchase
    Type.", "Select valid Purchase Category.", "Select valid Ref. Doc. Type.", "Select valid Vendor Name.", "Select valid
    Vendor Location.", "Select valid Validity date."

    - fPurchaseOrder (BR-32 Indent Selection Required): When indents are required by settings, at least one source line must
    be selected (MSG-69). This does not apply for Direct, Against DO, or Purchase Contract with "create PO without indent";
    messages: "Select atleast one Item in <indent tab caption>."

    - fPurchaseOrder (BR-46 Tolerance Required Rule): When active, item-type lines without tolerance warn (MSG-124) or block
    (MSG-125); messages: "Tolerance is empty for row no. N . Do you want to continue?", "Tolerance Can''t be empty for row
    no. N ."

    - fRequestforQuotation (BR-03 Mandatory Header): Source Document, Submission Date, Opening Date and Validity Date are
    compulsory; Source Document must be a list value (MSG-02); the document control validates its own fields (MSG-32); messages:
    "Select valid Source Document."

    - fRequestforQuotation (BR-06 Source Selection Required): For Purchase Request, GRC and Sales Order at least one source
    line must be ticked (MSG-07, MSG-08, MSG-09); messages: "Select atleast one Indent .", "Select atleast one GRC.", "Select
    atleast one Sales Order."

    '
  applies_to:
  - form:fDocumentReceipt
  - form:fGRN
