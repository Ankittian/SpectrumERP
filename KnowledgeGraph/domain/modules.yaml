modules:
- code: FI
  name: Finance
  status: active
  summary: Ledger, books, taxes and charges, and the supplier bill to payment flow.
  description: |
    Evidence: code + ERP domain (inferred)
    Chart of accounts, finance books, account determination, tax and charge set-up, and accounts payable (document receipt, purchase bill, payment request, plan, advice, voucher).
- code: MM
  name: Material Management
  status: active
  summary: Materials, purchasing, stores, quality inspection and the masters they use.
  description: |
    Evidence: code + ERP domain (inferred)
    Master data for materials, units, vendors and storage, and the procure-to-pay and stores flows built on it.
- code: PM
  name: Plant Maintenance
  status: active
  summary: Maintenance (EAM) master data and maintenance consumption of stores material.
  description: |
    Evidence: code + ERP domain (inferred)
    Work permit templates and maintenance flows that draw spares from MM stores.
- code: PP
  name: Production Planning
  status: active
  summary: Production units and production activities used by process plans.
  description: |
    Evidence: code + ERP domain (inferred)
    Production master data maintained by the in-scope forms.
- code: MD
  name: Master Data
  status: active
  summary: Shared master screens used by several modules.
  description: |
    Evidence: code + ERP domain (inferred)
    Master Entry screens of the KB validation plan that the phase's transaction forms read.
- code: SD
  name: Sales and Distribution
  status: active
  summary: Customer enquiry, quotation, sales order, dispatch, invoice and returns.
  description: |
    Evidence: code + ERP domain (inferred)
    Order to cash: pre-sales, sales orders and agreements, dispatch planning and challans, invoices, returns and certificates.
- code: ADM
  name: Settings and Utilities
  status: active
  summary: Company settings, account mappings, utilities and shared popups.
  description: |
    Evidence: code + ERP domain (inferred)
    Configuration and utility screens and the shared search / PO booking popups.
- code: WB
  name: Weigh Bridge
  status: active
  summary: First and second weighment of vehicles for gate, GRN and dispatch.
  description: |
    Evidence: code + ERP domain (inferred)
    Weighbridge readings that the gate entry, GRN and dispatch documents use.
- code: DRM
  name: Discrete Raw Material
  status: active
  summary: 'Raw material lots: opening, gate entry, SIN, issue, return, transfer, adjustment and consumption.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Discrete RM module tracks raw material by lot from gate entry to consumption.
- code: RPT
  name: Reports
  status: active
  summary: 'Report catalogue: one stored procedure per report in globaldata.ReportDescriptionMain.'
  description: |
    Evidence: code + ERP domain (inferred)
    The 879 active reports, split into sub-phases 13a-13g by module. Reports whose SP is missing from the export (13f payroll reads the HIRA database) are not in the graph.
