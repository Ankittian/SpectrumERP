form: fDocumentReceipt
title: Document Receipt
module: FI
kind: transaction
users:
- Accounts officer (inferred)
summary: The Document Receipt screen records the arrival of a party document, such as a purchase invoice, debit/credit note
  or subcontract bill, before Finance processes it.
purpose: |
  What it is: An inward register of party documents (bills, notes) received by the company, with their amounts and links to the goods receipt documents they relate to. When it applies: When a party's bill or note physically or electronically arrives at the company and must be logged before bill passing. Business outcome: Every received bill is traceable, duplicate bill numbers per party and year are blocked (BR-09), and later billing screens can pick up the receipt.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - GeneralDetails Tab: The default tab holding the receipt header, the reference grid and the notes control.
  - CustomFields Tab: A second tab hosting the shared custom field control.
  - Receipt Entry No. Field: Read-only text box.
  - Receipt Date Field: Date picker; mandatory by nature (always has a value).
  - Document Type Field: Dropdown, mandatory (highlighted as compulsory); list of active receipt types (BR-03).
  - Party Name Field: Dropdown with a search button, mandatory; columns Party Name, Code and Vendor Type (BR-05).
  - Location Field: Dropdown, mandatory; columns Vendor Location and Code.
  - Document No. Field: Text box, mandatory, maximum 30 characters; trimmed on save.
  - Document Date Field: Date picker, mandatory.
  - Amount Field: Numeric text box with two decimals, optional, maximum 12 characters as set at runtime.
  - Tax Amount Field: Numeric text box with two decimals, optional, maximum 12 characters as set at runtime.
  - Received Through Field: Dropdown, optional; values Courier, Fax, Mail, Letter, Hand.
  - Receiver Name Field: Editable dropdown, optional, up to 100 characters stored; the list offers receiver names already used on receipts of the company.
  - Forward To Field: Dropdown, optional; list of application modules.
  - Forwarded Date Field: Date picker.
  - Source Document Field: Dropdown, optional; values GRN, GatePass, MRA, SIN.
  - Filter Button: Small button next to Source Document, hidden by default.
  - Show All Documents Checkbox (General Details): Checkbox with From Date and To Date pickers that appear when it is ticked.
  - Bill Passed Checkbox: Checkbox, ticked by default whenever Document Type changes.
  - Remarks Field: Multi-line text box, optional, maximum 1000 characters; trimmed on save.
  - Reference Detail Grid: Grid of eligible source documents with a tick column (no header text), Document No., Document Date, Finance Book (captioned Profit Center when finance books are profit centers), Division (hidden when divisions are not used) and, for GRNs, Vendor Bill No., Vendor Bill Date, Challan No., Challan Date and PO No.
  - Notes Control: Shared notes control on the GeneralDetails tab with Print Area, Notes and Default columns.
  - Reference Detail Filter Panel: A panel titled "Reference Detail" overlaid at the top of the screen with Date Filter Apply On (Challan Date or Document Date), From Date, To Date, PO No., PO Reference No., Item Description, a Show All Documents checkbox, the Show button, the O&k button and a GRN item grid.
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open, showing the standard search window.
  Delete: Standard toolbar Delete.
validations:
- Receipt date should be in current financial year.
- Select valid Document Type.
- Select valid Party Name.
- Select valid Location.
- Enter Document No..
- Duplicate Document No. not allowed for this Party Name.
- Select atleast one Document No.
- Document Can't be of different Profit Center.
- Document Can't be of different finance books.
- Receipt Date can't be Less than Document Date.
- GRN with different currencies are not allowed.
- Document Date must be less than or equal to receipt date.
- Tax amount can't be greater than Bill Amount.
- Forwarded Date must be greater than or equal to Receipt Date.
- Select valid Date Filter On.
- 'Document No. '
- ' saved successfully.'
- Unable to save, this entry has already been used in Debit/Credit Note.
- Unable to save, this entry has already been used in Service Bill.
- Unable to save, this entry has already been used in Purchase Bill.
- Bill is prepared against this Receipt
manages:
- document-receipt
uses_concepts:
- accounting-voucher
- company
- currency-exchange-rate
- finance-book
