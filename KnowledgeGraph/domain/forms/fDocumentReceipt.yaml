  Delete: Deletes the record through Finance.FDRNDelete.
  FillValues: Fills the lookup lists through Finance.FDRNFillValues.
  FillValuesDependent: Fills the lookup lists through Finance.FDRNFillValuesDependent.
  FillValuesVendor: Fills the lookup lists through GlobalData.VendorLocationSelect.
  LoadData: Loads the selected record through Finance.FDRNLoadData.
  Open: Searches records through Finance.FDRNSearchData.
  ReferenceFilter: Runs through Finance.FDRNReferenceFilter.
  Save: Saves the record through Finance.FDRNSaveMain.
  SaveCustomFieldDetail: Saves the record through Finance.FDRNSaveCustomFieldDetail.
  SaveNotesDetail: Saves the record through Finance.FDRNSaveNotesDetail.
