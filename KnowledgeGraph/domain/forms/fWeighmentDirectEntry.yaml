form: fWeighmentDirectEntry
title: Weighment Direct Entry
module: WB
kind: transaction
summary: The Weighment Direct Entry screen lets a clerk record a complete weighment in one step, typing the gross and tare
  weights and their times for each item instead of reading them from the weighing machine.
purpose: |
  What it is: A weighment slip created and finished by keyboard entry, with one or more item rows each carrying gross, tare and net weight [fWeighmentDirectEntry.vb:451-583]. When it applies: When the machine-driven First and Second Weighment steps could not be used. Business outcome: The weigh bridge record stays complete and numbered even when the hardware flow was bypassed (BR-08; BR-11).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A single page with a general-detail group on top and an item grid below; the window caption is "FirstWeighment" [fWeighmentDirectEntry.Designer.vb:335; fWeighmentDirectEntry.Designer.vb:530].
  - Machine Name Field: A dropdown labelled "Machine Name" showing machine name and unit; mandatory on save [fWeighmentDirectEntry.Designer.vb:94; fWeighmentDirectEntry.vb:106; fWeighmentDirectEntry.vb:331-335].
  - Weighment Type Field: Dropdown, mandatory [fWeighmentDirectEntry.vb:37; fWeighmentDirectEntry.vb:337-341].
  - Entry Date Field: Date and time picker with a check box that must be ticked [fWeighmentDirectEntry.vb:343-348; fWeighmentDirectEntry.Designer.vb:117].
  - Source Document Field: Dropdown, mandatory; it offers only Direct, plus Gate Entry when an existing slip is opened and the company setting disables Gate Entry quantity update [fWeighmentDirectEntry.vb:350-355; WeighBridge.WBDEFillValues:28-42].
  - Ref. Doc. No and Ref. Doc. Date Fields: Read-only text with labels "Ref.
  - Invoice/Challan No. Field: Read-only text labelled "Invoice/Challan No." [fWeighmentDirectEntry.Designer.vb:389; fWeighmentDirectEntry.Designer.vb:396].
  - Vendor Type and Vendor Name Fields: Vendor Type dropdown (codes 5, 6, 11); Vendor Name dropdown or, for type Others, a text box [WeighBridge.WBDEFillValues:45-59; fWeighmentDirectEntry.vb:653-677].
  - Transporter Name, Vehicle No. and Driver Name Fields: Transporter Name is an optional dropdown; Vehicle No.
  - Last Tare Weight Field: Read-only number with the machine's unit [fWeighmentDirectEntry.Designer.vb:217; fWeighmentDirectEntry.vb:730-752].
  - Weight Type Field: Dropdown, mandatory [fWeighmentDirectEntry.vb:386-391].
  - Party Tare Weight Field: Optional number, 3 decimals, up to 10 characters [fWeighmentDirectEntry.Designer.vb:294; fWeighmentDirectEntry.vb:91; fWeighmentDirectEntry.vb:502-506].
  - W.B. Clerk Name and Remarks Fields: Clerk Name is a read-only display of the user, or the slip's creator when opened; Remarks is optional text up to 1000 characters [fWeighmentDirectEntry.vb:112-116; fWeighmentDirectEntry.vb:92; fWeighmentDirectEntry.vb:180].
  - Remove From Invoice/Challan Field: Check box "Remove From Invoice/Challan", ticked by default and re-ticked on every reset [fWeighmentDirectEntry.Designer.vb:373-379; fWeighmentDirectEntry.vb:282].
  - Item Detail Grid: Grid with Item Description, Make, Item Attribute (dropdown cells), Gross Wt., Gross Wt.
  - Other Toolbar Actions (Print, Preview, Export, Email, Navigation): Toolbar handlers are empty [fWeighmentDirectEntry.vb:244-276].
actions:
  New: Standard toolbar New [fWeighmentDirectEntry.vb:206-213].
  Save: Standard toolbar Save.
  Search: Standard toolbar Open; lists slips of the company and its branches for the current year and loads the chosen one
    [fWeighmentDirectEntry.vb:215-242; WeighBridge.WBDESearchData:20-54].
  Delete: Standard toolbar Delete on the loaded slip [fWeighmentDirectEntry.vb:44-68].
validations:
- Select valid Weighment Machine.
- Select valid Weighment Type.
- Select valid Entry Date.
- Select valid Source Document.
- Select valid Vendor Type.
- Select valid Vendor Name.
- Enter Vendor Name.
- Enter Vehicle No..
- Select valid Weight Type.
- Select atleast One Item.
- Net weight can not be negative
- Gross Wt. Time can't be empty <row>.
- Tare Wt. Time can't be empty <row>.
- Gross Wt. can't be empty in row <row>.
- Tare Wt. can't be empty <row>.
- Duplicate Item Description not allowed.
- Unable to save Weighment Entry, The same vehicle cannot be entered within 6 hours from the exist entry.
manages:
- weighment-direct-entry
uses_concepts:
- company
- first-weighment
- second-weighment
- weigh-bridge-item-setting
- weighment-machine-master
- weighment-setting
method_notes:
  Delete: Deletes the record through WeighBridge.WBFWDelete.
  FillValues: Fills the lookup lists through WeighBridge.WBDEFillValues.
  GetLastTareWeight: Runs through WeighBridge.WBFWGetLastTareWeight.
  LoadData: Loads the selected record through WeighBridge.WBDELoadData.
  Open: Searches records through WeighBridge.WBDESearchData.
  Save: Saves the record through WeighBridge.WBDESave.
  SaveItemDetail: Saves the record through WeighBridge.WBSWSaveWeighmentSlipDetail.
  UpdateReferenceQty: Runs through WeighBridge.WBSWUpdateReferenceQty.
  ValidateForm: Validates the entry through WeighBridge.WBFWValidate.
