form: fCityMaster
title: City Master
module: MM
kind: master
users:
- Master data administrator (inferred)
summary: The City Master screen maintains cities within states and countries, and lets a city be flagged as a district or
  be linked to a district city of the same state.
purpose: |
  What it is: A coded list of cities under states, with an optional district hierarchy. When it applies: When an address needs a city that does not exist, or a city's name, state or district changes. Business outcome: Clean, non-duplicated geography for addresses, locations and reporting.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - City Details Area: Panel with Code, Country, State, City Name, Is District, District and Inactive.
  - Code Field: Read-only, 6 characters; the "Code" label is a link with tool tip "Switch to fast entry mode.".
  - Country Field: Dropdown (Country Name, Code), mandatory.
  - State Field: Dropdown (State Name, Code), mandatory.
  - City Name Field: Text box, mandatory, trimmed; 50 characters in the database and Fast Entry.
  - Is District Field: Check box.
  - District Field: Dropdown (District Name, Code), optional.
  - Inactive Field: Check box, always disabled.
  - Fast Entry Grid Container: Columns Country, State, City Name (50 characters), Remarks (read only), with Import.
  - Other Toolbar Actions (Print, Preview, Export, Email): Not enabled; handlers empty.
actions:
  Switch back to detail mode.: Link at the top of the Fast Entry container.
  Import: Reads "Country", "State" and "City Name" from an Excel sheet.
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled.
validations:
- Select valid Country Name.
- Select valid State Name.
- Enter City Name.
- Duplicate City Name is not allowed.
- Successfully Created.
- Refer remarks for saved status.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
manages:
- city
uses_concepts:
- company
method_notes:
  Delete: Deletes the record through masterdata.ADCTDelete.
  FillValues: Fills the lookup lists through masterdata.ADCTFillValues.
  LoadData: Loads the selected record through masterdata.ADCTLoadData.
  Open: Searches records through masterdata.ADCTSearchData.
  SaveMain: Saves the record through masterdata.ADCTSave.
  ValidateForm: Validates the entry through masterdata.ADCTValidate.
  ucmbCountry_ValueChanged: Fills the lookup lists through masterdata.ADCTFillValuesDependent.
  ucmbState_ValueChanged: Fills the lookup lists through masterdata.ADCTFillValuesDependent.
