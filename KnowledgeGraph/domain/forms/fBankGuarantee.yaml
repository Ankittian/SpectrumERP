  SaveDivisionDetail: Saves the record through masterdata.MMBGSaveDivisionDetail.
  SaveVendorDetail: Saves the record through masterdata.MMBGSaveVendorDetail.
  ValidateForm: Validates the entry through masterdata.MMBGValidate.
