method_notes:
  Delete: Deletes the record through CustomerService.ESCODelete.
  FillBillingPlan: Runs through CustomerService.ESCOFillBillingPlan.
  FillOccurenceDetail: Runs through CustomerService.ESCOFillOccuranceDetail.
  FillValueDepaendent: Fills the lookup lists through CustomerService.ESCOFillValuesDependent.
  FillValues: Fills the lookup lists through CustomerService.ESCOFillValues.
  LoadData: Loads the selected record through CustomerService.ESCOLoadData.
  LoadPartyLocation: Runs through GlobalData.VendorLocationSelect.
  Open: Searches records through CustomerService.ESCOSearchData.
  Save: Saves the record through CustomerService.ESCOSave.
  SaveBilling: Saves the record through CustomerService.ESCOSaveBillingDetail.
