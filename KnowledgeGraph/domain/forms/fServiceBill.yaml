form: fServiceBill
title: Service Invoice
module: FI
kind: transaction
summary: The Service Invoice screen (window caption "Service Bill") records a vendor's bill for services or subcontract work
  and turns it into a payable.
purpose: |
  What it is: A service invoice is the company's record of a vendor bill for services, subcontract processing or job work, matched to the receipts or production entries it charges for, and the source of the vendor liability in the books. When it applies: When a service vendor or subcontractor submits a bill. Business outcome: Services are billed once per receipt, charged to the right stock, work-in-progress or expense account, and scheduled for payment.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Document number control at top; tabs General Detail, Tax Detail, Advance Detail, Payment Schedule, Custom Field, Posting Detail and GST Posting; below, Service Detail and Supplementary Invoice tabs.
  - Document No., Date, Finance Book, Division and Status: Shared document number control; authorized bills get read-only status.
  - Source Document, Vendor Name, Location, Pay To Fields: Mandatory pick lists.
  - Vendor Bill No., Vendor Bill Date, Amount Fields: Bill number picked from document receipts (or typed when not compulsory), bill date and bill amount (max 12 characters).
  - Payment Mode, Narration, Net Amount, Advance Fields: Payment mode (mandatory), narration, net amount and total advance (read-only totals).
  - Service Tax Rule, GST Tax Rule, Place of State Fields: Mutually exclusive tax rules and the state of supply, defaulting to the company state.
  - Document Detail Grid: Receipts or production entries with Select, Document No., Date, Challan No.
  - Service Detail Grid: Service lines with caption "Service Description"; remarks up to 500 characters; for Direct bills a new row is added automatically.
  - Advance Detail Tab: Adjust Advance check box (default checked), Manual/Automatic option, advance grid, Imprest Account, Imprest Amount (max 15 characters) and Balance Amount with Dr/Cr.
  - Payment Schedule Tab: Read-only schedule of reference, due date, due amount and actual amount.
  - Tax Detail, Posting Detail, GST Posting, Custom Field Tabs and Notes: Shared tax control, posting proposal, GST posting detail, custom fields and notes.
  - Maintenance Key Combinations: Ctrl+Alt+G on GST Posting rebuilds GST posting; Ctrl+Alt+V on Posting Detail re-saves the voucher; Ctrl+Alt+G on Posting Detail builds a narration update script for all bills.
actions:
  New, Save, Search, Delete, Navigation and Other: Toolbar New, Save, Open, Delete, Navigation, Print, Preview, Export and
    Email; the print uses the service invoice report.
