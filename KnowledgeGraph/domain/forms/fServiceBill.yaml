method_notes:
  Delete: Deletes the record through Finance.FASBDelete.
  FillValueDependent: Fills the lookup lists through Finance.FASBFillValuesDependent.
  FillValues: Fills the lookup lists through Finance.FASBFillValues.
  FillValuesPOWise: Fills the lookup lists through Finance.FASBFillValuesPOWise.
  FillValuesVendor: Fills the lookup lists through GlobalData.VendorLocationSelect.
  GetAccountBalance: Runs through Finance.AccountOpening.
  ItemAccountDetail: Runs through masterdata.ItemAccountDetail.
  LoadData: Loads the selected record through Finance.FASBLoadData.
  Open: Searches records through Finance.FASBSearchData.
  Save: Saves the record through Finance.FASBAuthorize, Finance.FASBSave, Finance.VoucherSaveStatuory, Inventory.VoucherVsLotValidation.
