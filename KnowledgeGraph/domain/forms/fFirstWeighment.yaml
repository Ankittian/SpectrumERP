method_notes:
  CaptureImage: Runs through Utility.FetchIPCameraSetup.
  Delete: Deletes the record through WeighBridge.WBFWDelete.
  FillValues: Fills the lookup lists through WeighBridge.WBFWFillValues.
  FillValuesDependent: Fills the lookup lists through WeighBridge.WBFWFillValuesDependent.
  GetLastTareWeight: Runs through WeighBridge.WBFWGetLastTareWeight.
  LoadData: Loads the selected record through WeighBridge.WBFWLoadData.
  Open: Searches records through WeighBridge.WBFWSearchData.
  Save: Saves the record through WeighBridge.WBFWSave.
  ValidateForm: Validates the entry through WeighBridge.WBFWValidate.
