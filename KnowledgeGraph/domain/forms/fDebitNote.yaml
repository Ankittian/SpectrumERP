form: fDebitNote
title: Debit Note
module: FI
kind: transaction
summary: 'The Debit Note screen records a debit note as an accounting voucher: an entry that debits an account (typically
  a supplier or customer) and credits the related accounts.'
purpose: |
  What it is: Records the accounting entry for a debit note, with a debit line first and balancing lines. When it applies: A user needs this when a return, rate difference or other adjustment must be debited to an account. Business outcome: The party and ledger balances change in one approved, balanced document.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Document number, document date, finance book, status and prefix, with a repeat entry button when the voucher copy setting is on ([fDebitNote.vb:38; Voucher.cs:154-161]).
  - Voucher Type Field: "Voucher T&ype" list with Regular and Inter FB ([Voucher.Designer.cs:226]).
  - Voucher Grid: Columns Type, Account Name, Current Balance, Balance Amount, Debit Amount, Credit Amount, Ref.
  - Ref. Detail, Cost Center, Qty. Detail and TDC Rule Pop-ups: Pop-up editors opened from the grid cells.
  - Narration Field: "&Narration" text area.
  - Total Debit and Total Credit: Running totals of the grid.
actions:
  Toolbar: New, Save, Open, Delete, Navigation, Print, Print Preview, Export, Email ([fDebitNote.vb:23-33]).
validations:
