form: fPaymentVoucher
title: Payment Voucher
module: FI
kind: transaction
users:
- Accounts officer (inferred)
summary: The Payment Voucher screen records money paid out of a cash or bank account.
purpose: |
  What it is: The accounting entry for a payment, crediting cash or bank and debiting the payees or expense accounts. When it applies: Whenever money is paid out, manually or as a voucher generated by another finance screen and opened here. Business outcome: The ledger, party references and bank payment particulars are updated in one approved document.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Document number, date, finance book, status and prefix, with a repeat entry button when voucher copy is enabled.
  - Voucher Type Field: "Voucher T&ype" list with Regular and Inter FB.
  - Currency Field: Currency and conversion rate.
  - Voucher Grid: Columns Type, Account Name, Current Balance, Balance Amount, Debit Amount, Credit Amount, Ref.
  - Ref. Detail, Cost Center, Qty. Detail and TDC Rule Pop-ups: Pop-up editors opened from the grid cells.
  - Payment Detail Grid: Columns Payment Mode, Issued To, Cheque/DD/UTR No., Date, Amount, In Favour Of, Party Bank Name, Branch Name.
  - Narration Field: "&Narration", up to 2000 characters, rebuilt automatically when accounts, amounts or payment details change.
  - Total Debit and Total Credit: Running totals of the grid.
actions:
  Toolbar: New, Save, Open, Delete, Navigation, Print, Print Preview, Export, Email.
