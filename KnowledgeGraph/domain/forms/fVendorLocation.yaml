method_notes:
  Delete: Deletes the record through masterdata.VIVLDelete.
  DeleteBankDetail: Deletes the record through masterdata.VIBDDelete.
  DeleteContactPerson: Deletes the record through masterdata.VICPDelete.
  FillValues: Fills the lookup lists through masterdata.VIVLFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.VIVLFillValuesDependent.
  LoadVendorDetail: Loads the selected record through masterdata.VIVLLoadData.
  LoadVendorRequestDetail: Loads the selected record through masterdata.VIRQLoadData.
  Open: Searches records through masterdata.VIVLSearchData.
  SaveBankDetail: Saves the record through masterdata.VIBDSaveMain.
  SaveCompanyDetail: Saves the record through masterdata.VIVLDeleteCompanyInactiveDetail, masterdata.VIVLSaveCompanyInactiveDetail.
