form: fTDCGroup
title: TDC Group
module: FI
kind: master
users:
- Tax administrator (inferred)
summary: The TDC Group screen maintains groups of taxes, duties and charges (TDC, Inferred expansion).
purpose: |
  What it is: A classification of taxes, duties and charges under a tax category with a rounding rule. When it applies: When a new tax or charge grouping is needed, or the rounding method of a group changes. Business outcome: Consistent grouping and rounding of tax and charge amounts (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A single header panel with four fields.
  - Code Field: Mandatory text box, exactly 6 characters (BR-01, BR-02).
  - Category Field: Mandatory dropdown of active tax categories (BR-03).
  - Group Name Field: Mandatory text box, up to 50 characters (BR-01, BR-05).
  - Rounding Field: Dropdown of rounding methods; required by validation although not marked mandatory on screen (BR-04).
  - Other Toolbar Actions (Navigation, Print, Preview, Export, Email): Not implemented on this screen; the standard master toolbar set applies (Inferred).
actions:
  New: Standard toolbar New.
  Save: Creates or updates the group.
  Search: Opens the standard search list of active groups with code, category and group name.
  Delete: Deletes the loaded group after confirmation (MSG-11).
validations:
- Enter Code.
- Code length should be 6
- Group Code should be 6 in length
- Select valid Category.
- Enter Group Name.
- Select valid Rounding.
- Duplicate Code is not allowed.
- Duplicate Group Name is not allowed.
manages:
- tdc-group
method_notes:
  Delete: Deletes the record through masterdata.TDCGDelete.
  FillValues: Fills the lookup lists through masterdata.TDCGFillValues.
  LoadData: Loads the selected record through masterdata.TDCGLoadData.
  Open: Searches records through masterdata.TDCGSearchData.
  Save: Saves the record through masterdata.TDCGSave.
  ValidateGeneralDetail: Validates the entry through masterdata.TDCGValidate.
