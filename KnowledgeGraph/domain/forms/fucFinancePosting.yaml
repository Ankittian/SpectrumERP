usercontrol: fucFinancePosting
title: Finance posting control
module: FI
kind: component
users:
- Users of the host screens (inferred)
summary: Embedded finance posting preview and save for transactions.
purpose: |
  Builds the ledger posting of a transaction from its document detail, tax groups and misc charges (FinancePostingFillValues*) and saves the item detail of the voucher (VoucherSaveItemDetail).
functional_description: |
  Embedded in: fGRN, fPurchaseBill.
  On-screen fields: Document No., Narration, TDC Rule Description, Tax Group, Voucher Type.
uses_concepts:
- accounting-voucher
- ledger-account
method_notes:
  FillValues: Fills the lookup lists through Finance.FinancePostingFillValues.
  FillValuesDependent: Fills the lookup lists through Finance.VoucherFillValuesDependent.
  FillValuesDocumentDetail: Fills the lookup lists through Finance.FinancePostingFillValuesDocumentDetail.
  FillValuesDocumentDetails: Fills the lookup lists through Finance.FinancePostingFillValuesDocumentDetails.
  FillValuesMiscCharge: Fills the lookup lists through Finance.FinancePostingFillValuesMiscCharge.
  FillValuesMiscChargeItemNo: Fills the lookup lists through Finance.FinancePostingFillValuesMiscChargeItemNo.
  FillValuesTaxGroup: Fills the lookup lists through Finance.FinancePostingFillValuesTaxGroup.
  FillValuesTaxGroupMiscCharge: Fills the lookup lists through Finance.FinancePostingFillValuesTaxGroupMiscCharge.
  LoadData: Loads the selected record through Finance.FinancePostingLoadData.
  SaveItemDetail: Saves the record through Finance.VoucherSaveItemDetail.
