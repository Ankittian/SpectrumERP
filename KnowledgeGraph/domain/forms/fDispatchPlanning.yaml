form: fDispatchPlanning
title: Dispatch Planning
module: SD
kind: transaction
summary: The Dispatch Planning screen lets a sales organisation plan, for a stated period, how much of each open sales order
  line will be dispatched, to which consignee and consignee location, from which warehouse and on which schedule date.
purpose: |
  What it is: A planning document that commits quantities of open sales-order lines to consignees, warehouses and schedule dates within a planning period. When it applies: Before goods are advised, picked or dispatched against sales orders. Business outcome: Dispatch is driven from an agreed plan, and the same order quantity cannot be planned twice (BR-07, BR-12, BR-13).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout: The document-number control at the top, an Other Details area (Sales Organization, Sales Category, Planning Period, Remarks and the Notes control) and a two-tab area: Order Detail and Custom Field [fDispatchPlanning.Designer.vb:245-251].
  - Document No., Date, Division and Status Control: The shared control capturing the yearly document number (or an automatic number from a prefix), Document Date, Division and Status [fDispatchPlanning.vb:495-499].
  - Sales Organization Field: A dropdown, mandatory, listing Sales Organization, Company, Division [fDispatchPlanning.vb:191] [fDispatchPlanning.vb:271-273].
  - Sales Category Field: A dropdown of active Sales Categories.
  - Planning Period: From Date and To Date Fields: Two date pickers in the Planning Period box.
  - Remarks Field: An optional text box, up to 1000 characters [fDispatchPlanning.Designer.vb:257].
  - Notes Control: The shared Notes control with Print Area, Notes and Default columns [fDispatchPlanning.Designer.vb:392-393].
  - Order Detail Grid: The grid of eligible order lines.
  - Shipment Detail Popup: A row-edit popup with a grid of Consignee Name, Consignee Location, Attribute, Schedule Date, Warehouse and Quantity, and Ok and Cancel buttons [fDispatchPlanning.Designer.vb:163-205].
  - Technical Description Popup: A popup showing the item's technical description in a text box that is disabled in the design, with Ok and Cancel [fDispatchPlanning.Designer.vb:451] [fDispatchPlanning.vb:2029-2048].
  - Specification Popup: A popup with a grid of Code, Quality Parameter, QP Type, Unit, Value (and Lower/Upper Limit where the parameter is a range) for the line's specification, with Ok and Cancel [fDispatchPlanning.vb:1948-1990].
  - Custom Field Tab: The shared Custom Field grid on the Custom Field tab.
  - Navigation and Other Toolbar Actions (First, Previous, Next, Last, Print, Preview, Export, Email): Standard toolbar actions.
actions:
  New: Starts a blank planning.
  Save: Validates and stores the planning.
  Search: Opens the common search window filled with the plannings of the logged-in company and year.
  Delete: Deletes the loaded planning after confirmation.
validations:
- Select valid Sales Organization.
- From Date can't be less than Document Date.
- To Date can't be less than Document Date.
- From Date can't be greater than To Date.
- Authorized Dispatch Planning can't be updated.
- Authorized entry can't be updated.
- Authorized entry can''t be updated.
- 'There exists unauthorized dispatch planning for  Sales Order : <no>, Item : <item>, Make : <make>, Attribute : <attribute>'
- Duplicate Document No. not allowed.
- Select atlease one Order.
- Can't select more than one Order.
- Can't select multiple sales order.
- Quantity can't be empty or zero in row <n>.
- Quantity. can't be greater than Balance Planning Qty. in row <n>.
- Quantity. can't be greater than Schedule Qty. in row <n>.
- Amount can't be empty or 0 in row <n>.
- Document date can't be less than sales order date.
- Select valid Consignee Location in row <n>.
- Select Schedule Date in row <n>.
- Schedule Date can't be less than document date in row <n>.
- Select valid Warehouse in row <n>.
- Select atleast one Shipment Detail.
- Total Quantity should be equal to <qty> in row <n>.
- Unable to save, Quantity cannot be more than Balance Planning Qty for Sales Order:<no>,Item:<item>,Make:<make>,Combination:<attribute>
- Duplicate Consignee Name is not allowed for same Consignee Location and Attribute.
- Do you want to continue?
- Picking already exists for this dispatch planning.
- Document No. <no> saved successfully.
manages:
- dispatch-planning
uses_concepts:
- company
- dispatch-advice
- picking
