  Open: Searches records through Finance.FIPASearchData.
  Save: Saves the record through Finance.FIPASave.
  SavePaymentDetails: Saves the record through Finance.FIPASavePaymentAdviceDetail.
  ValidateForm: Validates the entry through Finance.FIPAValidate.
