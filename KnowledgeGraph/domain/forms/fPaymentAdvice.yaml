form: fPaymentAdvice
title: Payment Advice
module: FI
kind: transaction
users:
- Finance controller (inferred)
summary: The Payment Advice screen records an approved instruction stating how much may be paid against a ledger account,
  either as a direct amount or broken down by open payable references or sundry payments.
purpose: |
  What it is: An approvable limit on what may be paid, per account, per reference or per sundry payment. When it applies: When management approves payments before the payment plan is prepared. Business outcome: Payment plans cannot exceed advised amounts where the company enforces advices.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Shared document numbering control with number, date, finance book, division, prefix and status.
  - Source Document Field: Dropdown, mandatory; values Direct, Sundry Payment, Reference.
  - Account Name Field: Dropdown, mandatory.
  - Reference No Field: Text box, up to 50 characters.
  - Reference Date Field: Date picker with tick box.
  - Amount Field: Numeric text box, two decimals, up to 13 characters.
  - Payment Mode Field: Dropdown, mandatory.
  - Remarks Field: Text box, optional, up to 200 characters.
  - Payment Details Grid: Grid with tick column, Reference No, Reference Date, Reference Amount (hidden for Sundry Payment), Balance Amount, Previous Advice Amount and Passing Amount; the internal key is hidden.
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with the standard search window.
  Delete: Standard toolbar Delete.
validations:
- Authorized PaymentAdvice can't be updated.
- Authorized entry can't be updated.
- Select valid Source Document.
- Select valid Account Name.
- Enter a valid Reference No.
- Select a valid reference date.
- Enter Amount.
- Select valid Payment Mode.
- Select a valid reference.
- 'Passing Amount can''t be empty or zero in row '
- 'Passing Amount can''t be greater than Balance Amount in row '
- 'Document No. '
- ' saved successfully.'
- Duplicate Document No. not allowed.
manages:
- payment-advice
uses_concepts:
- accounting-voucher
- company
- finance-book
- payment-plan
