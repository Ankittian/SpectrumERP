usercontrol: TNCGroup
title: Terms and conditions control
module: MM
kind: component
users:
- Users of the host screens (inferred)
summary: Embedded terms and conditions group picker.
purpose: |
  Picks a terms and conditions group and lists its clauses (TNCFillValues / FillValuesDependent).
functional_description: |
  Embedded in: fMaintenanceServiceOrder, fServiceContract, fServiceContractSetup.
  On-screen fields: TNC Group Name.
method_notes:
  FillValues: Fills the lookup lists through masterdata.TNCFillValues.
  ucmbTNCGroup_ValueChanged: Fills the lookup lists through masterdata.TNCFillValuesDependent.
