form: fCS
title: CS (Comparative Statement)
module: MM
kind: transaction
users:
- Purchase officer (inferred)
- Purchase manager (inferred)
summary: The CS screen builds a side-by-side comparative statement for one authorized material Request For Quotation (RFQ).
purpose: |
  What it is: A computed comparison of all authorized offers for an RFQ, used to decide which vendor supplies which quantity at which rate. When it applies: After vendors' quotations against an RFQ are entered and authorized. Business outcome: Transparent vendor selection, documented with signature blocks, and bookings that feed purchase orders.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area: Top panel with the colour legend, RFQ No., "Subject of CS" and "Fit To Page Width".
  - Colour Legend: Four read-only colour swatches with labels "Not Booked", "Partially Completed", "Fully Booked", "P.O.
  - RFQ No. Field: Dropdown showing RFQ No.
  - Subject of CS Field: Text box, optional, 1000 characters; Enter key does not add a new line.
  - Fit To Page Width Checkbox: Checkbox.
  - Comparative Statement Grid: Grid with fixed columns "Item Name", "Make Name", "Unit", "Qty", "LastPurchase", followed by one column pair per offer.
  - Last Purchase Popup: Row popup listing up to 10 recent purchase orders (PO No., PO Date, Supplier Name, Rate, Quantity, Unit, Discount) with an "Ok" button.
  - Booking Context Menu: Menu with "Book For PO", "Edit Booking", "Cancel Booking".
  - Booking Dialog: Separate dialog captioned "Book For PO" or "Edit Booking" with booking quantity (3 decimals), booking rate (2 decimals), remarks and OK.
  - Other Toolbar Actions (Print, Preview, Export): Print sends the grid directly to the printer in landscape; Preview shows a print preview; Export saves the grid as Excel (.xls) or PDF.
actions:
  New: Toolbar New.
  Save, Search, Delete and Navigation: Not offered; their routines are empty.
validations:
- Quotation is Closed, so you can't book it.
- Select valid RFQ No.
- PO has already been made for this Item, It cannot be cancelled.
- 'Do you want to Cancel the booking ? '
- Cancelled successfully
- Quantity cannot be zero or empty.
- Booking Quantity greater than Balance Enquiry Quantity <qty>
- Booking Quantity can not be less than PO Quantity <qty>
- Booking Rate can not be less than or equal to zero.
- Total PO Qty= <x>, Total Booked Qty= <y>
- Booked Qty= <x>, Booking Rate= Rs <y>, PO Qty= <z>
- Vendor Name <v>, PO No. <n>, GRN Date <d>, Rate <r>
manages:
- comparative-statement
uses_concepts:
- company
- hsn-sac-code
- make
- material-item
- purchase-order
- rfq
- tdc-charge
- tdc-group
- tech-specification-head
- unit-of-measure
