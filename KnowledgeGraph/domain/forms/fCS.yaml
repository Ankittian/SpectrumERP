- vendor-location
- vendor-quotation
method_notes:
  CancelBooking: Deletes the record through Purchase.PMCSBookingDelete, Purchase.PMCSRFQItemQty.
  CheckStatus: Runs through Purchase.PMCSGetBookingNo, Purchase.PMCSRFQItemInformation.
  CopmpanyDetails: Runs through masterdata.CompanyDetail.
  FillValues: Fills the lookup lists through Purchase.PMCSFillValues.
  LoadItemDetail: Runs through Purchase.PMCSRFQDetail.
  LoadQuotationOtherDetail: Runs through Purchase.PMCSQuotationDetail, Purchase.PMCSRFQDetail.
  LoadSupplier: Runs through Purchase.PMCSRFQDetail.
  RFQItemInformation: Runs through Purchase.PMCSRFQItemInformation.
  udgvCS_BeforeRowEditTemplateDisplayed: Runs through Purchase.PMCSLastPurchase.
