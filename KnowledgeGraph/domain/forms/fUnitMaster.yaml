form: fUnitMaster
title: Unit Master
module: MM
kind: master
users:
- Material master administrator (inferred)
summary: The Unit Master screen maintains the units of measure used across the application, such as kilograms, litres or pieces.
purpose: |
  What it is: A central list of units of measure with their conversion relationships and their default use by material sub groups. When it applies: When a new unit of measure is needed, a conversion between units must be recorded, or sub groups must be told which unit to use for stock, purchase, sales or production. Business outcome: Consistent quantities across documents, correct unit conversions, and correct GST unit codes on tax returns.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Unit Header Area: The top panel holding Code, Alias, Unit Name, Category and Inactive.
  - Code Field: Read-only text box (maximum 6 characters) whose label is a hyperlink "Code" with tooltip "Switch to fast entry mode." (BR-03).
  - Alias Field: Mandatory text box, maximum 6 characters, trimmed on save (BR-04).
  - Unit Name Field: Mandatory text box, maximum 25 characters, trimmed on save (BR-01).
  - Category Field: Mandatory dropdown of unit categories (BR-06).
  - Inactive Field: Checkbox labelled "Inactive", always disabled (BR-08).
  - Standard Conversion Factor Grid: Grid with columns Conversion Type, Unit Value, Base Unit, Conversion Value and Unit, placed below the header on the left.
  - Material Subgroup Grid: Grid with columns Subgroup Name, Subgroup Code and Unit Type, placed to the right of the conversion grid.
  - GST UQC Field: Optional dropdown labelled "GST UQC", showing code and unit name, in a small panel below the grids (BR-07).
  - Fast Entry Grid Container: A grid with columns Unit Name (maximum 25 characters), Alias (maximum 6), Category (dropdown matched by category name) and Remarks (read-only result).
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions not enabled for this screen.
actions:
  Switch back to detail mode.: Hyperlink "Switch back to detail mode." at the top of the fast entry container.
  Import: '"Import" button in fast entry mode that loads an Excel sheet with columns Unit Name, Alias and Category (BR-16).'
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with the shared search list.
  Delete: Standard toolbar Delete.
  Navigation: Standard First / Previous / Next / Last toolbar actions, enabled for this screen.
validations:
- Enter Unit Name.
- Duplicate Unit Name is not allowed.
- Enter Alias.
- Select valid Category Name.
- Duplicate Alias is not allowed.
- Enter Unit Value in row n.
- Enter Conversion Value in row n.
- Enter Unit in row n.
- Duplicate Unit is not allowed.
- Select valid Unit Type in row n.
- Duplicate Subgroup Name is not allowed.
- Successfully Created.
- Refer remarks for saved status.
- Your excel should consists of sheet with name MMUM. Do you want to continue?
manages:
- unit-of-measure
uses_concepts:
- company
- material-group
- material-sub-group
- unit-type
method_notes:
  Delete: Deletes the record through masterdata.MMUMDelete.
  FillValues: Fills the lookup lists through masterdata.MMUMFillValues.
  LoadData: Loads the selected record through masterdata.MMUMLoadData.
  Open: Searches records through masterdata.MMUMSearchData.
  SaveConversionFactor: Saves the record through masterdata.MMUMSaveUnitConversionDetail.
  SaveMain: Saves the record through masterdata.MMUMSave.
  SaveSubGroupUnitDetail: Saves the record through masterdata.MMUMSaveSubGroupUnitDetail.
  ValidateForm: Validates the entry through masterdata.MMUMValidate.
