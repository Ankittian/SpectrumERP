form: fQualityParameter
title: Quality Parameter
module: MM
kind: master
users:
- Quality controller (inferred)
summary: The Quality Parameter screen defines the characteristics that quality tests measure, such as moisture or colour.
purpose: |
  What it is: A catalogue of measurable quality characteristics with their format and acceptable values. When it applies: Before specifications, quality tests or inspection plans are defined. Business outcome: Results are recorded and judged against a consistent definition (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "QualityParameter" with a header and tabs "Standard Value" and "Variable" (hidden by default).
  - Code Field: Read-only text box, 8 characters.
  - Description Field: Text box, mandatory, maximum 100 characters (BR-01).
  - Type and Data Type Fields: Dropdowns "Type" (QP Type, Code) and "Data Type" (Numeric, Alpha Numeric, Date), mandatory (BR-02).
  - Reporting Length Field: Numeric text box, 3 characters, disabled by default.
  - Decimal Precision Field: Numeric text box, 2 characters, disabled by default.
  - Unit Field: Dropdown (Unit, Code), mandatory.
  - Method Field: Dropdown, mandatory; for Alpha Numeric and Date only Fixed and Variable are offered (BR-05).
  - Default Test Field: Read-only text box.
  - Algorithm Field: Dropdown (Algorithm, Code), read-only unless Method is Algorithm.
  - Define Standard Values Field: Checkbox "Define Standard Values" that enables the Standard Value grid (BR-07).
  - Value Type Field: Dropdown Normal / Range, default Normal (BR-06).
  - Standard Value Grid: Columns Value, Tolerance Unit, Lower Tolerance, Upper Tolerance, Upper Limit, Lower Limit, Default; column visibility follows Data Type and Value Type (BR-08 to BR-10).
  - Variable Grid: Read-only columns Code and Variable Name; rows cannot be deleted.
  - Other Toolbar Actions (Print, Preview, Email, Export): Present in the toolbar contract with no behaviour on this screen.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with columns Code, Description, QP Type, Data Type, Method, Created By, Authorized By.
  Delete: Standard toolbar Delete.
validations:
- Enter Description.
- Duplicate quality parameter not allowed.
- Select valid Type.
- Select valid Data Type.
- Reporting length can't be empty or zero.
- Reporting length should be between 1 to 20.
- Reporting length should be between 1 to 500.
- Decimal precision can't be empty.
- Decimal precision can't be greater than reporting length.
- Decimal precision can't be greater than 6.
- Select valid Unit.
- Select valid Method.
- Select valid value type.
- Enter atleast one standard value.
- Enter lower tolerance or upper tolerance.
- Enter upper Limit.
- Enter lower limit.
manages:
- quality-parameter
uses_concepts:
- company
- qc-parameter
- quality-specification
- unit-of-measure
method_notes:
  Delete: Deletes the record through masterdata.QMQPDelete.
  FillValues: Fills the lookup lists through masterdata.QMQPFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.QMQPFillValuesDependent.
  LoadData: Loads the selected record through masterdata.QMQPLoadData.
  Open: Searches records through masterdata.QMQPSearchData.
  Save: Saves the record through masterdata.QMQPSave.
  SaveStandardValue: Saves the record through masterdata.QMQPSaveStandardValue.
  SaveVariableDetail: Saves the record through masterdata.QMQPSaveVariableDetail.
  ValidateForm: Validates the entry through masterdata.QMQPValidate.
