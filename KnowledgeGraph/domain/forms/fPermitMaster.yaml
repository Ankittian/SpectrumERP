form: fPermitMaster
title: Permit Master
module: PM
kind: master
users:
- Maintenance planner (inferred)
summary: The Permit Master screen maintains work permit templates used in plant maintenance.
purpose: |
  What it is: A reusable definition of the safety conditions, tasks and objects for a type of maintenance work. When it applies: When a new kind of permit-controlled work is introduced or an existing one changes. Business outcome: Consistent isolation (LOTO), instructions and check lists for hazardous work.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "PermitMaster" with a header panel and a tab control with tabs "Task Detail", "Equipment/Location Detail", "Safety Instructions", "Maintenance Category" and "Check Lists".
  - Code Field: Read-only text box.
  - Reference Permit Button: Image button beside Code that opens a permit search.
  - Permit Name Field: Text box, mandatory, maximum 100 characters (BR-01, BR-03).
  - Permit Description Field: Text box, mandatory, maximum 300 characters (BR-02).
  - LOTO Field: Dropdown Lockout, Tagout, Other; mandatory (BR-02).
  - Permit Type Field: Dropdown (Permit Type, Code); mandatory (BR-02).
  - Authorized Person Field: Editable dropdown, mandatory, maximum 100 characters; lists names already used on permits (BR-02).
  - Inactive Field: Checkbox, disabled.
  - Task Detail Grid: Columns Task Name (list) and Code (read-only, filled from the task) (BR-07).
  - Equipment/Location Detail Grid: Columns Object (list), Equipment/Location (list filtered by Object), Code and Functional Unit (read-only, filled from the selection) (BR-08).
  - Safety Instructions Area: Safety Group dropdown and a grid with Safety Instruction (list) and Code (read-only) (BR-10).
  - Maintenance Category Grid: Columns Category Name (list) and Code (read-only).
  - Check Lists Grid: Columns SNo (read-only, automatic) and Check List (free text, maximum 300 characters) (BR-09).
  - Other Toolbar Actions (Print, Preview, Email, Export): Standard actions.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with columns Code, Permit Name, Permit Description, LOTO, Permit Type, Authorized Person,
    Created By.
  Delete: Standard toolbar Delete.
validations:
- Enter Permit Name.
- Duplicate Permit Name not allowed.
- Enter Permit Description.
- Select valid LOTO.
- Select valid Permit Type.
- Enter or Select valid Authorized person.
- Enter valid Equipment/Location.
- Duplicate Task Name not allowed.
- Duplicate Equipment/Location not allowed.
- Duplicate Safety Instruction not allowed.
- Duplicate Category Name not allowed.
- Duplicate Check List not allowed.
manages:
- work-permit
uses_concepts:
- company
method_notes:
  Delete: Deletes the record through masterdata.EMPMDelete.
  FillValues: Fills the lookup lists through masterdata.EMPMFillValues.
  LoadData: Loads the selected record through masterdata.EMPMLoadData.
  Open: Searches records through masterdata.EMPMSearchData.
  Save: Saves the record through masterdata.EMPMSave.
  SaveCheckList: Saves the record through masterdata.EMPMSaveCheckList.
  SaveEquipmentDetail: Saves the record through masterdata.EMPMSaveEquipmentDetail.
  SaveMaintenanceCategory: Saves the record through masterdata.EMPMSaveMaintenanceCategory.
  SaveSafetyInstructions: Saves the record through masterdata.EMPMSaveSafetyInstructions.
  SaveTaskDetails: Saves the record through masterdata.EMPMSaveTaskDetail.
