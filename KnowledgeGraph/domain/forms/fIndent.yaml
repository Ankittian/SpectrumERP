form: fIndent
title: Purchase Request
module: MM
kind: transaction
users:
- Department requester (inferred)
- Purchase officer (inferred)
summary: The Purchase Request screen (window caption "Indent") records a department's formal request to buy stock items, which
  the purchase team later converts into purchase orders.
purpose: |
  What it is: A priced, approved statement of what a department needs to purchase, in what quantity, by when and for which cost center. When it applies: When stock must be procured, either directly or to fulfil a Material Request or material plan. Business outcome: Procurement starts only from an approved, budget-checked demand (BR-05, BR-24).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Panel: Shared panel with Division (when applicable), prefix, Document No., Document Date, Status, an information button and a Repeated Entry button.
  - General Details Tab: Default tab with all header fields.
  - Source Document Field: Dropdown, mandatory (BR-08).
  - Ref. Document No. Field: Dropdown of eligible references with Ref Doc No, Ref Doc Date and Request For; read-only by default (BR-09).
  - Ref. Document Date Field: Read-only display of the reference date.
  - Indent Type Field: Dropdown, mandatory: Capital, Revenue, RawMaterial; default Revenue (BR-11).
  - Department Field: Dropdown, mandatory, filtered by division (BR-11).
  - Requested By Field: Editable dropdown, mandatory, maximum 100 characters, listing names used on earlier requests (BR-11).
  - Reference No. and Reference Date Fields: Text box (maximum 30 characters) and date picker with tick box, format dd/MM/yyyy (BR-12).
  - Warehouse and Warehouse Address Fields: Optional dropdown of warehouses of the division, and a read-only address (maximum 1000 characters) (BR-13).
  - Reserve Lot Checkbox: Checkbox "Reserve Lot" (BR-22).
  - Default Schedule Date Field and Set Button: Date picker with tick box (unticked by default) and a "Set" button enabled only when ticked (BR-21).
  - Remarks Field: Multi-line text, optional, maximum 1000 characters.
  - Notes Control: Embedded notes button; default notes pre-load on new requests.
  - Inform To Tab: Grid with Person Type (Employee or Other), Contact Person Name, Email Id, Mobile No and Whatsapp No (BR-30).
  - Custom Fields Tab: Company-defined fields.
  - Multi-Level Authorization Tab: Shared approval control listing levels, approvers and actions.
  - Item Details Grid: Line grid with Item Code, Item Description, item search button, item information icon, Make, HSN & SAC Code, Tech.
  - Net Amount Field: Read-only total of line amounts, maximum 16 characters.
  - Specification Pop-up: Quality parameter grid (Code, Quality Parameter, QP Type, Unit, Value, Lower Limit, Upper Limit) with Ok and Cancel.
  - Reservation Detail Pop-up: Grid with Particular (CostCenter, JobCard, Sales Order), Document and Quantity with a quantity total, and Ok and Cancel.
  - Tech. Description, Size, Schedule, QC and Technical Parameter Pop-ups: Shared editors opened from their columns on a line with an item.
  - Other Toolbar Actions (Print, Preview, Export, Email): Indent daily print report.
  - Repeated Entry Button and Ctrl+Y: Copies an earlier request.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Open (Search): Toolbar Open.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last.
validations:
- Authorized Indent can't be updated.
- Authorize Indent No. can't be update.
- Duplicate Indent No. is not allowed.
- 'Qty. in Purchase Request cannot be more than Qty. in Material Planning for Item '
- 'Budget Amount should not exceeded (<balance>) for selected Division '
- '... for selected Dept. '
- Select valid Source Document.
- Select valid Reference Doc No.
- Document Date can't be less than Ref Doc Date.
- Select valid Indent Type.
- Select valid Department.
- Enter or select valid Requested By.
- Select Reference Date.
- Enter Reference No.
- Reference Date can't be greater than Document Date.
- Select atleast one Item.
- Duplicate Item Name ,Make and Tech. Grade is not allowed.
- Item Type of <Item Description> is not capital
- '   Do you want to continue ?'
- Can't select <Item Description>(Capital) in row <n>.
- Select valid Unit in row <n>.
- Enter value for mandatory quality parameter  in row <n>.
- Required Qty. can't be zero or empty in row <n>.
- Indent Qty. can't be zero or empty in row <n>.
- Rate can't be zero or empty in row <n>.
- Sum of reserve Qty. should equal to Indent Qty. in row <n>.
- Select valid Cost Center in row <n>.
- With item type 'RawMaterial' other type item is selected. Do you want to continue?
- With item type RawMaterial other type item can not be selected.
- Can not authorize as last level is not approved.
- Net Amount can't be zero or empty.
- Document Status can't be Authorized for multi level Authorization
- Document No. <number> saved successfully.
- Authorized Indent can't be updated
- Selected Division is not matching with department division
- Value can't be empty or zero  in row <n>.
- Enter lower limit  in row <n>.
- Enter upper limit  in row <n>.
- Select Document in row <n>.
- Quantity can't be empty or zero in row <n>.
- Sum of Quantity should be equal to <Indent Qty.>.
- The Default Schedule Date will not change for those items where Scheduled Date is already defined. Do you want to continue?
