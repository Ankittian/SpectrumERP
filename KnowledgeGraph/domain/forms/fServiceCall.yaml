method_notes:
  Delete: Deletes the record through CustomerService.EASCDelete.
  FillValueDependent: Fills the lookup lists through CustomerService.EASCFillValuesDependent.
  FillValues: Fills the lookup lists through CustomerService.EASCFillValues.
  LoadData: Loads the selected record through CustomerService.EASCLoadData.
  LoadPartyLocation: Runs through GlobalData.VendorLocationSelect.
  Open: Searches records through CustomerService.EASCSearchData.
  Save: Saves the record through CustomerService.EASCSave.
  SaveContractDetail: Saves the record through CustomerService.EASCSaveContractDetail.
  SaveCustomFieldDetail: Saves the record through CustomerService.EASCSaveCustomFieldDetail.
  SaveCustomerFeedbackDetail: Saves the record through CustomerService.EASCSaveCustomerFeedbackDetail.
