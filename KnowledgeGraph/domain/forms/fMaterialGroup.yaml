form: fMaterialGroup
title: Material Group
module: MM
kind: master
users:
- Material master administrator (inferred)
summary: The Material Group screen maintains material groups, the second level of the material classification (Category, then
  Group, then Sub Group, then Item).
purpose: |
  What it is: A central list of material groups, each linked to a material category and identified by a 2-character code that is unique within the category. When it applies: When the business introduces a new family of materials under an existing category, renames a group, or corrects its code or category. Business outcome: Consistent item coding across the enterprise, because the group code forms part of every item's full code, and a stable grouping for sub groups, reporting and default quality parameters.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Material Group Detail Area: The default single-record workspace, holding Group Code, Category Name, Category Code, Code, Group Name and Inactive in a single panel.
  - Group Code Field: Read-only text box, maximum 4 characters, with the label shown as a hyperlink "Group Code" (tooltip "Switch to fast entry mode."); computed, not saved (BR-08).
  - Category Name Field: Mandatory dropdown showing category name and code (BR-02).
  - Category Code Field: Read-only text box (maximum 4 characters).
  - Code Field: Mandatory text box, maximum 2 characters, trimmed on save (BR-03).
  - Group Name Field: Mandatory text box, maximum 100 characters, trimmed on save (BR-06).
  - Inactive Field: Checkbox labelled "Inactive", always disabled (BR-12).
  - Quality-Control Parameters Area: An embedded quality-control area with a QC Group selector and a QC parameter grid (described in Section 7).
  - Fast Entry Grid Container: A grid with columns Category Name (dropdown of categories, matched by name), Code (maximum 2 characters), Group Name and Remarks (read-only result).
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions not enabled for this screen.
actions:
  Switch back to detail mode.: Hyperlink "Switch back to detail mode." at the top of the fast entry container.
  Import: '"Import" button inside fast entry mode that loads an Excel sheet with columns Category Name, Code and Group Name
    (BR-18).'
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open, showing the shared search list.
  Delete: Standard toolbar Delete.
  Navigation: Standard First / Previous / Next / Last toolbar actions, enabled for this screen.
validations:
- Select valid Category Name.
- Code must be 2 digit.
- Duplicate Group Name is not allowed.
- Duplicate Group Code is not allowed.
- Enter Group Name.
- Standard Value can't be empty or zero
- Enter Tolerance Value
- Select valid Deduction Rate
- Select valid Deduction Type
- Enter Double Deduction From
- Duplicate QC Parameter not allowed.
- Actual Value1 can't be empty or zero
- Successfully Created.
- Refer Remarks for data saved status.
- Your excel should consists of sheet with name MMIG. Do you want to continue?
- Select atleast one QC Parameter.
manages:
- material-group
uses_concepts:
- company
- material-category
- material-item
- material-sub-group
- qc-parameter
method_notes:
  Delete: Deletes the record through masterdata.MMIGDelete.
  FillValues: Fills the lookup lists through masterdata.MMIGFillValues.
  LoadData: Loads the selected record through masterdata.MMIGLoadData.
  Open: Searches records through masterdata.MMIGSearchData.
  SaveMain: Saves the record through masterdata.MMIGSave.
  SaveQC: Saves the record through masterdata.MMIGSaveQCParameter.
  ValidateForm: Validates the entry through masterdata.MMIGValidate.
  ucmbCategoryName_ValueChanged: Fills the lookup lists through masterdata.MMIGFillValuesDependent.
