form: fAssetCapitalization
title: Asset Capitalization
module: FI
kind: transaction
summary: The Asset Capitalization screen turns purchases and other costs into fixed assets.
purpose: |
  What it is: A document that moves cost from a clearing (capital work in progress) account into the fixed asset account and creates the matching asset and tag records [fAssetCapitalization.vb:2677-2749; fAssetCapitalization.vb:1554-1821]. When it applies: When goods or services bought for capital use are put into service. Business outcome: The asset register and the books agree on cost, and depreciation can start from the in-service date (BR-14; BR-15).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A window captioned in code "AssetCapitalization" with a header area and three tabs: "Transaction Detail", "Other Detail" and "Posting Detail" [fAssetCapitalization.Designer.vb:597; fAssetCapitalization.Designer.vb:548-556].
  - Document Block (Document No., Date, Status, Finance Book): A shared control for number, date, status and finance book [fAssetCapitalization.vb:123; fAssetCapitalization.vb:171-180].
  - Header Fields: Capitalization Nature, Capitalization Document, Ref.
  - Transaction Detail Tab: A grid with Select, Supplier Name, Location, Bill No., Bill Date, GRN No., GRN Date, Voucher No., Voucher Date, Account Name, Item Description, Make, Unit, Lot Qty., Pre.
  - Other Detail Tab: An Asset Number grid (Asset No, Asset Description, Item Description, Quantity, Acquisition Value, Salvage Value, Cost Center, Department, Business Use %, Custodian, Remarks; for Tag Addition also the existing asset and previous values), a Tag Number grid (Asset No., Tag No., Tag Description, Item Description, Ref.
  - Posting Detail Tab: The shared posting control showing the capitalization journal voucher [fAssetCapitalization.vb:2677-2749].
  - Other Toolbar Actions (Print, Preview, Export, Email): Empty routines [fAssetCapitalization.vb:261-293].
actions:
  New: Asks the main window for a blank record [fAssetCapitalization.vb:224-231].
  Save: Validates and stores the document, the assets and tags and, on authorization, the voucher [fAssetCapitalization.vb:1322-1433].
  Search: Opens a list of documents of the company and working year with Document No., Document Date, Finance Book, Capitalization
    Document, Ref.
  Delete: Deletes the open document after confirmation [fAssetCapitalization.vb:37-66].
