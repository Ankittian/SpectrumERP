usercontrol: DocumentYearlydll
title: Document number control
module: MM
kind: component
users:
- Users of the host screens (inferred)
summary: Embedded document number, date, name and status block.
purpose: |
  Lists the document numbering series of the host form, fills the next number and validates that the number fits the financial year (DocumentNumberFillValues / Validate).
functional_description: |
  Embedded in: Voucher, fGRN, fGateEntry, fIndent, fIndentRequisition, fInspectionEntry, fInspectionIntimation, fPaymentAdvice, fPaymentPlan, fPaymentRequest, fPurchaseBill, fPurchaseOrder, fQuotation, fRequestforQuotation.
  On-screen fields: Document Date, Document No., Document Status, Name.
method_notes:
  FillValues: Fills the lookup lists through masterdata.DocumentNumberFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.DocumentNumberFillValuesDependent.
  ValidateForm: Validates the entry through masterdata.DocumentNumberValidate.
