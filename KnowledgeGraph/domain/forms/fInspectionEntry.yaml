form: fInspectionEntry
title: Inspection Entry
module: MM
kind: transaction
users:
- Quality controller (inferred)
summary: The Inspection Entry screen records the result of quality inspection on received goods.
purpose: |
  What it is: A numbered record of the inspection outcome of intimated GRN lines: accepted and rejected quantity, reason, rejected serials, coil dimensions and quality parameter values. When it applies: After an inspection intimation has been authorized for the GRN lines and before the GRN is authorized. Business outcome: Only accepted material is taken into stock; rejections are documented with reasons for vendor follow-up.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Header: Shared document number control: number, date, division (if applicable), status.
  - General Details Tab: Tab "General Details" with Department, Inspection Officer, Remarks, notes and the item grid.
  - Custom Fields Tab: Tab "Custom Fields" with the shared custom field control.
  - Department Field: Dropdown (Department, Division), highlighted as mandatory; includes "All".
  - Inspection Officer Field: Editable dropdown of officer names used before in the company, highlighted as mandatory; free text allowed (stored up to 100 characters).
  - Remarks Field: Text box, optional, max 1000, trimmed.
  - Notes Control: Shared notes control with Print Area, Notes and Default.
  - Item Detail Grid: Columns Select (editable), GRN No., GRN Date, PO NO./ ST No., PO Date/ ST Date, Vendor Name, Gate Entry No., Gate Entry Date, Vehicle No., Intimation No., Intimation Date, Indent No.
  - Serial Number Pop-up: Pop-up from the Serial No.
  - QC Group Pop-up: Pop-up from the QC Group button hosting the shared QC group control, a "Copy" button and an information icon.
  - Other Toolbar Actions (Print, Print Preview, Export, Email): Print, preview, export and email of the inspection entry print layout.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search: Toolbar Open with the search window.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last enabled on the toolbar.
validations:
- Select valid Department.
- Select or Enter valid Inspection Officer.
- Authorized Entry can't be updated.
- Select atleast one Item.
- Document Date can't be less than GRN Date in row N.
- Document Date can't be less than Intimation Date in row N.
- Accepted Qty can't greater than Received Qty.
- Accepted Qty. can't be greater than Received Qty. in row N.
- Enter Reason in row N.
- Rejected Qty.should be equal to No. of Rejected Serial Number in row N.
- <serial key> is already used.
- QC Parameter does not match with PO QC Parameter for row N.
- QC Parameter does not match with PO QC Parameter for row N. Do you want to continue?
- Document No. <number> saved successfully.
- PO QC Information
- A single Inspection can be linked to only one GRN. Multiple GRNs cannot be added to the same Inspection for material type
  Raw Material.
- some GRN is Authorized,so you can't delete this entry
- Enter default width in rowN.
- Enter default thickness in rowN.
manages:
- quality-inspection
uses_concepts:
- company
- gate-entry
- goods-receipt-note
- inspection-intimation
- make
- material-item
- purchase-order
- purchase-request
- qc-parameter
- unit-of-measure
- vendor
- vendor-location
method_notes:
  Delete: Deletes the record through Inventory.IMIEDelete.
  FillValues: Fills the lookup lists through Inventory.IMIEFillValues.
  FillValuesDependent: Fills the lookup lists through Inventory.IMIEFillValuesDependent.
  GetPOQCInfo: Runs through Inventory.IMIEGetPOQCDetail.
  LoadData: Loads the selected record through Inventory.IMIELoadData.
  Open: Searches records through Inventory.IMIESearchData.
  Save: Saves the record through Inventory.IMIEAuthorize, Inventory.IMIESave.
  SaveItemDetails: Saves the record through Inventory.IMIESaveInspectionItemDetail.
  SaveItemQCDetails: Saves the record through Inventory.IMIESaveInspectionItemQCParameterDetail.
  SaveNotesDetail: Saves the record through Inventory.IMIESaveInspectionNotesDetail.
