method_notes:
  Delete: Deletes the record through Purchase.PUFODelete.
  FillValues: Fills the lookup lists through Purchase.PUFOFillValues.
  FillValuesFO: Fills the lookup lists through Purchase.PUFOFillValuesFO.
  FillValuesTransporterGroup: Fills the lookup lists through Purchase.PUFOFillValuesTransporterGroup.
  FillValuesVendor: Fills the lookup lists through GlobalData.VendorLocationSelect.
  LoadData: Loads the selected record through Purchase.PUFOLoadData.
  Open: Searches records through Purchase.PUFOSearchData.
  Save: Saves the record through Purchase.PUFOSaveMain.
  SaveFreightBasisDetail: Saves the record through Purchase.PUFOSaveFreightBasis.
  SaveItemDetail: Saves the record through Purchase.PUFOSaveItemDetail.
