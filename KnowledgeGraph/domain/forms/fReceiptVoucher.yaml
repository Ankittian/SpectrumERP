- Select valid Voucher Type.
- In InterFB Voucher can't select multiple InterFB Account and multiple Regular Account.
- Select atleast one cash/ bank account.
- Duplicate Account with same bank account type can't be selected.
- Duplicate Account with same cash account type can't be selected.
- Duplicate Account with same cash/bank account type can't be selected.
- Enter Cheque/DD/UTR No.
- Select Date
