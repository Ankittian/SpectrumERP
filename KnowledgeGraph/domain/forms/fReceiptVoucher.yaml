form: fReceiptVoucher
title: Receipt Voucher
module: FI
kind: transaction
summary: The Receipt Voucher screen records money received into a cash or bank account.
purpose: |
  What it is: Records the accounting entry for money received, crediting the payers and debiting cash or bank. When it applies: A user needs this when money is received from a customer or other party in cash, cheque, draft or transfer. Business outcome: Party, cash and bank balances change together in one approved document with its payment particulars.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Document number, document date, finance book, status and prefix, with a repeat entry button when the voucher copy setting is on ([fReceiptVoucher.vb:38; Voucher.cs:154-161]).
  - Voucher Type Field: "Voucher T&ype" list with Regular and Inter FB ([Voucher.Designer.cs:226]).
  - Voucher Grid: Columns Type, Account Name, Current Balance, Balance Amount, Debit Amount, Credit Amount, Ref.
  - Ref. Detail, Cost Center, Qty. Detail and TDC Rule Pop-ups: Pop-up editors opened from the grid cells.
  - Payment Detail Grid: Columns Payment Mode, Issued To, Cheque/DD/UTR No., Date, Amount, In Favour Of, Party Bank Name, Branch Name.
  - Narration Field: "&Narration" text area.
  - Total Debit and Total Credit: Running totals of the grid.
actions:
  Toolbar: New, Save, Open, Delete, Navigation, Print, Print Preview, Export, Email ([fReceiptVoucher.vb:23-33]).
