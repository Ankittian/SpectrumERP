  FillValues: Fills the lookup lists through Inventory.IMMIFillvalues.
  FillValuesDependent: Fills the lookup lists through Inventory.IMMIFillValuesDependent.
  ItemLotDetail: Runs through Inventory.IMMIExciseItemGroupLotDetail.
  LoadData: Loads the selected record through Inventory.IMMILoadData.
  Open: Searches records through Inventory.IMMISearchData.
  Save: Saves the record through Inventory.IMMISave, Inventory.VoucherVsLotValidation.
  SaveExciseItemGroupDetail: Saves the record through Inventory.IMMISaveExciseItemGroupDetail.
  SaveItemDetails: Saves the record through Inventory.IMMISaveMaterialIssueItemDetail.
  SaveLotDetail: Saves the record through Inventory.IMMISaveMaterialIssueLotDetail.
