method_notes:
  Delete: Deletes the record through CustomerService.CMSODelete.
  FillGrid: Runs through CustomerService.CMSOFillGrid.
  FillValues: Fills the lookup lists through CustomerService.CMSOFillValues.
  FillValuesAccountAssignment: Fills the lookup lists through CustomerService.CMSOFillValuesAccountAssignment.
  FillValuesDependent: Fills the lookup lists through CustomerService.CMSOFillValuesDependent.
  LoadCustomerLocation: Runs through GlobalData.VendorLocationSelect.
  LoadData: Loads the selected record through CustomerService.CMSOLoadData.
  Open: Searches records through CustomerService.CMSOSearchData.
  Save: Saves the record through CustomerService.CMSOAuthorize, CustomerService.CMSOSave.
  SaveFaultDetail: Saves the record through CustomerService.CMSOSaveFaultDetail.
