form: fTDCMaster
title: TDC Master
module: FI
kind: master
users:
- Tax administrator (inferred)
summary: The TDC Master screen maintains miscellaneous charges and tax charges (TDC, read as taxes, duties and charges (Inferred))
  that are added to, subtracted from or shown alongside purchase and sales documents.
purpose: |
  What it is: A list of named charges with their default value and calculation behaviour, grouped by tax group. When it applies: When a new freight, packing, insurance, tax or similar charge is needed in documents (Inferred). Business outcome: Documents apply charges consistently and post them to the right accounts.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "TDC Master" with a header panel and the mapping grid below.
  - Code Link and Code Field: Hyperlink "Code" (tooltip "Switch to fast entry mode.") and a read-only code box.
  - Tax Group Field: Dropdown (TaxGroup Name, Code), mandatory (BR-01).
  - Charge Name Field: Text box, mandatory, maximum 50 characters (BR-02, BR-03).
  - Charge Value Field: Numeric box, mandatory, up to 3 decimals, maximum 13 characters (BR-05).
  - Charge Nature Field: Dropdown (Charge Nature): Misc Charge, Taxes; mandatory (BR-04).
  - Display Name Field: Text box, mandatory, maximum 50 characters (BR-02).
  - Calculation Nature Field: Dropdown, mandatory (BR-06).
  - Include In Basic Sales and Include In Basic Purchase Fields: Checkboxes (BR-09).
  - Inactive Field: Checkbox.
  - Mapping Grid: Grid with Select, TDC Rule Description, Account Name, Group Name; only Select is editable; rows cannot be deleted (BR-10, BR-11).
  - Fast Entry Grid Container: Grid with Tax Group, Charge Name (50 characters), Charge Value (2 decimals), Charge Nature, Calculation Nature, Include in Basic Sales, Include in Basic Purchase and read-only Remarks; Import button.
  - Other Toolbar Actions (Print, Preview, Email, Export): Standard actions.
actions:
  Back Link: Link on the Fast Entry panel.
  Import: Imports an Excel sheet with columns Tax Group, Charge Name, Charge Value, Charge Nature, Calculation Nature, Include
    in Basic Sales, Include in Basic Purchase.
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with columns Code, Tax Group Name, Misc Charge Name, Calculation Nature, Include In Basic
    Purchase, Include In Basic Sales, Inactive, Created By, Created Date.
  Delete: Standard toolbar Delete.
validations:
- Select valid Tax Group.
- Enter Misc Charge Name.
- Duplicate MiscCharge Name is not allowed.
- Enter Rate.
- Select valid Charge Name.
- Enter Display Name.
- Select valid Calculation Nature.
- Successfully Created.
- Selected row can't be deleted.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
- Refer remarks for saved status.
manages:
- tdc-charge
uses_concepts:
- account-determination-rule
- account-group
- company
- ledger-account
- tdc-account-rule
- tdc-group
method_notes:
  Delete: Deletes the record through masterdata.ATDCDelete.
  FillValues: Fills the lookup lists through masterdata.ATDCFillValues.
  LoadData: Loads the selected record through masterdata.ATDCLoadData.
  Open: Searches records through masterdata.ATDCSearchData.
  SaveMain: Saves the record through masterdata.ATDCSave.
  SaveTDCAccountMapping: Saves the record through masterdata.ATDCSaveTDCRuleDetail.
  ValidateForm: Validates the entry through masterdata.ATDCValidate.
  ucmbTaxGroup_ValueChanged: Fills the lookup lists through masterdata.ATDCFillValues.
