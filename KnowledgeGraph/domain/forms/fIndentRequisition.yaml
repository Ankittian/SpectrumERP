  FillValues: Fills the lookup lists through Inventory.IDMRFillValues.
  FillValuesDependent: Fills the lookup lists through Inventory.IDMRFillValuesDependent.
  FillValuesIssueTo: Fills the lookup lists through Inventory.IDMRFillValuesIssueTo.
  GetCostCenterInfo: Runs through Inventory.IDMRGetCostCenterInfo.
  GetDeptInfo: Runs through Inventory.IDMRGetDeptInfo.
  GetItemInfo: Runs through Inventory.IDMRGetItemInfo.
  GetSpecificationDetail: Runs through Inventory.IDMRGetSpecificationDetail.
  LoadData: Loads the selected record through Inventory.IDMRLoadData.
  LoadRepeatedEntry: Searches records through Inventory.IDMRSearchData.
