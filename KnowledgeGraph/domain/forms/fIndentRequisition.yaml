form: fIndentRequisition
title: Material Request
module: MM
kind: transaction
users:
- Department requester (inferred)
- Storekeeper (inferred)
summary: The Material Request screen lets a department raise an internal request for stock items, either for issue from the
  store or as the first step towards procurement.
purpose: |
  What it is: A controlled internal request for stock items raised by a department, with quantities, schedule and cost allocation, that later drives material issue or purchase indent preparation. When it applies: When a department needs material from the store, or when a Maintenance Order needs its required items requested. Business outcome: Material demand is recorded once, approved through the document status, and can be traced to the indent or issue that fulfils it (BR-05, BR-29).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Panel: The shared document panel at the top showing Division (when applicable), numbering prefix, Document No., Document Date, Status and a Repeated Entry button.
  - General Details Tab: The default tab holding all header fields of the request.
  - Source Document Field: Dropdown, mandatory, list of active source documents (Direct, Maintenance Order) (BR-07).
  - Ref Doc No. Field: Dropdown of eligible reference documents showing Ref Doc No and Ref Doc Date (and Card No for AMC); disabled by default (BR-08).
  - Request Type Field: Dropdown, mandatory, list of Capital, Revenue and RawMaterial; Revenue is pre-selected (BR-09, BR-17).
  - Department Field: Dropdown, mandatory, showing Dept Name (with division code), Code and Division (BR-09).
  - Requested By Field: Editable dropdown, mandatory, maximum 100 characters; lists names previously used on purchase requests and material requests of the company (BR-09).
  - Requisition Purpose Field: Text box, optional, maximum 300 characters.
  - Cost Center Field: Dropdown, optional for Direct and Maintenance Order requests, mandatory for AMC (BR-20).
  - Remarks Field: Multi-line text box, optional, maximum 1000 characters; mandatory only when the inactive custom validation is switched on (BR-26).
  - Request For Field: Dropdown listing Material Issue (and Procurement when active or already saved on the record); mandatory while the "Request For" custom validation is active (BR-10).
  - Returnable Option Set: Two options, "Non Returnable" (default) and "Returnable" (BR-11).
  - Return Date Field: Date picker with tick box, format dd/MM/yyy (BR-12).
  - Chargeable Option Set: Two options, "Non Chargeable" (default) and "Chargeable" (BR-11).
  - Issue To Field: Dropdown of Employee, Contractor/ShopFloor/Transporter and Vendor (BR-13).
  - Employee Name / Contractor Name / Vendor Name Field: Dropdown of active employees, contractor-type vendors or vendors with Code (BR-14).
  - Notes Control: Small embedded notes button opening print-area notes; default notes of the company are pre-loaded on a new request.
  - Custom Fields Tab: Company-defined additional fields for this screen.
  - Item Details Grid: The main line grid with columns Item Code, Item Description, item search button, Make, information icon, HSN & SAC Code, Tech.
  - Tech. Description Pop-up: A text box (maximum 1000 characters) with Ok and Cancel buttons opened from the Tech.
  - Specification Pop-up: Grid of the item's quality parameters showing Code, Quality Parameter, QP Type, Unit, Value and, for variable range parameters, Lower Limit and Upper Limit, with Ok and Cancel buttons.
  - Size, Schedule, QC and Technical Parameter Pop-ups: Shared embedded controls opened from the Size, Schedule, QC and Technical Parameter columns of a line that has an item.
  - Other Toolbar Actions (Print, Preview, Export, Email): Print, Print Preview, Export and Email of the Material Request daily print report.
  - Repeated Entry Button: Button in the document number panel that copies an earlier request.
  - Department Information Label: A double-click label next to Department that shows Department Information.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Open (Search): Toolbar Open, showing the shared search list.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled for this screen in the toolbar.
validations:
- Authorized Indent Requisition can't be updated.
- Authorize Indent Requisition No. can't be update.
- Duplicate Indent Requisition No. is not allowed.
- Select valid Source Document.
- Select valid Ref Document No.
- Select valid Requisition Type.
- Select valid Department.
- Enter or select valid Requested By.
- Select valid Cost Center.
- Select valid Request For.
- Select either Returnable or Non-Returnable.
- Return Date can't be less than Document Date.
- Select either Chargeable or Non-Chargeable.
- Select valid Issue to.
- 'Select valid '
- Select valid Employee Name.
- Select atleast one Item.
- Duplicate Item Name ,Make and Tech. Grade is not allowed.
- Item Type of <Item Description> is not capital
- '   Do you want to continue ?'
- Can't select <Item Description>(Capital) in row <n>.
- Can't select <Item Description> (Intermediate) in row <n> when Request For is Procurement.
- Item is not defined in AMC Contact in row <n>.
- Select valid Unit in row <n>.
- Enter value for mandatory quality parameter  in row <n>.
- Required Qty. can't be zero or empty in row <n>.
- Select valid Cost Center in row <n>.
- Enter a valid Remark.
- Enter a valid Make in row <n> .
- Enter A valid Tech Description in row <n> .
- Enter A schedule for row <n> .
- Enter A valid Remark in row <n> .
- Schedule Date must be greater than Document Date in row <n> .
- Value can't be empty or zero  in row <n>.
- Enter lower limit  in row <n>.
- Enter upper limit  in row <n>.
- Capital And Non-Capital can't be select atonce.
- Required Qty. is greater than Balance Qty.(Maintenance Order) in row <n>. Do you want to continue?
- Document No. <number> saved successfully.
- Indent is prepared against this requisition,so you can't delete this
- Material is issued against this requisition,so you can't delete this
