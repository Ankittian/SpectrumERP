  SavePaymentTermsDetail: Saves the record through masterdata.MDETSavePaymentTerms.
  SaveTermsNConditions: Saves the record through masterdata.MDETSaveTnCDetail.
  ValidateForm: Validates the entry through masterdata.MDETValidate.
