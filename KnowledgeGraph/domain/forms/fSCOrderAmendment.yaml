form: fSCOrderAmendment
title: Service Order Amendment
module: MM
kind: transaction
summary: The Service Order Amendment screen changes an authorized [Service Order](Functional_Doc_fSCOrder.md) without re-creating
  it.
purpose: |
  What it is: A controlled, versioned change to an authorized service order. Each version has its own amendment number, date, reason, status and full copy of the order detail [fSCOrderAmendment.vb:1864-2071; Purchase.SCSOSave:298-415]. When it applies: When an authorized order must change after it was sent to the vendor, for example for a revised rate, quantity, schedule, tax or term. Business outcome: The order history is kept version by version. The changes are approved before they take effect, and the live order shows the last authorized version (BR-12).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Differences: The header has SC Order No., SC Order Date (read-only), Division (read-only), Amendment No.
  - Locked Header Fields: Document Type, Ref.
  - Tab Layout: General Details, Requisition Details, PO Expense Head Detail (hidden at start), Shipping & Account Detail, Tax Details, Additional Cost (hidden at start), T & C, Payment Terms, Account Assignment, Authorization (hidden at start) and Custom Fields.
  - SC Order No. Field: Choosing an order resets the screen and loads its latest version, with the next amendment number [fSCOrderAmendment.vb:4090-4102; fSCOrderAmendment.vb:549-732].
  - Document Date and Status Fields: Changing the document date reloads the tax rules and service-tax abatement for that date.
  - Freight Order Field: A list of freight orders for the division, date, order and From / To locations.
  - Division Filter: The department list is filtered to the order's division [fSCOrderAmendment.vb:5257-5263].
  - Grids and Detail Tabs: Same as [Service Order](Functional_Doc_fSCOrder.md), Section 5 'Requisitions Tab', 'Service Detail and Item Detail Grids', 'Mark Detail and Billing Detail Tabs', 'Shipping Detail Tab' and 'Tax, Additional Cost, T & C, Payment Terms and Custom Fields'.
  - Account Assignment and Authorization Tabs: Same as [Service Order](Functional_Doc_fSCOrder.md), Section 5 'Account Assignment Tab' and 'Authorization Tab' [fSCOrderAmendment.vb:5377; fSCOrderAmendment.vb:5789-5886].
actions:
  Save, Search and Delete: Save asks for confirmation and reports the order number.
  Print, Preview, Export and Email: These actions have empty bodies [fSCOrderAmendment.vb:775-789; fSCOrderAmendment.vb:4403-4409].
