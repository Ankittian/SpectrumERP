method_notes:
  Delete: Deletes the record through masterdata.VIVCDelete.
  DeleteBankDetail: Deletes the record through masterdata.VIBDDelete.
  DeleteContactPerson: Deletes the record through masterdata.VICPDelete.
  FillValues: Fills the lookup lists through masterdata.VIVCFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.VIVLFillValuesDependent.
  LoadVendorDetail: Loads the selected record through masterdata.VIVCLoadData.
  LoadVendorRequestDetail: Loads the selected record through masterdata.VIRQLoadData.
  Open: Searches records through masterdata.VIVCSearchData.
  SaveARD: Saves the record through Finance.FARDSaveMain.
  SaveAccount: Saves the record through masterdata.FIAMSaveMain, masterdata.FIAMValidate.
