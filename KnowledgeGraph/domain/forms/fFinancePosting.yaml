method_notes:
  Delete: Deletes the record through Finance.VoucherDelete.
  FillValues: Fills the lookup lists through Finance.FATPFillValues.
  FillValuesTransactionType: Fills the lookup lists through Finance.FATPFillValuesTransactionType.
  LoadData: Loads the selected record through Finance.FATPLoadData.
  Open: Searches records through Finance.FATPSearchData.
  Save: Saves the record through Finance.FATPSaveDocument.
