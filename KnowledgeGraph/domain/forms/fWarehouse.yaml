form: fWarehouse
title: Warehouse
module: MM
kind: master
users:
- Stores manager (inferred)
summary: The Warehouse screen maintains the stores in which inventory is held.
purpose: |
  What it is: A register of stores with their ownership, address, company/division assignment and allowed items. When it applies: When a new store, third-party warehouse or division store is opened. Business outcome: Receipts, issues and transfers can only use valid warehouses for valid items (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "Warehouse" with a header and tabs "Address Detail", "Organization Detail" and "WareHouse Item Detail".
  - Code Field: Read-only text box.
  - Warehouse Name Field: Text box, mandatory, maximum 50 characters (BR-01).
  - Location Field: Text box, mandatory, maximum 200 characters (BR-02).
  - Type Field: Dropdown Inhouse / External, mandatory (BR-03).
  - Ownership Field: Dropdown Own / Party, mandatory (BR-03).
  - Party Name Field: Dropdown (Party Name, Code), read-only by default (BR-04).
  - Inactive Field: Checkbox.
  - Address Detail Tab: Address (three lines, 100 characters each), City, State, Country, Pincode (6 characters) (BR-10).
  - Organization Detail Grid: Columns Select, Company, Division (read-only) (BR-05).
  - WareHouse Item Detail Grid: Three-level tree: groups (Select, Group Code, Group name), sub groups (Select, SubGroup Code, SubGroup Name), items (Select, Item Code, Item Name), with a header checkbox (BR-06).
  - Other Toolbar Actions (Print, Preview, Email, Export): Not enabled.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with columns WareHouse Code, WareHouse Name, Location, Business Unit, Type, Ownership, Inactive,
    Created By.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last enabled on the toolbar.
validations:
- Enter Warehouse Name.
- Duplicate Warehouse Name is not allowed.
- Enter Location.
- Select valid Type.
- Select valid Ownership.
- Select atleast one Company/Division.
manages:
- warehouse
uses_concepts:
- city
- company
- goods-receipt-note
- material-category
- material-group
- material-item
- material-sub-group
- vendor
method_notes:
  Delete: Deletes the record through masterdata.MMWHDelete.
  FillItemDetail: Fills the lookup lists through masterdata.MMWHItemFillValues.
  FillValues: Fills the lookup lists through masterdata.MMWHFillValues.
  LoadData: Loads the selected record through masterdata.MMWHLoadData.
  Open: Searches records through masterdata.MMWHSearchData.
  Save: Saves the record through masterdata.MMWHSave.
  SaveDivision: Saves the record through masterdata.MMWHSaveWarehouseDivisionDetails.
  SaveGroup: Saves the record through masterdata.MMWHSaveItemWarehouseDetail, masterdata.MMWHSaveItemWarehouseDetail2008.
  ValidateForm: Validates the entry through masterdata.MMWHValidate.
