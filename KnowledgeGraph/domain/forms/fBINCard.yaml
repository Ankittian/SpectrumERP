form: fBINCard
title: BIN Card
module: MM
kind: master
users:
- Stores manager (inferred)
summary: The BIN Card screen maintains storage bins inside warehouses for the login company.
purpose: |
  What it is: A register of bins per warehouse with the items allowed in each. When it applies: When a store is laid out or re-organised. Business outcome: Material can be located and placed consistently.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "BIN Card" with a header panel and a tab control with "Subgroup Detail" and "Item Detail" tabs.
  - BIN Code Link and Code Field: Hyperlink "BIN Code" (tooltip "Switch to fast entry mode.") and a read-only code box.
  - BIN Card No. Field: Text box, mandatory, maximum 25 characters (BR-01).
  - Location Field: Text box, mandatory, maximum 100 characters (BR-01).
  - Warehouse Name Field: Dropdown (Warehouse Name, Code), mandatory (BR-03).
  - Division Field: Dropdown (Division, Code), optional (BR-04).
  - Maximum Capacity Field: Numeric box, optional, up to 3 decimals, maximum 14 characters (BR-07).
  - Inactive Field: Checkbox.
  - Mapping Type Option: Option set "Sub Group Wise" / "Item Wise"; Sub Group Wise is selected on New (BR-08).
  - Subgroup Detail Grid: Two-level grid: sub groups (Set Default, Sub Group Name, Group Name, Category Name, Item Type) with their items (Select, Code, Item Name, Unit Name, Item Type); only the tick columns are editable; header checkboxes tick all (BR-09).
  - Item Detail Grid: Flat grid of items (Select, Code, Item Name, Sub Group Name, Group Name, Category Name, Item Type) with a header checkbox (BR-10).
  - Fast Entry Grid Container: Grid with BIN Card No (25), Location (100), Warehouse Name (list), Division (list filtered by warehouse), Maximum Capacity (3 decimals), Item Description and read-only Remarks; Import button (BR-11).
  - Other Toolbar Actions (Print, Preview, Email, Export): Not enabled.
actions:
  Back Link: Link on the Fast Entry panel.
  Import: Imports an Excel sheet with columns BIN Card No, Location, Warehouse Name, Division, Maximum Capacity, Item Description.
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last enabled on the toolbar.
validations:
- Enter BIN Card No.
- Duplicate BIN Card No. is not allowed.
- Enter Location.
- Select valid Warehouse Name.
- Select atleast one Item.
- Successfully Created.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
- Refer remarks for saved status.
- BIN can't be save in Head Office
manages:
- bin
uses_concepts:
- company
- material-category
- material-group
- material-item
- material-sub-group
- unit-of-measure
- warehouse
