form: fInvOpeningBalance
title: Multi Item Opening
module: MM
kind: transaction
summary: The Multi Item Opening screen records the opening stock of many items in one session.
purpose: |
  What it is: A fast way to load the stock on hand at the inventory start date for many items, with the detail needed to track it later. When it applies: When a company starts using inventory or a new warehouse is brought on. Business outcome: Stock ledgers and lot-wise stock start from a known quantity and value, and the finance opening balance can agree with them.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area: The upper area with the stock combination and the read-only Opening Date.
  - Division Field: Dropdown labelled "&Division" [fInvOpeningBalance .Designer.vb:243].
  - Warehouse Field: Dropdown labelled "&Warehouse", mandatory [fInvOpeningBalance .Designer.vb:252].
  - Ownership Field: Dropdown labelled "&Ownership" with Own and Party, mandatory [fInvOpeningBalance .Designer.vb:261].
  - Stock Nature Field: Dropdown labelled "Stock &Nature", mandatory [fInvOpeningBalance .Designer.vb:234].
  - Stock Type Field: Dropdown labelled "Stock &Type" with Capital and Non-Capital, mandatory [fInvOpeningBalance .Designer.vb:175].
  - Opening Date Field: Read-only text labelled "Opening Date" [fInvOpeningBalance .Designer.vb:222; fInvOpeningBalance .Designer.vb:270].
  - Item Grid: A grid with Select, Category, Group, SubGroup, Item Code, Item Description, Make, Unit, Quantity, Rate, Total Amount, Expiry Date and an Other Details button.
  - Other Details Panel: A row-edit panel opened from the Other Details button of a ticked row, with a grid of lots (Department, Cost Center, BIN Card, Party Name, Party Location, Bill No., Bill Date, Batch No., Quantity, Rate, Amount, Reserve Stock) and "O&k" and "Cance&l" buttons [fInvOpeningBalance .Designer.vb:84; fInvOpeningBalance .Designer.vb:111; fInvOpeningBalance .Designer.vb:120; fInvOpeningBalance .vb:859-903]
  - Import Button: Button labelled "&Import" [fInvOpeningBalance .Designer.vb:156].
  - Item Not Found Panel: A panel titled "Item Not Found" with the unmatched import rows, shown below the item grid and hidden otherwise [fInvOpeningBalance .Designer.vb:279; fInvOpeningBalance .vb:1222-1238].
actions:
  New: Toolbar New [fInvOpeningBalance .vb:17].
  Save: Toolbar Save [fInvOpeningBalance .vb:19].
  Search: Toolbar Open with a search list [fInvOpeningBalance .vb:20; fInvOpeningBalance .vb:186-210].
  Delete: Toolbar Delete [fInvOpeningBalance .vb:23; fInvOpeningBalance .vb:33-63].
  Navigation and Other Toolbar: Navigation enabled; Print, Preview, Email, Export empty [fInvOpeningBalance .vb:22; fInvOpeningBalance
    .vb:212-216; fInvOpeningBalance .vb:1120-1126].
