- 'Stock Clearing Account is not created against item in row '
- 'Select Expiry Date in row '
- 'Expiry Date can not less than opening date in row '
- 'Rate can''t be empty in row '
- Select valid Department/Cost Center/BIN / Batch No.
- Rate can't be empty.
- 'Sum of Quantity should be equal to '
- ' [Quantity].'
- 'Sum of Total Amount should be equal to '
- ' with Cost Center.'
- 'Select valid Department/ Cost Center/BINCard/Batch No. in row '
- 'Select valid Party Name in row '
- 'Sum of Quantity should be equal '
- Duplicate Item and Make is not allowed.
- 'Quantity can''t be less than issued Qty '
- Few item not found, please check list mentioned below.
- Balance sheet is prepared ,so you can't make change in Opening
