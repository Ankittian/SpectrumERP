form: fCostCenterMaster
title: Cost Center Master
module: FI
kind: master
users:
- Accounts officer (inferred)
summary: The Cost Center Master screen maintains the hierarchy of cost centers to which costs, stock lots, vouchers and maintenance
  assets are charged.
purpose: |
  What it is: A coded, hierarchical list of cost centers shared by all companies. When it applies: When a new department, site or cost pool is introduced, renamed or regrouped. Business outcome: Consistent cost allocation and roll-up reporting by parent cost center.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Cost Center Details Area: Main panel with Code, Cost Center Name, Parent Cost Center and Inactive, and the company inactive grid below.
  - Code Field: Read-only text, 12 characters.
  - Cost Center Name Field: Text box, mandatory, maximum 50 characters, trimmed on save.
  - Parent Cost Center Field: Dropdown, optional.
  - Inactive Field: Check box, disabled.
  - Company Inactive Grid: Columns Inactive (tick, with a header tick box) and Company Name (read only).
  - Fast Entry Grid Container: Columns Cost Center Name (50 characters), Parent Cost Center (list by name), Remarks (read only), plus Import.
  - Other Toolbar Actions (Print, Preview, Export, Email): Not enabled; handlers are empty.
actions:
  Switch back to detail mode.: Link at the top of the Fast Entry container.
  Import: Import button reading columns "Cost Center Name" and "Parent Cost Center" from an Excel sheet.
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled through the toolbar.
validations:
- Enter Cost Center Name.
- Duplicate CostCenter Name not allowed.
- Successfully Created.
- Refer remarks for saved status.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
manages:
- cost-center
uses_concepts:
- company
method_notes:
  Delete: Deletes the record through masterdata.CCCMDelete.
  FillValues: Fills the lookup lists through masterdata.CCCMFillValues.
  LoadData: Loads the selected record through masterdata.CCCMLoadData.
  Open: Searches records through masterdata.CCCMSearchData.
  SaveMain: Saves the record through masterdata.CCCMDeleteCompanyInactiveDetail, masterdata.CCCMSave, masterdata.CCCMSaveCompanyInactiveDetail.
  ValidateForm: Validates the entry through masterdata.CCCMValidate.
