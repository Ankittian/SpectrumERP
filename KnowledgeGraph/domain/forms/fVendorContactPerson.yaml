form: fVendorContactPerson
title: Vendor Contact Person
module: MM
kind: master
users:
- Purchase officer (inferred)
summary: The Vendor Contact Person screen records the people to contact at a vendor location.
purpose: |
  What it is: A register of named people at each vendor location with their contact details. When it applies: When a vendor location is set up or its staff changes. Business outcome: Purchasing and accounts staff know whom to contact at the vendor (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "Vendor Contact Person" with a single detail panel and a hidden Fast Entry panel.
  - Code Field: Read-only text box, 12 characters, captioned by a "Code" link with tooltip "Switch to fast entry mode." When it applies: Always.
  - Vendor Name Field: Dropdown (Vendor Name, Code, Vendor Type), mandatory.
  - Location Field: Dropdown (Location, Code), mandatory.
  - Contact Person Name Field: Text box, mandatory, maximum 100 characters.
  - Designation Field: Dropdown with auto-complete listing designations already in use (BR-05).
  - Address Field: Three text lines, 100 characters each.
  - City, State and Country Fields: Dropdowns captioned "City", "State" and "Country".
  - Mobile No., Phone No., Fax No. and E-Mail Fields: Text boxes of 50, 50, 50 and 300 characters.
  - Birth Date and Anniversary Date Fields: Date pickers with a tick box.
  - Inactive Field: Checkbox "Inactive", always disabled.
  - Fast Entry Panel: Grid with columns Vendor Name, Location, Contact Person Name, Designation, Address1, Address2, Address3, City, State, Country, Mobile No, Phone No, Fax No, Email and a read-only Remarks; an "Import" button; link "Switch back to detail mode." When it applies: Fast Entry mode (BR-11, BR-12).
  - Other Toolbar Actions (Print, Preview, Email, Export): Present in the toolbar contract with no behaviour on this screen.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with columns Code, Contact Person Name, Vendor Name, Location, Created By, Created Date.
  Delete: Standard toolbar Delete.
validations:
- Select valid Vendor Name.
- Select valid Location.
- Enter Contact Person Name.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
- Refer remarks for saved status.
- Permission denied to delete Contact Person.
manages:
- vendor-contact-person
uses_concepts:
- city
- company
- vendor
- vendor-location
method_notes:
  Delete: Deletes the record through masterdata.VICPDelete.
  FillValues: Fills the lookup lists through masterdata.VICPFillValues.
  LoadData: Loads the selected record through masterdata.VICPLoadData.
  Open: Searches records through masterdata.VICPSearchData.
  SaveMain: Saves the record through masterdata.VICPSaveMain.
  ucmbVendorName_ValueChanged: Runs through masterdata.VICPFillValueDependent.
