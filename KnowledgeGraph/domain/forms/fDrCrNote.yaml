  FillValuesBill: Fills the lookup lists through Finance.FIDCFillValuesBill.
  FillValuesDependent: Fills the lookup lists through Finance.FIDCFillValuesDependent.
  FillValuesSourceDocument: Fills the lookup lists through Finance.FIDCFillValuesSourceDocument.
  FillValuesVendor: Fills the lookup lists through GlobalData.VendorLocationSelect.
  GetVendorInfo: Runs through Finance.FIDCGetVendorInfo.
  LoadData: Loads the selected record through Finance.FIDCLoadData.
  Open: Searches records through Finance.FIDCSearchData.
  Save: Saves the record through Finance.FIDCAuthorize, Finance.FIDCSaveMain, Finance.VoucherSaveChildDetail, Inventory.VoucherVsLotValidation.
