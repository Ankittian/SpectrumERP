- Select valid <Deduction/Addition> Reason.
- Enter Other Reason.
- Select valid <Deduction/Addition> Nature.
- Nature Value can't be empty or 0.
- Select valid <Deduction/Addition> On.
- Select valid Method.
- Select valid Vendor Bill No..
- Select Due Date.
- Select valid Payment Mode.
- Select valid GST Tax Rule.
- Select Valid Dispatch Challan.
- Select atleast one Bill.
- Document Currency and referred Invoice Currency doesn't match.
- Bill Date can't be greater than Document Date in row <n>.
- <Deduction/Addition> Amount can't be greater than Net Amount in row <n>.
- Reverse charge of all the selected bills must be same.
- ' GST is Applied in Tax Invoice but GST in Tax Detail is missing. Do you want to continue?  '
- ' GST is not Applied in Tax Invoice but GST in Tax Detail exists. Do you want to continue?  '
- Enter atleast one Item.
- Select atleast one <GRN/Invoice/Ref. Document>.
- Row <n> doesn't match with Item Details of Selected Dispatch Challan.
- <Net Amount caption> in row <n> can not be zero or empty.
- In Item Detail, rows with 'Purchase Type' Capital & Non-Capital, can't be selected at once.
- Select valid HSN & SAC Code in row <n>.
- HSN & SAC Code in not 8 character long. Do you want to continue?
- HSN & SAC Code must be 8 character long.
- <Deduction/Addition> Qty. can't be empty or 0 in row <n>.
- <Deduction/Addition> Rate can't be empty or 0 in row <n>.
- must be equal to Qty. <n>
- Qty. can't be greater than Challan Qty.
- Qty. can't be greater than Received Qty.
- Nature Value should be equal to Basic Amount.
- GST cannot be applied in Tax Detail tab for those Invoices, whose Reverse Charge is 'Exempted'.
- GST Taxes and GST Tax Rule can't be selected simultaneously
- GST Input can't be selected in TDC Account Rule for Tax Invoice
- Net Amount can't be 0.
- Total Selected Invoices are more than one. Do you want to continue?
- Total selected Invoices can't be more than one.
- Debit/Credit Note can be created against only one Tax Invoice. Do you want to continue?
- Debit/Credit Note can be created against only one Tax Invoice.
