form: fDrCrNote
title: Debit/ Credit Note
module: FI
kind: transaction
summary: The Debit/ Credit Note screen records a numbered note that raises or reduces an amount owed by or to a business partner
  after the original document was posted.
purpose: |
  What it is: A controlled correction document that changes the balance of one or more posted bills of a partner, with its own number, taxes, GST posting and voucher. [fDrCrNote.vb:1631-1758; Finance.FIDCSaveMain:91-188] When it applies: When a rate difference, short supply, quality rejection, discount, freight or other reason requires the partner's account to be debited or credited after billing. Business outcome: The partner ledger, outstanding references, GST input or output and stock lot values are corrected through one auditable document.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Screen Layout: A header with number, status, date and division, and tabs General, Invoice Detail, Item Detail, Tax Detail (hidden unless Calculate Tax), Finance Posting and GST Posting (hidden by default).
  - General Tab Fields: Note type, Source Document, Vendor Name, Vendor Location (mandatory, BR-01), Reason, Other Reason (100 characters, only for reason 5), On, Remarks (1000), Vendor Bill No.
  - Invoice Detail Grid: The partner's open bills with select box, bill number and date, net amount, balance, currency, reverse charge and the note Amount (sum of the selected lines' Net Amount).
  - Item Detail Grid: Lines of the selected bills (or free item rows for direct notes) with select box, item, unit, HSN, purchase type, bill quantity, rate and net amount, deduction or addition Qty., Rate, Amount, Net Amount, remarks (500) and previous notes.
  - Quality Deduction Grid: A pop-up grid opened from the deduction rate cell for Auto nature, listing inspection parameters with OK and Cancel; OK writes the calculated rate to the line.
  - Tax Detail, Finance Posting and GST Posting Tabs: Tax Detail holds the tax lines on the note amount and the tax concession form.
  - Hidden Shortcuts: Ctrl+Alt+G on the GST tab deletes and re-saves the GST posting after confirmation; Ctrl+Alt+V shows MSG-49; Ctrl+Alt+G with the posting tab visible copies narration-update statements for all notes to the clipboard.
actions:
  Save, Search, Delete, Print and Other: 'Standard toolbar: New, Save, Search (opens the configured list), Delete, Print and
    Preview (voucher, supplier debit note report and daily print reports), E-mail and Export.'
