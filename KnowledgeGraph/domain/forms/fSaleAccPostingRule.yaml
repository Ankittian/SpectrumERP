  FillValues: Fills the lookup lists through Finance.FCSRFillValues.
  LoadData: Loads the selected record through Finance.FCSRLoadData.
  Open: Searches records through Finance.FCSRSearchData.
  Save: Saves the record through Finance.FCSRSave.
  SaveugdDetails: Saves the record through Finance.FCSRSaveSaleAccPostingRuleDetails.
  ValidateDetails: Validates the entry through Finance.FCSRValidate.
  ValidateGeneralDetail: Validates the entry through Finance.FCSRValidate.
  dtpEffectiveFromDate_ValueChanged: Validates the entry through Finance.FCSRFillValues, Finance.FCSRValidate.
