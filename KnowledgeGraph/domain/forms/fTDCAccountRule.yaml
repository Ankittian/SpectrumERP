form: fTDCAccountRule
title: TDC Account Rule
module: FI
kind: master
users:
- Tax administrator (inferred)
summary: The TDC Account Rule screen defines tax, duty and charge rules that group miscellaneous charges of one tax category
  under a single description, with an account basis (item basis or tax basis), an optional account type and an effective date.
purpose: |
  What it is: A rule that ties a tax category, its charges, tax attributes and applicable screens to an accounting basis. When it applies: When a new tax, duty or charge treatment is introduced or extended to more screens. Business outcome: Consistent tax and charge accounting across documents.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Rule Header Area: TDC Rule Code, TDC Rule Description, Tax Category, Account Basis, Account Type, Effective From.
  - TDC Rule Code Field: Read-only text.
  - TDC Rule Description Field: Text box, mandatory, maximum 100 characters, trimmed.
  - Tax Category Field: Dropdown, mandatory.
  - Account Basis Field: Dropdown, mandatory.
  - Account Type Field: Dropdown.
  - Effective From Field: Date picker.
  - Taxation Detail Tab: Grid with Tax Attribute, Transaction Type (read only, from attribute), Nature, Assessee Type; new row on filling the last Tax Attribute.
  - Miscellaneous Charges Tab: Grid with Select (header tick box), Code, Tax Group, Charge Name, Charge Value (read only).
  - Form Detail Tab: Grid with Select (header tick box), Module Name, Form Name.
  - Other Toolbar Actions (Print, Preview, Export, Email): Not enabled; handlers empty.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled.
validations:
- Enter TDC Rule Description.
- Select valid Tax Category.
- Select valid Account Basis.
- Select valid Account Type.
- Select atleast one Tax Attribute.
- 'Select valid Assessee Type in row '
- Duplicate Tax Attribute and Nature is not allowed.
- Select atleast one Miscellaneous Charge.
- Account Rule Definition exists against this Charge.
- Select atleast one Form.
- Duplicate TDC Account Rule not allowed.
manages:
- tdc-account-rule
uses_concepts:
- account-determination-rule
- tdc-charge
- tdc-group
