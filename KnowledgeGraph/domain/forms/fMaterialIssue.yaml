form: fMaterialIssue
title: Material Issue
module: MM
kind: transaction
users:
- Storekeeper (inferred)
summary: The Material Issue screen records the issue of materials from a warehouse to an employee, a contractor or shop floor,
  or a vendor.
purpose: |
  What it is: A stores transaction that moves material out of a warehouse against a business need, identified by a yearly document number, a date and a status. When it applies: When stores hand over material for consumption, capital work, subcontract processing, repair, maintenance, service, batch production or packing, or as a returnable loan. Business outcome: Stock is reduced lot by lot at the correct value, the requesting document's balance is consumed, and the cost is charged to the right department, cost centre and ledger account.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Area: The shared document number control at the top: Division, Prefix, Issue No., Date and Status.
  - Tab Layout: Four tabs: Issue Detail, Item Detail, Custom Field and Finance Posting.
  - OwnerShip Field: Dropdown, mandatory: Own or Customer.
  - Source Document Field: Dropdown, mandatory, list of active source documents with Direct as default.
  - Ref. Doc. No. Field: Dropdown of open reference documents for the selected source; extra Cost Center column for Material Request and Batch No.
  - Ref. Doc. Date Field: Read-only date of the selected reference document.
  - Warehouse Field: Dropdown, mandatory, list of warehouses with code, division and type.
  - Department Field: Dropdown, mandatory, list of departments with code and division.
  - Issue Type Field: Dropdown, mandatory: Capital, Revenue, RawMaterial, Reusable, and Repairable only for Customer Service Order issues.
  - Issue To Field: Dropdown, mandatory: Employee, Contractor/ShopFloor/Transporter, Vendor.
  - Employee Name Field: Dropdown, mandatory.
  - Receiver Name Field: Text box, optional, up to 100 characters.
  - Non Returnable / Returnable Option: Two-way option, mandatory, default Non Returnable.
  - Return Date Field: Date picker with tick box (on-screen label "Return Date" with a double space).
  - Non Chargeable / Chargeable Option: Two-way option, default Non Chargeable.
  - Reference No. & Date Field: Text box, optional, up to 100 characters, under the label "Reference No.
  - Issue Label Field: Dropdown of issue labels with code.
  - Project Code Field: Dropdown.
  - Default Cost Center Field: Dropdown of cost centres.
  - Remarks Field: Multi-line text box, optional, up to 1000 characters, saved trimmed.
  - Notes Area: The shared notes control on the Issue Detail tab.
  - BarCode Group: Item Code text box (10 characters), an O&k button and a last-scan status line ("Not Scanned." at start).
  - Item Details Grid: The item rows: Select, Item Code, Item Description, item information icon, Make, Tech.
  - Lot Details Picker: A pop-up grid of available lots for the current row: Select, Received Doc No., Received Doc Date, Lot No., Stock Qty., Stock Pcs, Quantity, Pcs, cost centre, the Capital Lot flag, and heat numbers when heat-wise lots are enabled; with Select All, Unselect All, Ok and Cancel buttons.
  - Serial Number Picker: A pop-up list of serials for the current row with Ok and Cancel.
  - Stock Details Pop-up: A read-only list of the item's stock by make, attribute, cost centre, department, project, reservation and stock type, with an Ok button.
  - Information Pop-ups: Item, cost centre and department information windows.
  - Custom Field Tab: The shared custom field control configured for this screen.
  - Finance Posting Tab: The shared posting control showing the journal voucher lines.
  - Other Toolbar Actions (Print, Print Preview, Export, Email): Issue slip report with the issue as parameter.
  - Hidden Keyboard Shortcuts: Ctrl+Alt+V and Ctrl+Alt+G.
actions:
  New: Clears the screen for a new issue.
  Save: Validates and saves the issue with its items, lots, serials, custom fields, notes and voucher.
  Open: Search list of issues for the login company and year.
  Repeat Entry: The document number control's repeat function.
  Delete: Deletes the open issue.
  Navigation: First, Previous, Next and Last through the issue list.
