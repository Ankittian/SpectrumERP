form: fGSTAdvanceReceipt
title: GST Advance Receipt
module: FI
kind: transaction
summary: The GST Advance Receipt screen records the GST that is contained in an advance received from a customer.
purpose: |
  What it is: A document that declares the GST content of one customer advance (a party reference created by a receipt voucher), with the HSN or SAC code, net amount, tax lines and resulting basic amount per row [fGSTAdvanceReceipt.vb:606-621; Finance.FARPSave:80-133]. When it applies: After an advance receipt voucher has been booked for a customer in the month being reported, and before the supply is invoiced. Business outcome: GST on advances is recognised in the month of receipt and the books carry the matching journal (BR-02; BR-10; BR-11).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Tabbed Layout: Four tabs: General, Tax, Finance Posting and GST Posting [fGSTAdvanceReceipt.Designer.vb:518-528].
  - Document Number, Date and Status Control: The shared document control holding the document number (or prefix series), date, status and division [fGSTAdvanceReceipt.vb:164; fGSTAdvanceReceipt.vb:211-221].
  - Mon-Year Field: A month picker formatted MMM-yyyy [fGSTAdvanceReceipt.Designer.vb:146-150].
  - Voucher Type Field: A mandatory dropdown of voucher types 1 and 3 [fGSTAdvanceReceipt.vb:103; Finance.FARPFillValues:24].
  - Account Name Field: A mandatory dropdown of accounts with Account Name and Account Group, restricted to account types 5, 4, 7, 8 and 10 [Finance.FARPFillValuesDependent:21-23].
  - Party Reference No Field: A mandatory dropdown showing Party Ref No, Party Ref Date, Voucher No and Voucher Date [fGSTAdvanceReceipt.vb:941].
  - Reference Information Fields: Read-only fields Party Reference Date, Reference Amount, Ref.
  - GST Tax Rule Field: An optional dropdown of GST rules.
  - Remark Field: An optional text box; trimmed on save [fGSTAdvanceReceipt.vb:600].
  - Currency Control: The shared currency control with currency, conversion and rate [fGSTAdvanceReceipt.vb:230-232; fGSTAdvanceReceipt.vb:433].
  - Advance Detail Grid: A grid with Select, Ref Doc No., Item Code, Item Description, Make, Unit, HSN & SAC Code, HSN & SAC Description, Net Amount, Basic Amount, Tax (button) and GST Tax Rule; IDNo, ItemNo, MakeNo and RefDocumentNo are hidden [fGSTAdvanceReceipt.vb:499-544].
  - Tax Tab: The tax calculation control: tax lines for the whole document and, via the Tax button, per row, all inclusive in the net amount [fGSTAdvanceReceipt.vb:149-160; fGSTAdvanceReceipt.vb:486-495].
  - Finance Posting Tab: The journal voucher preview [fGSTAdvanceReceipt.vb:789-880].
  - GST Posting Tab and Ctrl+Alt+G: The GST return detail by row and tax [fGSTAdvanceReceipt.vb:46-96].
  - Other Toolbar Actions (Print, Preview, Export, Email): Handlers exist with no logic [fGSTAdvanceReceipt.vb:296-327].
actions:
  New: Opens a new blank document [fGSTAdvanceReceipt.vb:260-266].
  Save: Validates and saves the document and, when applicable, its voucher and GST detail in one transaction [fGSTAdvanceReceipt.vb:551-641].
  Search: Opens the search list of this company and year [fGSTAdvanceReceipt.vb:269-290].
  Delete: Deletes the loaded document [fGSTAdvanceReceipt.vb:110-135].
validations:
- Authorized GST Advance Receipt can't be updated.
- Authorized entry can't be updated.
- Select valid Voucher Type.
- Select valid Account Name.
- Select valid Party Reference No.
- Adjusted amount can't be greater than ref. Balance Amt.
- Ref. Balance Amt should be equal to Adjustment Amount.
- Want to continue?
- Party Account Balance and Party Reference Balance is not same, want to continue?
- Select valid HSN & SAC Code  in row n.
- Net Amount can't be empty or zero in row n.
- No Detail found
- Duplicate Document No. not allowed.
- Document No. <number> saved successfully.
manages:
- gst-advance-receipt
uses_concepts:
