method_notes:
  Delete: Deletes the record through EAM.EAMPDelete.
  FillFault: Runs through EAM.EAMPFillFault.
  FillRefNo: Runs through EAM.EAMPFillRefNo.
  FillResource: Runs through EAM.EAMPFillResource.
  FillValues: Fills the lookup lists through EAM.EAMPFillValues.
  FillValuesDependent: Fills the lookup lists through EAM.EAMPFillValuesDependent.
  LoadData: Loads the selected record through EAM.EAMPLoadData.
  Open: Searches records through EAM.EAMPSearchData.
  Save: Saves the record through masterdata.AMRCSave.
  SaveFaultDetail: Saves the record through EAM.EAMPSaveFaultDetail.
