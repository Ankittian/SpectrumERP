form: fPOAmendment
title: Purchase Order Amendment
module: MM
kind: transaction
summary: The Purchase Order Amendment screen lets a buyer revise an already authorized purchase order (PO) without re-creating
  it.
purpose: |
  What it is: A controlled, versioned change to an authorized purchase order; each version carries its own amendment number, date, reason, status and full copy of the PO detail (BR-02, BR-03). When it applies: When an authorized PO must change after release to the vendor, for example a revised rate, quantity, delivery schedule, tax, freight term or payment term. Business outcome: The PO history is preserved version by version, changes are approved before they take effect, and the live PO always reflects the last authorized amendment (BR-38).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Area: A panel above the tabs with "PO No.", the amendment number, "Document Date", "PO Date", "Document Status" and "Division Name" [fPOAmendment.Designer.vb:2130].
  - Tabbed Workspace: Tabs "General Details", "Indent Details", "Shipping & Account Detail", "Tax Details", "Terms and Conditions", "Transportation Route", "Other Expenses", "Payment Terms", "Account Assignment", "Authorization Group", "Advance Detail" and "Custom Fields" [fPOAmendment.Designer.vb:2273].
  - Item Details Grid: The main item grid below the tabs [fPOAmendment.Designer.vb:2367] with item code and description, make, technical grade, HSN & SAC code, quantity, unit, rate, discount, basic and net amount, weights, cost centre, agreement schedule and buttons for schedule, QC, tax, consignee, tolerance, technical specification and previous PO.
  - PO No. Field: Mandatory drop-down with a search button listing eligible POs (PO number with financial year, PO Date, vendor name, vendor location) (BR-02).
  - Amendment Number Field: Read-only numeric box next to "PO No." [fPOAmendment.Designer.vb:2199].
  - Document Date Field: Mandatory date of the amendment.
  - PO Date and Division Name Fields: Read-only displays copied from the PO [fPOAmendment.Designer.vb:2149].
  - Document Status Field: Mandatory drop-down: Initial, Release, Authorized; default Initial [fPOAmendment.vb:873].
  - General Details Tab Fields: "Document Type", "Purchase Type", "Purchase Category", "Ref.
  - Shipping & Account Detail Tab Fields: "Shipping Detail" group with the consignee grid (consignee name, consignee location), "Define Transportation Route", "Freight Type", "Freight Rate Type", "Freight Amount", "Freight Order", "From Location", "To Location", "No.
  - Tax Details Tab: The shared tax-on-amount control (document taxes and charges, item-wise taxes, net amount) and the tax concession form control [fPOAmendment.Designer.vb:1249].
  - Transportation Route Tab: "Level" drop-down, route grid, "PO Manually Closing" check box, freight popup ("Freight Nature", "Freight Amount", "No.
  - Other Expenses Tab: Expense head grid with "Expense Amount" and "PO Net Amount" totals and an output-item conversion popup ("Input Item Qty.", "Yield %", "Rejection %", "Loss %") [fPOAmendment.Designer.vb:1575].
  - Payment Terms Tab: "Payment Mode" (mandatory) and the shared payment terms control [fPOAmendment.Designer.vb:1775].
  - Account Assignment, Authorization Group, Advance Detail and Custom Fields Tabs: Account assignment grid; "Authorization Group" drop-down with approval grid (level, user, role, status, action, comment, previous status / comment, "Send Email" button); advance grid with "Manual" / "Automatic" option; custom field control [fPOAmendment.Designer.vb:1822].
  - Other Toolbar Actions (Print, Preview, Export, Email): Print, preview, export and e-mail of the amendment report.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search: Toolbar Open.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last are enabled for the screen [fPOAmendment.vb:52].
