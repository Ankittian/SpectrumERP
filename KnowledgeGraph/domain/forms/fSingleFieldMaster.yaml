form: fSingleFieldMaster
title: Single Field Master
module: MM
kind: master
users:
- Master data administrator (inferred)
summary: The Single Field Master screen is one generic screen that maintains many simple code-and-name lists, such as Location
  Master, Technical Grade, Category, Tech Specification Master and Quality Parameter Type.
purpose: |
  What it is: A uniform way to create and maintain simple reference lists that consist only of a code, a name and an inactive flag (and, for one configuration, a default flag). When it applies: When a new location, grade, category, specification category, quality parameter type or any other configured list value must be made available for selection in transactions and other masters. Business outcome: All simple lists follow the same entry, duplicate-check, authorisation and company-availability behaviour, and new lists can be added by configuration without a new screen (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Detail Area: A single panel holding the "Code" link and code box, the name label and name box, and the "Is Default" and "Inactive" check boxes.
  - Code Field: Text box, maximum 2 characters (BR-06).
  - Code Link: The caption "Code" to the left of the code box is a hyperlink with tooltip "Switch to fast entry mode." When it applies: Always visible in detail mode.
  - Name Field: Text box, mandatory (highlighted as compulsory), maximum 50 characters unless the configuration sets another limit (BR-03, BR-05).
  - Is Default Check Box: Check box "Is Default", optional.
  - Inactive Check Box: Check box "Inactive", always disabled (display only).
  - Fast Entry Grid Container: A grid with columns "Code" (Category only, 2 characters), "Name" (50 characters) and "Remarks" (read-only), plus an "Import" button and the link "Switch back to detail mode.".
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions.
actions:
  Switch back to detail mode.: Link at the top of the fast entry container.
  Import: '"Import" button in fast entry mode that loads an Excel sheet into the grid.'
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open/Search, which opens the common search window.
  Delete: Standard toolbar Delete.
  Navigation: First, Previous, Next and Last over the current search result list, provided by the main application window.
validations:
- Enter Code.
- Enter Location Name.
- Duplicate Location Name not allowed.
- Duplicate Technical Grade Name not allowed.
- Duplicate Category Name not allowed.
- Duplicate Tech Specification Category Name not allowed.
- Duplicate quality parameter type not allowed.
- Duplicate Category Code not allowed.
- Refer Remarks for data saved status.
- Successfully Created.
- Multiple Default Sales Classification Name not allowed.
manages:
- single-field-list
method_notes:
  Delete: Deletes the record through masterdata.Delete.
  FillValues: Fills the lookup lists through masterdata.FillValues.
  LoadData: Loads the selected record through masterdata.LoadData.
  Open: Searches records through masterdata.SearchData.
  SaveMain: Saves the record through masterdata.Save.
  ValidateForm: Validates the entry through masterdata.Validate.
