method_notes:
  Delete: Deletes the record through masterdata.FIAMDelete.
  FillValues: Fills the lookup lists through masterdata.FIAMFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.FIAMFillValuesDependent.
  LoadData: Loads the selected record through masterdata.FIAMLoadData.
  Open: Searches records through masterdata.FIAMSearchData.
  SaveARD: Saves the record through Finance.FARDSaveMain.
  SaveBankDetail: Saves the record through masterdata.FIAMSaveBankDetail.
  SaveBankInterestDetail: Saves the record through masterdata.FIAMSaveBankInterestDetail.
  SaveCOAMappingDetail: Saves the record through masterdata.FIAMSaveAccountGroupDetail.
  SaveLocation: Saves the record through masterdata.VIVCSaveLocation.
