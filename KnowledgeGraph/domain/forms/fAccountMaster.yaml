form: fAccountMaster
title: Account Master
module: FI
kind: master
users:
- Accounts officer (inferred)
summary: The Account Master screen creates and maintains general ledger accounts.
purpose: |
  What it is: The ledger account master with its classification, controls, bank details, chart mappings and, for party accounts, the party's address and tax registration. When it applies: When finance opens a new ledger, bank account or additional party account, or changes its group, controls or details. Business outcome: Consistent, unique ledgers with the controls posting needs (BR-01 to BR-27).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area: Main panel with identification, classification, controls and tax code.
  - Account Code Field and Link: Read-only code (up to 12 characters) with an "Account Code" link labelled with the tooltip "Switch to fast entry mode." When it applies: Code is filled after load; link always available.
  - COA Field: Dropdown with COA name and code, mandatory (BR-03).
  - Account Nature Field: Read-only text.
  - Account Type Field: Dropdown, mandatory (BR-04).
  - Account Name Field: Text box, mandatory, up to 100 characters (BR-01, BR-10).
  - Account Group Field: Dropdown, mandatory (BR-05).
  - A/c Alias Field: Optional text box, up to 10 characters.
  - Printing Name Field: Optional text box, up to 100 characters.
  - Currency Control: Shared currency selector with conversion rate.
  - Maintain References Checkbox: Optional flag.
  - Maintain Cost Center Checkbox and Cost Center Field: Flag; when ticked shows "Cost Center" dropdown, which is then mandatory.
  - Maintain Qty. Wise Checkbox and Unit Name Field: Flag; when ticked shows "Unit Name" dropdown, then mandatory.
  - HSN /SAC Code Field with CGST, SGST, IGST, UTGST Rate: Optional dropdown with code and description; four read-only rate displays.
  - Is Fund Flow Account Checkbox: Optional flag.
  - COA Mapping & Interest Tab: "COA Mapping" grid ("COA Name", "Group Name", "Parent Group Name" read-only) and "Interest" grid ("From Date", "Interest Rate" up to 5 characters, 2 decimals).
  - Bank Tab: "Bank Name" (mandatory, up to 100), "Address" (three lines), "City", "State", "Country", "Phone No.", "Fax No.", "Website", "Contact Person", "Bank Branch Code" (mandatory, up to 10), "IFSC Code" (mandatory, up to 12), "Bank Account No." (mandatory, up to 20), "Min.
  - Additional Information Tab: "Party Account" checkbox; when ticked enables "Address Detail" ("Address" three lines, "City", "State", "Country", "Pincode" up to 6) and "TDS Detail" ("STC No.", "PAN No.", "Payer's Category", "GST Registration Type", "GSTIN No.", "UIN No.", "MSME Registration", "MSME No."), plus "Is PAN Operative".
  - Account Mapping Tab: Grid "Account Name" dropdown with read-only "Group Name" and "Parent Group Name"; new rows added automatically.
  - Fast Entry Grid Container: Columns "COA", "Account Type", "Account Name" (50), "Account Group", "A/c Alias" (10), "Printing Name" (50), "Bank Name" (100), "Bank Account No" (20), "Bank Branch Code" (10), "IFSC Code" (12), "Party Account", "Address1" to "Address3" (100), "GST Registration Type", "GSTIN No", "Remarks" (read-only).
  - Other Toolbar Actions (Print, Preview, Email, Export): Handlers are empty.
actions:
  Switch back to detail mode.: Link "Switch back to detail mode." in the fast entry panel.
  Import: '"Import" button in fast entry that reads an Excel sheet named after the screen code.'
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with "Code", "COA", "Account Name", "Group Name", "Account Type", "Reference App", "Cost Center
    App", "Cost Center", "Created By", "Created Date".
  Delete: Standard toolbar Delete.
