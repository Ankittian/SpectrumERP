  FillValues: Fills the lookup lists through masterdata.FSLDFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.FSLDFillValuesDependent.
  LoadData: Loads the selected record through masterdata.FSLDLoadData.
  Open: Searches records through masterdata.FSLDSearchData.
  SaveMain: Saves the record through masterdata.FSLDSaveMain.
  ValidateForm: Validates the entry through masterdata.FSLDValidate.
