  FillValuesPayingUnit: Fills the lookup lists through Finance.FICJFillValuesPayingUnit.
  FillValuesSourceDocumentForm: Fills the lookup lists through Finance.FICJFillValuesSourceDocumentForm.
  LoadData: Loads the selected record through Finance.FICJLoadData.
  Open: Searches records through Finance.FICJSearchData.
  Save: Saves the record through Finance.FICJSaveMain, Finance.VoucherSaveChildDetail.
  ValidateForm: Validates the entry through Finance.FICJValidate.
