form: fMaintenanceSchedule
title: Maintenance Schedule
module: PM
kind: transaction
summary: The Maintenance Schedule screen defines recurring or one-off preventive and inspection maintenance for a piece of
  equipment or a functional location.
purpose: |
  What it is: A planned-maintenance definition tied to one equipment item or one functional location, with a maintenance category and type, the work content, and one or more triggers that say when maintenance falls due [fMaintenanceSchedule.vb:896-1024; fMaintenanceSchedule.vb:1510-1671]. When it applies: When maintenance planning wants an asset serviced or inspected on a calendar rhythm (daily, weekly, monthly) or on a meter reading (for example running hours). Business outcome: Due maintenance is predictable and Maintenance Orders can be raised from dated occurrences instead of being remembered manually (BR-36; BR-38).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: The window captioned "MaintenanceSchedule" [fMaintenanceSchedule.designer.vb:2577].
  - Document Number, Date, Status, Division and Repeat Controls: The standard document control with Document No.
  - Schedule Description Field: Mandatory text box, up to 300 characters [fMaintenanceSchedule.designer.vb:2020; fMaintenanceSchedule.vb:903-909].
  - Reference Object Field: Mandatory dropdown listing the active reference objects; defaults to Equipment on a new record [EAM.EAMSFillValues:123-125; fMaintenanceSchedule.vb:492; fMaintenanceSchedule.vb:911-917].
  - Equipment Description / Location Field: Mandatory dropdown (label switches between "Equipment Description" and "Location") listing authorized assets of the company [fMaintenanceSchedule.vb:919-932; fMaintenanceSchedule.vb:4340-4348].
  - Custodian Field: Read-only text, up to 100 characters, filled from the selected asset [fMaintenanceSchedule.designer.vb:2078-2080; fMaintenanceSchedule.vb:4417-4420].
  - Maintenance Category Field: Mandatory dropdown [fMaintenanceSchedule.vb:943-949].
  - Maintenance Type Field: Mandatory dropdown with Preventive Maintenance and Inspection [fMaintenanceSchedule.vb:935-941; EAM.EAMSFillValues:168-171].
  - Free Service Checkbox: Checkbox "Free Service" saved with the schedule [fMaintenanceSchedule.vb:2719; fMaintenanceSchedule.designer.vb:2139].
  - Shutdown Required Checkbox and Shutdown Duration Field: Checkbox "Shutdown Required" and a numeric "Shutdown Duration" in hours.minutes with two decimals, up to 8 characters, read-only until the checkbox is ticked [fMaintenanceSchedule.designer.vb:2149-2170; fMaintenanceSchedule.vb:4358-4376].
  - Create MO Manually Checkbox and Start MO with Status Field: Checkbox "Create MO Manually" and dropdown "Start MO with Status" listing the document statuses [fMaintenanceSchedule.vb:4385-4400; EAM.EAMSFillValues:186-187].
  - Estimated Completion Field: Mandatory numeric field (up to 5 characters, two decimals) with the unit label "Hrs" [fMaintenanceSchedule.designer.vb:2205-2217; fMaintenanceSchedule.designer.vb:2346].
  - Status Field: Read-only text, shows "Initial" for a new record and the schedule's business status after loading [fMaintenanceSchedule.vb:286; fMaintenanceSchedule.vb:586].
  - Remarks Field: Optional text, up to 500 characters [fMaintenanceSchedule.designer.vb:2242; fMaintenanceSchedule.vb:2713].
  - Schedule Interval and Generate MO Fields: Two mandatory dropdowns on the Trigger Detail tab area.
  - Shift Field: Dropdown "Shift" of the active shifts of the company [fMaintenanceSchedule.vb:508; EAM.EAMSFillValues:495-499].
  - Take Meter Reading Checkbox: Checkbox "Take Meter Reading"; ticking shows the Meter Reading Detail tab [fMaintenanceSchedule.vb:4943-4950].
  - Trigger Detail Grid: Grid with Trigger No, Trigger Type, a Trigger button column and the read-only Trigger Description.
  - Trigger Dialog (By Time / By Meter Reading): A row-edit dialog opened with the Trigger button.
  - By Time Fields: Schedule Type, Every (up to 4 digits) with a period (Day, Week, Month), On (weekday, only for weekly), Start Date, End Date (a checkbox on the date), End After (occurrences, up to 4 digits) and Threshold Days (up to 4 digits, with the label "Before") [fMaintenanceSchedule.designer.vb:1265; fMaintenanceSchedule.designer.vb:1256; fMaintenanceSchedule.designer.vb:1078; EAM.EAMSFillValues:372-374].
  - By Meter Reading Fields: Measurement Parameter, Schedule Type, Every (up to 15 characters, four decimals), Start At (four decimals, default 0.0000), End By (Value or Occurrence), End For Value, Threshold On (Percentage or Value), Threshold Value, Condition (greater than or equal to), Reading Value, plus read-only unit displays [fMaintenanceSchedule.designer.vb:849; fMaintenanceSchedule.designer.vb:878; fMaintenanceSchedul
  - Task Detail Grid: Grid with Trigger No, Task Id (auto), a Btn button, Task Name, Code, Parent Task Id, Parent Task, Subcontract checkbox, Subcontract Detail button, Priority, Assign To, Estimated Duration(Hr), Work Center and Cost Center.
  - Task Name Button and Import Button: The Btn column opens a multiple-selection picker of task masters [fMaintenanceSchedule.vb:5911-5925].
  - Subcontract Dialog: A row-edit dialog with "Service &Item" (items of type service), "&Quantity" (up to 11 characters, three decimals), read-only "Unit" and "&Ok" and "&Cancel" buttons [fMaintenanceSchedule.designer.vb:1509-1575; EAM.EAMSFillValues:477-488].
  - Inspection Check Points Grid: Grid with S No.
  - Resource Detail Grid: Grid with Trigger No, Task Id, Task Name (read-only), Resource Name, Code (read-only), Quantity (whole number) and Estimated Duration(Hr) [fMaintenanceSchedule.vb:2230-2255; fMaintenanceSchedule.vb:383-384].
  - Skill Detail Grid: Grid with Trigger No, Task Id, Task Name, Skill Name and Code (read-only, 6 characters) [fMaintenanceSchedule.vb:2297-2320].
  - Tools Required Grid: Grid with Trigger No, Task Id, Task Name, Item Code, Item Description, Unit (read-only), Quantity (three decimals), Estimated Duration(Hr) and a Btn button that shows item details [fMaintenanceSchedule.vb:2389-2421; fMaintenanceSchedule.vb:3695-3760].
  - Item Required Grid: Grid with Trigger No, Task Id, Task Name, Item Code, Item Description, Unit, Make, Technical Grade, Quantity (three decimals), "Is Replacement" and a Btn button [fMaintenanceSchedule.vb:2497-2537; fMaintenanceSchedule.vb:3764-3845].
  - Meter Reading Detail Grid: Grid with Measurement Parameter, Code (read-only) and a Standard Value column that appears only for Inspection [fMaintenanceSchedule.vb:4986-5003].
  - Occurrence Detail Grid and Calculate Button: Grid with Trigger No, Occurrence No., Occurrence Date and Remarks (up to 500 characters).
  - Custom Field Tab: A shared custom-field control saved with the schedule [fMaintenanceSchedule.vb:353; fMaintenanceSchedule.vb:3313-3336].
  - Notes Control: A shared notes control with Print Area, Notes and Default, positioned very small at the right of the header [fMaintenanceSchedule.designer.vb:2350-2356].
  - Create Same Schedule For Grid: Grid with Document No., Code (read-only) and Equipment Description (equipment or location) [fMaintenanceSchedule.vb:5356-5380].
  - Other Toolbar Actions (Print, Preview, Export, Email): Handlers that exist but do nothing [fMaintenanceSchedule.vb:713-745].
actions:
  New: Clears the form for a new schedule.
  Save: Validates and saves the schedule and all details, then authorizes.
  Search: Opens the standard search list of schedules.
  Delete: Deletes the loaded schedule after the standard delete confirmation.
  Import: The "Import" button reads an Excel file and fills the Task Detail grid from sheet "Sheet1$" [fMaintenanceSchedule.vb:5951-5966;
    fMaintenanceSchedule.designer.vb:1475].
