form: fSalesAgreement
title: Sales Agreement
module: SD
kind: transaction
summary: The Sales Agreement screen records a commercial agreement with a customer (or an agent) that later sales orders are
  raised against.
purpose: |
  What it is: A customer-specific commercial commitment that states what may be sold, at what rate or value, in which quantity, under which payment, tax and delivery terms, and for which period. When it applies: When the sales team concludes a rate contract, a quantity contract or a value contract with a customer or agent before individual orders are placed. Business outcome: Later sales orders are raised against an approved agreement; agreed rates and quantities are enforced and agreement balances can be tracked (BR-27, BR-37).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout and Tabs: A window titled "Sales Agreement" [fSalesAgreement.designer.vb:3845] with a document-number header and tabs: "General Information", "Payment Terms & Tax Detail", "Export Detail", "Inspection Detail", "Consignee Detail", "Cost Detail", "Terms & Condition" and "Multi-Level Authorization" [fSalesAgreement.designer.vb:3754-3777].
  - Document Number, Date, Status and Division: Shared document-number control: prefix, document number, document date, document status, division and a repeated-entry button.
  - Order Type Field: Mandatory dropdown "Order Type"; lists only Non-Turn Key, Trading and Job Work for agreements (BR-06).
  - Source Document and Ref. Doc. No. Fields: Mandatory dropdown "Source Document" (default Direct) and dropdown "Ref.
  - Customer Name and Customer Location Fields: Dropdowns; the first location is selected automatically [fSalesAgreement.vb:2730-2732].
  - Agent and Distributor Fields: Agent dropdown with an information label; Distributor dropdown visible only when the distributor setting is on [fSalesAgreement.vb:514-520].
  - Sales Category, Supply Type and Sales Classification Fields: Mandatory "Sales Category"; mandatory "Supply Type" whose list depends on the category; optional "Sales Classification" with a configured default [fSalesAgreement.vb:485-487].
  - Agreement Type, Qty. Validation, Agreement Qty. and Agreement Unit Fields: Mandatory "Agreement Type" and "Qty.
  - Agreement Period (From Date / To Date): Two dates in the "Agreement Period" group.
  - Sales Person Name, Booking Time, Freight Type, Cust. Ref. No., Cust. Ref. Date and Remarks: Sales person dropdown; booking time (shown only if the company maintains booking time [fSalesAgreement.vb:414-420]); freight type (default from master, hidden for Export); free-text customer reference number and optional date; remarks.
  - Additional Cost and QC Required Check Boxes: "Additional Cost" (visible only when the company shows additional cost) and "QC Required".
  - Item Details Grid: Grid of agreement lines with "Item Code", "Item Description", "Make", "Unit", "Quantity", "Rate", "Basic Amount", "Tax", "Net Amount", "Processing Type", "Tech.
  - Item Popups (Item Information, Specification, Tolerance, Cash Discount, Rate, Activity, Price Code): Row popups for attribute combination and pricing factors, quality parameters, item tolerance, item cash discount, rate bifurcation, activities and (when enabled) item price-setting selection.
  - Payment Terms & Tax Detail Tab: "Pay Term Code" dropdown, payment terms grid ("Pay Code", "Payment Type", "Payment Description" up to 300 characters, "Pay Value %", "Payment Mode", "Credit Days", "Remarks" up to 500 characters [fSalesAgreement.vb:4751-4778]), document tax control, and "Cash Discount" group (Level, Basis, Value).
  - Export Detail Tab: Contact person, bank, buyer contact, notify party details, Inco Terms, method of shipment, type of dispatch, place of receipt, ports, place of delivery, pre-carriage, countries, packing instruction, bill-to party and location, bond number and date, declaration amount, LUT number and expiry.
  - Consignee Detail Tab: "Freight Type" and consignee grid ("Consignee Name", "Consignee Location", "Consignee Contact Person", "From Location", "To Location", "Freight Rate Type", "Freight Rate", "Freight Order", "Remarks").
  - Inspection Detail Tab: Grid of "Inspection By" and "Reference Document".
  - Cost Detail Tab: Cost grid ("Cost Head", "Vendor", "Agreement No.", "Quantity", "Unit", "Currency", "Rate", "Amount", base and export currency amounts, "Billing Reference") and "Inco Terms".
  - Terms & Condition Tab: Shared terms-and-conditions control with group and heads; editable.
  - Multi-Level Authorization Tab: Shared authorization control listing levels, approvers and actions.
  - Other Toolbar Actions (Print, Preview, Export, Email): Print and Preview run the "rptSalesAgreement" report for the loaded agreement [fSalesAgreement.vb:28] [fSalesAgreement.vb:950-968]; Export and Email are enabled on the toolbar but their handlers are empty [fSalesAgreement.vb:4018-4024].
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search (Open): Toolbar Open showing the shared search list.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled through the toolbar option list [fSalesAgreement.vb:64].
