form: fExciseInvoice
title: Tax Invoice
module: SD
kind: transaction
summary: The Tax Invoice screen (window caption "Excise Invoice", form code SDEI) raises the outbound sales invoice of a company
  for a customer location.
purpose: |
  What it is: The legal sales invoice of the company: what was sold, to whom, shipped where, at what price and tax, and from which stock. When it applies: When goods or services are billed to a customer, either directly or after a sales order, dispatch challan, dispatch planning/advice or purchase-return document. Business outcome: A single authorized document drives the customer receivable, GST output liability, stock reduction, sales order fulfilment and e-invoice/e-way bill compliance.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A document number control (Document No., Date, Status, prefix, division, copy button) above a tab set: "General Detail", "Dispatch Challan Detail", "Shipment & Other Documents", "Bill Detail", "Tax Detail", "Advance Detail", "Posting Detail", "Advance GST Posting", "GST Posting", "Document Required", "Disposal Posting", "Custom Field", "Expense Posting" [fExciseInvoice.Designer.vb:4051-4094].
  - Document No., Date and Status: Shared document control; Document No.
  - Customer Name and Customer Location Fields: Mandatory dropdowns (customer, then its location with code and GSTIN) (BR-02).
  - Invoice Category Field: Mandatory dropdown, defaulted from the master default (Domestic) (BR-02, BR-07).
  - Source Document, Ref. Doc. No., Ref. Doc. Date and Ref. No. Date Fields: Mandatory "Source Document" dropdown (default Direct on new [fExciseInvoice.vb:1653-1655]), reference document selector and free-text "Ref.
  - Bill To Party / Location and Consignee Name / Location Fields: Mandatory dropdowns for the billed party and the ship-to party with their locations (BR-02).
  - Contact Person Name, Agent Name, Warehouse, All Warehouse Fields: Optional contact, optional agent (double-click label for agent commission information [fExciseInvoice.vb:9716]), warehouse to issue stock from, and "All Warehouse" checkbox when allowed by setting.
  - Preparation Date, Removal Date, TC No., TC Date, Wt Slip No. / Wt Slip Dt or Weighment Slip Fields: Date-time fields (Preparation Date defaults to now [fExciseInvoice.vb:395]) and test certificate / weight slip references; a weighment slip dropdown replaces the free-text weight slip when weighbridge integration is on [fExciseInvoice.vb:549-559].
  - Place Of City, Place Of State, Place Of Supply, Place Of Supply PinCode Fields: Place of supply for GST; "Place Of Supply" text and "Place Of State" are mandatory (BR-10).
  - Supply Type, Reverse Charge and GST Tax Rule Fields: Dropdowns defaulted from master defaults (Regular, No); "GST Tax Rule" is hidden by default and required when Reverse Charge is "Yes" [fExciseInvoice.vb:912-913].
  - Checkboxes: Sales W/O Stock, Update SO, Cash Discount Applicable, Adjust Advance, Don't Print Agent, Create DC Against This Invoice, Exclude from RG1, Use Alternative Unit In Invoice: Option flags shown by configuration and source document.
  - Remarks Field: Optional free text, saved trimmed.
  - Item Details Grid: Main item grid in the General Detail tab with columns including "Select", "Sales Order No.", "Customer Order No.", "Item Code", "Item Description", "Make", "Attribute Combination", "HSN & SAC Code", "Chapter Head", "Quantity", "Unit", "Pcs", "First CF", "Second CF", "Stock Unit", "Rate", "Basic Amount", "Net Amount", "Balance Qty.", "Order Qty.", "Pre.
  - Dispatch Challan Detail Grid: List of pending dispatch challans with "Select", "Dispatch No.", "Dispatch Date", "Challan Type", "Challan Nature", "Dispatch Category", "Sales Order No.", "Consignee Name", "Transporter Name", "Vehicle No." and quantities [fExciseInvoice.vb:8046-8094].
  - Shipment & Other Documents Tab: "Delivery Mode", "Transporter Name", "Vehicle No.", "Vehicle Type", "Driver Name", "Licence No.", "Contact No.", "LR No.", "LR Date", "eWay-Bill No.
  - Bill Detail Tab: "Payment Mode" (mandatory, defaulted), "Payment Days" (mandatory), "Pay Code" (read-only by default), "Commodity Name", "Bank Name" (when bank display is enabled), "Print Description", "Project Milestone", "A.R.E.
  - Tax Detail Tab: Shared tax-on-amount control with document charges (Basic Amount, GST, TCS, freight) and item-wise tax breakdown, plus the tax concession form control.
  - Advance Detail Tab: Advance grid ("Reference No.", "Reference Date", "Document No.", "Document Date", "Due Date", "Advance Amount", "Adjusted Amount", "Balance Amount", "Adjusting Amount") with Manual/automatic allocation option [fExciseInvoice.vb:8596-8664].
  - Posting Detail, GST Posting, Advance GST Posting, Disposal Posting, Expense Posting Tabs: Embedded voucher controls.
  - Document Required Tab: "Document Group" selector and checklist grid ("Document Name", "No.
  - Custom Field Tab: Shared custom field control.
  - Pop-up Panels (Lot, Serial No., Attribute, Asset Tag, Conversion Factor, Description, Additional Detail, Stock Details): Panels opened from item cells for lot selection, serial numbers, attribute values, asset tags, unit conversion, description and stock view.
  - Other Toolbar Actions (Print, Preview, Export, Email): Print and Preview of the daily sales invoice report, repeated for the configured number of copies; Export and Email of the report (BR-51).
actions:
  New: Clears the screen through the main window's new-record routine.
  Save: Validates and saves the invoice with all child data and vouchers in one transaction.
  Search: Opens the common search list of invoices for the current company and year, using the search procedure configured
    for the form [Sales.SDEISearchData:15-24].
  Copy (Repeated Entry): Button in the document control that loads an earlier invoice as a template.
  Delete: Deletes the loaded invoice after confirmation.
  Navigation: First / Previous / Next / Last through the main window toolbar (BR-01).
