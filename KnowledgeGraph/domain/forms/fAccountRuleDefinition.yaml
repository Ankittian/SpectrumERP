method_notes:
  Delete: Deletes the record through Finance.FARDDelete.
  FillValues: Fills the lookup lists through Finance.FARDFillValues.
  FillValuesDateWise: Fills the lookup lists through Finance.FARDFillValuesDateWise.
  FillValuesDependent: Fills the lookup lists through Finance.FARDFillValuesDependent.
  FillValuesIntermediateAccount: Fills the lookup lists through Finance.FARDFillValuesIntermediateAccount.
  FillValuesSaleWise: Fills the lookup lists through Finance.FARDFillValuesSaleWise.
  FillValuesTDCWise: Fills the lookup lists through Finance.FARDFillValuesTDCWise.
  LoadData: Loads the selected record through Finance.FARDLoadData.
  Open: Searches records through Finance.FARDSearchData.
  Save: Saves the record through Finance.FARDSaveMain.
