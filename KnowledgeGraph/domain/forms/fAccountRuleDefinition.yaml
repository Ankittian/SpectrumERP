form: fAccountRuleDefinition
title: Account Rule Definition
module: FI
kind: master
users:
- Finance controller (inferred)
summary: The Account Rule Definition screen tells the system which ledger account to use when a business document is posted
  to finance.
purpose: |
  What it is: A rule record that links one posting account (with an optional effective date) to the business objects whose transactions must post to that account. When it applies: When finance sets up a new ledger account that the system must pick automatically, or when the objects that post to an account change (new items, new tax charges, new supplier locations). Business outcome: Documents post to the right ledger without manual account selection, and double mapping of the same object to two accounts of the same type is blocked (BR-09 to BR-18).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area: A top panel with the account selection, its group and type, and the effective date.
  - Account Name Field: A multi-column dropdown listing account name and code; mandatory (marked as compulsory) (BR-01, BR-02).
  - Account Group Field: Read-only text box showing the account's default group.
  - Account Type Field: Read-only text box showing the account type name.
  - Effective From Field: Date picker in dd/MM/yyyy format.
  - Mapping Tabs Area: A tab control with eight tabs: "Sale", "TDC", "Intermediate Account Type", "Supplier/ Customer", "Item", "Payroll Component", "Finance Book", "Employee".
  - Sale Grid: Columns "Select" and "Description" (read-only).
  - TDC Grid: Columns "Select", "Description", "Account Basis", "Charge Name", "Charge Value", "Tax Category", "Tax Group" (all read-only except "Select").
  - Intermediate Account Type Grid: Columns "Select", "Description", "Basis On" (read-only).
  - Supplier/ Customer Grid: Columns: unlabelled select checkbox, "Name", "Code", "Address", "Type", "GSTIN No", "Registration Type", "CST No", "LST No", "ECC No", "Service Tax No", "TIN No", "TAN No", "PAN No", "TDS Category", "Payee Category".
  - Item Tree Grid: A two-level grid with a filter row.
  - Payroll Component Grid: Columns "Select", "Name", "Code" (read-only).
  - Finance Book Grid: Columns "Select", "Finance Book", "Code" (read-only).
  - Employee Grid: Columns "Select", "Unit", "Code", "Emp Name", "Deparment", "Division", "Category" (read-only).
  - Other Toolbar Actions (Print, Preview, Email, Export): Standard actions with empty handlers.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open, showing the common search list with "Account Type", "Account Name", "Group Name", "Effective
    From", "Created By", "Created Date", "Modified By", "Modified Date".
  Delete: Standard toolbar Delete.
validations:
- Select valid Account Name.
- Duplicate Account Name and Effective Date can't be saved.
- Account is already mapped. Do You want to continue?
- Select atleast one Sale Account Rule
- Select atleast one TDC Account Rule
- Select atleast one Supplier/ Customer Account Rule
- Select atleast one Item
- Capital Item can't be mapped with other item type item.
- Select atleast one Payroll Account Rule
- Select atleast one Employee.
- Select two Finance Books.
- Selected Finance Book combination already exists in another Account.
- Account is not mapped with selected Finance Book COA.
- Select atleast one Intermediate Account Type
- you can select only one Intermediate Account Type
- Account Basis is different from previous selected TDC Rule Account Basis.
- Tax Group is different from previous selected TDC Rule Tax Group.
- 'Duplicate ARD mapping not possible for Items '
manages:
- account-determination-rule
