form: fSubcontractReceipt
title: Service Receipt Note
module: MM
kind: transaction
summary: The Service Receipt Note (SRN) screen records the receipt of services and of materials returned from a subcontractor
  or service provider.
purpose: |
  What it is: A numbered, dated document that confirms what was received from a subcontractor or service vendor against one or more orders, with quantities, rates, vendor bill and challan references. [fSubcontractReceipt.vb:660-852; fSubcontractReceipt.Designer.vb:3108-3109] When it applies: When services have been performed or materials have come back from a vendor against a Service Order (or a Purchase Order, Gate Entry or Inter-Unit Dispatch Challan). [Inventory.SCMRFillValues:19-26] Business outcome: Updates the order balances, brings accepted material into stock and proposes an accrual voucher (stock or expense debited against WIP and suspense accounts; no vendor account line). [Inventory.IGRNAuthorize:719-1108; fSubcontractReceipt.vb:5533-5578; Inventory.SCMRFinancePosting:442-460; Inventory.SCMRFinancePosting:747-760]
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Screen Layout: Tabs "General Details", "Gate Entry Detail" (the reference document grid), "Custom Field", "Excise Posting" and "Online Posting", and below them "Service Detail", "MRA Item Detail" and "Item Detail".
  - Document Number Control: The shared control for number, date, division and status; it validates first (MSG-04).
  - Source Document Field: Mandatory selection (MSG-06) from Purchase Order, Gate Entry, Inter-Unit Dispatch Challan and Subcontract Order.
  - Vendor Name and Vendor Location Fields: Mandatory (MSG-07; MSG-08).
  - Vendor Bill and Challan Fields: "Vendor Bill No." and "Vendor Bill Date"; "Challan No." and challan date; both are marked compulsory on screen.
  - Freight Type, Billing Location, Issue No. and Gatepass No. Fields: Freight Type (editable for source 6), "Billing Location" and "Issue No." (shown for expense-mapped Service Orders; location is mandatory and issue number is mandatory when shown), and "Gatepass No." (shown for source 6, or gate entry whose source is a subcontract gate pass and not expense mapped).
  - Transporter, Driver, Vehicle, Dispatch Challan and Warehouse Fields: Transporter, Driver Name, Vehicle No.
  - Department, Project Code, Remarks, Inspection Required: Department, Project Code, Remarks and the "Inspection Required" tick.
  - E-way Bill, Excise Challan and Excise Posting Fields: E-way bill number and date, Ex.
  - Gate Entry Detail Grid (Reference Documents): The orders, gate entries or challans available for the vendor and source.
  - Service Detail Grid: For each ticked service line: Received Qty., Rate and Amount.
  - Service Requisition Popup: A row-edit popup listing the requisitions behind a service line with their received quantity; OK checks tolerance, that the total equals the line's received quantity and then stores the split.
  - MRA Item Detail Grid: Ticking a material receipt of the order fills its balance as the quantity (not above balance, MSG-60); the matched quantity drives the service received quantity and, if route rates exist, the rate.
  - Item Detail Grid: Material lines with Challan Qty., Received Qty., Accepted Qty., Rejected Qty., FOC Qty., Replaceable Qty., Rate, Amount, Stock Qty., Warehouse and serial numbers.
  - Item Indent Popup and Serial Number Popup: The accepted quantity of a line can be split over the indents or requisitions it serves, by balance first and then tolerance; serial numbers are entered per accepted and rejected unit.
  - Excise Posting Tab: When "Excise Posting" is ticked: vendor type, manufacturer or dealer and location, ECC No., invoice number, date and amount, input type and tax calculation.
  - Online Posting Tab: A finance voucher proposal built from the ticked services and items.
  - Custom Field and Notes: Company-defined custom fields (validated and saved with the receipt) and print notes.
  - Discrepancy Memo and Rejection Note Buttons: Two buttons that print the discrepancy memo and the rejection note of the loaded receipt.
  - Hidden Voucher Re-Post Shortcut: Pressing Ctrl+Alt+V while the Online Posting tab is visible rebuilds the voucher proposal, validates it and, after confirmation, saves a voucher and links it to the receipt, even if the receipt is read-only.
  - Other Toolbar Actions (Print, Preview, Export, E-mail): Standard daily printing of the receipt, preview, export and e-mail.
actions:
  New: Clears the screen for a new receipt.
  Save: 'Validates (BR-01 to BR-24), asks for confirmation and saves in one transaction: the voucher, header, reference documents,
    MRA, service lines, material lines with indent and serial detail, excise posting if ticked, custom fields and notes; then
    runs authorization posting always and, for an Authorized document, the voucher against lot check.'
  Search: Lists receipts of this form code for the company and year.
  Delete: After confirmation deletes the loaded receipt and reverses its effects, with no status check on screen or in the
    procedure (BR-27).
