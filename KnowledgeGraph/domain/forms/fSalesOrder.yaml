form: fSalesOrder
title: Sales Order
module: SD
kind: transaction
summary: 'The Sales Order screen records a customer''s confirmed order for the company: who ordered (customer and location),
  against which source (direct, an authorized quotation, a sales agreement, an opportunity or a transport delivery order),
  which items or turnkey particulars are sold, at what rate, quantity, tolerance and delivery schedule, and under which commercial
  terms (freight, consignees, bill-to '
purpose: |
  What it is: A formal, numbered record of a customer order with its commercial, tax, logistic and delivery terms. When it applies: When a customer confirms a purchase, either directly or after a quotation, under a sales agreement, from an opportunity or from a transport delivery order. Business outcome: A single controlled order that dispatch, invoicing, production and finance rely on, with prices and quantities checked against price settings, agreements and tax rules.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A window titled "Sales Order" with a document number strip on top and tabs "General Information", "Other Information", "Shipment Detail", "Billing Detail", "Tax Detail", "Document Required", "Export Detail", "Inspection Detail", "Cost Detail", "Terms & Condition", "Account Assignment", "Custom Field" and "Multi-Level Authorization".
  - Document Number Strip: Shared document number control with prefix, document no., "Document Date", status and division, plus information and repeated-entry buttons; read-only "Amendment No." and "Amendment Date".
  - Order Type Field: Dropdown "Order Type", mandatory.
  - Source Document Field: Dropdown "Source Document", mandatory.
  - Ref. Doc. No. and Ref. Doc. Date Fields: Dropdown "Ref.
  - Customer Name and Customer Location Fields: Dropdowns "Customer Name" (with search button) and "Customer Location", both mandatory; double-clicking the customer info label shows pending agreements, orders, dispatches and invoices of the customer.
  - Customer Order No. and Customer Order Date Fields: Text "Customer Order No." (may default from settings) and date "Customer Order Date", both mandatory.
  - Sales Category Field: Dropdown "Sales Category", mandatory, with default.
  - Agent, Distributor and Sales Person Name Fields: Dropdown "Agent" (double-click label for agent information), read-only "Distributor" shown for agreement orders, dropdown "Sales Person Name".
  - Validity Date and Booking Time Fields: Date "Validity Date" (defaulted to document date plus configured validity days) and time "Booking Time" (visible only when booking time is maintained).
  - Other General Fields: "Customer Project Code", "Project Code", "Lift", "Sales Classification", "Supply Type", "Vessel Name", "Remarks", checkboxes "Additional Cost" (visible per setting) and currency control (currency, rate type, conversion rate).
  - Item Details Grid: Main grid with "Import" button.
  - Item Popups: Popups opened from item cells: Item Attribute ("Attribute", "Attribute Booking Nature", attribute values, price display "Base Price", "Price Variation", "Min.
  - Shipment Detail Tab: "Freight Type" (mandatory, defaulted) and the consignee grid ("Consignee Name", "Consignee Location", "From Location", "To Location", "Freight Rate Type", "Freight Rate", "Freight Order").
  - Billing Detail Tab: "Bill To Party" and "Location" (mandatory), "Pay Term Code", payment terms grid ("Pay Code", "Payment Type", "Payment Description", "Payment Mode", "Credit Days", "Pay Value", "Remarks"), "Cash Discount" with "Level", "Basis", "Value", "SD Applicable" and "Security Deposit %" (per setting), and excise and export documents "CT1/ CT3 No.
  - Other Information Tab: "Order Nature", "Approved By", "LOI Number", "LOI Date", "Micron Name", "PV Clause", "LD Clause".
  - Export Detail Tab: "Customer's Contact Person", contact no.
  - Inspection Detail, Cost Detail and Document Required Tabs: Inspection grid ("Inspection By", "Reference Document"); cost grid with "Inco Terms" ("Cost Group", "Cost Head", "Quantity", "Unit", "Currency", "Rate", "Amount", "Amount (Base Currency)", "Amount (Export Currency)", "Agreement No.", billing reference popup); "Document Group" with document checklist grid ("Document Name", "No.
  - Tax Detail, Terms & Condition, Custom Field, Account Assignment and Multi-Level Authorization Tabs: Shared controls for item-wise and order taxes, terms and conditions groups, custom fields, account assignment grid and authorization group.
  - Other Toolbar Actions (Print, Preview, Export, Email): Print, Preview and Export of the "rptSalesOrder" daily print report, and Email with the exported report attached (internal mail or Outlook by mail type).
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Open (Search): Toolbar Open showing the search list for the company and year.
  Delete: Toolbar Delete.
  Navigation: First, Previous, Next, Last are enabled on the toolbar.
