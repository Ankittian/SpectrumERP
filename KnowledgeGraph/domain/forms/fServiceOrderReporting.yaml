method_notes:
  Delete: Deletes the record through CustomerService.CSSRDelete.
  FillValues: Fills the lookup lists through CustomerService.CSSRFillValues.
  GetServiceOrderDetail: Runs through CustomerService.CSSRGetServiceOrderDetail.
  LoadData: Loads the selected record through CustomerService.CSSRLoadData.
  Open: Searches records through CustomerService.CSSRSearchData.
  Save: Saves the record through CustomerService.CSSRSave.
  SaveBOMDetail: Saves the record through CustomerService.CSSRSaveBOMDetail.
  SaveCustomerFeedbackDetail: Saves the record through CustomerService.CSSRSaveCustomerFeedback.
  SaveFaultDetail: Saves the record through CustomerService.CSSRSaveFaultDetail.
  SaveIssueDetail: Saves the record through CustomerService.CSSRSaveIssueDetail.
