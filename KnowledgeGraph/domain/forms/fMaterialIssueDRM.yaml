method_notes:
  Delete: Deletes the record through DiscreteRM.DRMIDelete.
  FillValues: Fills the lookup lists through DiscreteRM.DRMIFillValues.
  FillValuesDependent: Fills the lookup lists through DiscreteRM.DRMIFillValuesDependent.
  FillValuesItemWise: Fills the lookup lists through DiscreteRM.DRMIFillValuesItemWise.
  GetItemInfo: Runs through Inventory.DRMIGetItemInfo.
  LoadData: Loads the selected record through DiscreteRM.DRMILoadData.
  Open: Searches records through DiscreteRM.DRMISearchData.
  Save: Saves the record through DiscreteRM.DRMISaveMain, Inventory.VoucherVsLotValidation.
  SaveJobCardDetail: Saves the record through DiscreteRM.DRMISaveJobCardDetail.
  SaveLotDetail: Saves the record through DiscreteRM.DRMISaveLotDetail.
