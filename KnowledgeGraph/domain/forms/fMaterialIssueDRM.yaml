- Authorized entry can't be updated.
- Duplicate Document No. not allowed.
- Document No. <number> saved successfully.
- Duplicate Lot No. not allowed.
- Select valid material Arrangement.
- Select valid warehouse.
- Select valid Item Name .
- Issue Pcs can't be greater than Stock Pcs.
- Issue Qty. can't be greater than Stock Qty.
- Pcs is empty, want to continue?
- Issue Qty. can't be zero or empty in row <n>.
- Production Entry is done against this Entry
- Difference in Voucher and Lot -- <difference> and VoucherAmt -- <amount> and ReceivedAmt -- <amount> and IssuedAmt -- <amount>
- Not found in Lot
- Not found in Voucher 2nd
- Item Information
