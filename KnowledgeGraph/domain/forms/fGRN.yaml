form: fGRN
title: Material Receipt Note (GRN)
module: MM
kind: transaction
users:
- Storekeeper (inferred)
summary: The GRN screen records the physical receipt of material at a company warehouse and turns it into usable stock.
purpose: |
  What it is: The record of goods received from a vendor or another unit, with the quantities accepted into stock and the quantities rejected, free or replaceable. When it applies: When a vehicle or consignment has arrived and stores staff must confirm what was received against the order, gate entry, transfer or challan. Business outcome: Stock is only increased for checked and authorized receipts; purchase orders, indents and transfers are closed against actual receipts; finance gets a valued inward entry for the purchase bill.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: The shared document number control at the top: document number, document date, status (Initial, Release, Authorized), division and prefix.
  - Tab Layout: Tabs General Details, Item Detail, Tax Detail, Custom Field, Excise Detail, RG Posting, Excise Posting, Finance Posting, Multi-Level Authorization.
  - Document Type Field: Dropdown (GRN, MRA); mandatory; default from the list's default value.
  - Source Document Field: Dropdown filtered by Document Type; mandatory (MSG-09).
  - Reference Number Field (PO No. / Gate Entry No. / Stock Transfer No. / Dispatch Challan No. / Sales Order No.): Dropdown whose label changes with Source Document; lists open references for the vendor location.
  - Dispatch Challan No. Field: Dropdown of dispatch challans for inter-unit receipts.
  - Vendor Name Field: Dropdown with a search button (code, name, vendor type); mandatory (MSG-10).
  - Vendor Location Field: Dropdown; mandatory (MSG-11).
  - Consginee Name and Consignee Location Fields: Dropdowns (label text "Consginee Name" as on screen); optional.
  - Warehouse Field: Dropdown filtered by Document Type; optional header default.
  - Receipient Party Field: Dropdown of vendors; label "Receipient Party".
  - Department Field: Dropdown filtered by division.
  - Project Code Field: Dropdown; optional.
  - Vendor Bill No. and Bill Date Fields: Text, 50 characters, and a date with tick box; marked compulsory on screen.
  - Challan No. and Challan Date Fields: Text, 50 characters, and a date; Challan No.
  - Ex. Challan No. and Ex. Challan Date Fields: Text, 50 characters, and a date.
  - Transporter Field: Dropdown of transporters.
  - Driver Name and Vehicle No. Fields: Driver Name is a dropdown allowing typed text (50); Vehicle No.
  - LR No. and Dt Fields: Text (30) and date.
  - eWay-Bill No. and Dt Fields: Text (50) and date.
  - Freight Type Field: Dropdown (TOPAY, FOR, FOR As Actual); marked compulsory on screen.
  - From Location and To Location Fields: Dropdowns of locations.
  - Distance and Vehicle Capacity Fields: Numbers, 2 and 3 decimals (8 and 13 characters).
  - Inspection Required Field: Check box.
  - Excise Posting Field: Check box.
  - Remarks Field: Text, 1000 characters; optional.
  - Currency Control: Shared currency selector with conversion rate.
  - Notes Control: Shared notes button with print area, note text and default flag.
  - Reference Grid (Item Detail tab, top): List of open references for the vendor location with Select column; other columns read-only; includes dates, challan, currency, exchange rate, and for Gate Entry the EWay Bill No.
  - Item Detail Grid: The item lines.
  - CF Details Popup: PO Unit, first factor, Stock Unit, second factor; OK and Cancel.
  - Indent Popup: Grid with Indent No., Indent Date, Indent Make, Stock Unit, Indent Qty., Pre.
  - Reserve Popup: Grid with Particular, Document, PO No., Indent No., Reserve Qty, Balance Qty, Qty and Select.
  - Serial Number Popup: Grid with Item Code, Make, Serial Number (60), Expiry Date; new rows added automatically.
  - FOC Detail Popup: FOC Rate, calculated FOC Amount (read-only), Warehouse filtered by item.
  - Tolerance Popup: Read-only Tolerance Basis, Tolerance(-), Tolerance(+); OK.
  - Attribute Popup: Grid with Attribute, Qty, Rate (read-only).
  - Lot Detail Popup: Grid with Heat No.
  - Return through Dispatch Challan Field: Check box on Item Detail; disabled by default.
  - Rejection Note and Discrepancy Memo Buttons: Buttons that preview the Rejection Note and Discrepancy Memo reports.
  - Tax Detail Tab: Shared tax grid for the GRN (charges, nature, charge on, value, total, account rule, include in basic).
  - Custom Field Tab: Shared custom field control.
  - Excise Detail Tab: Mfd.
  - RG Posting, Excise Posting and Finance Posting Tabs: Shared posting previews: excise register summary, excise journal and online finance journal.
  - Multi-Level Authorization Tab: Shared approval grid with levels, approvers and actions.
  - Other Toolbar Actions (Print, Preview, Export, Email): GRN report print, preview, export, and email through the mail dialog or Outlook with the report attached.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Open (Search): Toolbar Open showing the search list.
  Delete: Toolbar Delete.
  Navigation: First, Previous, Next, Last.
  Hidden Keyboard: Ctrl+Alt+V re-posts the finance voucher of the loaded GRN; Ctrl+Alt+G walks through all records and copies
    a database update script to the clipboard.
