form: fMaintenanceOrderClosing
title: Maintenance Order Closing
module: PM
kind: transaction
summary: The Maintenance Order Closing screen is where a maintenance order is finished.
purpose: |
  What it is: A closing document that records the final outcome of one maintenance order: closing status, actual start and end, duration, delay and reason, remarks, and the actual task, resource, shutdown, fault and check point results [fMaintenanceOrderClosing.vb:2320-2447; EAM.EAOCSave:97-148]. When it applies: When the work on a maintenance order is completed, cancelled, short-closed, held or still in progress and the planner needs to close out the facts (BR-02; BR-03). Business outcome: The order's tasks and the order itself take their final status, and actual times, delays, root causes and resource usage are on record (BR-27).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: The window is titled "MaintenanceOrderClosing".
  - Document Control (Division, Prefix, Number, Date, Status): The shared document control with Division, document number, document date and document status [fMaintenanceOrderClosing.vb:2337-2351; fMaintenanceOrderClosing.vb:248].
  - Maintenance Order Field: A mandatory drop-down listing Maintenance Order No, Maintenance Order Date, Reference Object and Maintenance Type [fMaintenanceOrderClosing.vb:249; fMaintenanceOrderClosing.Designer.vb:656] (BR-04).
  - Status Field: A mandatory drop-down of the closing statuses [fMaintenanceOrderClosing.vb:251; fMaintenanceOrderClosing.Designer.vb:751].
  - Reason Field: A text box, up to 300 characters, read-only unless the Status is 4, 3 or 7 [fMaintenanceOrderClosing.Designer.vb:987-989; fMaintenanceOrderClosing.vb:3765-3772].
  - Start Time and End Time Fields: Two date-time pickers in the format dd/MM/yyyy hh:mm tt, defaulting to the current time [fMaintenanceOrderClosing.Designer.vb:793-818; fMaintenanceOrderClosing.vb:480-481].
  - Duration, Delay Duration and Delay Reson Fields: Duration is a mandatory number in hours.minutes; Delay Duration is a read-only number of up to 10 characters; Delay Reson is a drop-down labelled "Delay &Reson" [fMaintenanceOrderClosing.vb:76; fMaintenanceOrderClosing.Designer.vb:890-892; fMaintenanceOrderClosing.Designer.vb:924; fMaintenanceOrderClosing.vb:212-215].
  - Remarks Field: An optional text box, up to 1000 characters [fMaintenanceOrderClosing.Designer.vb:997].
  - Fault Detail Grid: Columns Select, Fault (or Description), RCA.
  - ShutDown Detail Grid: Grouped columns Equipment Down Time (Equipment Start Date, Equipment End date, Equipment Duration) and Production Down Time (Production Start Date, Production End Date, Production Duration); new rows are added automatically; durations are read-only [fMaintenanceOrderClosing.vb:2045-2100; fMaintenanceOrderClosing.vb:2908-2955].
  - Task Detail Grid: Columns include Task Id, Task Description, Parent Task, Assign To, Start Time, Progress Entry, End Time, Total Duration, Estimated Start Time, Estimated End Time, Estimated Duration, Progress (%), Status, Reason, Delay Duration and Delay Reason [fMaintenanceOrderClosing.vb:2119-2181].
  - Progress Entry Pop-up for Tasks: A row edit template with Entry Date, Start Time, End Time, Duration, Shift and Progress (%); OK and Cancel buttons [fMaintenanceOrderClosing.vb:3127-3160; fMaintenanceOrderClosing.vb:3245-3290; fMaintenanceOrderClosing.vb:3440-3470].
  - Resource Detail Grid: Columns Task Id, Task Description, Resource Name, Quantity, Start Time, Progress Entry, End Time, Usage Duration, Rate Type, Rate and Amount.
  - Progress Entry Pop-up for Resources: A row edit template with Entry Date, Start Time, End Time, Usage Duration, Shift, Quantity, Rate Type, Rate and Amount [fMaintenanceOrderClosing.vb:3290-3340; fMaintenanceOrderClosing.vb:3477-3615].
  - Check Points Grid: Columns S.No., Check Points (read-only), Inspection Date and Status [fMaintenanceOrderClosing.vb:3820-3836].
  - Permit, Item and Service Grids: Read-only grids.
  - Multi Level Authorization Tab: The shared authorization control showing authorization levels and actions [fMaintenanceOrderClosing.vb:3891-3908].
  - Other Toolbar Actions (Print, Preview, Export, Email): Print Preview and Print are on the toolbar, but the screen's Print, Preview, Export and Email handlers are empty [fMaintenanceOrderClosing.vb:431-463].
actions:
  New: Asks the main window for a new record [fMaintenanceOrderClosing.vb:393-401].
  Save: Validates the closing, asks for confirmation (MSG-40), then saves the header, faults, shutdowns, check points, tasks
    and resources in one transaction [fMaintenanceOrderClosing.vb:2320-2447].
  Search: Opens the search list of closings and loads the chosen one [fMaintenanceOrderClosing.vb:403-425].
  Delete: Asks for confirmation (MSG-42), deletes the closing and its details and reopens a blank screen [fMaintenanceOrderClosing.vb:85-117].
  Navigation: First, Previous, Next and Last are offered on the toolbar [fMaintenanceOrderClosing.vb:72].
