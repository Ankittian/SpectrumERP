method_notes:
  Delete: Deletes the record through masterdata.MMMMDelete.
  FillValues: Fills the lookup lists through masterdata.MMMMFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.MMMMFillValuesDependent.
  ItemSubstituteMaterialDetail: Saves the record through masterdata.MMMMSaveItemSubstituteMaterialDetail.
  LoadItemDetail: Loads the selected record through masterdata.MMMMFillValues, masterdata.MMMMLoadData.
  LoadMaterialRequestDetail: Loads the selected record through masterdata.MMRQLoadData.
  Open: Searches records through masterdata.MMMMSearchData.
  SaveBinDetail: Saves the record through masterdata.MMMMSaveBinDetail.
  SaveCompanyDetail: Saves the record through masterdata.MMMMDeleteCompanyInactiveDetail, masterdata.MMMMSaveCompanyInactiveDetail.
  SaveItemMakeDetail: Saves the record through masterdata.MMMMSaveItemMakeDetail.
