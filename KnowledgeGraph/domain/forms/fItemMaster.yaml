form: fItemMaster
title: Item Master
module: MM
kind: master
users:
- Material master administrator (inferred)
summary: 'The Item Master screen creates and maintains the enterprise material (item) master: every raw material, consumable,
  finished good, service, spare and other stocked or non-stocked item used across purchasing, inventory, production and sales.'
purpose: |
  What it is: A single, centrally governed definition of each item: classification, codes, description, units, tax details, stock-control flags and default mappings. When it applies: When the business starts buying, stocking, producing or selling a new material, when a Material Master Request is approved for creation, or when an existing item's attributes must be corrected. Business outcome: Prevents duplicate items (by Full Code and by Item Description), keeps item behaviour consistent in every company, and supplies the defaults that transactions use (units, conversion factors, warehouses, tolerances, tax codes, accounting rules).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area: A strip at the top with the Item Code link, the Full Code box, the copy and request buttons, the Item Description and the Inactive checkbox.
  - Item Code Link and Full Code Field: A hyperlink labelled "Item Code" with tooltip "Switch to fast entry mode.", next to a read-only Full Code box (display limit 9 characters) with an editor button.
  - Copy from Item Master Button: A small button with tooltip "Copy from Item Master." When it applies: Enabled on a new record; disabled after an existing item is loaded.
  - Load from Material Master Request Button: A small button with tooltip "Load from Material Master Request." When it applies: Enabled on a new record; disabled after an existing item is loaded.
  - Item Description Field: Read-only text, up to 800 characters on screen.
  - Inactive Checkbox: Checkbox "Inactive".
  - Tab Area: Tabs "Item Details", "Other Information", "UOM", "Quality Parameter Details" (hidden), "Make Mapping", "Warehouse Mapping", "Vendor Detail", "Substitute Material", "Supplementary Field", "Production Detail", "Bin Detail" and "Company".
  - Material Type Field: Mandatory dropdown "Material Type".
  - Category Name Field: Mandatory dropdown "Category Name" with a read-only code box (2 characters).
  - Group Name Field: Mandatory dropdown "Group Name" with a read-only code box (2 characters).
  - Subgroup Name Field: Mandatory dropdown "Subgroup Name" with a read-only code box (2 characters).
  - Full Code (Item Code) Field: Mandatory text labelled "Full Code" on the Item Details tab, holding the four-character Item Code.
  - Item Name Field: Mandatory text "Item Name", up to 200 characters.
  - Grade Field: Optional text "Grade" (up to 100 characters) or, when the company uses a grade list, a dropdown of Grades in the same place.
  - Size Field: Optional text "Size", up to 100 characters.
  - Unit Field: Mandatory dropdown "Unit" (the stock unit).
  - Item Nature Field: Mandatory dropdown "Item Nature".
  - Stock Manage In Field: Hidden dropdown "Stock Manage In" with two modules.
  - GST Category Field: Dropdown "GST Category".
  - HSN /SAC Code Field: Dropdown "HSN /SAC Code" with a search button, plus read-only "CGST Rate", "SGST Rate", "IGST Rate", "UTGST Rate".
  - Remarks Field: Optional text "Remarks", up to 4000 characters, trimmed on save.
  - Stock Valuation and Item Flags (Other Information Tab): Read-only "Stock Val.
  - Measurement, Unit Weight and Their Units: Dropdown "Measurement" (1-D, 2-D, 3-D) with a measurement unit dropdown; numeric "Unit Weight" (3 decimals) with a weight unit dropdown; dropdown "Chapter Heading".
  - Stock Level and Tolerance Fields: Numeric "Standard Rate", "Maximum Quantity", "Minimum Quantity", "Reorder Point", "Reorder Quantity" (2 decimals), "Lead Time" (whole days, up to 3 digits), "Receipt Tolerance" and "Shipment Tolerance" (percent, 2 decimals), checkboxes "Critical Material" and "Multi Rate in GRN".
  - Coil Fields: Checkboxes "Is Coil" and "Is Manage Pcs Wise Stock"; numeric "Default Width" and "Default Thickness" (3 decimals).
  - UOM Conversion Factor Grid: Grid with columns Unit Type, Conversion Type (Fixed or Variant), Unit Value, Base Unit, Conversion Value, Unit; one row per unit type (stock, purchase, sales, production).
  - Allow Multiple Conversion Factor Checkbox: Checkbox "Allow Multiple Conversion Factor".
  - Production Stock UOM Conversion Formula Field: Dropdown "Production Stock UOM Conversion Formula".
  - Secondary Unit Fields: Dropdown "Secondary Unit" and group "Secondary Unit Conversion Factor" (stock unit = secondary quantity, 3 decimals).
  - Manage Another Stock Unit Block: Checkbox "Manage another Stock Unit" with "Conversion Type", "Second Unit" and "Conversion Factor" boxes.
  - Quality Parameter Details Tab: Checkbox "QC Applicable" and an embedded QC parameter grid (shared component).
  - Make Mapping Grid: Grid with Make Name (dropdown) and Code (read-only, filled from the make).
  - Warehouse Mapping Grid: Grid with a select checkbox (header checkbox selects all), Warehouse, Division, Company (read-only).
  - Vendor Detail Grid: Grid with Vendor Name (dropdown), Location (dropdown filtered by vendor), Vendor Type (read-only), Part Number.
  - Substitute Material Grid: Grid with Material Code and Material Description (dropdowns kept in step), Make (filtered by the chosen material), Unit (read-only).
  - Supplementary Field Grid: Dropdown "Supplementary Field Group" and a grid with Supplementary Field, Code (read-only), Value Type (Fixed or Variable), Supplementary Field Value.
  - Production Detail Fields: "Manufacturing Lead Time" (whole number, up to 3 digits), "Production Strategy", "Planning Strategy" dropdowns, checkboxes "Check ATP", "Maintain Batch Number", "Maintain Serial Number".
  - Bin Detail Grid: Grid with a select checkbox, Bin Card No., Location, Warehouse (read-only).
  - Company Grid: Grid with Inactive (checkbox, header checkbox for all), Company Name and Alias (read-only).
  - Fast Entry Grid Container: A full-screen grid with columns Material Type, Category Name, Group Name, Sub Group Name, Code, Name, Size, Grade, Unit, Item Nature, Is Serial No, BIN Applicable, Chapter Heading, Measurement ID, Measurement Unit, Unit Weight, Unit Weight Unit, GST Category, HSN/SAC Code, Standard Item, Is Coil, Default Width, Default Thickness, Rate Bifurcation in Sales, Secondary Unit, Secondary Unit 1st CF, Se
  - Other Toolbar Actions (Print, Preview, Export, Email, Navigation): Standard toolbar actions.
actions:
  Switch Back to Detail Mode: Link "Switch back to detail mode." in the Fast Entry container.
  Import: Button "Import" in the Fast Entry container; imports an Excel sheet named with the screen tag "MMMM".
  New: Toolbar New.
  Save: Toolbar Save.
  Search: Toolbar Open/Search.
  Delete: Toolbar Delete.
