  FillValues: Fills the lookup lists through Inventory.MGPIFillValues.
  FillValuesDependent: Fills the lookup lists through Inventory.MGPIFillValuesDependent.
  FillValuesDependentGrid: Fills the lookup lists through Inventory.MGPIFillValuesDependent.
  FillValuesVendorLocation: Fills the lookup lists through GlobalData.VendorLocationSelect.
  LoadData: Loads the selected record through Inventory.MGPILoadData.
  Open: Searches records through Inventory.MGPISearchData.
  Save: Saves the record through Inventory.MGPIAuthorize, Inventory.MGPISave.
  SaveContractorMaterial: Saves the record through Inventory.MGPISaveContractorMaterialDetail.
