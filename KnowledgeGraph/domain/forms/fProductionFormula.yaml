  Delete: Deletes the record through masterdata.MEPFDelete.
  FillValues: Fills the lookup lists through masterdata.MEPFFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.MEPFFillValuesDependent.
  LoadData: Loads the selected record through masterdata.MEPFLoadData.
  Open: Searches records through masterdata.MEPFSearchData.
  Save: Saves the record through masterdata.MEPFSave.
  SaveConsumptionDetail: Saves the record through masterdata.MEPFSaveConsumptionDetail.
  SaveExpenseDetail: Saves the record through masterdata.MEPFSaveExpenseDetail.
  SaveProductionDetail: Saves the record through masterdata.MEPFSaveProductionDetail.
  ValidateForm: Validates the entry through masterdata.MEPFValidate.
