form: fPaymentPlan
title: Payment Plan
module: FI
kind: transaction
users:
- Finance controller (inferred)
summary: The Payment Plan screen lets Finance decide, for a given due date, which outstanding payables will be paid, how much
  of each, and by which payment mode.
purpose: |
  What it is: A planned, approvable batch of payments to be made on or by a due date, with passing amounts, payment modes and instrument details. When it applies: During periodic payment runs when Finance selects which due items to release for payment. Business outcome: Payments are controlled through a single approved plan; open references cannot be over-paid and amounts already planned are reserved.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Shared document numbering control with document number, date, finance book, division, prefix and status.
  - &General Detail Tab: Main tab with the filter bar, Reference Detail grid and account grid.
  - Due Date Field: Date picker (dd/MM/yyyy).
  - Source Document Field: Dropdown, optional; list of active payment plan source documents (BR-04).
  - Payee Type Field: Dropdown, optional; all payee types except Company.
  - Payee Name Field: Dropdown, optional; payees of the chosen type (employees for Employee, parties, accounts).
  - Sho&w Button: Button that loads due items.
  - Reference Detail Grid: Grid of due items with fixed columns tick, Unit Name, Finance Book, Payee Type, Payee Name, then MSME No., Payee Location, Account Group, Current Balance, HO Current Balance, Source Document, Reference No., Reference Date, Document Date, Hold, Hold Reason (button), Due Date, Pending Days, Reference Amount, Currency (button), Balance Amount (button), Passing Amount, Payment Mode (button) and Cost C
  - Hold Reason Pop-up: Read-only text pop-up with &Ok.
  - Balance Amount Pop-up: Grid of Particular and Amount with &Ok.
  - Currency Pop-up: Shared currency and rate control.
  - Payment Mode Pop-up: Grid of Payment Mode and Passing Amount with &Ok and &Cancel.
  - Account Detail Grid: Grid with Unit Name, Finance Book, Account Name, Current Balance, HO Current Balance, Currency (button), Passing Amount, Ref.
  - &Cheque Detail Tab: Grid of cheque lines per payee and currency with Payee Type, Payee Name, Currency, Amount (button) and In favour of (up to 100 characters).
  - &DD Detail Tab: Grid of DD lines with Payable At (up to 50) and In favour of (up to 100).
  - &RTGS/ NEFT Tab: Grid of RTGS and NEFT lines with Bank Name, Bank Branch Code, IFSC Code (read-only, from branch), Bank Account No.
  - RT&GS/ NEFT Through Cheque Tab: Same layout as RTGS/NEFT.
  - Cas&h Tab: Grid of cash lines with Payee Type, Payee Name, Currency and Amount.
  - Payment Reference Detail Pop-up: Read-only grid of the items behind an instrument line, with &Ok.
  - Other Toolbar Actions (Print, Preview, Export, Email): Standard toolbar actions.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with the standard search window.
  Delete: Standard toolbar Delete.
