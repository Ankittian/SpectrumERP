method_notes:
  Delete: Deletes the record through DiscreteRM.DRSTDelete.
  FillValues: Fills the lookup lists through DiscreteRM.DRSTFillValues.
  FillValuesDependent: Fills the lookup lists through DiscreteRM.DRSTFillValuesDependent.
  FillValuesWarehouse: Fills the lookup lists through DiscreteRM.DRSTFillValuesWarehouse.
  LoadData: Loads the selected record through DiscreteRM.DRSTLoadData.
  Open: Searches records through DiscreteRM.DRSTSearchData.
  Save: Saves the record through DiscreteRM.DRSTAuthorize, DiscreteRM.DRSTSave, Inventory.VoucherVsLotValidation.
  SaveCustomFieldDetail: Saves the record through DiscreteRM.DRSTSaveStockTransferCustomFieldDetail.
  SaveIssueDetail: Saves the record through DiscreteRM.DRSTSaveStockTransferIssueDetail.
  SaveNotesDetail: Saves the record through DiscreteRM.DRSTSaveStockTransferNotesDetail.
