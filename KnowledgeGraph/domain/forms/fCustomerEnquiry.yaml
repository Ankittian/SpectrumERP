form: fCustomerEnquiry
title: Customer Enquiry
module: SD
kind: transaction
summary: The Customer Enquiry screen records a customer's request for quotation as a numbered sales document of the current
  company and financial year.
purpose: |
  What it is: A formal record of a customer's request for prices and terms, numbered and dated as a sales document and listing the materials, quantities and dates requested. When it applies: Whenever a customer sends an RFQ, tender or informal request by e-mail, phone, tender or a marketing contact (the "Enquiry Through" list). Business outcome: Each enquiry can be quoted, followed up, rejected or closed. Sales management can see pending enquiries per customer, item, agent and sales person, and how many turn into quotations and orders.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Control Strip: The shared document-number control at the top: Document No.
  - Header Tabs (General, Export Detail, Lift Detail, Custom Field): The upper tab set.
  - Customer Name Field: Mandatory dropdown of active, authorized customers of the company (BR-05, BR-09).
  - Location Field: Mandatory dropdown of the selected customer's locations (BR-05).
  - Contact Person and Contact No. Fields: Optional dropdown of the location's contacts, and a read-only "Contact No." showing mobile and phone (BR-10, BR-29).
  - Customer RFQ No. Field: Mandatory entry of up to 50 characters [Sales.SDCESave:17] (BR-05).
  - Customer RFQ Date Field: Date, marked as a mandatory field.
  - Enquiry Type, Material Nature and Enquiry Priority Fields: Mandatory dropdowns (BR-05).
  - Enquiry Through and Sales Category Fields: Mandatory dropdowns: the channel (Email, Phone, Tender, Marketing) and the sales category (BR-05).
  - Sales Person Name and Agent Name Fields: Optional dropdowns of the company's sales persons and agents (BR-29).
  - Quotation Submission Date and Expected Order Date Fields: Date fields.
  - Shipping Location Field: Optional dropdown of the company's own active locations (BR-29).
  - Enquiry Status, Reason For Loosing and Reason For Rejection Fields: Read-only text boxes on the right of the General tab [fCustomerEnquiry.Designer.vb:371-414].
  - Remarks Field and Notes Control: Optional Remarks (up to 1000 characters) [fCustomerEnquiry.Designer.vb:634].
  - Information Icons: Icons for customer, sales person and agent, and an information column in the item grid.
  - Export Detail Tab Fields: "Inco Terms", "Port Of Discharge", "Place Of Delivery" (dropdowns), "Packing Instruction" (text, up to 100 characters) and "QC Required" (checkbox) [fCustomerEnquiry.Designer.vb:685-761].
  - Lift Detail Tab: A "Lift Search" button and a lift grid with columns Select, "Card No.", Address, Manager, Sales Executive, Line Man, Supervisor, Technician, Zone and Route.
  - Custom Field Tab: The shared custom-field grid for form code "SDCE" [fCustomerEnquiry.vb:119].
  - Item Details Grid: Lower tab "&Item Details".
  - Tech. Description Pop-up: A multi-line text editor (up to 1000 characters) with Ok and Cancel buttons [fCustomerEnquiry.Designer.vb:905-918].
  - Specification Pop-up: A quality-parameter grid (Code, Quality Parameter, QP Type, Unit, Value, Lower Limit, Upper Limit) with Ok and Cancel [fCustomerEnquiry.vb:1840-1883].
  - Particular Details Grid: Lower tab "&Particular Details".
  - Other Toolbar Actions (Print, Preview, Export, Email): Implemented as empty procedures [fCustomerEnquiry.vb:337-352] [fCustomerEnquiry.vb:1499-1505].
actions:
  New: The standard toolbar New, handled by the main window [fCustomerEnquiry.vb:299-306].
  Save: Validates and saves the enquiry and all its details as one unit [fCustomerEnquiry.vb:948-1087].
  Search: Opens the standard search window with the company's enquiries for the current financial year [fCustomerEnquiry.vb:308-335].
  Delete: Deletes the loaded enquiry after confirmation [fCustomerEnquiry.vb:32-59].
