method_notes:
  Delete: Deletes the record through DiscreteRM.DRSNDelete.
  FillValues: Fills the lookup lists through DiscreteRM.DRSNFillValues.
  FillValuesDependent: Fills the lookup lists through DiscreteRM.DRSNFillValuesDependent.
  FillValuesOrderDetail: Fills the lookup lists through GateEntry.DRGEFillValuesDependent.
  FillValuesVendorLocation: Fills the lookup lists through GlobalData.VendorLocationSelect.
  LoadData: Loads the selected record through DiscreteRM.DRSNLoadData.
  Open: Searches records through DiscreteRM.DRSNSearchData.
  Save: Saves the record through DiscreteRM.DRSNAuthorize, DiscreteRM.DRSNSaveMain, Inventory.VoucherVsLotValidation.
  SaveItemDetails: Saves the record through DiscreteRM.DRSNSaveGateEntryItemDetail.
  SaveLotDetails: Saves the record through DiscreteRM.DRSNSaveLotDetail.
