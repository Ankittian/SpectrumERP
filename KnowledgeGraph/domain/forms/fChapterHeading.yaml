form: fChapterHeading
title: Chapter Heading
module: MM
kind: master
users:
- Material master administrator (inferred)
- Tax administrator (inferred)
summary: The Chapter Heading screen maintains chapter headings, the tariff chapter numbers under which items are classified
  for excise and customs purposes (Inferred from the term), and the items that belong to each heading.
purpose: |
  What it is: The list of tariff chapter headings and their item assignments. When it applies: When a new heading is needed or items are reclassified. Business outcome: Items carry the correct statutory classification (Inferred).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Header panel with chapter fields and the item tree below.
  - Chapter Field: Mandatory text box, up to 25 characters; its label is a link (tooltip "Switch to fast entry mode.") (BR-01, BR-02).
  - Description Field: Optional text box, up to 200 characters.
  - Inactive Field: Checkbox.
  - Item Group Tree: Embedded group, subgroup and item tree with Select, Item Code and Item Name at item level.
  - Fast Entry Grid Container: Grid with Chapter, Description and read-only Remarks, and an Import button; it covers the whole screen when opened.
  - Other Toolbar Actions (Print, Preview, Export, Email): Not enabled.
actions:
  Switch back to detail mode.: Link at the top of the fast entry panel, placed partly off the left edge.
  Import: Import button; asks MSG-08, then loads the chosen Excel sheet into the fast entry grid.
  New: Standard toolbar New.
  Save: Saves the heading (default mode) or every fast entry row.
  Search: Standard search with Chapter Heading No., Description, Inactive, Created By, Created Date, ordered by heading.
  Delete: Deletes the loaded heading after confirmation (MSG-10).
  Navigation: First, Previous, Next, Last through the standard toolbar.
validations:
- Enter Chapter.
- Duplicate Chapter Heading No not allowed.
- Refer remarks for saved status.
- Successfully Created.
- 'Your excel should consists of sheet with name '
- . Do you want to continue?
manages:
- chapter-heading
uses_concepts:
- company
- material-item
method_notes:
  Delete: Deletes the record through masterdata.MMCHDelete.
  ItemDetailSave: Saves the record through masterdata.MMCHItemDetailSave.
  LoadData: Loads the selected record through masterdata.MMCHLoadData.
  Open: Searches records through masterdata.MMCHSearchData.
  SaveMain: Saves the record through masterdata.MMCHSave.
  ValidateForm: Validates the entry through masterdata.MMCHValidation.
