usercontrol: TaxOnAmount
title: Tax on amount control
module: FI
kind: component
users:
- Users of the host screens (inferred)
summary: Embedded tax group calculation on an amount.
purpose: |
  Applies a tax group to an amount and shows the total tax and net amount; it has no stored procedure of its own.
functional_description: |
  Embedded in: GSTVoucherDetail, fGRN, fPaymentRequest, fPurchaseBill, fPurchaseOrder, fQuotation.
  On-screen fields: Net Amount, Tax Group, Total Tax.
uses_concepts:
- tdc-group
