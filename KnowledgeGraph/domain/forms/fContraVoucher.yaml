form: fContraVoucher
title: Contra Voucher
module: FI
kind: transaction
summary: The Contra Voucher screen records a transfer between two cash or bank accounts of the same company, such as depositing
  cash into a bank or moving money between bank accounts.
purpose: |
  What it is: Records the transfer of funds between two cash or bank accounts. When it applies: A user needs this when cash is deposited or withdrawn, or funds move from one bank account to another. Business outcome: Both cash and bank ledgers change together in one balanced, approved document.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Strip: Document number, document date, finance book, status and prefix, with a repeat entry button when the voucher copy setting is on ([fContraVoucher.vb:38; Voucher.cs:154-161]).
  - Voucher Type Field: "Voucher T&ype" list with Regular and Inter FB ([Voucher.Designer.cs:226]).
  - Voucher Grid: Columns Type, Account Name, Current Balance, Balance Amount, Debit Amount, Credit Amount, Ref.
  - Ref. Detail, Cost Center, Qty. Detail and TDC Rule Pop-ups: Pop-up editors opened from the grid cells.
  - Payment Detail Grid: Columns Payment Mode, Issued To, Cheque/DD/UTR No., Date, Amount, In Favour Of, Party Bank Name, Branch Name.
  - Narration Field: "&Narration" text area.
  - Total Debit and Total Credit: Running totals of the grid.
actions:
  Toolbar: New, Save, Open, Delete, Navigation, Print, Print Preview, Export, Email ([fContraVoucher.vb:23-33]).
