method_notes:
  Delete: Deletes the record through FixedAsset.AMAODelete.
  DeleteAsset: Deletes the record through FixedAsset.AssetDelete.
  DeleteAssetTag: Deletes the record through FixedAsset.AssetTagDelete.
  FillValues: Fills the lookup lists through FixedAsset.AMAOFillValues.
  FillValuesDB: Fills the lookup lists through FixedAsset.AMAOFillValuesDB.
  FillValuesFB: Fills the lookup lists through FixedAsset.AMAOFillValuesFB.
  LoadData: Loads the selected record through FixedAsset.AMAOLoadData.
  Open: Searches records through FixedAsset.AMAOSearchData.
  Save: Saves the record through FixedAsset.AMAOSaveMain.
  SaveAssetMain: Saves the record through FixedAsset.AssetSaveMain.
