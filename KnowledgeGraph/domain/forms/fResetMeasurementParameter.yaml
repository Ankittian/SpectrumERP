  FillValues: Fills the lookup lists through EAM.EARPFillValues.
  FillValuesDependent: Fills the lookup lists through EAM.EARPFillValuesDependent.
  LoadData: Loads the selected record through EAM.EARPLoadData.
  Open: Searches records through EAM.EARPSearchData.
  Save: Saves the record through EAM.EARPSave.
  SaveMeasurementDetails: Saves the record through EAM.EARPSaveParaDetail.
  ValidateForm: Validates the entry through EAM.EARPValidate.
