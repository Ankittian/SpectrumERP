form: fPurchaseBill
title: Purchase Bill
module: FI
kind: transaction
users:
- Accounts officer (inferred)
summary: The Purchase Bill screen (also called Purchase Invoice) records a supplier's invoice and passes it for payment.
purpose: |
  What it is: A purchase bill is the company's record of a supplier invoice, matched where applicable to the goods receipts it pays for, and the source of the supplier liability in the books. When it applies: When a supplier invoice arrives (often first logged as a document receipt) and the accounts team must pass it against receipts or enter it directly. Business outcome: Each receipt line is billed once, the payable is posted with correct GST and price differences, and payment due dates are scheduled from agreed terms.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Header: Shared document number band at the top with Document No., Document Date, division, finance book and Status.
  - Tab Layout: Tabs: General Detail, Tax Detail, Shipping Detail, Advance Detail, Payment Schedule, Custom Field, RG Posting, Posting Detail, GST Posting.
  - Source Document Field: Dropdown, mandatory: Direct or Material Receipt Note (default from setup) (BR-04).
  - Vendor Name Field: Dropdown, mandatory, listing active vendors (BR-05).
  - Location Field: Dropdown, mandatory, vendor locations (BR-05, BR-06).
  - Pay To Field: Dropdown, mandatory, defaulted to the vendor (BR-07).
  - Vendor Bill No. Field: Dropdown of open document receipts (Bill No, Bill Date), mandatory (BR-08).
  - Vendor Bill Date Field: Date (dd/MM/yyy), read-only unless document receipt is not compulsory (BR-09).
  - Amount Field: Numeric, 2 decimals, max 12 characters, the vendor bill amount; read-only unless document receipt is not compulsory (BR-08, BR-10).
  - Advance Field: Read-only total of adjusting amounts plus imprest amount.
  - Payment Mode Field: Dropdown, mandatory, active payment modes; defaults from the PO on receipt-based new bills (BR-11).
  - Service Tax Rule Field: Dropdown of non-GST tax rules effective on the document date.
  - GST Tax Rule Field: Dropdown of active GST rules (BR-44).
  - GST Exempted Checkbox: Checkbox, optional (BR-46).
  - Adjust Advance Checkbox: Checkbox; default from company setting (ticked unless advance adjustment is optional) (BR-51).
  - Update Stock and Dropshipment Checkboxes: Checkboxes (BR-36).
  - Qty Based On Option: Option "Accepted Qty." / "Challan Qty."; default Accepted Qty.
  - Unit Type Option: Option "Store Unit" / "Purchase Unit"; default Purchase Unit (BR-32).
  - Narration Field: Multi-line text, optional, no length limit on screen.
  - Net Amount Field: Read-only, total from the tax control.
  - Notes Control: Small notes button with print area and default notes.
  - Receipt Grid (GRN Detail): Grid on General Detail with a select checkbox, Document No., Document Date, Challan No., Excise Invoice No.
  - Item Grid: Grid below the tabs.
  - Serial No. Pop-up: Row editor with Serial No.
  - Tax Detail Tab: Shared tax-on-amount control (item-level tax rows via the Tax button and bill-level charges) and tax concession form grid.
  - Shipping Detail Tab: Shipped From Party, Shipped From Location, Shipped To Party, Shipped To Location (dropdowns, mandatory), Invoice No.
  - Advance Detail Tab: Option Manual/Automatic, Imprest Account dropdown, Imprest Amount (2 decimals, 15 characters), Balance Amount with Cr/Dr, and advance grid: Document No., Document Date, Reference No., Reference Date, Due Date, Ref Type, Advance Amount, Adjusted Amount, Balance Amount, Adjusting Amount (editable), Account Name, with sums.
  - Payment Schedule Tab: Read-only grid: Reference No., Reference Date, Payment Type, Due Date, Due Amount, Actual Amount, Discount, plus the shared currency control (BR-48 to BR-50).
  - Custom Field Tab: Shared custom field grid for this screen.
  - Posting Detail, GST Posting and RG Posting Tabs: Shared finance posting control (proposed journal), GST voucher detail, and excise RG register.
  - Other Toolbar Actions (Print, Preview, Export, Email): Print and Preview of the purchase invoice report; Export and Email of the same report are implemented.
  - Hidden Maintenance Shortcuts: Keyboard combinations Ctrl+Alt+G (on GST Posting tab: rebuild GST posting; on Posting Detail: loop through records and copy narration update script to clipboard) and Ctrl+Alt+V (rebuild the voucher of an authorized bill).
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Open (Search): Standard toolbar Open with the shared search list.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last.
