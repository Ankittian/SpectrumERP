method_notes:
  Delete: Deletes the record through EAM.EAEMDelete.
  FillValues: Fills the lookup lists through EAM.EAEMFillValues.
  FillValuesDependent: Fills the lookup lists through EAM.EAEMFillValuesDependent.
  GetRefDetail: Runs through EAM.EAEMGetRefDetail.
  LoadData: Loads the selected record through EAM.EAEMLoadData.
  Open: Searches records through EAM.EAEMSearchData.
  SaveBOMDetail: Saves the record through EAM.EAEMSaveBOMDetail.
  SaveCertificateDetail: Saves the record through EAM.EAEMSaveCertificateDetail.
  SaveLotDetail: Saves the record through EAM.EAEMSaveLotDetail.
  SaveMain: Saves the record through EAM.EAEMSave.
