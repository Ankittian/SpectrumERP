method_notes:
  Delete: Deletes the record through FixedAsset.AMAGDelete.
  FillValues: Fills the lookup lists through FixedAsset.AMAGFillValues.
  FillValuesCODWise: Fills the lookup lists through FixedAsset.AMAGFillValuesCODWise.
  FillValuesClassWise: Fills the lookup lists through FixedAsset.AMAGFillValuesClassWise.
  LoadData: Loads the selected record through FixedAsset.AMAGLoadData.
  Open: Searches records through FixedAsset.AMAGSearchData.
  SaveAccountNumberDetails: Saves the record through FixedAsset.AMAGSaveAssetNumberDetail.
  SaveMain: Saves the record through FixedAsset.AMAGSaveMain.
  ValidateForm: Validates the entry through FixedAsset.AMAGValidate.
