form: fCommercialInvoice
title: Commercial Invoice
module: SD
kind: transaction
summary: 'The Commercial Invoice screen (form code SDCI; window caption "CommercialInvoice") raises a commercial invoice for
  a customer location, either directly or against a source document: Sales Order, Dispatch Challan, Tax Invoice (shown in
  code as "EI"), MRA, Purchase Bill, Approval Sheet, Project, Sales Supplementary Invoice, MDN or AMC.'
purpose: |
  What it is: The commercial billing document of the company: what was sold to which customer location, at what price and tax, shipped how, and from which stock or asset. When it applies: When goods, assets or services are billed directly, or after a sales order, dispatch challan, tax invoice (typically an export commercial invoice prepared over a tax invoice), MRA, purchase bill, approval sheet, project, supplementary invoice, MDN or AMC. Business outcome: One authorized document drives the customer receivable, advance adjustment, stock reduction, asset disposal and sales order fulfilment, and is the base for the export document and invoice cancellation.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Tabbed Workspace: One tab control with General Detail, Reference Detail, Shipment & Other Documents Detail, Tax Detail, Document Required, Advance Detail, Service Tax Advance Adjustment, Posting Detail, Advance GST Posting, GST Posting, Disposal Posting, Custom Field and Export Detail [fCommercialInvoice.Designer.vb:2855-2901].
  - Document Number, Date, Division and Status: Shared document-number control with prefix, number, date, division and status [fCommercialInvoice.vb:952-957].
  - Customer Name Field: Mandatory dropdown with a search button [fCommercialInvoice.Designer.vb:837; fCommercialInvoice.vb:6052-6080] (BR-02, MSG-04).
  - Location Field: Mandatory dropdown of the customer's locations [fCommercialInvoice.Designer.vb:856] (BR-02, MSG-05).
  - Source Document Field: Mandatory dropdown (BR-02, MSG-06).
  - Ref. Document No. and Ref. Document Date Fields: Dropdown of sales orders (Sales Order source) or reference documents, with a read-only date [fCommercialInvoice.Designer.vb:894-913].
  - Warehouse Field: Dropdown of warehouses [fCommercialInvoice.Designer.vb:808].
  - Currency Control: Shared currency, rate type and conversion rate control [fCommercialInvoice.vb:1058-1061].
  - Payment Mode and Payment Days Fields: Mandatory dropdown and numeric text (up to 10 digits) [fCommercialInvoice.vb:352-354] (BR-02, MSG-10, MSG-11).
  - Consignee, Place of Supply, Project Milestone and Text Fields: Consignee Name and Location, Place Of City (fills Place Of Supply and locks Place Of State), Ref.
  - Adjust Advance Checkbox and Advance Amount: Checkbox, read-only total and Manual/Automatic option [fCommercialInvoice.Designer.vb:736; fCommercialInvoice.Designer.vb:1656; fCommercialInvoice.Designer.vb:1667-1670].
  - Shipment & Other Documents Detail Tab: Delivery Mode, Transporter Name, Vehicle No.
  - Item Details Grid: Grid of Customer Order No., Sales Order No., Item Code, Item Description, Make, Unit, HSN & SAC Code, Tech.
  - Reference Detail Grid: Grid of selectable reference documents with document number, date, orders, challan type, transporter, vehicle and material type [fCommercialInvoice.vb:1713-1779].
  - Tax Detail, Document Required, Custom Field and Notes: Shared tax control with item-level taxes, document checklist grid, custom field control and notes control [fCommercialInvoice.vb:372-377; fCommercialInvoice.vb:1945-1968].
  - Export Detail Tab: Contact Person Name, Bank Name, Consignee and Buyer contacts, Notify Firm Name and contacts, Port Of Loading, Pre Carriage, Description Of Package, Shiping Marks, and read-only Inco Terms, Method Of Shipment, Type Of Dispatch, Place Of Receipt, Port Of Discharge, Place Of Delivery, Country Of Origin and Final Destination, BL No.
  - Posting Detail, GST, Advance GST and Disposal Posting Tabs: Finance posting control, GST voucher detail, advance GST voucher and depreciation (disposal) control [fCommercialInvoice.vb:4666-4766; fCommercialInvoice.vb:4898-5077].
  - Other Toolbar Actions (Print, Preview, Export, Email): Daily-print report of the invoice [fCommercialInvoice.vb:742-773; fCommercialInvoice.vb:3177-3200].
actions:
  New: Toolbar New [fCommercialInvoice.vb:705-712].
  Save: Toolbar Save [fCommercialInvoice.vb:4153-4488].
  Search: Toolbar Open with the search dialog [fCommercialInvoice.vb:714-741].
  Delete: Toolbar Delete [fCommercialInvoice.vb:265-302].
  Navigation: First / Previous / Next / Last [fCommercialInvoice.vb:250].
