form: fCurrencyConversion
title: Currency Conversion
module: FI
kind: master
users:
- Accounts officer (inferred)
summary: The Currency Conversion screen records exchange rates between the company's base currency and foreign currencies
  for a validity period.
purpose: |
  What it is: Dated exchange rates per currency and rate type, with an allowed tolerance range. When it applies: When exchange rates change or a new foreign currency starts being used. Business outcome: One authoritative rate for any date, and a controlled range for deviations.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Validity Period Area: Group "Validity Period" with Base Currency, From Date and To Date.
  - Base Currency Field: Read-only text.
  - From Date Field: Date picker, format dd/MM/yyyy, always has a value.
  - To Date Field: Date picker with a tick box; unticked means open-ended.
  - Currency Detail Grid: Columns Exchange Rate Type, Exchange Currency, Translation Type, Exchange Rate, Inverse Rate, Tolerance Type, Positive Tolerance, Negative Tolerance, Range (read only).
  - Other Toolbar Actions (Print, Preview, Export, Email): Handlers are empty; the screen does not declare its toolbar options, so availability depends on the application frame (Inferred).
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with the shared search list.
  Delete: Standard toolbar Delete.
validations:
- To Date can't be less than From Date.
- Exchange Currency [currency name] and Exchange Rate Type [rate type] already exists between this validity period.
- Select valid To Date.
- Select atleast one Exchange Rate Type.
- Duplicate Exchange Rate Type and Exchange Currency is not allowed.
- 'Select valid Exchange Currency in row '
- 'Select valid Translation Type in row '
- 'Exchange Rate can''t be empty or zero  in row '
- 'Inverse Rate can''t be empty or zero  in row '
- 'Either Positive Tolerance or Negative Tolerance can''t be empty or zero  in row '
- 'Negative Tolerance can''t be greater then Exchange Rate  in row '
- '... Inverse Rate  in row '
manages:
- currency-exchange-rate
uses_concepts:
- company
- currency
method_notes:
  Delete: Deletes the record through masterdata.MDCCDelete.
  FillValues: Fills the lookup lists through masterdata.MDCCFillValues.
  LoadData: Loads the selected record through masterdata.MDCCLoadData.
  Open: Searches records through masterdata.MDCCSearchData.
  SaveCurrency: Saves the record through masterdata.MDCCSave.
  ValidateForm: Validates the entry through masterdata.MDCCValidate.
