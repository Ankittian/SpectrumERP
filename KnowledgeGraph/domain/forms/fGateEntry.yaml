- Select valid Vendor Name.
- Select valid Location.
- Driver Name should not have numeric value.
- Contact No. can only have numbers, comma(,) and hyphen(-).
- Contact No. should not be less than 10 digits.
- Each Contact No. should be of 10 digit only.
- Vehicle No. should not contain special characters.
- Enter valid Vehicle No.
- Arrival time is mandatory
- Document Date is greater than minimum available Validity Date (dd/MM/yyyy). Do you want to continue?
- Document Date can't be greater than minimum available Validity Date (dd/MM/yyyy).
- Enter Challan No.
- Contact No. is not selected.Do you want to continue?
- License No. is not selected.Do you want to continue?
