form: fGateEntry
title: Gate Entry
module: MM
kind: transaction
users:
- Security / gate staff (inferred)
summary: The Gate Entry screen records every inward vehicle and consignment that arrives at the factory gate before it is
  received into stores.
purpose: |
  What it is: A dated, numbered record of an inward consignment at the gate, tied to the supplier location, the reference documents and the items and quantities declared on the supplier challan. When it applies: When a vehicle with material reaches the gate, before the goods receipt note is prepared. Business outcome: The company has a controlled first record of every inward consignment, with quantity limits against orders, so that receipts, weighment and freight can be reconciled later and over-supply against orders is stopped at the gate.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Number Header: Shared document number control at the top: document number, date, division (when divisions apply), status and the repeat-entry button.
  - General Details Tab: Tab "General Details" with source, reference, vendor, challan, transport, weighment, eWay-Bill, weights, remarks, currency and notes.
  - Item Detail Tab: Tab "Item Detail" with the "Reference Detail" grid (top) and the "Item Detail" grid (bottom).
  - Custom Fields Tab: Tab "Custom Fields" hosting the shared custom field control for this screen.
  - Source Document Field: Dropdown, mandatory (highlighted), list of active source documents; defaults to the source flagged as default (Purchase Order in the export) (BR-04).
  - Ref. Document No. Field: Dropdown of open reference documents of the selected source (columns Ref Document No, Ref Document Date).
  - Ref. Document Date Field: Read-only text display.
  - Vendor Name Field: Dropdown (Vendor Name, Code), mandatory (highlighted), with a list button that opens the search window (BR-05).
  - Location Field: Dropdown of the vendor's locations (Vendor Location, Code), mandatory (highlighted).
  - Challan No. Field: Text box, highlighted as mandatory, max 30 characters, trimmed on save (BR-07).
  - Challan Date Field: Date with check box, highlighted as mandatory, unchecked on load (BR-08).
  - Transporter Field: Dropdown (Transporter, Code), optional unless configured (BR-22).
  - Driver Name Field: Editable dropdown of driver names used on earlier gate entries (Driver Name, Contact No, License No), max 50, with a search button.
  - Contact No. Field: Text box, max 25.
  - License No. Field: Text box, max 50.
  - Vehicle No. Field: Text box, max 25 on screen, trimmed (BR-09).
  - Reference Item Button (Mobile Gate In): Small button next to the vehicle area that opens a list of approved mobile gate-in records.
  - LR No. and Dt Fields: LR No.
  - Reference No. & Date Field: Free text, max 50, optional.
  - Freight Type Field: Dropdown, mandatory (highlighted) (BR-06).
  - From Location and To Location Fields: Dropdowns of company locations, optional.
  - Arrival Time and Departure Time Fields: Date-time pickers with check box, unchecked by default, preset to current time (BR-10).
  - Weighbridge Name Field: Editable dropdown of weighbridge names used earlier, max 50.
  - Weighment Slip No. and Dt Fields: Text box (max 50) and date with check box (BR-11).
  - Vehicle Type Field: Dropdown of company vehicle types, optional.
  - Vehicle Capacity and Distance Fields: Numeric text boxes; Vehicle Capacity 3 decimals (max 13), Distance 2 decimals (max 8); optional.
  - eWay-Bill No. and Dt Fields: Text box (max 50) and date with check box (BR-13).
  - Exclude Weighment Check Box: Check box "Exclude Weighment".
  - Party Gross Weight, Party Tare Weight and Party Net Weight Fields: Gross and tare numeric fields (3 decimals, max 8 characters); Party Net Weight read-only.
  - Remarks Field: Text box, max 1000, trimmed, optional.
  - Currency Control: Shared currency control showing currency and conversion rate.
  - Notes Control: Shared notes control with Print Area, Notes and Default.
  - Footer Group (Mobile Gate In No., Net Weight, Approved By, Bill Weight): Read-only displays.
  - Reference Detail Grid: List of open references of the vendor location with a Select check box; other columns read-only: reference number and date (captions per source, e.g.
  - Item Detail Grid: Item rows: Select, Item Code (with search button Btn and information icon), Item Description, Make, Unit, Tech.
  - Tolerance Pop-up: Read-only pop-up showing Tolerance Basis, Tolerance(-) and Tolerance(+) with an OK button.
  - Other Toolbar Actions (Print, Print Preview, Export, Email): Print, Print Preview, Export and Email of the gate entry print layout for the loaded entry.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search (Open): Toolbar Open showing the search window.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last enabled on the toolbar.
