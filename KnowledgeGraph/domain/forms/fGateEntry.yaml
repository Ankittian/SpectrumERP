- License No. is mandatory.
- Transporter not selected.Do you want to continue?
- Vehicle No. not selected.Do you want to continue?
- Transporter is mandatory.
- Vehicle No. is mandatory.
- Select Challan Date.
- Challan Date can't be greater than Gate Entry Date.
- Arrival Time can't be greater than Document Date.
- Arrival Time can't be greater than Departure Time.
- Select Weighment Slip Date.
- Enter Weighment Slip No.
- Weighment Slip Date can't be greater than Document Date.
- Select LR Date.
- Enter LR No.
