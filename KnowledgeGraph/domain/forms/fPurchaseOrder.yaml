form: fPurchaseOrder
title: Purchase Order
module: MM
kind: transaction
users:
- Purchase officer (inferred)
- Purchase manager (inferred)
summary: The Purchase Order screen creates, amends, releases and authorizes purchase documents issued to vendors.
purpose: |
  What it is: A commercial commitment to a vendor for items or services at agreed rates, quantities, delivery schedules, freight and payment terms. When it applies: A buyer needs to place an order, convert an approved indent, LOI, quotation or agreement into an order, or raise a drop-shipment order against a sales order or GRC. Business outcome: Purchases are made only against valid demand, approved rates and available budget, and they are authorized by the right people before goods are received.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Purchase Order Window and Tabs: The window "Purchase Order" with a document number control at the top and the tabs "&General Details ", "&Indent Details", "Shipping && Account Detail", "Tax &Details", "&Terms and Conditions", "&Transportation Route", "Other Expenses", "Payment &Terms", "Account Assi&gnment", "Authorization &Group", "Advance Detail" and "&Custom Fields".
  - Document Number Control (Document No., Date, Status, Prefix): A shared control holding the yearly document number, document date, prefix and Document Status (Initial, Release, Authorized).
  - Document Type Field: Dropdown, mandatory: LOI, PO (default), RO (BR-05; MSG-08).
  - Purchase Type Field: Dropdown, mandatory: Capital, General, Drop-Shipment (BR-05; MSG-09).
  - Purchase Category Field: Dropdown, mandatory: Domestic (default), Import (BR-05; MSG-10).
  - Ref. Doc. Type Field: Dropdown, mandatory.
  - Ref. Doc. No. and Dt Fields: Dropdown of open source documents for the chosen type, with a read-only reference date (Dt).
  - Vendor Name Field: Searchable vendor selector, mandatory (BR-05; MSG-12).
  - Location Field (Vendor Location): Dropdown, mandatory (BR-05; MSG-13).
  - Contact Person Name Field: Dropdown of vendor contacts.
  - Validity Date Field: Date, mandatory, not earlier than the document date (BR-05, BR-08; MSG-14, MSG-19).
  - Waybill No. and Dated Fields: Text (max 50) and date.
  - Reference No. and Dated Fields: Text (max 50) and an optional date with a checkbox.
  - Dept. Name Field: Dropdown of departments.
  - Remarks Field: Free text, max 1000 characters, optional.
  - Purchase Organization Field: Text, max 30, filled from settings.
  - &PO Rate Validation Checkbox: Checkbox.
  - Item Details Grid: The order lines on "&General Details ": Item Code, Item Description, Make, Tech.
  - Indent Details Grid: Open lines of the source indent, sales order or GRC with Select, Indent Date, Balance Qty., PO Unit, First CF, Second CF, PO Qty., Rate, Amount and Schedule Date.
  - Shipping Detail Group: Warehouse, Warehouse Address (max 1000), Define Transportation Route, Freight Type (default from settings), Freight Rate Type (Per Unit, Fixed, Per Trip), Freight Amount (max 10), From Location, To Location (default company location), Freight Order, No.
  - Pay To Party, Pay To Location, Billed To, Billed To Location and Payment Mode Fields: Party selectors enabled by their checkboxes, location dropdowns, and the Payment Mode dropdown.
  - Tax &Details Tab: A shared tax-on-amount control with the tax and charges lines (and HSN-wise tax when enabled) and tax concession forms.
  - &Terms and Conditions and Payment &Terms Tabs: Shared terms and conditions control and shared payment terms control, defaulted from the vendor location.
  - &Transportation Route Tab: Level, PO Manually Closing, and a route grid with Route Id, Transportation Mode, Freight Type, From and To Location, Warehouse, Recipient, Item Description (level 2), Freight Amount or Freight Order (popup with Freight Nature, Freight Amount, No.
  - Other Expenses Tab: Expense grid with Expense Head, Billing Location, Billing Qty., Rate Basis, Rate, Party Name, Reference No.
  - Account Assi&gnment Tab: Account head assignment per line.
  - Authorization &Group Tab: Authorization Group dropdown, an approval grid (level, user, Select, action Approve or Reject, comment) and a Send Email button.
  - Advance Detail Tab: Advance option Manual or Automatic, and a grid of advances with Balance Amount and PO Adjusting Amount.
  - &Custom Fields Tab: Shared custom field control.
  - Repeat Previous PO (Ctrl+Y or repeated-entry button): Opens a search of earlier orders and copies the chosen one.
  - Other Toolbar Actions (Print Preview, Print, Export, Email): Report-based output of the purchase order layout.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search: Toolbar Open, using the common search window.
  Delete: Toolbar Delete.
  Navigation: First, Previous, Next, Last are enabled in the toolbar.
