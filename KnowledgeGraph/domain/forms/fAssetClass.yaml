  FillValues: Fills the lookup lists through FixedAsset.AMACFillValues.
  FillValuesDependent: Fills the lookup lists through FixedAsset.AMACFillValuesDependent.
  LoadData: Loads the selected record through FixedAsset.AMACLoadData.
  Open: Searches records through FixedAsset.AMACSearchData.
  SaveAccountNumberDetails: Saves the record through FixedAsset.AMACSaveAssetNumberDetail.
  SaveMain: Saves the record through FixedAsset.AMACSaveMain.
  ValidateForm: Validates the entry through FixedAsset.AMACValidate.
