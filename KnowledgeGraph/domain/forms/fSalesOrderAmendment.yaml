form: fSalesOrderAmendment
title: Sales Order Amendment
module: SD
kind: transaction
summary: The Sales Order Amendment screen revises an existing, authorized sales order without creating a new order number.
purpose: |
  What it is: A numbered revision (amendment 1, 2, 3, …) of an authorized sales order that records what changed and why ("Amendment Reason"), while keeping the original document number and date. When it applies: When a customer changes quantities, rates, schedules, delivery points, payment terms or other conditions after the order has been authorized. Business outcome: The order history is preserved revision by revision, and downstream operations always work on the latest authorized terms (BR-43).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Header Area and Tabs: A header band with the order and amendment identity, and a tab set: "General Information", "Other Information", "Shipment Detail", "Billing Detail", "Tax Detail", "Document Required", "Export Detail", "Inspection Detail", "Cost Detail", "Terms & Condition", "Account Assignment", "Custom Field" and "Multi-Level Authorization" [fSalesOrderAmendment.designer.vb:4087-4125].
  - Sales Order No. Field: Mandatory dropdown listing "Sales Order No", "Sales Order Date" and "Customer Name" of eligible orders (BR-01).
  - Amendment Number Display: Read-only number beside "Sales Order No." [fSalesOrderAmendment.designer.vb:4060].
  - Sales Order Date and Division Name Fields: Read-only displays of the original order date and division [fSalesOrderAmendment.designer.vb:4718] [fSalesOrderAmendment.designer.vb:4662].
  - Document Date Field: Mandatory date of the amendment.
  - Document Status Field: Mandatory dropdown: Initial, Release, Authorized (BR-11).
  - Inherited Header Fields (Read-Only): "Order Type", "Source Document", "Ref.
  - Editable General Information Fields: "Sales Person Name", "Sales Classification", "Supply Type", "Booking Time" (when the setting is on), "Validity Date", "Project Code", "Lift" (for divisions configured to show lifts), "Vessel Name", "Remarks", "Amendment Reason", "SD Applicable" with "Security Deposit %", "Cash Discount" with "Level", "Basis" and "Value", "Additional Cost" and "Distributor" (agreement orders).
  - Currency Control: Shared currency selector with conversion rate.
  - Item Details Grid: The main grid.
  - Shipment Detail Tab: "Freight Type" and the consignee grid ("Consignee Name", "Consignee Location", "Consignee Contact Person", "From Location", "To Location", "Freight Rate Type", "Freight Rate", "Freight Order").
  - Billing Detail Tab: "Bill To Party", "Location", "Pay Term Code", the payment terms grid, "CT1/ CT3 No.
  - Other Tabs: "Tax Detail" (document taxes), "Document Required" ("Document Group" and documents with "No.
  - Other Toolbar Actions (Print, Preview, Export, Email): Registered on the toolbar but empty on this screen [fSalesOrderAmendment.vb:1170-1176] [fSalesOrderAmendment.vb:5501-5507].
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Open (Search): Standard toolbar Open showing a search list of amendments.
  Delete: Standard toolbar Delete.
  Navigation: First / Previous / Next / Last are registered for the screen [fSalesOrderAmendment.vb:75].
