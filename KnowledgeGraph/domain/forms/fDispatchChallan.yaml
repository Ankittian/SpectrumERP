form: fDispatchChallan
title: Dispatch Challan
module: SD
kind: transaction
summary: The Dispatch Challan screen records the physical dispatch of goods from a company warehouse to a customer, a subcontractor,
  a sister unit or (for purchase returns) a supplier.
purpose: |
  What it is: A transaction document that authorises and records goods leaving the warehouse, with the stock lots consumed and the logistics details needed for transport and e-way bills. When it applies: Whenever material is physically dispatched: sale to a customer, interunit sale, subcontract dispatch, purchase return, export dispatch, AMC/MDN dispatch. Business outcome: Stock is reduced against the right lots, sales orders show correct dispatched and balance quantities, and later invoicing and gate-pass processes have a controlled source document.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: A header with the shared document-number control (Division, Document No., Date, Status, Prefix) and a tab control with General Details, Packing Detail, BOM Detail, Item Detail, Tax Detail, Document Required, Finance Posting and Custom Field tabs.
  - Document No., Date, Status and Division: Shared document-number control; Status Initial/Release/Authorized; Division validated when division is applicable [fDispatchChallan.vb:345-349].
  - Customer Name and Customer Location Fields: Mandatory dropdowns (BR-03); location list shows the customer's locations and defaults to the first [fDispatchChallan.vb:3098].
  - Challan Type, Source Document and Challan Nature Fields: Mandatory dropdowns filtered as per BR-04 to BR-06.
  - Ref. Doc. No. and Ref. Doc. Date Fields: Dropdown of reference documents for the source; Ref.
  - Consignee Name, Consignee Location and Consignor Location Fields: Mandatory consignee dropdowns (BR-03); Consignor Location visible only for Sales Return (Interunit) when GST applies (BR-09).
  - Dispatch Category, Agent Name and Warehouse Fields: Dispatch Category mandatory (BR-03, BR-10, BR-16); Agent Name optional, locked when the order carries an agent; Warehouse optional, defaulted from GRN/invoice references.
  - Wt Slip No., Dated and Weighment Fields: Text Wt Slip No.
  - Ref No. & Date, Maintain Packing Details, Invoice Type, Ex. Challan No./Date: Free text reference (50); checkbox showing the Packing Detail tab and column [fDispatchChallan.vb:3899]; Invoice Type dropdown (BR-28); excise challan combo and date, hidden when GST applies [fDispatchChallan.vb:460-465].
  - Transport Fields: Delivery Mode (default from master), Shipping Date (mandatory), Transporter Name, Vehicle No.
  - Transaction Type, Sub Supply Type, Bill From and Dispatch From Fields: Mandatory Transaction Type (defaulted) and Sub Supply Type; Bill From/Location and Dispatch From/Location, read-only for Regular and Bill To Ship To [fDispatchChallan.vb:8653].
  - Export Details Group: Destination Country, Place of Receipt Pre-Carriage, Vessel / Flight No., Port of Loading, Port of Discharge.
  - Item Detail Grid: Item lines with Select, Item Code (search button), Item Description, Make, Item Attribute, Unit, Sales Order No., SC Order No., Customer Order No.
  - Packing Detail Grid: Packing Material No., Packing Material, Qty., Remarks, Lot Detail.
  - BOM Detail Grid: BOM rows with Select, BOM No., Qty., Work Order No./Date (subcontract types).
  - Tax Detail Tab: Shared tax-on-amount control with item-wise tax.
  - Document Required Tab: Document Group dropdown that loads a checklist; grid Document Name, No.
  - Finance Posting and Custom Field Tabs: Shared voucher posting control and shared custom field control.
  - Reference Item and Lift Buttons: Reference Item copies items from an open sales order (setting dependent, Direct source) [fDispatchChallan.vb:8248]; the lift button picks an AMC lift and sets customer, type Dispatch to Customer, source AMC and reference [fDispatchChallan.vb:8381].
  - Other Toolbar Actions (Print, Preview, Export, Email): Print, Preview, Export and Email of the sales challan report for the loaded challan [fDispatchChallan.vb:831] [fDispatchChallan.vb:7048].
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard Open showing a search list for the company and year [fDispatchChallan.vb:800].
  Delete: Standard Delete.
  Navigation: First / Previous / Next / Last enabled through the toolbar options [fDispatchChallan.vb:143].
