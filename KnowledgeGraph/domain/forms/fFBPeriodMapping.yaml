form: fFBPeriodMapping
title: FB Period Mapping
module: FI
kind: master
users:
- Finance controller (inferred)
summary: The FB Period Mapping screen (menu caption "Calendar Period Mapping") links accounting periods to a finance book
  or to a depreciation book.
purpose: |
  What it is: The set of periods, with Open or Close status and one beginning period, that a finance book or depreciation book works with. When it applies: When a new book is set up, a new financial year is added to a book, or a period must be opened or closed. Business outcome: Controls which periods a book may use and fixes the book's start date.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Book Selection Area: Top panel with Calendar Type and the book field.
  - Calendar Type Field: Dropdown, mandatory, values Financial Calendar and Depreciation Calendar.
  - Finance Book Field: Dropdown, marked mandatory; source is finance books visible to the logged-in company (BR-04).
  - Depreciation Book Field: Dropdown in the same position, labelled "Depreciation Book", mandatory in this mode.
  - Financial Year Grid: Columns Select, Year Name, Start Date, End Date, Status; only Select is editable; rows cannot be deleted.
  - Financial Period Grid: Columns Year Name, Period Name, Start Date, End Date, Beginning Period, Status; Beginning Period and Status (Open / Close) are editable; rows cannot be deleted.
  - Other Toolbar Actions (Open, Delete, Navigation, Print, Preview, Export, Email): Not enabled; Open and Delete return no result and print handlers are empty.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
validations:
- Select valid Calendar Type.
- Select valid Finance Book.
- Select valid Depreciation Book.
- Select atleast one Financial Year.
- 'Select valid Status in row '
- Select atleast one Beginning Period.
- Can't select more than one Beginning Period.
- Voucher exists under this Financial Year.
- Reference exists under this Financial Year.
- Opening balance exists on this Begining Period.
- Depreciation exists on this Begining Period.
manages:
- accounting-period
uses_concepts:
- accounting-voucher
- company
- finance-book
method_notes:
  DeleteFB: Deletes the record through masterdata.FIMPDelete.
  FillValues: Fills the lookup lists through masterdata.FIMPFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.FIMPFillValuesDependent.
  Save: Saves the record through masterdata.FIMPSaveMain.
  ugdFinancialPeriod_BeforeCellUpdate: Validates the entry through masterdata.FIMPValidate.
  ugdFinancialYear_BeforeCellUpdate: Validates the entry through masterdata.FIMPValidate.
