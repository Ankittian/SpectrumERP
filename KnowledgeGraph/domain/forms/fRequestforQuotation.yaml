form: fRequestforQuotation
title: Request For Quotation
module: MM
kind: transaction
users:
- Purchase officer (inferred)
summary: The Request For Quotation screen creates and maintains the material RFQ document that a buying company sends to one
  or more vendors to invite prices for goods.
purpose: |
  What it is: A formal, numbered request to selected vendors to quote for a defined list of materials, quantities and delivery dates. When it applies: When a purchase requirement exists (an authorized indent, a project gross requirement, a sales order to be bought out, or a direct need) and the buyer wants competitive quotations before ordering. Business outcome: Every vendor receives the same specification and deadlines, the requirement lines are reserved against this RFQ so they are not sourced twice, and quotations and the comparative statement can be traced back to one RFQ.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Area: The shared document-number control at the top: document number, document date, division (when divisions apply) and status.
  - Tabbed Header Area: Tabs "General Details", "Indent Details" (renamed per source), "Vendor Details" and "Custom Fields".
  - Item Details Area: The item grid below the tabs, always visible.
  - Source Document Field: Dropdown, mandatory (highlighted as compulsory).
  - Submission Date Field: Date picker, mandatory.
  - Opening Date Field: Date picker, mandatory.
  - Validity Date Field: Date picker, mandatory.
  - Remark Field: Multi-line text box, optional, screen limit 1000 characters, trimmed on save.
  - Warehouse Field: Dropdown, optional, label "Warehouse".
  - Warehouse Address Field: Read-only multi-line display.
  - Notes Control: Small embedded notes button at the right of General Details, with print-area support.
  - Source Lines Grid (Indent Detail / GRC Detail / Sales Order Detail): Selection grid of eligible requirement lines with a "Select" checkbox.
  - Conversion (CF) Popup: Row popup with a unit dropdown, First CF, the source unit (read-only), "=" and Second CF, with "OK" and "Cancel".
  - Vendor Selection Field: Dropdown, mandatory: All, Item-Vendor Mapping, Vendor Group.
  - Vendor Group Field: Dropdown, label "Vendor Group".
  - Vendor Details Grid: Grid with Vendor Name, Location, an information icon, Contact Person and Send Email.
  - Item Details Grid: Grid with Item Code, Item Description, information icon, search button, Make, HSN & SAC Code, Tech.
  - Custom Fields Tab: The shared custom-field control configured for the RFQ form.
  - Other Toolbar Actions (Print, Preview, Export, Email): Report actions producing one RFQ report per vendor row.
actions:
  New: Toolbar New.
  Save: Toolbar Save.
  Search: Toolbar Open, showing the shared search list.
  Delete: Toolbar Delete.
  Navigation: First / Previous / Next / Last, enabled on the toolbar.
validations:
- Authorized RFQ can't be updated.
- Select valid Source Document.
- Submission Date can't be less than Document Date.
- Opening Date can't be less than Submission Date.
- Validity Date can't be less than Submission Date.
- Validity Date can't be less than Opening Date.
- Select atleast one Indent .
- Select atleast one GRC.
- Select atleast one Sales Order.
- First CF can't be empty or zero.
- Second CF can't be empty or zero.
- Select valid Unit.
- Select valid Vendor Selection.
- Select atleast one Vendor.
- Select valid Location in row <n>.
- Duplicate Vendor Name is not allowed.
- Duplicate Item Name and Make is not allowed.
- Select atleast one Item.
- Select valid Unit in row <n>.
- RFQ Qty. can't be empty or zero in row <n>.
- Select Delivery Date in row <n>.
- Delivery Date can't be less than Document Date in row <n>.
- HSN & SAC Code or row <n> do not exists in any selected indents. Do you want to continue?
- Document No. <number> saved successfully.
- Item Information
- Vendor Information
manages:
- rfq
uses_concepts:
- company
- hsn-sac-code
- item-unit-weight
- make
- material-item
- purchase-order
- purchase-organization
- purchase-request
- tech-specification-head
- unit-of-measure
- vendor
- vendor-contact-person
- vendor-location
- warehouse
