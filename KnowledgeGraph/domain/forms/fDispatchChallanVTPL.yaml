form: fDispatchChallanVTPL
title: Delivery Challan (Dispatch Challan VTPL)
module: SD
kind: transaction
summary: The Delivery Challan screen records the goods that physically leave the company, either to a customer or back to
  a supplier.
purpose: |
  What it is: The document that authorises and records outward movement of material, with the stock lots taken out and the transport used. When it applies: Goods are ready to leave the company, either to fulfil a sales order or packing list or to go back to a supplier as a purchase return. Business outcome: Stock leaves the books only against a controlled document. Sales order balances, provisional stock holds and the stock valuation journal all stay in line with what was shipped.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout: A document number and status strip at the top, followed by the tabs "General Details", "Packing Detail", "BOM Detail", "Item Detail", "Document Required", "Finance Posting" and "Custom Field" [fDispatchChallanVTPL.designer.vb:2893-2916].
  - Document No., Date, Division and Status Strip: A shared control for the document number (manual or from a numbering setting), document date, division and document status.
  - Challan Type Field: Mandatory dropdown, defaulted to the first value (BR-03, MSG-17).
  - Source Document Field: Mandatory dropdown (BR-04, MSG-18).
  - Challan Nature Field: Mandatory dropdown (BR-05, MSG-19).
  - Ref. Doc. No. and Ref. Doc. Date Fields: Dropdown of sales orders, packing lists or GRNs, with the date as a read-only display.
  - Customer Name and Customer Location Fields: Mandatory dropdowns.
  - Consignee Name and Consignee Location Fields: Mandatory dropdowns (BR-06, MSG-24, MSG-25).
  - Agent Name Field: Optional dropdown, with an agent information link (MSG-70).
  - Dispatch Category Field: Mandatory dropdown (MSG-26).
  - Warehouse Field: Optional dropdown, filtered by division.
  - Wt Slip No., Dated and Ref No. & Date Fields: Optional text and date fields.
  - Invoice Weight On and Weighment Weight Fields: A choice between "Weighment Weight" and "Packing Weight", plus a numeric weight with 3 decimals [fDispatchChallanVTPL.designer.vb:511-515].
  - Invoice Type Field: Dropdown, mandatory for customer dispatch and purchase return (BR-25, MSG-57).
  - Ex. Challan No. and Ex. Challan Date Fields: A dropdown of the customer location's excise challans that also accepts typed text, and a date.
  - Transport Fields: "Delivery Mode" (defaulted), "Shipping Da&te" (mandatory), "Transporter Name", "Vehicle No.", "Vehicle Type", "Driver Name", "Licence No.", "Contact No.", "LR No."/"LR Date", "E-Way Bill No."/"E-Way Bill Date", "Freight Type", "From Location" and "To Location" [fDispatchChallanVTPL.designer.vb:1510-1758].
  - Export Details Group: "Destination Country", "Place of Receipt Pre-Carriage", "Vessel / Flight No.", "Port of Loading" and "Port of Discharge".
  - Maintain Packing Details, Remarks and Print Description Fields: A checkbox, free text, and a print description.
  - Item Detail Grid: Columns include "Select", "Item Code", "Item Description", "Make", "Item Attribute", "Unit", "First CF"/"Second CF"/"CF", "Qty.", "Sales Order No.", "Customer Order No.
  - Lot Detail, Stock Details, Serial Number, Packing Detail, CF and Specification Pop-ups: Row-edit windows that open from the matching item cells.
  - BOM Detail Grid: BOM revisions (with work order, attribute combination and Qty.) to select for dispatch.
  - Packing Detail Grid: "Packing Material No.", "Packing Material", "Qty.", "Remarks", "Lot Detail", "Current Stock" and "On Date Stock".
  - Excise Challan Grid: Excise challans with "GRN Qty.", "Balance Qty.", "Qty." and "Excise Challan Date", shown on the Item Detail tab [fDispatchChallanVTPL.designer.vb:2146-2155].
  - Document Required Grid and Document Group: "Document Name", "No.
  - Notes and Custom Field Areas: Shared notes control by print area, and the custom field grid.
  - Finance Posting Tab: Shared voucher control showing the journal built from lot values.
  - Hidden Voucher Repair Shortcuts: Ctrl+Alt+V rebuilds and re-links the voucher of the loaded challan.
actions:
  New: Clears the screen through the main window and returns to "General Details" [fDispatchChallanVTPL.vb:641-652].
  Save: Runs validation, asks for confirmation (MSG-01) and saves everything in one transaction.
  Search (Open): Opens the search window with the company and year challans (BR-45).
  Delete: Asks for confirmation (MSG-65) and then deletes the challan.
  Navigation, Print, Preview, Export and Email: First/Previous/Next/Last navigation, Print and Preview of the challan report,
    Export and Email are enabled on the toolbar [fDispatchChallanVTPL.vb:126-135].
