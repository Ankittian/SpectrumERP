form: fFinanceBook
title: Finance Book
module: FI
kind: master
users:
- Finance controller (inferred)
summary: The Finance Book screen maintains the books under which accounting is recorded and reported.
purpose: |
  What it is: A register of finance books, their hierarchy (transaction book under a unit level book, consolidate book over transaction books), and the accounts, tax books and divisions linked to each. When it applies: When a new company, unit or reporting consolidation is set up, or when the account or tax coverage of a book changes. Business outcome: Postings and reports are segregated by book, and the operative account used for a book is consistent across its hierarchy.
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Main Layout Area: Window titled "FinanceBook" with a header panel (top left), a division / transaction FB panel (bottom left), a Chart of Account Detail panel (top right) and a Tax Book Detail panel (bottom right).
  - Code Field: Read-only text box.
  - Finance Book Name Field: Text box, mandatory, maximum 100 characters (BR-01, BR-02).
  - FB Type Field: Dropdown, mandatory (BR-03).
  - Parent FB Field: Dropdown of Unit Level books (Code, FB Name), mandatory for Transaction (BR-04).
  - Company Name Field: Dropdown (Company Name, Code) listing only companies not already used by another book (BR-05).
  - Set as default Field: Checkbox (BR-14).
  - Division Grid: Grid with Select, Code, Division Name; Code and Division Name are read-only; rows cannot be deleted (BR-13).
  - Transaction FB Grid: Grid with Select, Transaction FB, Unit Level FB listing all Transaction books (BR-06).
  - Chart of Account Detail Grid: Grid with Code, COA Name (both selectable lists, kept in sync) and read-only COA Type; a new row is added automatically after the last row is edited (BR-08 to BR-11).
  - Tax Book Detail Grid: Grid with Code, Tax Book Name (kept in sync) and read-only Tax Category; new rows added automatically (BR-12).
  - Other Toolbar Actions (Print, Preview, Email, Export): Standard toolbar actions.
actions:
  New: Standard toolbar New.
  Save: Standard toolbar Save.
  Search: Standard toolbar Open with a search list (Code, Finance Book Name, FB Type, Parent FB, Company Name, Set as default,
    Created By, Created Date).
  Delete: Standard toolbar Delete.
validations:
- Enter Finance Book Name.
- Duplicate Finance Book Name not allowed.
- Select valid FB Type.
- Select valid Parent FB.
- Select valid Company Name.
- Select at least one Transaction FB.
- Selected TFB combination already exists.
- Select atleast one operative Chart of account.
- Select atleast one Chart of account.
- Select only one operative COA.
- Can't select operative COA.
- Selected Operative COA should be same as child's Operative COA.
- Selected operative COA is not same as Parent FB's operative COA,so it will be deleted from Parent FB.Do you want to continue?
- Can't select Tax Book of same Tax category.
- Duplicate COA Code is not allowed.
- Duplicate Tax Book Code is not allowed.
- Division is already selected in other FB
manages:
- finance-book
uses_concepts:
- accounting-period
- chart-of-accounts
- company
method_notes:
  Delete: Deletes the record through masterdata.FIFBDelete.
  FillValues: Fills the lookup lists through masterdata.FIFBFillValues.
  FillValuesDependent: Fills the lookup lists through masterdata.FIFBFillValuesDependent.
  LoadData: Loads the selected record through masterdata.FIFBLoadData.
  Open: Searches records through masterdata.FIFBSearchData.
  Save: Saves the record through masterdata.FIFBSave.
  SaveChartOfAccountDetail: Saves the record through masterdata.FIFBSaveCOADetail.
  SaveDivisionDetail: Saves the record through masterdata.FIFBSaveDivisionDetail.
  SaveFinanceBookDetail: Saves the record through masterdata.FIFBSaveTransactionFBDetail.
  SaveTaxBookDetail: Saves the record through masterdata.FIFBSaveTaxBookDetail.
