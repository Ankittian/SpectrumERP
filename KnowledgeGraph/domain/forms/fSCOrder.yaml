form: fSCOrder
title: Service Order
module: MM
kind: transaction
summary: The Service Order screen places a subcontract (service) order on a vendor.
purpose: |
  What it is: A numbered, versioned order to one vendor and vendor location for services, conversion items or activities. It holds input and output material, rates, schedules, taxes and terms [fSCOrder.vb:2133-2339]. When it applies: When work is given to a subcontractor or service vendor, whether against a quotation, a Service Request or an LOI, or placed directly. Business outcome: A binding, approved order that controls what material leaves for the vendor, what is expected back and at what value (BR-01, BR-24).
  (Roles under Used by are inferred from ERP practice.)
functional_description: |
  - Document Header Control: The shared number / date / division / status control, with Document Type, SC Type, SC Nature, Source Document, Ref.
  - Tab Layout: Top tabs: General, Requisitions, PO Expense Head Detail, Shipping Detail, Transportation Route, Tax, Additional Cost, Expenses, T & C, Payment Terms, Account Assignment, Authorization and Custom Fields.
  - Source Document and Ref. Doc. No. Fields: Changing the source reloads the reference list.
  - Vendor Fields: Choosing a vendor picks its first location, copies Pay To, and for an inter-unit vendor forces Inter Unit location and locks it.
  - Price Type, Billing Nature and Validity Date: Price Type defaults to 1 but is hidden on the screen.
  - Requisitions Tab: A grid of open Service Request lines with Select, SC Qty., Rate, Schedule Date and nature.
  - Service Detail and Item Detail Grids: Service lines with sequence, quantity, schedule, warehouse and valuation method.
  - Mark Detail and Billing Detail Tabs: Mark / work-order selection pop-ups, and bill lines with activity or mark selection, unit, quantity, rate and a unique service description [fSCOrder.vb:4802-4960; fSCOrder.vb:5057-5433; fSCOrder.vb:250].
  - Shipping Detail Tab: Consignee and location, freight nature and amount, freight order, From / To location, Pay To / Billed To parties and locations with "change" checkboxes, and payment mode [fSCOrder.vb:3619-3635; fSCOrder.vb:1919-1998].
  - Transportation Route, Expenses and PO Expense Head Tabs: Route levels and legs, other expense lines with party and billing location, and the mapping of the order to PO expense heads [fSCOrder.vb:6313-6341; fSCOrder.vb:6736-6941; fSCOrder.vb:5558-5651].
  - Tax, Additional Cost, T & C, Payment Terms and Custom Fields: Shared controls for taxes, additional item cost with tolerance, terms, payment schedule and custom fields [fSCOrder.vb:7009-7090; fSCOrder.vb:1240-1330].
  - Account Assignment Tab: Expense and intermediate accounts per service line.
  - Authorization Tab: Approval levels and users, with action (approve / reject), comment and a Send Email button [fSCOrder.vb:7092-7197; fSCOrder.vb:7128].
actions:
  New, Save, Search and Repeat: The toolbar offers New, Save, Open, Delete, Navigation, Preview, Print, Export and Email [fSCOrder.vb:113-122].
  Delete: Asks for confirmation and deletes the order version [fSCOrder.vb:139-172].
  Print, Preview, Export and Email: Use the activity report for Activity orders, otherwise the subcontract order report [fSCOrder.vb:893-919;
    fSCOrder.vb:5002-5055].
