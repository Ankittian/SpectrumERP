    The Budget screen lets a company define a spending budget for a validity period. A budget is held in one of three ways chosen by the user: by Division with its Departments, by Item Sub Group with its Items (amount and quantity), or by Cost Center with its child cost centers [fBudget.vb:25; fBudget.vb:275-285]. For every selected line the user enters a Budget Amount and, where known, a Utilized Amount; the screen works out the Balance Amount and the header totals. Each budget has a company-unique Budget Code, may not overlap in time with any other budget of the company, and can be authorized, after which it is locked and can only change through the Budget Amendment screen. Saving a new budget also creates its first (zero) version so that later amendments have something to compare against and roll back to. Indent and purchase order budget checks, the budget register and the department budget enquiry read the stored budgets.
