- key: gate-pass-in
  name: Gate Pass In
  module: MM
  summary: 'The Gate Pass In screen records material that physically enters the premises through the gate: contractor material,
    direct returnable and non-returnable receipts, receipts against an earlier Gate Pass Out, loans taken or returned, replaceable
    items received against a Gate Pass Out raised from a GRN, subcontract material received back against a Subcontract Order
