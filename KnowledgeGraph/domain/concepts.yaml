    Evidence: code + ERP domain (inferred)
    The Sales Order Change Custom Status screen lets sales staff record a new company-defined ("custom") status against open sales order items in bulk. The user picks a sales order date range, presses "Show", and the grid lists every item line of authorized sales orders of the current company that are still Authorized or In Progress, with the customer, agent, item, ordered and balance quantities and the most recent custom status already recorded. For each line the user ticks "Select", chooses a "Current Status" and types a "Current Remark"; on Save every ticked line receives a new dated status entry under the "Entry Date". Entries are only ever added, so each item builds a status history. The custom statuses themselves are maintained centrally and enabled per company; the status history is read later by sales MIS reports and the production dashboard.
