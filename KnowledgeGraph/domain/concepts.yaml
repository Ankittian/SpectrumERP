- key: sales-return
  name: Sales Return
  module: SD
  summary: The Sales Return screen records goods that a customer sends back, either against a gate entry, an authorized tax
    invoice, a commercial invoice, or directly without any reference document.
  description: |
    Evidence: code + ERP domain (inferred)
    The Sales Return screen records goods that a customer sends back, either against a gate entry, an authorized tax invoice, a commercial invoice, or directly without any reference document. The user picks the customer and location, the source document type and one or more reference documents; the screen then proposes the returnable items with invoiced, previously returned and tolerance quantities, and the user enters challan and received quantities, rates, rejection reasons and taxes. Transport details (transporter, vehicle, LR, weight slip, freight type, from and to location), warehouse, customer complaint, e-way bill and e-invoice (IRN) details are captured on the header. When the return is saved as Authorized, the application brings the returned stock into the selected warehouse, posts the finance voucher (and, where the invoice had one, an expense-provision reversal voucher and a GST voucher), and refreshes the sales-order status of the affected order lines. Records are maintained per company and financial year, with numbering, division and finance book handled by the shared document control. Stores, sales, accounts and GST compliance teams depend on the stock, receivable and tax postings created here.
