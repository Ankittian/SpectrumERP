  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Guarantee screen (window caption "Bank Guarantee") records a bank guarantee that a vendor gives to the company as security for advances against purchase orders. The user enters the Vendor Name and Location, the Source Document type, the issuing Bank Name and Branch Name, the BG No., the BG Date and validity, the BG Amount and remarks, and then allocates the guarantee to the vendor's purchase orders. The screen shows for each order the total BG amount required by its payment terms, the amount already covered by other guarantees, the amount of expired guarantees and the balance still to cover. The guarantee goes through the document status flow from Initial to Authorized. The Advance Passing process (Inferred from its use of the same tables) later relies on the amount covered, and the purchase order delete operation checks the guarantee. This screen is a register: it posts no voucher. It is different from the [Bank Guarantee master](Functional_Doc_fBankGuarantee.md), which records guarantees with a purpose and type.
