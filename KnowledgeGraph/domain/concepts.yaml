- key: vendor-quotation
  name: Vendor Quotation
  module: MM
  synonyms:
  - Quotation
  - Offer
  summary: The Quotation screen records a vendor's priced offer against an authorized material Request For Quotation (RFQ).
  description: 'Evidence: code + ERP domain (inferred)

    The Quotation screen records a vendor''s priced offer against an authorized material Request For Quotation (RFQ). The
    user picks the RFQ, one of the vendors and vendor locations invited on it, and enters the vendor''s quotation number and
    date, validity, freight type, payment mode, credit days and currency; for each RFQ item the user ticks the quoted lines
    and enters quantity, rate and delivery days, with item-level and document-level taxes calculated by the shared tax control.
    Terms and conditions, custom fields, item sizes and technical parameters are captured with the quotation. Every save writes
    both the quotation and its base revision record, so later revisions (made on a separate revision screen) and the comparative
    statement can work from a consistent revision history. Saving also moves the RFQ to "partly quoted" or "completed" depending
    on whether every invited vendor location has quoted. The quotation is then compared on the Comparative Statement screen,
    booked, and converted into a purchase order.

    '
  related_to:
  - concept: rfq
    how: quotation received against the RFQ
