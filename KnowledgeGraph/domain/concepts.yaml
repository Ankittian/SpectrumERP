    The Inter Unit Stock Transfer screen (menu caption "InterUnit Stock Transfer") is a simplified version of the Stock Transfer screen, built for moving stock from a warehouse of the logged-in company to a warehouse of another group company in a single step [fInterUnitStockTransfer.Designer.vb:773]. It is documented here as a set of differences from the base screen; everything not listed works as described in [Stock Transfer Screen: Functional Documentation](Functional_Doc_fInvStockTransfer.md). The transfer type is always Company, the source is always Direct and processing is always 1 Step, so the header has only "Transfer To Company", "From Warehouse", "To Warehouse", "Requested By" and "Remarks" (BR-01). The user enters issue lines that are filled from stock lots, the screen builds receipt lines for the destination company's mapped items, and an authorized save issues the lots, receives new lots in the destination warehouse and, when finance is enabled, posts an issue voucher in the sending company's book and a receiving voucher in the destination company's book (BR-24 to BR-29). The screen saves into the same transfer records as the base screen but under its own document series and search list (BR-02, BR-31). The review found that the value of "Transfer To Company" is a combined text key that the screen converts straight to a number, so the screen may fail as soon as a company is chosen (BR-05; Section 13).
