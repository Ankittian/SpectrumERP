  module: FI
  synonyms:
  - Tax Code
  summary: The TDC Account Rule screen defines tax, duty and charge rules that group miscellaneous charges of one tax category
    under a single description, with an account basis (item basis or tax basis), an optional account type and an effective
    date.
  description: 'Evidence: code + ERP domain (inferred)

    The TDC Account Rule screen defines tax, duty and charge rules that group miscellaneous charges of one tax category under
    a single description, with an account basis (item basis or tax basis), an optional account type and an effective date.
    For tax categories it also records which tax attributes, natures and assessee types the rule covers, and for every rule
    it lists the screens on which the rule applies. The system assigns a TC code. Once charges are linked, the rule header
    becomes read-only, and charges used in an account rule definition cannot be unticked. Finance account rule definitions
    and tax-applicable purchase, sales and finance screens rely on these rules (Inferred).

    '
