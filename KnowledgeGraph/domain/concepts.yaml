    The Sales Order Status Category screen maintains the categories under which custom sales order statuses are grouped (for example production, dispatch or commercial stages, Inferred). Each category has an automatically generated code, a name and a serial number that fixes its display order. A new category becomes available in every company at once. Users can create, search, modify and delete categories; names and serial numbers must be unique. The Sales Order Custom Status master, sales order follow-up and production and dispatch reports rely on these categories downstream.
