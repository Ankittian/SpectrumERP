  module: MM
  synonyms:
  - Supplier
  - Customer
  - Party
  summary: 'The Vendor Card screen maintains the party master used across the application: transporters, agents, customers,
    suppliers, contractors and group companies are all created here as "vendors", each with one primary location.'
  description: 'Evidence: code + ERP domain (inferred)

    The Vendor Card screen maintains the party master used across the application: transporters, agents, customers, suppliers,
    contractors and group companies are all created here as "vendors", each with one primary location. A single save captures
    the party header (type, name, alias, mailing name, currency), the communication address and statutory registrations (GST,
    PAN, MSME, sales tax), contact persons, bank accounts, item part numbers, custom fields, vendor group membership and,
    where configured, Tally ledger names, divisions and company-wise inactive status. The screen enforces name uniqueness
    within the company, GST and PAN format checks, and a set of configurable mandatory-field checks that each installation
    can switch on as a warning or a hard stop. For new parties it automatically creates the linked ledger accounts and account
    rules from the vendor-type account mapping, so finance can post against the party at once. The head office governs the
    master: branch companies see the screen locked and cannot delete. Purchase, sales, dispatch and finance documents downstream
    rely on the party, its location, its tax registrations and its bank details.

    '
  parent_of:
  - vendor-location
  tables:
