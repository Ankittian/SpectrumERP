  name: Vendor Contact Person
  module: MM
  synonyms:
  - Contact Person
  summary: The Vendor Contact Person screen records the people to contact at a vendor location.
  description: 'Evidence: code + ERP domain (inferred)

    The Vendor Contact Person screen records the people to contact at a vendor location. Each contact belongs to one vendor
    and one of that vendor''s locations, and carries a name, designation, own address, phone, mobile, fax, e-mail, birth date
    and anniversary date. Contacts are given an automatic code and are made available to every company of the group on creation.
    A Fast Entry grid, with an Excel import, lets many contacts be keyed or loaded at once. Only the head office maintains
    contacts; other companies see a locked screen.

    '
  tables:
