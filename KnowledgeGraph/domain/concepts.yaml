    The Raw Material Issue screen (window caption "Material Issue", form code IGMI) issues stock from a warehouse to a department by Stock Item Group rather than by individual item. The user picks an item type (raw material by default), and the grid lists every active Stock Item Group of that type; for each group the user enters the quantity to issue and the system allocates it automatically to the oldest available stock lots of the items that belong to the group, or the user selects lots manually. The issue records who receives the material (employee, contractor or vendor), the warehouse, department, optional cost centre, reference number and remarks, and carries the standard document number, date, status and division. Once the document is authorized, stock is reduced lot by lot and, where finance is applicable, a journal voucher is posted from the lot values. Stores staff use the screen; cost accounting, stock ledgers and finance rely on the issue values downstream.
  tables:
  - Inventory.InvUnAuthorizedIssueDetail
  - Inventory.MaterialIssueExciseItemGroupDetail
  - Inventory.MaterialIssueItemDetail
  - Inventory.MaterialIssueLotDetail
  - Inventory.MaterialIssueMain
  - Inventory.MaterialIssueNotesDetail
- key: service-request
  name: Service Request
  module: MM
  summary: The Service Request screen (technical name fSCRequisition; window caption left as "fSCRequisition") raises an internal
    request for subcontracted services or job work.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Request screen (technical name fSCRequisition; window caption left as "fSCRequisition") raises an internal request for subcontracted services or job work. A department and cost center request either service items (for subcontract types 1 and 2) or a sequence of activities (subcontract type 3) and list the materials that go with them: items issued to the subcontractor, items returned, primary and secondary outputs, and repairable items with serial numbers. A request can be entered directly or created from a source document such as a work order, a material planning line, a service order configuration, a maintenance order, a service order or a tyre repair request; for work-order-based requests the screen proposes activities and materials from the work orders and BOM marks chosen. The request carries delivery schedules, rates, HSN/SAC codes, notes and custom fields, is numbered per financial year and moves through draft, released and authorized status. Purchasing then uses authorized requests to place service orders (Inferred), and project material planning statuses are updated from them.
  tables:
  - Inventory.SCReqActivityDetail
  - Inventory.SCReqCustomFieldDetail
  - Inventory.SCReqItemDetail
  - Inventory.SCReqItemSerialDetail
  - Inventory.SCReqMain
  - Inventory.SCReqMarkDetail
  - Inventory.SCReqNotesDetail
  - Inventory.SCReqScheduleDetail
  - Inventory.SCReqServiceDetail
  - Inventory.SCReqWorkOrderDetail
- key: state-master
  name: State Master
  module: MD
  summary: The State Master screen maintains the states (and union territories) of each country used across the enterprise.
  description: |
    Evidence: code + ERP domain (inferred)
    The State Master screen maintains the states (and union territories) of each country used across the enterprise. For each state the user selects the **Country Name**, enters the **State Name**, flags whether it is a **Union Territory** and records the two-character **GST State Code**; a code is generated automatically. States can be entered one at a time or in bulk through a fast entry grid that also accepts an Excel import. New states become available in every company; existing states can be changed only at the head office. Addresses, party masters and GST tax determination rely on these states (Inferred).
  tables:
  - masterdata.mStateMaster
  - masterdata.mStateMasterCompanyDetail
- key: stock-adjustment
  name: Stock Adjustment
  module: MM
  summary: The Stock Adjustment screen corrects book stock to match what was physically counted.
  description: |
    Evidence: code + ERP domain (inferred)
    The Stock Adjustment screen corrects book stock to match what was physically counted. The user picks a source document type and a warehouse, then chooses an authorized physical stock verification of that warehouse; the screen lists every verified item whose counted quantity differs from the system quantity, with the system quantity and value, the actual quantity and value, and the resulting adjusted quantity and value. For shortages the user confirms which stock lots are reduced (lots are proposed automatically); for excesses the user describes the new stock to be received (pieces, dimensions, heat, cast, test-certificate and serial details). Serial numbers and BIN-wise quantities are checked against the adjusted quantity. When the document is saved with status Authorized, stock is received into or issued from lots, and, where finance is enabled, a journal voucher is posted from the adjusted values. Stores staff and inventory controllers use the screen, and stock ledgers, valuation and finance rely on its result.
  tables:
  - Inventory.InvUnAuthorizedIssueDetail
  - Inventory.StockAdjustmentItemBINDetail
  - Inventory.StockAdjustmentItemDetail
  - Inventory.StockAdjustmentItemSerialDetail
  - Inventory.StockAdjustmentLengthDetail
  - Inventory.StockAdjustmentLotDetail
  - Inventory.StockAdjustmentMain
  - Inventory.StockAdjustmentNotesDetail
- key: stock-item-group
  name: Stock Item Group
  module: MD
  summary: 'The Stock Item Group screen maintains stock item groups (historically called excise item groups): named sets of
    items of one item type that are reported and issued together in a common unit.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Stock Item Group screen maintains stock item groups (historically called excise item groups): named sets of items of one item type that are reported and issued together in a common unit. For each group the user enters the **Stock Group Name**, chooses the **Item Type** and the group **Unit**, and lists the member items in the **Item Detail** grid with a conversion factor from the group unit to each item's own unit. A code is generated automatically and new groups become available in every company. Material issue by item group, excise RG registers, RG1 and Form IV statutory reports and quantity-wise balance sheet summaries read these groups (Inferred from the database procedures that use them).
  tables:
  - masterdata.mExciseItemGroup
  - masterdata.mExciseItemGroupCompanyDetail
  - masterdata.mExciseItemGroupItemDetail
- key: supplier-advance-request
  name: Supplier Advance Request
  module: MM
  summary: The Supplier Advance Request screen (window caption "Advance Request") records a request to pay a supplier an advance
    that is due under the payment terms of an authorised purchase order, sub-contract order or material agreement.
  description: |
    Evidence: code + ERP domain (inferred)
    The Supplier Advance Request screen (window caption "Advance Request") records a request to pay a supplier an advance that is due under the payment terms of an authorised purchase order, sub-contract order or material agreement. The user picks the vendor and location, the source document and one of its down-payment terms; the screen then shows the advance due, what was already requested, the tolerance allowed and the progress achieved, and proposes the amount still available. The user confirms the request amount or percentage, the payment mode and, for proforma-based terms, the proforma invoice details. The request is numbered, carries a document status (Initial, Release, Authorized) and copies the chosen payment term from the source document. It is maintained per company and financial year, and the printed payment advice and downstream supplier payment processing rely on it (Inferred).
  tables:
  - Finance.AdvanceRequestMain
  - Finance.AdvanceRequestPaymentTermsDetail
  - Finance.AdvanceRequestSourceDocumentDetail
- key: task-master
  name: Task Master
  module: MD
  summary: The Task Master screen maintains standard tasks used in project planning, together with their standard material
    and resource requirements.
  description: |
    Evidence: code + ERP domain (inferred)
    The Task Master screen maintains standard tasks used in project planning, together with their standard material and resource requirements. For each task the user enters the **Task Name**, chooses a **Task Category** (which shows the **Task Type**) and a **Unit**, and lists required items with make, quantity, rate and supply source, and required resources with usage and rate; amounts are calculated automatically. A code is generated automatically and new tasks become available in every company. Only the head office can edit; a task already mapped to a project keeps its name and unit fixed. Project task mapping and project costing rely on these tasks (Inferred from the project mapping check).
  tables:
  - masterdata.mTaskMaster
  - masterdata.mTaskMasterCompanyDetail
  - masterdata.mTaskMaterialDetails
  - masterdata.mTaskResourceDetails
- key: tax-book
  name: Tax Book
  module: MD
  summary: The Tax Book screen maintains tax books, the groupings of tax categories that the finance and tax set-up uses to
    classify taxes on documents.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tax Book screen maintains tax books, the groupings of tax categories that the finance and tax set-up uses to classify taxes on documents. A tax book is either a "Transaction" book, which lists the tax categories it covers (for example VAT, TDS, TCS or GST), or a "Main" book, which is built from a selection of Transaction books. The user enters a name, chooses the type and ticks the categories or Transaction books in the grid that matches the type; a code is generated automatically. Tax books are shared by the whole enterprise and can be marked inactive. Tax code, TDS and statutory register set-ups read these books to decide which taxes apply (Inferred from other procedures that filter on tax book type).
  tables:
  - masterdata.mTaxBookCategoryDetail
  - masterdata.mTaxBookDetail
  - masterdata.mTaxBookMain
- key: terms-condition
  name: Terms & Condition
  module: MD
  summary: The Terms & Condition screen maintains the library of standard terms and conditions text used on commercial documents.
  description: |
    Evidence: code + ERP domain (inferred)
    The Terms & Condition screen maintains the library of standard terms and conditions text used on commercial documents. Each entry belongs to a Terms and Condition head (for example payment, delivery or warranty) and holds up to 1000 characters of clause text; a code is generated automatically. The same text cannot be recorded twice under the same head. New entries are saved as authorised and become available in every company of the group. Only the head office can edit; other companies see the screen locked. Purchase and sales documents that print or pick standard terms rely on this library (Inferred).
  tables:
  - masterdata.mTermsNCondition
  - masterdata.mTermsNConditionCompanyDetail
- key: value-stock-adjustment
  name: Value Stock Adjustment
  module: MM
  summary: The Value Stock Adjustment screen (technical name fStockValueAdjustment, requested as "Stock Value Adjustment")
    revalues stock that is already held in a warehouse without changing its quantity.
  description: |
    Evidence: code + ERP domain (inferred)
    The Value Stock Adjustment screen (technical name fStockValueAdjustment, requested as "Stock Value Adjustment") revalues stock that is already held in a warehouse without changing its quantity. The user picks a warehouse, enters the items (with optional make and technical grade) to be revalued, and the screen brings in every stock lot of the item held on the document date with its quantity, rate and stock value. The user states the new (actual) value either for the whole item, which is spread over its lots in proportion to their current value, or lot by lot. The difference between actual and stock value is the adjusted amount. When the document is saved as Authorized, the difference is booked into each lot's rate history and, where finance is enabled, a journal voucher for a positive net difference is posted. Stores accountants and inventory controllers use it; stock valuation, issue costing and finance rely on its result.
  tables:
  - Inventory.StockValueAdjustmentItemDetail
  - Inventory.StockValueAdjustmentLotDetail
  - Inventory.StockValueAdjustmentMain
  - Inventory.StockValueAdjustmentNotesDetail
- key: account-mapping
  name: Account Mapping
  module: MD
  summary: The Account Mapping screen links the account groups, subgroups and ledger accounts of a chart of accounts to the
    sections and groups of a financial statement layout.
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Mapping screen links the account groups, subgroups and ledger accounts of a chart of accounts to the sections and groups of a financial statement layout. The user picks a layout (**FSL Name**), sees the chart of accounts it is built on (**COA Name**), and then assigns a **Section/ Group Name** to each group or account in an indented tree. Choosing a section on a group copies it to everything beneath that group. Display can be limited to all, mapped or unmapped accounts. The screen has no search or delete of its own: every save replaces the mapping of the selected layout. Financial statement reports such as the balance sheet and cash flow layouts read these mappings to place balances (Inferred).
  tables:
  - masterdata.FSLayoutDesignAccountDetail
  - masterdata.FSLayoutDesignGroupDetail
- key: attribute-master
  name: Attribute Master
  module: MD
  summary: The Attribute Master screen (window caption "ItemAttribute") defines item attributes, such as a size, grade or
    colour, that can be recorded against stock items.
  description: |
    Evidence: code + ERP domain (inferred)
    The Attribute Master screen (window caption "ItemAttribute") defines item attributes, such as a size, grade or colour, that can be recorded against stock items. For each attribute the user records a name, a short alias, a sequence number and the value type (Numeric, Decimal or Character). In a two-level grid the user then ticks the item subgroups and the individual items to which the attribute applies; ticking a subgroup ticks all of its items. Codes are generated automatically and each new attribute is made available in every company. Once an attribute is used in attribute combinations its name, alias and value type are locked. Inventory screens that record attribute values and attribute-wise stock rely on these definitions (Inferred).
  tables:
  - masterdata.mItemAttributeCompanyDetail
  - masterdata.mItemAttributeMaster
- key: check-list-document-group
  name: Check List Document Group
  module: MD
  summary: The Check List Document Group screen maintains named groups of document check list items, such as the set of documents
    required for a particular kind of export shipment (Inferred).
  description: |
    Evidence: code + ERP domain (inferred)
    The Check List Document Group screen maintains named groups of document check list items, such as the set of documents required for a particular kind of export shipment (Inferred). Each group has an automatically generated code, a description and a list of check list documents chosen from the Document Check List master. Groups are created centrally by the head office and are made available in every company; other companies see the screen locked. Users can create, search, navigate, modify and delete groups. Sales orders, dispatch challans and the commercial, excise and service invoice screens use these groups to bring in their document check lists (Inferred).
  tables:
  - masterdata.mDocCheckListGroup
  - masterdata.mDocCheckListGroupCompanyDetail
  - masterdata.mDocCheckListGroupDetail
- key: commission-terms
  name: Commission Terms
  module: MD
  summary: The Commission Terms screen (window caption "Sales Commision Terms") defines the terms on which agents earn commission
    on sales.
  description: |
    Evidence: code + ERP domain (inferred)
    The Commission Terms screen (window caption "Sales Commision Terms") defines the terms on which agents earn commission on sales. Each term has a description, a validity period, a sales region, a calculation basis (a percentage, a rate, or flat values by range), a rate, a setting type (including a broker and sub-broker variant that adds a distributor rate), and the agents, items, customers and states or cities to which it applies. Codes ("SC" plus four digits) are generated automatically. Only the head office can maintain terms; other companies see the screen locked. Commission calculation on sales documents relies on these terms (Inferred).
  tables:
  - masterdata.mSalesCommissionTerms
  - masterdata.mSalesCommissionTermsAgentDetail
  - masterdata.mSalesCommissionTermsCustomerDetail
  - masterdata.mSalesCommissionTermsFlatDetail
  - masterdata.mSalesCommissionTermsItemDetail
  - masterdata.mSalesCommissionTermsRegionDetail
- key: cost-group
  name: Cost Group
  module: MD
  summary: The Cost Group screen maintains the cost groups under which cost heads are classified for estimation and pre-calculation
    of sales jobs.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cost Group screen maintains the cost groups under which cost heads are classified for estimation and pre-calculation of sales jobs. For each cost group the user records a name and a sequence number (**S. No.**) that sets its display order, and, where the company's sales setting requires it, ticks the users who are allowed to work with that group. Codes are generated automatically and a new cost group is made available in every company at the moment it is created. The screen has no head-office restriction: any company can create, change or delete cost groups, and the changes apply across the enterprise. Cost heads, sales estimates, quotations and pre-calculation reports rely on these groups, and the user assignment limits which groups a user sees in pre-calculation reporting (Inferred).
  tables:
  - masterdata.mCostGroupCompanyDetail
  - masterdata.mCostGroupMain
  - masterdata.mCostGroupUserDetail
- key: cost-head
  name: Cost Head
  module: MD
  summary: The Cost Head screen maintains the individual cost lines (cost heads) that make up sales estimates and pre-calculations,
    and that also appear on invoices, export cost details, price masters and Inco Term settings.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cost Head screen maintains the individual cost lines (cost heads) that make up sales estimates and pre-calculations, and that also appear on invoices, export cost details, price masters and Inco Term settings. Each cost head has a type (Cost, Freight or Insurance), a name, the cost group it belongs to, a sequence number within that group, and a calculation nature (Add or Subtract). Depending on a company sales setting, the user either defines how the head is calculated from other elements (cost groups, other cost heads, material cost, cost elements, expense heads, taxes, margins and totals) and which elements it is a percentage of, together with an Excel cell reference, or simply marks whether it is calculated on item quantity. Codes are generated automatically, every save is recorded as authorised, and a new cost head is made available in every company. Estimation, quotation, sales order, invoice and outward bill processes depend on these heads (Inferred).
  tables:
  - masterdata.mCostHeadEROSCalculationfrom
  - masterdata.mCostHeadEROSCompanyDetail
  - masterdata.mCostHeadEROSMain
  - masterdata.mCostHeadEROSPercentOf
- key: customer-enquiry
  name: Customer Enquiry
  module: SD
  summary: The Customer Enquiry screen records a customer's request for quotation as a numbered sales document of the current
    company and financial year.
  description: |
    Evidence: code + ERP domain (inferred)
    The Customer Enquiry screen records a customer's request for quotation as a numbered sales document of the current company and financial year. It captures who is asking (customer, customer location, contact person, agent, sales person), the customer's own RFQ reference and date, the enquiry type, material nature, priority and channel, the sales category (domestic or export), and the key dates by which a quotation must be submitted and an order is expected. Codified-material enquiries list catalogue items with unit, quantity, required date and an optional quality specification per item; non-codified enquiries list free-text particulars instead. Export enquiries carry Inco Terms, port, place of delivery, packing instruction and a QC flag, and divisions configured for lift business link the enquiry to specific lifts. The document follows the Initial, Release and Authorized workflow; an authorized enquiry is read-only. Sales quotations, enquiry rejections, quotation closings and the sales MIS registers all use the enquiries saved here.
  tables:
  - Sales.CustomerEnquiryCustomFieldDetail
  - Sales.CustomerEnquiryItemDetail
  - Sales.CustomerEnquiryItemSpecificationDetail
  - Sales.CustomerEnquiryLiftDetail
  - Sales.CustomerEnquiryMain
  - Sales.CustomerEnquiryNotesDetail
  - Sales.CustomerEnquiryParticularDetail
- key: delivery-challan
  name: Delivery Challan
  module: SD
  summary: The Delivery Challan screen records the goods that physically leave the company, either to a customer or back to
    a supplier.
  description: |
    Evidence: code + ERP domain (inferred)
    The Delivery Challan screen records the goods that physically leave the company, either to a customer or back to a supplier. On this VTPL variant there are two kinds of challan: dispatch to a customer, raised directly, from a Sales Order or from a Packing List, and purchase return, raised against a goods receipt (GRN). The screen captures the customer and consignee, transport and e-way bill details, export details, the items with their stock lots and serial numbers, BOM lines for structure dispatches, packing material, documents sent with the goods, excise challans, notes and custom fields. When the document is saved unauthorized, the selected stock is only held provisionally. When it is saved as Authorized, the stock is actually issued from the lots and, if the finance rules allow it, an inventory journal voucher is posted. The challan feeds sales order dispatch status, invoices, gate passes and outward bill entries. Warehouse, sales and accounts staff of the logged-in company and financial year all depend on it.
  tables:
  - Inventory.InvLotItemSerialNoDetail
  - Inventory.InvUnAuthorizedIssueDetail
  - Sales.DispatchChallan
  - Sales.DispatchChallanBOMDetail
  - Sales.DispatchChallanCustomFieldDetail
  - Sales.DispatchChallanDocDetail
  - Sales.DispatchChallanItemDetail
  - Sales.DispatchChallanItemLotDetail
  - Sales.DispatchChallanItemPackingDetail
  - Sales.DispatchChallanItemSerialDetail
  - Sales.DispatchChallanItemSpecificationDetail
  - Sales.DispatchChallanNotesDetails
  - Sales.DispatchChallanPackingMaterialDetail
  - Sales.DispatchChallanPackingMaterialLotDetail
- key: dispatch-challan
  name: Dispatch Challan
  module: SD
  summary: The Dispatch Challan screen records the physical dispatch of goods from a company warehouse to a customer, a subcontractor,
    a sister unit or (for purchase returns) a supplier.
  description: |
    Evidence: code + ERP domain (inferred)
    The Dispatch Challan screen records the physical dispatch of goods from a company warehouse to a customer, a subcontractor, a sister unit or (for purchase returns) a supplier. A challan is raised directly or against a reference document (sales order, dispatch planning, dispatch advise, MDN, AMC card, GRN or SC material receipt, tax invoice for export and others), and captures the customer and consignee, transport and e-way bill details, export details, the items with quantities, the stock lots and serial numbers issued, optional packing details, a document checklist and custom fields. The screen enforces order-balance, stock, lot, weighment, GST/e-way and configurable company validations before saving. While the challan is in Initial or Release status the chosen lots are only held; on authorization the stock is actually issued, a finance journal voucher can be posted in the same transaction and the sales order dispatch status is refreshed. Authorized challans can no longer be modified. Downstream, invoices, commercial invoices, service invoices, outward bill entries and gate passes are raised against the challan.
  tables:
  - Inventory.InvLotItemSerialNoDetail
  - Inventory.InvUnAuthorizedIssueDetail
  - Sales.DispatchChallan
  - Sales.DispatchChallanBOMDetail
  - Sales.DispatchChallanCustomFieldDetail
  - Sales.DispatchChallanDocDetail
  - Sales.DispatchChallanItemDetail
  - Sales.DispatchChallanItemLotDetail
  - Sales.DispatchChallanItemPackingDetail
  - Sales.DispatchChallanItemSerialDetail
  - Sales.DispatchChallanItemSpecificationDetail
  - Sales.DispatchChallanItemTaxDetail
  - Sales.DispatchChallanNotesDetails
  - Sales.DispatchChallanPackingMaterialDetail
  - Sales.DispatchChallanPackingMaterialLotDetail
  - Sales.DispatchChallanTaxDetail
- key: enquiry-rejection
  name: Enquiry Rejection
  module: SD
  summary: The Enquiry Rejection screen records the company's decision not to quote, in whole or in part, for an authorized
    customer enquiry.
  description: |
    Evidence: code + ERP domain (inferred)
    The Enquiry Rejection screen records the company's decision not to quote, in whole or in part, for an authorized customer enquiry. The user picks the enquiry, enters an entry date and a rejection reason, and for codified-material enquiries chooses which item lines are rejected, each with its own reason. The screen marks the rejected item or particular lines as "Reject" so that they drop out of the lists of enquiries still open for quotation. It also tries to set the enquiry header status from the items that remain open. Rejections can be searched, modified and deleted; deleting a rejection reopens the lines. The reason is shown back on the Customer Enquiry screen and is offered as a reusable reason on later rejections. Sales management uses it to understand lost or declined business.
  tables:
  - Sales.EnquiryRejection
- key: enquiry-type
  name: Enquiry Type
  module: MD
  summary: The Enquiry Type screen maintains the types used to classify customer enquiries, together with the default commercial
    content each type carries.
  description: |
    Evidence: code + ERP domain (inferred)
    The Enquiry Type screen maintains the types used to classify customer enquiries, together with the default commercial content each type carries. For each enquiry type the user records a name and, in three tabs, default payment terms, terms and conditions, and custom field values. Payment terms can be typed in or copied from a predefined pay term template. Codes are generated automatically and every new type is made available in every company of the group. Customer enquiries, enquiry reports and enquiry notifications rely on these types (Inferred).
  tables:
  - masterdata.mEnquiryType
  - masterdata.mEnquiryTypeCompanyDetail
  - masterdata.mEnquiryTypeCustomFieldDetail
  - masterdata.mEnquiryTypePaymentTerms
  - masterdata.mEnquiryTypeTnCDetail
- key: inco-terms-master
  name: INCO Terms Master
  module: MD
  summary: The INCO Terms Master screen (window caption "IncoTermMaster") maintains the delivery terms (INCO terms) used on
    sales documents, together with the expense heads that each term brings with it.
  description: |
    Evidence: code + ERP domain (inferred)
    The INCO Terms Master screen (window caption "IncoTermMaster") maintains the delivery terms (INCO terms) used on sales documents, together with the expense heads that each term brings with it. For each term the user records a name, a description and whether insurance applies. In an expense grid the user lists the cost heads that apply under the term, with rate type, currency, whether the head is mandatory, whether it is local freight, whether it is calculated on item quantity, and on which billing documents (Dispatch Challan, Tax Invoice, Commercial Invoice) it is used. Codes are generated automatically and every new term is made available in every company. Dispatch and invoicing documents rely on these definitions to bring in the right charges (Inferred).
  tables:
  - masterdata.mIncoTermMaster
  - masterdata.mIncoTermMasterCompanyDetail
  - masterdata.mIncoTermMasterExpenseHeadDetail
  - masterdata.mIncoTermMasterExpenseHeadFormDetail
- key: layout-design
  name: Layout Design
  module: MD
  summary: The Layout Design screen (window caption "FSLayoutDesign") builds the structure of a financial statement layout,
    such as a balance sheet, profit and loss or cash flow statement.
  description: |
    Evidence: code + ERP domain (inferred)
    The Layout Design screen (window caption "FSLayoutDesign") builds the structure of a financial statement layout, such as a balance sheet, profit and loss or cash flow statement. Each entry is a **Section** (top level) or a **Group** (under a parent section or group) within a chosen layout (**FSL Name**), with a sequence, nature, classification, report component, schedule, display options for negative balances and summaries, and a value source: mapped to accounts, computed by a formula over other groups, or a fixed value. A read-only tree shows the existing structure of the chosen layout. A fast entry grid with Excel import allows many sections and groups to be created at once. Codes ("LD" plus four digits) are generated automatically. Financial statement generation, layout opening balances and the account/group mapping screens depend on this structure.
  tables:
  - masterdata.FSLayoutDesignMaster
- key: lut-master
  name: LUT Master
  module: MD
  summary: The LUT Master screen records the company's Letters of Undertaking (LUT), the tax authority acceptance that allows
    exports without payment of tax (Inferred).
  description: |
    Evidence: code + ERP domain (inferred)
    The LUT Master screen records the company's Letters of Undertaking (LUT), the tax authority acceptance that allows exports without payment of tax (Inferred). For each LUT the user records the **LUT No.**, the export type it covers, the accepted date and the validity date. LUTs belong to the logged-in company, and LUT numbers must be unique within the company. Users can create, search, navigate, modify and delete LUTs. Sales orders, sales order amendments, dispatch challans and export invoices offer the LUTs whose accepted-to-validity period covers the document date.
  tables:
  - Finance.LUTMaster
- key: measurement-parameter
  name: Measurement Parameter
  module: MD
  summary: The Measurement Parameter screen maintains the list of parameters that can be measured or recorded against equipment,
    service contracts and similar records, for example a reading, a dimension or a yes/no check.
  description: |
    Evidence: code + ERP domain (inferred)
    The Measurement Parameter screen maintains the list of parameters that can be measured or recorded against equipment, service contracts and similar records, for example a reading, a dimension or a yes/no check. For each parameter the user records a name, the kind of value it holds (data type), whether it is a running or static value (nature), and its unit of measure. Codes are generated automatically and every new parameter is made available in every company of the group. The screen has no head-office restriction, so any company can create, change or delete a parameter for the whole group. Customer service contracts and service orders and the equipment master read these parameters (Inferred).
  tables:
  - masterdata.mMeasurementParameter
  - masterdata.mMeasurementParameterCompanyDetail
- key: multiple-layout-mapping
  name: Multiple Layout Mapping
  module: MD
  summary: The Multiple Layout Mapping screen maps one ledger account, or one account group, to several sections or groups
    of a financial statement layout at the same time.
  description: |
    Evidence: code + ERP domain (inferred)
    The Multiple Layout Mapping screen maps one ledger account, or one account group, to several sections or groups of a financial statement layout at the same time. The user picks a layout (**FSL Name**), sees its chart of accounts (**COA Name**), chooses whether to map an **Account** or a **Group** (**Type**), picks the account or group, and lists the layout headings it should appear under. For each heading the screen shows which balance the heading reports (opening, closing, period credit, period debit or period net). Mapping a group also maps the accounts directly under it. It complements the Account Mapping screen, which maps each line to only one heading at a time. Financial statement reports read these mappings (Inferred).
  tables:
  - masterdata.FSLayoutDesignAccountDetail
  - masterdata.FSLayoutDesignGroupDetail
- key: order-nature
  name: Order Nature
  module: MD
  summary: The Order Nature screen (window caption "OrderNature") maintains the natures used to classify sales orders and
    bills of material in the VTPL production area.
