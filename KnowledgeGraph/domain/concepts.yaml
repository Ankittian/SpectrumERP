- key: gate-entry-fgateentrydrm
  name: Gate Entry
  module: DRM
  summary: The Gate Entry screen for discrete raw material records each inward vehicle carrying raw material for the discrete
    raw material stores, before the material is received on a Stores Inward Note.
  description: |
    Evidence: code + ERP domain (inferred)
    The Gate Entry screen for discrete raw material records each inward vehicle carrying raw material for the discrete raw material stores, before the material is received on a Stores Inward Note. The user chooses a Source Document (Direct, Purchase Order, Stock Transfer, Dispatch Challan or Sales Order), the supplier or party and its location, and the reference orders and items on the vehicle. The screen also captures the supplier challan, transporter, driver, vehicle, lorry receipt, eWay-Bill, freight and location details. It blocks duplicate challans, blacklisted vehicles and wrong dates, and limits stock transfer quantities to the order quantity. It is a lighter variant of the standard [Gate Entry](Functional_Doc_fGateEntry.md): it lists only discrete raw material items and omits the tolerance, weighment, currency and repeat-entry features of that screen. Stores and security staff use it, and the Stores Inward Note and gate-out processes rely on its records.
