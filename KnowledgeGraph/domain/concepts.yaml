  - Inventory.QDAStocktransferMain
- key: receipt-acknowledgement
  name: Receipt Acknowledgement
  module: SD
  summary: The Receipt Acknowledgement screen records that a customer has received goods that were dispatched.
  description: |
    Evidence: code + ERP domain (inferred)
    The Receipt Acknowledgement screen records that a customer has received goods that were dispatched. The user chooses a customer, a customer location, the kind of source document (dispatch challan or sales invoice) and a date range, and the screen lists the authorized source documents for that location. For each ticked document line the user confirms the delivered quantity and delivery date; the screen works out the shortage or excess, proposes a Credit Note, Debit Note or None adjustment type, and calculates the payment due date from the credit days of the invoice. For items that are tracked by serial number, the serial numbers actually acknowledged are ticked in a popup. When the acknowledgement is saved as Authorized, the payment due date recorded against the sales invoice in finance is updated [Sales.SDRASaveItemDetail:88-102]. Finance and inventory documents later read the acknowledged quantities [Finance.FIFIFillValuesDependent:536] [Inventory.MMPRFillValuesDependent:223-235].
