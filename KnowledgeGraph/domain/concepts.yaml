concepts:
- key: account-determination-rule
  name: Account Determination Rule
  module: FI
  synonyms:
  - Account Rule
  summary: The Account Rule Definition screen tells the system which ledger account to use when a business document is posted
    to finance.
  description: 'Evidence: code + ERP domain (inferred)

    The Account Rule Definition screen tells the system which ledger account to use when a business document is posted to
    finance. The user picks one posting account and then ties it to the business objects that should post to it: sale posting
    rules, tax and miscellaneous charge rules, supplier and customer locations, items and item sub groups, payroll components,
    finance books, employees, and intermediate posting bases such as expense heads or service items. Which of these lists
    is offered depends on the type of the selected account, so a sales revenue account is linked to sale rules and items,
    a tax account to tax charge rules, and a supplier control account to supplier locations. The screen prevents the same
    object from being mapped twice to accounts of the same type, so that posting is unambiguous. Rules are defined centrally
    at head office; when the screen is used from another company an opened rule is shown locked (see Section 13 for gaps).
    Finance posting of purchase, sales, inventory, payroll and voucher documents relies on these rules downstream.

    '
  related_to:
  - concept: ledger-account
    how: account chosen by the rule
  tables:
  - Finance.ARDFinanceBookRule
  - Finance.ARDImprestRule
  - Finance.ARDIntermediatePostingAccountRule
  - Finance.ARDItemRule
  - Finance.ARDItemSubGroupRule
  - Finance.ARDMain
  - Finance.ARDPayrollComponentRule
  - Finance.ARDSaleAccountRule
  - Finance.ARDTDCAccountRule
  - Finance.ARDVendorLocationRule
- key: account-group
  name: Account Group
  module: FI
  synonyms:
  - Ledger Group
  summary: The Account Group Master screen maintains the hierarchy of account groups within each Chart of Accounts (COA).
  description: 'Evidence: code + ERP domain (inferred)

    The Account Group Master screen maintains the hierarchy of account groups within each Chart of Accounts (COA). Each group
    belongs to one COA, sits under a parent group, may point to an alternate group, and inherits its nature (and its default
    reference and cost center settings) from the parent. Groups can be created one at a time, in a fast entry grid, or by
    importing an Excel sheet into that grid. Maintenance is reserved for the head office company; other companies can only
    view groups. System default groups and groups of reporting-type COAs are protected from key changes. Ledger accounts and
    financial statements downstream depend on this hierarchy for classification.

    '
  parent_of:
  - ledger-account
  tables:
  - masterdata.mAccountGroup
- key: accounting-period
  name: Accounting Period Mapping
  module: FI
  synonyms:
  - Calendar Period Mapping
  summary: The FB Period Mapping screen (menu caption "Calendar Period Mapping") links accounting periods to a finance book
    or to a depreciation book.
  description: 'Evidence: code + ERP domain (inferred)

    The FB Period Mapping screen (menu caption "Calendar Period Mapping") links accounting periods to a finance book or to
    a depreciation book. The user picks a calendar type, then a finance book or depreciation book, ticks the financial years
    that apply, and for each period of those years sets Open or Close status and marks exactly one beginning period. The beginning
    period also sets the book''s opening date. Years and beginning periods that already carry vouchers, references, opening
    balances or depreciation cannot be unticked. Finance and fixed asset users rely on these period statuses and the opening
    date when posting and depreciating (Inferred).

    '
  related_to:
  - concept: finance-book
    how: periods of the book
  tables:
  - masterdata.mDBPeriodDetail
  - masterdata.mFBPeriodDetail
- key: accounting-voucher
  name: Accounting Voucher
  module: FI
  synonyms:
  - Journal
  - Voucher
  summary: Ledger posting (debit / credit lines) created by finance posting from transactions.
  description: 'Evidence: code + ERP domain (inferred)

    Ledger posting (debit / credit lines) created by finance posting from transactions. Looked up by the in-scope forms through
    Finance.accVoucherDetail, Finance.accVoucherMain.

    '
  tables:
  - Finance.accVoucherDetail
  - Finance.accVoucherMain
- key: bin
  name: Bin Card
  module: MM
  synonyms:
  - Storage Bin
  summary: The BIN Card screen maintains storage bins inside warehouses for the login company.
  description: 'Evidence: code + ERP domain (inferred)

    The BIN Card screen maintains storage bins inside warehouses for the login company. Each bin has a BIN Card No., a physical
    location description, a warehouse, an optional division, an optional maximum capacity and an inactive flag. The user also
    states which items may be stored in the bin, either by ticking whole sub groups (and their items) or by ticking individual
    items. Bins can be created singly, in a fast entry grid, or by importing an Excel sheet. Bins cannot be created while
    logged into the head office. Stores users and stock transactions that record bin-level placement depend on this data (Inferred).

    '
  related_to:
  - concept: warehouse
    how: warehouse that holds the bin
  tables:
  - masterdata.mBinCard
  - masterdata.mBinCardItemDetail
  - masterdata.mBinCardSubgroupDetail
- key: chapter-heading
  name: Chapter Heading
  module: MM
  synonyms:
  - Tariff Chapter
  summary: The Chapter Heading screen maintains chapter headings, the tariff chapter numbers under which items are classified
    for excise and customs purposes (Inferred from the term), and the items that belong to each heading.
  description: 'Evidence: code + ERP domain (inferred)

    The Chapter Heading screen maintains chapter headings, the tariff chapter numbers under which items are classified for
    excise and customs purposes (Inferred from the term), and the items that belong to each heading. The user enters the chapter
    number and a description, and ticks the applicable items in a group, subgroup and item tree. Headings must be unique after
    ignoring punctuation and spaces. Besides single entry, the screen offers a fast entry grid and an Excel import for creating
    many headings at once. Only the head office can edit; new headings are made available to every company and saved directly
    as authorised. Item masters and tax documents that print or use the chapter heading rely on this list (Inferred).

    '
  tables:
  - masterdata.mChapterHeading
  - masterdata.mChapterHeadingCompanyDetail
  - masterdata.mItemChapterDetail
- key: chart-of-accounts
  name: Chart of Accounts
  module: FI
  synonyms:
  - COA
  summary: The Chart Of Account screen maintains the charts of accounts (COA) of the enterprise.
  description: 'Evidence: code + ERP domain (inferred)

    The Chart Of Account screen maintains the charts of accounts (COA) of the enterprise. Each chart has an automatic code,
    a name and a type: Reporting or Operative. When a new chart is created, its account group tree is built automatically,
    either from the system default account groups or by copying the groups of an existing chart of the same type, optionally
    including its account placements ("Copy With Ledgers"). The screen also shows which finance books use the chart and previews
    the group and account structure of a chart being imported. Charts are enterprise-wide. Account masters, finance books,
    the Reporting COA Setup screen and all finance reporting rely on these charts (Inferred).

    '
  parent_of:
  - account-group
  tables:
  - masterdata.COAAccountGroupDetail
  - masterdata.COAMain
- key: city
  name: City
  module: MM
  synonyms:
  - District
  summary: The City Master screen maintains cities within states and countries, and lets a city be flagged as a district or
    be linked to a district city of the same state.
  description: 'Evidence: code + ERP domain (inferred)

    The City Master screen maintains cities within states and countries, and lets a city be flagged as a district or be linked
    to a district city of the same state. The system assigns a city code and makes each new city available to all companies.
    When a city is first saved and no location exists for it, a location of the same name is created automatically. Cities
    are entered at head office; other companies view them read-only after a record is loaded or cleared. A Fast Entry mode
    with Excel import supports bulk creation. Customer, supplier, company and location addresses rely on these cities downstream
    (Inferred).

    '
  tables:
  - masterdata.mCityMaster
  - masterdata.mCityMasterCompanyDetail
- key: company
  name: Company
  module: MM
  summary: Legal company under which masters are activated and documents are recorded.
  description: 'Evidence: code + ERP domain (inferred)

    Legal company under which masters are activated and documents are recorded. Looked up by the in-scope forms through masterdata.mCompanyMaster.

    '
  tables:
  - masterdata.mCompanyMaster
- key: comparative-statement
  name: Comparative Statement
  module: MM
  synonyms:
  - CS
  - Quote Comparison
  summary: The CS screen builds a side-by-side comparative statement for one authorized material Request For Quotation (RFQ).
  description: 'Evidence: code + ERP domain (inferred)

    The CS screen builds a side-by-side comparative statement for one authorized material Request For Quotation (RFQ). For
    every RFQ item it lays out, vendor by vendor, the quoted quantity, rate, delivery date, item-level taxes, total amount,
    GST, landed rate, HSN/SAC code, optional item remarks and technical parameters, together with the last purchase price
    of the item; it also shows document-level net amount, GST, landed rate and the vendors'' terms and conditions. Authorized
    quotations (latest authorized revision) and currently valid vendor rate agreements that cover RFQ items are both included
    as columns. The screen highlights the lowest landed rate per item, the earliest delivery and the lowest overall landed
    value, and colour-codes booking progress. From the grid the buyer books a quantity and rate against a chosen vendor for
    purchase-order creation, edits or cancels bookings; the comparative statement itself is not saved, only the bookings are.
    The statement can be printed, previewed and exported to Excel or PDF with a subject line and signature blocks.

    '
  related_to:
  - concept: vendor-quotation
    how: quotations compared side by side
- key: cost-center
  name: Cost Center
  module: FI
  summary: The Cost Center Master screen maintains the hierarchy of cost centers to which costs, stock lots, vouchers and
    maintenance assets are charged.
  description: 'Evidence: code + ERP domain (inferred)

    The Cost Center Master screen maintains the hierarchy of cost centers to which costs, stock lots, vouchers and maintenance
    assets are charged. A user enters a Cost Center Name and an optional Parent Cost Center; the system assigns a code. Cost
    centers are created centrally at head office and are made available to every company; in a multi-company setup head office
    also decides in which companies each cost center is inactive. Once a cost center is used in stock lots, finance vouchers,
    equipment or functional locations, its name and parent are locked. A Fast Entry mode with Excel import supports bulk creation.

    '
  tables:
  - masterdata.mCostCenterMaster
  - masterdata.mCostCenterMasterCompanyDetail
- key: currency
  name: Currency
  module: FI
  summary: The Currency Master screen maintains the currencies used across the enterprise.
  description: 'Evidence: code + ERP domain (inferred)

    The Currency Master screen maintains the currencies used across the enterprise. For each currency the user records its
    name, fractional currency name (for example paise or cents), notation, symbol and translation type (exchange rate or inverse
    rate), and ticks the countries that use it. Codes are generated automatically and new currencies become available in every
    company. Only the head office can edit; other companies see the screen locked. Foreign currency documents, exchange rate
    entry and party masters rely on these currencies (Inferred).

    '
  tables:
  - masterdata.mCurrencyCountryDetail
  - masterdata.mCurrencyMaster
  - masterdata.mCurrencyMasterCompanyDetail
- key: currency-exchange-rate
  name: Currency Exchange Rate
  module: FI
  synonyms:
  - Conversion Rate
  summary: The Currency Conversion screen records exchange rates between the company's base currency and foreign currencies
    for a validity period.
  description: 'Evidence: code + ERP domain (inferred)

    The Currency Conversion screen records exchange rates between the company''s base currency and foreign currencies for
    a validity period. For each exchange rate type (Standard, Buying, Selling) and exchange currency the user enters either
    an exchange rate or an inverse rate, depending on the translation type, and an optional tolerance band in percentage or
    amount. The screen prevents overlapping validity periods for the same currency and rate type and automatically closes
    the previous open-ended rate when a newer one is saved. Rates are maintained centrally at head office; other companies
    view them read-only. Purchase, sales and finance documents in foreign currency use these rates and tolerance bands (Inferred).

    '
  related_to:
  - concept: currency
    how: rates of the currency
  tables:
  - masterdata.mCurrencyConversion
- key: document-receipt
  name: Document Receipt
  module: FI
  synonyms:
  - Bill Inward
  summary: The Document Receipt screen records the arrival of a party document, such as a purchase invoice, debit/credit note
    or subcontract bill, before Finance processes it.
  description: 'Evidence: code + ERP domain (inferred)

    The Document Receipt screen records the arrival of a party document, such as a purchase invoice, debit/credit note or
    subcontract bill, before Finance processes it. The user captures who sent the document (party and location), the party''s
    own document number, date, amount and tax amount, how it arrived, who received it and which module it was forwarded to.
    Optionally the receipt is tied to one or more source documents (GRN, Gate Pass, MRA or SIN) of the same party, so that
    Finance knows which receipts and goods the bill covers. Each receipt gets an automatic yearly Receipt Entry No. per company
    and financial year. The screen prevents the same party document number from being recorded twice for the same party in
    the same financial year, and blocks changes once a Purchase Bill, Service Bill or Debit/Credit Note has been prepared
    against the receipt. Accounts payable staff who later prepare bills benefit from a single register of received documents.

    '
  tables:
  - Finance.DocumentReceiptCustomFieldDetail
  - Finance.DocumentReceiptMain
  - Finance.DocumentReceiptNotesDetail
  - Finance.DocumentReceiptReferenceDetail
- key: expense-head
  name: Expense Head
  module: FI
  summary: The Expense Head screen maintains the list of expense heads used to classify service, conversion, charges and production
    expenses.
  description: 'Evidence: code + ERP domain (inferred)

    The Expense Head screen maintains the list of expense heads used to classify service, conversion, charges and production
    expenses. A user enters the Expense Head name and its Nature, may link an HSN / SAC code and GST category for tax purposes,
    and, for heads of nature Charges, ticks the tax charges that apply. The system assigns a code and makes each new head
    available in every company. Heads are created at head office only; other companies view them read-only. A Fast Entry mode
    with Excel import supports bulk creation. Finance and purchasing documents that book expenses use these heads (Inferred).

    '
  tables:
  - masterdata.mExpenseHead
  - masterdata.mExpenseHeadCompanyDetail
  - masterdata.mExpenseHeadTaxDetail
- key: finance-book
  name: Finance Book
  module: FI
  synonyms:
  - Book
  summary: The Finance Book screen maintains the books under which accounting is recorded and reported.
  description: 'Evidence: code + ERP domain (inferred)

    The Finance Book screen maintains the books under which accounting is recorded and reported. Each book is one of three
    types: a Transaction book that vouchers are posted to, a Unit Level book that groups transaction books of one company,
    or a Consolidate book that combines selected transaction books. For each book the user links the Chart of Accounts it
    uses (with exactly one operative account for transaction books), and for transaction books also the tax books and divisions
    it covers. The screen enforces a unique book name, a consistent operative account between parent and child books, and
    one book per division. Books are central, enterprise-wide master data; finance users and every finance transaction and
    report that selects a finance book depend on it.

    '
  related_to:
  - concept: chart-of-accounts
    how: chart used by the book
  tables:
  - masterdata.mFBCOADetail
  - masterdata.mFBDivisionDetail
  - masterdata.mFBMain
  - masterdata.mFBTaxBookDetail
  - masterdata.mFBTransactionFBDetail
- key: gate-entry
  name: Gate Entry
  module: MM
  synonyms:
  - Gate Inward
  summary: The Gate Entry screen records every inward vehicle and consignment that arrives at the factory gate before it is
    received into stores.
  description: 'Evidence: code + ERP domain (inferred)

    The Gate Entry screen records every inward vehicle and consignment that arrives at the factory gate before it is received
    into stores. Security or stores staff identify the source of the material (Purchase Order, Stock Transfer, Inter Unit
    Dispatch Challan, Subcontract Order, Sales Return or Direct), pick the reference documents and the items on the vehicle,
    and capture the supplier challan, transporter, driver, vehicle, lorry receipt, eWay-Bill and weighbridge details. The
    screen checks challan quantities against the open balance and tolerance of the reference order, blocks duplicate challans
    from the same supplier location, refuses blacklisted vehicles, and applies company-configurable checks on driver and vehicle
    data. Each gate entry carries a yearly document number and a document status (Initial, Release, Authorized); once authorized
    it can no longer be changed. The saved gate entry is the starting point for goods receipt (GRN), weighment, freight invoicing
    and vehicle gate-out, and it can be linked to an approved mobile gate-in record.

    '
  related_to:
  - concept: purchase-order
    how: order the inward consignment refers to
  tables:
  - GateEntry.InvGateEntryItemDetail
  - GateEntry.InvGateEntryMain
  - GateEntry.InvGateEntryNotesDetail
  - GateEntry.InvGateEntryOrderDetail
- key: goods-receipt-note
  name: Goods Receipt Note
  module: MM
  synonyms:
  - GRN
  - Material Receipt Note
  summary: The GRN screen records the physical receipt of material at a company warehouse and turns it into usable stock.
  description: 'Evidence: code + ERP domain (inferred)

    The GRN screen records the physical receipt of material at a company warehouse and turns it into usable stock. A receipt
    can be made directly or against a reference document: a purchase order, a gate entry, a stock transfer, a subcontract
    order and, where enabled, an inter-unit dispatch challan or a sales order. A second document type, MRA, records material
    receipt advice, including drop-shipment receipts delivered to a consignee. The screen captures the vendor and vendor location,
    bill, challan, transport, freight and e-way bill details, then the item lines with challan, received, accepted, rejected,
    free-of-charge and replaceable quantities, plus indent allocation, reservation, serial numbers, batch, expiry, heat-wise
    lots and attribute-wise rates. It enforces quantity balance, purchase order tolerance, inspection and multi-level approval
    rules, many of which a company switches on through configurable validations. On authorization, the receipt posts inward
    stock lots, updates the status of the source documents, creates the finance voucher and, for legacy excise set-ups, the
    excise register entries. Purchase billing, inspection, stock issue, finance and purchase follow-up all depend on the data
    saved here.

    '
  related_to:
  - concept: purchase-order
    how: order the material is received against
  - concept: gate-entry
    how: gate inward the receipt follows
  tables:
  - Inventory.GRNIndentReserveDetail
  - Inventory.GRNItemAttributeIskcon
  - Inventory.GRNItemDetail
  - Inventory.GRNItemIndentDetail
  - Inventory.GRNItemLotAdditionalDetail
  - Inventory.GRNItemSerialDetail
  - Inventory.GRNItemTaxDetail
  - Inventory.GRNMain
  - Inventory.GRNNotesDetail
  - Inventory.GRNRefDocDetail
  - Inventory.GRNTaxDetail
- key: gst-category
  name: GST Category
  module: FI
  summary: GST classification of goods and services used for tax determination.
  description: 'Evidence: code + ERP domain (inferred)

    GST classification of goods and services used for tax determination. Looked up by the in-scope forms through GlobalData.GSTCategory.

    '
  tables:
  - GlobalData.GSTCategory
- key: hsn-sac-code
  name: HSN / SAC Code
  module: MM
  synonyms:
  - HSN
  - SAC
  summary: The HSN SAC Master screen maintains HSN codes for goods and SAC codes for services, as used under GST.
  description: 'Evidence: code + ERP domain (inferred)

    The HSN SAC Master screen maintains HSN codes for goods and SAC codes for services, as used under GST. For each code the
    user records the type (Goods or Service), the code itself, a two-character chapter, a description, the default CGST, SGST,
    IGST and UTGST rates, and the items that carry the code. Codes are unique across the enterprise. Only the head office
    can edit; other companies see the screen locked. Purchase and sales documents that determine GST by item rely on the code
    and its default rates (Inferred).

    '
  tables:
  - masterdata.HSNSACCode
  - masterdata.mItemHSNDetail
- key: inspection-intimation
  name: Inspection Intimation
  module: MM
  synonyms:
  - Intimation Letter
  summary: The Inspection Intimation screen prepares an intimation letter that tells the inspecting department which received
    items are waiting for quality inspection.
  description: 'Evidence: code + ERP domain (inferred)

    The Inspection Intimation screen prepares an intimation letter that tells the inspecting department which received items
    are waiting for quality inspection. The user enters a GRN date range, lists the goods receipt lines that require inspection
    and are not yet authorized, ticks the lines to be intimated and assigns the department responsible for each. Each intimation
    carries a yearly document number, a date and a document status (Initial, Release, Authorized); once authorized it can
    no longer be changed. An authorized intimation is a precondition for authorizing an inspection-required GRN and is the
    source from which the Inspection Entry screen picks lines to inspect. The screen is used by stores at company or division
    level; quality staff and stores management benefit downstream.

    '
  related_to:
  - concept: goods-receipt-note
    how: receipt sent for inspection
  tables:
  - Inventory.IntimationLetterDetail
  - Inventory.IntimationLetterMain
  - Inventory.IntimationLetterNotesDetail
- key: item-attribute-value
  name: Item Attribute Standard Value
  module: MM
  synonyms:
  - Attribute Combination
  summary: The Attribute Standard Value screen defines the standard values that item attributes (for example size, grade or
    colour) may take, either for a whole item sub group or for a single item, and generates the attribute combinations (variants)
    of an item from those values.
  description: 'Evidence: code + ERP domain (inferred)

    The Attribute Standard Value screen defines the standard values that item attributes (for example size, grade or colour)
    may take, either for a whole item sub group or for a single item, and generates the attribute combinations (variants)
    of an item from those values. In All Combination mode the user lists attribute values, marks one base value per attribute
    and generates every combination, then sets combinations inactive where needed. In Single Combination mode the user adds
    one specific combination for an item, with optional width, thickness or size for coil and piece-wise items. Each generation
    is versioned so that earlier combinations are kept as history. Inventory, purchase and sales documents that select item
    variants rely on the latest combinations (Inferred).

    '
  related_to:
  - concept: material-item
    how: attribute values of the item variant
  tables:
  - masterdata.mAttributeCombination
  - masterdata.mAttributeCombinationDetail
  - masterdata.mItemAttributeStandValueDetail
- key: item-technical-grade
  name: Item Technical Grade
  module: MM
  synonyms:
  - Technical Grade Mapping
  summary: The Item Tech Grade Mapping screen records which technical grades apply to an item or to a whole item subgroup.
  description: 'Evidence: code + ERP domain (inferred)

    The Item Tech Grade Mapping screen records which technical grades apply to an item or to a whole item subgroup. The user
    first chooses the mapping level (item or subgroup), then the item or subgroup, and then lists the technical grades in
    a grid. Saving replaces the previous list of grades for that item or subgroup. When the mapping is done at subgroup level,
    the grades are also written to every item of that subgroup. The item and subgroup lists are limited to the user''s current
    company, but the stored grades are not company specific. Downstream screens that ask for a technical grade against an
    item rely on this list (Inferred).

    '
  related_to:
  - concept: material-item
    how: grades applicable to the item
  tables:
  - masterdata.mItemTechnicalGrade
  - masterdata.mSubgroupTechnicalGrade
- key: item-unit-weight
  name: Item Unit Weight
  module: MM
  synonyms:
  - Item Weight
  summary: The Item Change Unit Weight screen is a utility that corrects weight and dimension settings of an existing item
    without reopening the full item master.
  description: 'Evidence: code + ERP domain (inferred)

    The Item Change Unit Weight screen is a utility that corrects weight and dimension settings of an existing item without
    reopening the full item master. The user picks an item and can change whether item dimensions are maintained, the measurement
    type (1-D, 2-D, 3-D) and its unit, the unit weight and its unit, the production stock unit conversion formula, and the
    production unit conversion. The latest bills of material that use the item are shown for reference. Each save writes the
    new values straight onto the item and keeps a change record. Only the head office can make changes. Stock, production
    and dispatch functions that convert quantities or compute weights rely on these values (Inferred).

    '
  related_to:
  - concept: material-item
    how: weight and dimension settings of the item
  tables:
  - masterdata.ChangeItemUnitWeight
  - masterdata.ChangeItemUnitWeightDetail
  - masterdata.mItemUnitConversionDetail
- key: ledger-account
  name: Ledger Account
  module: FI
  synonyms:
  - GL Account
  - Account
  summary: The Account Master screen creates and maintains general ledger accounts.
  description: 'Evidence: code + ERP domain (inferred)

    The Account Master screen creates and maintains general ledger accounts. Each account belongs to a chart of accounts (COA),
    has an account type and an account group, and carries control settings such as reference (bill-wise) tracking, cost center
    tracking, quantity tracking, currency, HSN/SAC code and a fund flow flag. Bank accounts additionally hold bank details
    and interest rates. Accounts of the "Additional Accounts" type can be marked as a party account, in which case the screen
    also creates a party card, a party location with GST, PAN and MSME details, and the account rule that links the party
    to this account. Accounts in a reporting chart roll up selected operative accounts through account mapping, and every
    account can be mapped to groups in other charts. A fast entry grid with Excel import allows bulk creation. Creation and
    deletion are restricted to head office; other companies can only view and update. Vouchers, financial statements, bank
    payments and finance posting rely on these accounts downstream.

    '
  related_to:
  - concept: cost-center
    how: cost centers booked with the account
  tables:
  - masterdata.COAAccountGroupDetail
  - masterdata.FSLayoutDesignAccountDetail
  - masterdata.mAccountBankDetail
  - masterdata.mAccountBankInterestDetail
  - masterdata.mAccountMaster
- key: make
  name: Make / Brand
  module: MM
  synonyms:
  - Brand
  - Manufacturer
  summary: The Make Master screen maintains the list of manufacturer makes (brands) used to describe items.
  description: 'Evidence: code + ERP domain (inferred)

    The Make Master screen maintains the list of manufacturer makes (brands) used to describe items. A user records a Make
    Name, the system assigns a code, and the user can tick the items that belong to the make in an item tree grouped by item
    group and sub group. A make can optionally be flagged as a tyre make when the tyre management screen is enabled. Makes
    are created and changed centrally from the head office; other companies see the screen read-only. Every new make is made
    available to all companies at once. Purchasing, inventory, sales and reporting screens read the make and its item mapping
    downstream.

    '
  tables:
  - masterdata.mItemMakeDetail
  - masterdata.mMakeMaster
  - masterdata.mMakeMasterCompanyDetail
- key: material-category
  name: Material Category
  module: MM
  synonyms:
  - Category
  summary: Top level of the material classification (Category > Group > Sub Group > Item).
  description: 'Evidence: code + ERP domain (inferred)

    Top level of the material classification (Category > Group > Sub Group > Item). Looked up by the in-scope forms through
    masterdata.mCategoryMaster.

    '
  parent_of:
  - material-group
  tables:
  - masterdata.mCategoryMaster
- key: material-group
  name: Material Group
  module: MM
  synonyms:
  - Item Group
  summary: The Material Group screen maintains material groups, the second level of the material classification (Category,
    then Group, then Sub Group, then Item).
  description: 'Evidence: code + ERP domain (inferred)

    The Material Group screen maintains material groups, the second level of the material classification (Category, then Group,
    then Sub Group, then Item). Each group belongs to one material category and carries a 2-character code that becomes the
    middle part of every item code built beneath it. The screen captures the category, the group code and the group name,
    shows the combined Group Code, and supports single-record entry, a grid-based fast entry mode and an Excel import. Groups
    are maintained centrally: only the head-office company can edit them, and every new group is made available to all companies
