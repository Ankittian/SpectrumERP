    The Gate Pass In screen records material that physically enters the premises through the gate: contractor material, direct returnable and non-returnable receipts, receipts against an earlier Gate Pass Out, loans taken or returned, replaceable items received against a Gate Pass Out raised from a GRN, subcontract material received back against a Subcontract Order or Dispatch Challan, items received for a Maintenance Service Order, against a service request or for a Service Call. The user chooses a Gate Pass Type, which decides which party list, reference documents, grid columns and quantity checks apply, then captures the party and location, the party's challan, the receiving person and warehouse, transport and freight details, optional excise and eWay-Bill details and the items with received quantities, serial numbers and, for subcontract receipts, the requisition-wise split. Documents follow the standard Initial, Release and Authorized life cycle, with numbering by the document-number control. On authorization the screen updates the balance and status of the referenced Gate Pass Out lines, brings loan, replaceable, service and subcontract material into stock, registers serial numbers and, for loan cases where finance setup requires it, posts a journal voucher. Stores, security and accounts users rely on it to track what came back from parties and what is still outstanding.
