    chart of accounts. The user selects a reporting chart of accounts (COA), and the screen shows the finance books that are
    connected to it together with the transaction charts of accounts behind those books. It then lists every posting account
    used in those transaction charts and lets the user choose the reporting account each one rolls up into. The account group
    and parent group of both sides are shown for reference. The mapping is saved as a full replacement for the selected reporting
    COA. Finance reporting that consolidates figures across finance books relies on this mapping (Inferred).

    '
  related_to:
  - concept: chart-of-accounts
    how: transaction and reporting charts linked
- key: rfq
  name: Request for Quotation
  module: MM
  synonyms:
  - RFQ
  - Enquiry
  summary: The Request For Quotation screen creates and maintains the material RFQ document that a buying company sends to
    one or more vendors to invite prices for goods.
  description: 'Evidence: code + ERP domain (inferred)

    The Request For Quotation screen creates and maintains the material RFQ document that a buying company sends to one or
    more vendors to invite prices for goods. An RFQ can be raised directly, or against approved purchase requests (indents),
    project gross requirements (GRC) or customer sales orders, in which case the requested items and quantities are pulled
    from the selected source lines and consolidated by item, make and unit. The screen captures submission, opening and validity
    dates, the vendors invited (chosen from all vendors, from item-vendor mappings or from a vendor group), the items with
    quantities, units, delivery dates, HSN/SAC codes, technical specification and size details, plus notes and company-defined
    custom fields. Numbering, document date, division and status (Initial, Release, Authorized) come from the shared document-number
    control, and an authorized RFQ is locked against change. The RFQ is printed, exported or e-mailed once per invited vendor.
    Downstream, vendor quotations are entered against the RFQ and compared in the comparative statement, from which purchase
    bookings and purchase orders follow.

    '
  related_to:
  - concept: purchase-request
    how: purchase request lines sent out for quotation
  tables:
  - Purchase.RFQItemDetail
  - Purchase.RFQItemSizeDetail
  - Purchase.RFQItemTechSpecificationDetail
  - Purchase.RFQMain
  - Purchase.RFQNotesDetail
  - Purchase.RFQVendorDetail
  - Purchase.rfqIndentDetail
- key: single-field-list
  name: Single Field List
  module: MM
  synonyms:
  - Simple Master
  - Code List
  summary: The Single Field Master screen is one generic screen that maintains many simple code-and-name lists, such as Location
    Master, Technical Grade, Category, Tech Specification Master and Quality Parameter Type.
  description: 'Evidence: code + ERP domain (inferred)

    The Single Field Master screen is one generic screen that maintains many simple code-and-name lists, such as Location
    Master, Technical Grade, Category, Tech Specification Master and Quality Parameter Type. Each menu entry opens the same
    screen with a different screen configuration (form code), which decides the window caption, the label of the name field,
    whether the user types the code, the allowed name length, whether an Is Default option is offered and which list is read
    and written. Users capture a name (and for Category also a two-character code), search existing entries, correct names
    and delete entries, either one at a time or through a fast entry grid that also accepts an Excel import. Creation and
    deletion are reserved to the head office company, and most lists are made available to every company automatically when
    an entry is created. The lists maintained here feed purchasing, inventory, quality, sales and maintenance transactions
    that pick these values from drop-downs.

    '
- key: tdc-account-rule
