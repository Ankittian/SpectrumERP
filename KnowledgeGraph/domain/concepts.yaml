  description: |
    Evidence: code + ERP domain (inferred)
    The Picking screen records the warehouse pick for customer orders: which items, in what quantity, from which stock lots, are set aside against a sales order or a dispatch plan before they are packed and dispatched. A picking is raised from one or more authorized sales orders, or from one authorized dispatch plan, for a chosen warehouse [fPicking.vb:269; fPicking.Designer.vb:776]. For every selected item the user confirms the quantity and the exact lots (and serial numbers where the item is serial-controlled) that will be issued, including pieces for pieces-managed lots. Items built from a bill of materials can be picked component by component. While the picking is unauthorized, the picked lot quantities are only held so that other documents cannot take the same stock; when the picking is authorized the stock is actually issued from the warehouse lots and, if finance is applicable, an inventory journal moving the value to a picking suspense account is posted. Warehouse and dispatch staff use it to prepare dispatch, and the Pack Slip screen consumes authorized pickings downstream ([Pack Slip](Functional_Doc_fPackSlip.md)).
