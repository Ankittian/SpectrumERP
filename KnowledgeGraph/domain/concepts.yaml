concepts:
- key: account-determination-rule
  name: Account Determination Rule
  module: FI
  synonyms:
  - Account Rule
  summary: The Account Rule Definition screen tells the system which ledger account to use when a business document is posted
    to finance.
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Rule Definition screen tells the system which ledger account to use when a business document is posted to finance. The user picks one posting account and then ties it to the business objects that should post to it: sale posting rules, tax and miscellaneous charge rules, supplier and customer locations, items and item sub groups, payroll components, finance books, employees, and intermediate posting bases such as expense heads or service items. Which of these lists is offered depends on the type of the selected account, so a sales revenue account is linked to sale rules and items, a tax account to tax charge rules, and a supplier control account to supplier locations. The screen prevents the same object from being mapped twice to accounts of the same type, so that posting is unambiguous. Rules are defined centrally at head office; when the screen is used from another company an opened rule is shown locked (see Section 13 for gaps). Finance posting of purchase, sales, inventory, payroll and voucher documents relies on these rules downstream.
  related_to:
  - concept: ledger-account
    how: account chosen by the rule
  tables:
  - Finance.ARDFinanceBookRule
  - Finance.ARDImprestRule
  - Finance.ARDIntermediatePostingAccountRule
  - Finance.ARDItemRule
  - Finance.ARDMain
  - Finance.ARDTDCAccountRule
  - Finance.ARDVendorLocationRule
  - Finance.ARDItemSubGroupRule
  - Finance.ARDPayrollComponentRule
  - Finance.ARDSaleAccountRule
- key: account-group
  name: Account Group
  module: FI
  synonyms:
  - Ledger Group
  summary: The Account Group Master screen maintains the hierarchy of account groups within each Chart of Accounts (COA).
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Group Master screen maintains the hierarchy of account groups within each Chart of Accounts (COA). Each group belongs to one COA, sits under a parent group, may point to an alternate group, and inherits its nature (and its default reference and cost center settings) from the parent. Groups can be created one at a time, in a fast entry grid, or by importing an Excel sheet into that grid. Maintenance is reserved for the head office company; other companies can only view groups. System default groups and groups of reporting-type COAs are protected from key changes. Ledger accounts and financial statements downstream depend on this hierarchy for classification.
  parent_of:
  - ledger-account
  tables:
  - masterdata.mAccountGroup
- key: accounting-period
  name: Accounting Period Mapping
  module: FI
  synonyms:
  - Calendar Period Mapping
  summary: The FB Period Mapping screen (menu caption "Calendar Period Mapping") links accounting periods to a finance book
    or to a depreciation book.
  description: |
    Evidence: code + ERP domain (inferred)
    The FB Period Mapping screen (menu caption "Calendar Period Mapping") links accounting periods to a finance book or to a depreciation book. The user picks a calendar type, then a finance book or depreciation book, ticks the financial years that apply, and for each period of those years sets Open or Close status and marks exactly one beginning period. The beginning period also sets the book's opening date. Years and beginning periods that already carry vouchers, references, opening balances or depreciation cannot be unticked. Finance and fixed asset users rely on these period statuses and the opening date when posting and depreciating (Inferred).
  related_to:
  - concept: finance-book
    how: periods of the book
  tables:
  - masterdata.mFBPeriodDetail
  - masterdata.mDBPeriodDetail
- key: accounting-voucher
  name: Accounting Voucher
  module: FI
  synonyms:
  - Journal
  - Voucher
  summary: Ledger posting (debit / credit lines) created by finance posting from transactions.
  description: |
    Evidence: code + ERP domain (inferred)
    Ledger posting (debit / credit lines) created by finance posting from transactions. Looked up by the in-scope forms through Finance.accVoucherDetail, Finance.accVoucherMain.
  tables:
  - Finance.accVoucherDetail
  - Finance.accVoucherMain
- key: bin
  name: Bin Card
  module: MM
  synonyms:
  - Storage Bin
  summary: The BIN Card screen maintains storage bins inside warehouses for the login company.
  description: |
    Evidence: code + ERP domain (inferred)
    The BIN Card screen maintains storage bins inside warehouses for the login company. Each bin has a BIN Card No., a physical location description, a warehouse, an optional division, an optional maximum capacity and an inactive flag. The user also states which items may be stored in the bin, either by ticking whole sub groups (and their items) or by ticking individual items. Bins can be created singly, in a fast entry grid, or by importing an Excel sheet. Bins cannot be created while logged into the head office. Stores users and stock transactions that record bin-level placement depend on this data (Inferred).
  related_to:
  - concept: warehouse
    how: warehouse that holds the bin
  tables:
  - masterdata.mBinCard
  - masterdata.mBinCardSubgroupDetail
  - masterdata.mBinCardItemDetail
- key: chart-of-accounts
  name: Chart of Accounts
  module: FI
  synonyms:
  - COA
  summary: The Chart Of Account screen maintains the charts of accounts (COA) of the enterprise.
  description: |
    Evidence: code + ERP domain (inferred)
    The Chart Of Account screen maintains the charts of accounts (COA) of the enterprise. Each chart has an automatic code, a name and a type: Reporting or Operative. When a new chart is created, its account group tree is built automatically, either from the system default account groups or by copying the groups of an existing chart of the same type, optionally including its account placements ("Copy With Ledgers"). The screen also shows which finance books use the chart and previews the group and account structure of a chart being imported. Charts are enterprise-wide. Account masters, finance books, the Reporting COA Setup screen and all finance reporting rely on these charts (Inferred).
  parent_of:
  - account-group
  tables:
  - masterdata.COAAccountGroupDetail
  - masterdata.COAMain
- key: company
  name: Company
  module: MM
  summary: Legal company under which masters are activated and documents are recorded.
  description: |
    Evidence: code + ERP domain (inferred)
    Legal company under which masters are activated and documents are recorded. Looked up by the in-scope forms through masterdata.mCompanyMaster.
  tables:
  - masterdata.mCompanyMaster
  - masterdata.mcompanymaster
- key: cost-center
  name: Cost Center
  module: FI
  summary: The Cost Center Master screen maintains the hierarchy of cost centers to which costs, stock lots, vouchers and
    maintenance assets are charged.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cost Center Master screen maintains the hierarchy of cost centers to which costs, stock lots, vouchers and maintenance assets are charged. A user enters a Cost Center Name and an optional Parent Cost Center; the system assigns a code. Cost centers are created centrally at head office and are made available to every company; in a multi-company setup head office also decides in which companies each cost center is inactive. Once a cost center is used in stock lots, finance vouchers, equipment or functional locations, its name and parent are locked. A Fast Entry mode with Excel import supports bulk creation.
  tables:
  - masterdata.mCostCenterMaster
  - masterdata.mCostCenterMasterCompanyDetail
- key: currency
  name: Currency
  module: FI
  summary: The Currency Master screen maintains the currencies used across the enterprise.
  description: |
    Evidence: code + ERP domain (inferred)
    The Currency Master screen maintains the currencies used across the enterprise. For each currency the user records its name, fractional currency name (for example paise or cents), notation, symbol and translation type (exchange rate or inverse rate), and ticks the countries that use it. Codes are generated automatically and new currencies become available in every company. Only the head office can edit; other companies see the screen locked. Foreign currency documents, exchange rate entry and party masters rely on these currencies (Inferred).
  tables:
  - masterdata.mCurrencyMaster
  - masterdata.mCurrencyMasterCompanyDetail
  - masterdata.mCurrencyCountryDetail
- key: currency-exchange-rate
  name: Currency Exchange Rate
  module: FI
  synonyms:
  - Conversion Rate
  summary: The Currency Conversion screen records exchange rates between the company's base currency and foreign currencies
    for a validity period.
  description: |
    Evidence: code + ERP domain (inferred)
    The Currency Conversion screen records exchange rates between the company's base currency and foreign currencies for a validity period. For each exchange rate type (Standard, Buying, Selling) and exchange currency the user enters either an exchange rate or an inverse rate, depending on the translation type, and an optional tolerance band in percentage or amount. The screen prevents overlapping validity periods for the same currency and rate type and automatically closes the previous open-ended rate when a newer one is saved. Rates are maintained centrally at head office; other companies view them read-only. Purchase, sales and finance documents in foreign currency use these rates and tolerance bands (Inferred).
  related_to:
  - concept: currency
    how: rates of the currency
  tables:
  - masterdata.mCurrencyConversion
- key: expense-head
  name: Expense Head
  module: FI
  summary: The Expense Head screen maintains the list of expense heads used to classify service, conversion, charges and production
    expenses.
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Head screen maintains the list of expense heads used to classify service, conversion, charges and production expenses. A user enters the Expense Head name and its Nature, may link an HSN / SAC code and GST category for tax purposes, and, for heads of nature Charges, ticks the tax charges that apply. The system assigns a code and makes each new head available in every company. Heads are created at head office only; other companies view them read-only. A Fast Entry mode with Excel import supports bulk creation. Finance and purchasing documents that book expenses use these heads (Inferred).
  tables:
  - masterdata.mExpenseHead
  - masterdata.mExpenseHeadCompanyDetail
  - masterdata.mExpenseHeadTaxDetail
- key: finance-book
  name: Finance Book
  module: FI
  synonyms:
  - Book
  summary: The Finance Book screen maintains the books under which accounting is recorded and reported.
  description: |
    Evidence: code + ERP domain (inferred)
    The Finance Book screen maintains the books under which accounting is recorded and reported. Each book is one of three types: a Transaction book that vouchers are posted to, a Unit Level book that groups transaction books of one company, or a Consolidate book that combines selected transaction books. For each book the user links the Chart of Accounts it uses (with exactly one operative account for transaction books), and for transaction books also the tax books and divisions it covers. The screen enforces a unique book name, a consistent operative account between parent and child books, and one book per division. Books are central, enterprise-wide master data; finance users and every finance transaction and report that selects a finance book depend on it.
  related_to:
  - concept: chart-of-accounts
    how: chart used by the book
  tables:
  - masterdata.mFBCOADetail
  - masterdata.mFBMain
  - masterdata.mFBTaxBookDetail
  - masterdata.mFBDivisionDetail
  - masterdata.mFBTransactionFBDetail
- key: gate-entry
  name: Gate Entry
  module: MM
  synonyms:
  - Gate Inward
  summary: The Gate Entry screen records every inward vehicle and consignment that arrives at the factory gate before it is
    received into stores.
  description: |
    Evidence: code + ERP domain (inferred)
    The Gate Entry screen records every inward vehicle and consignment that arrives at the factory gate before it is received into stores. Security or stores staff identify the source of the material (Purchase Order, Stock Transfer, Inter Unit Dispatch Challan, Subcontract Order, Sales Return or Direct), pick the reference documents and the items on the vehicle, and capture the supplier challan, transporter, driver, vehicle, lorry receipt, eWay-Bill and weighbridge details. The screen checks challan quantities against the open balance and tolerance of the reference order, blocks duplicate challans from the same supplier location, refuses blacklisted vehicles, and applies company-configurable checks on driver and vehicle data. Each gate entry carries a yearly document number and a document status (Initial, Release, Authorized); once authorized it can no longer be changed. The saved gate entry is the starting point for goods receipt (GRN), weighment, freight invoicing and vehicle gate-out, and it can be linked to an approved mobile gate-in record.
  related_to:
  - concept: purchase-order
    how: order the inward consignment refers to
  tables:
  - GateEntry.InvGateEntryMain
  - GateEntry.InvGateEntryOrderDetail
  - GateEntry.InvGateEntryItemDetail
  - GateEntry.InvGateEntryNotesDetail
- key: goods-receipt-note
  name: Goods Receipt Note
  module: MM
  synonyms:
  - GRN
  - Material Receipt Note
  summary: The GRN screen records the physical receipt of material at a company warehouse and turns it into usable stock.
  description: |
    Evidence: code + ERP domain (inferred)
    The GRN screen records the physical receipt of material at a company warehouse and turns it into usable stock. A receipt can be made directly or against a reference document: a purchase order, a gate entry, a stock transfer, a subcontract order and, where enabled, an inter-unit dispatch challan or a sales order. A second document type, MRA, records material receipt advice, including drop-shipment receipts delivered to a consignee. The screen captures the vendor and vendor location, bill, challan, transport, freight and e-way bill details, then the item lines with challan, received, accepted, rejected, free-of-charge and replaceable quantities, plus indent allocation, reservation, serial numbers, batch, expiry, heat-wise lots and attribute-wise rates. It enforces quantity balance, purchase order tolerance, inspection and multi-level approval rules, many of which a company switches on through configurable validations. On authorization, the receipt posts inward stock lots, updates the status of the source documents, creates the finance voucher and, for legacy excise set-ups, the excise register entries. Purchase billing, inspection, stock issue, finance and purchase follow-up all depend on the data saved here.
  related_to:
  - concept: purchase-order
    how: order the material is received against
  - concept: gate-entry
    how: gate inward the receipt follows
  tables:
  - Inventory.GRNItemDetail
  - Inventory.GRNMain
  - Inventory.GRNRefDocDetail
  - Inventory.GRNIndentReserveDetail
  - Inventory.GRNItemAttributeIskcon
  - Inventory.GRNItemIndentDetail
  - Inventory.GRNItemLotAdditionalDetail
  - Inventory.GRNItemSerialDetail
  - Inventory.GRNItemTaxDetail
  - Inventory.GRNNotesDetail
  - Inventory.GRNTaxDetail
- key: gst-category
  name: GST Category
  module: FI
  summary: GST classification of goods and services used for tax determination.
  description: |
    Evidence: code + ERP domain (inferred)
    GST classification of goods and services used for tax determination. Looked up by the in-scope forms through GlobalData.GSTCategory.
  tables:
  - GlobalData.GSTCategory
- key: item-attribute-value
  name: Item Attribute Standard Value
  module: MM
  synonyms:
  - Attribute Combination
  summary: The Attribute Standard Value screen defines the standard values that item attributes (for example size, grade or
    colour) may take, either for a whole item sub group or for a single item, and generates the attribute combinations (variants)
    of an item from those values.
  description: |
    Evidence: code + ERP domain (inferred)
    The Attribute Standard Value screen defines the standard values that item attributes (for example size, grade or colour) may take, either for a whole item sub group or for a single item, and generates the attribute combinations (variants) of an item from those values. In All Combination mode the user lists attribute values, marks one base value per attribute and generates every combination, then sets combinations inactive where needed. In Single Combination mode the user adds one specific combination for an item, with optional width, thickness or size for coil and piece-wise items. Each generation is versioned so that earlier combinations are kept as history. Inventory, purchase and sales documents that select item variants rely on the latest combinations (Inferred).
  related_to:
  - concept: material-item
    how: attribute values of the item variant
  tables:
  - masterdata.mAttributeCombination
  - masterdata.mAttributeCombinationDetail
  - masterdata.mItemAttributeStandValueDetail
- key: item-technical-grade
  name: Item Technical Grade
  module: MM
  synonyms:
  - Technical Grade Mapping
  summary: The Item Tech Grade Mapping screen records which technical grades apply to an item or to a whole item subgroup.
  description: |
    Evidence: code + ERP domain (inferred)
    The Item Tech Grade Mapping screen records which technical grades apply to an item or to a whole item subgroup. The user first chooses the mapping level (item or subgroup), then the item or subgroup, and then lists the technical grades in a grid. Saving replaces the previous list of grades for that item or subgroup. When the mapping is done at subgroup level, the grades are also written to every item of that subgroup. The item and subgroup lists are limited to the user's current company, but the stored grades are not company specific. Downstream screens that ask for a technical grade against an item rely on this list (Inferred).
  related_to:
  - concept: material-item
    how: grades applicable to the item
  tables:
  - masterdata.mItemTechnicalGrade
  - masterdata.mSubGroupTechnicalGrade
  - masterdata.mSubgroupTechnicalGrade
- key: ledger-account
  name: Ledger Account
  module: FI
  synonyms:
  - GL Account
  - Account
  summary: The Account Master screen creates and maintains general ledger accounts.
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Master screen creates and maintains general ledger accounts. Each account belongs to a chart of accounts (COA), has an account type and an account group, and carries control settings such as reference (bill-wise) tracking, cost center tracking, quantity tracking, currency, HSN/SAC code and a fund flow flag. Bank accounts additionally hold bank details and interest rates. Accounts of the "Additional Accounts" type can be marked as a party account, in which case the screen also creates a party card, a party location with GST, PAN and MSME details, and the account rule that links the party to this account. Accounts in a reporting chart roll up selected operative accounts through account mapping, and every account can be mapped to groups in other charts. A fast entry grid with Excel import allows bulk creation. Creation and deletion are restricted to head office; other companies can only view and update. Vouchers, financial statements, bank payments and finance posting rely on these accounts downstream.
  related_to:
  - concept: cost-center
    how: cost centers booked with the account
  tables:
  - masterdata.COAAccountGroupDetail
  - masterdata.mAccountMaster
  - masterdata.maccountBankDetail
  - masterdata.FSLayoutDesignAccountDetail
  - masterdata.mAccountBankDetail
  - masterdata.mAccountBankInterestDetail
- key: make
  name: Make / Brand
  module: MM
  synonyms:
  - Brand
  - Manufacturer
  summary: The Make Master screen maintains the list of manufacturer makes (brands) used to describe items.
  description: |
    Evidence: code + ERP domain (inferred)
    The Make Master screen maintains the list of manufacturer makes (brands) used to describe items. A user records a Make Name, the system assigns a code, and the user can tick the items that belong to the make in an item tree grouped by item group and sub group. A make can optionally be flagged as a tyre make when the tyre management screen is enabled. Makes are created and changed centrally from the head office; other companies see the screen read-only. Every new make is made available to all companies at once. Purchasing, inventory, sales and reporting screens read the make and its item mapping downstream.
  tables:
  - masterdata.mItemMakeDetail
  - masterdata.mMakeMaster
  - masterdata.mMakeMasterCompanyDetail
- key: material-category
  name: Material Category
  module: MM
  synonyms:
  - Category
  summary: Top level of the material classification (Category > Group > Sub Group > Item).
  description: |
    Evidence: code + ERP domain (inferred)
    Top level of the material classification (Category > Group > Sub Group > Item). Looked up by the in-scope forms through masterdata.mCategoryMaster.
  parent_of:
  - material-group
  tables:
  - masterdata.mCategoryMaster
- key: material-group
  name: Material Group
  module: MM
  synonyms:
  - Item Group
  summary: The Material Group screen maintains material groups, the second level of the material classification (Category,
    then Group, then Sub Group, then Item).
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Group screen maintains material groups, the second level of the material classification (Category, then Group, then Sub Group, then Item). Each group belongs to one material category and carries a 2-character code that becomes the middle part of every item code built beneath it. The screen captures the category, the group code and the group name, shows the combined Group Code, and supports single-record entry, a grid-based fast entry mode and an Excel import. Groups are maintained centrally: only the head-office company can edit them, and every new group is made available to all companies at once and is authorised on save. Sub group, item master, material request, production and KPI processes depend on the groups defined here.
  parent_of:
  - material-sub-group
  related_to:
  - concept: qc-parameter
    how: group level default QC parameters
  tables:
  - masterdata.mGroupMaster
  - masterdata.mGroupMasterCompanyDetail
  - masterdata.mGroupQCParameterDetail
- key: material-issue
  name: Material Issue
  module: MM
  synonyms:
  - Stores Issue
  - Issue Slip
  summary: The Material Issue screen records the issue of materials from a warehouse to an employee, a contractor or shop
    floor, or a vendor.
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Issue screen records the issue of materials from a warehouse to an employee, a contractor or shop floor, or a vendor. An issue can be made directly or against a source document such as a Subcontract Order, Job Card, Material Request, Maintenance Order, Customer Service Order, Batch Order or Packing Order, and the screen checks quantities against the balance of that document. For every item the user picks the stock lots (and serial numbers where the item is serial-controlled) from which the quantity is drawn, so the issue reduces stock at lot level and carries the lot cost into the issue value. The screen governs the issue type (Capital, Revenue, RawMaterial, Reusable, Repairable), returnable and chargeable status, department and cost centre, and, for authorised own-stock issues, builds a finance journal voucher that debits the consumption or work-in-progress account. Issues move through Initial, Release and Authorized statuses; an authorised issue can no longer be edited. Stores, production, maintenance, subcontracting, service and finance users depend on the stock movements, requisition status updates and vouchers this screen produces.
  related_to:
  - concept: warehouse
    how: store the material is issued from
  - concept: material-request
    how: request the issue is made against
  - concept: cost-center
    how: cost center charged with the consumption
  tables:
  - Inventory.InvLotItemSerialNoDetail
  - Inventory.InvUnAuthorizedIssueDetail
  - Inventory.MaterialIssueItemDetail
  - Inventory.MaterialIssueItemSerialDetail
  - Inventory.MaterialIssueLotDetail
  - Inventory.MaterialIssueMain
  - Inventory.MaterialIssueNotesDetail
- key: material-item
  name: Material / Item
  module: MM
  synonyms:
  - Item
  - Material Master
  summary: 'The Item Master screen creates and maintains the enterprise material (item) master: every raw material, consumable,
    finished good, service, spare and other stocked or non-stocked item used across purchasing, inventory, production and
    sales.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Item Master screen creates and maintains the enterprise material (item) master: every raw material, consumable, finished good, service, spare and other stocked or non-stocked item used across purchasing, inventory, production and sales. Each item is classified under a Category, Group and Subgroup, receives a four-digit Item Code that the system proposes automatically, and gets a unique Full Code and Item Description. Beyond identity, the screen captures stock and valuation behaviour (material type, units of measure and conversion factors, stock levels, serial/batch/expiry control, dimensions, bins), tax classification (GST Category, HSN/SAC Code), and item-level mappings to makes, warehouses, vendors, substitute materials, supplementary fields and companies. Maintenance is governed by the head office: branch companies see the screen read-only. Items can be entered one at a time, in a Fast Entry grid, by Excel import, by copying an existing item or from an open Material Master Request. Downstream, every transaction screen that buys, stores, produces, sells or accounts for material relies on the records maintained here.
  related_to:
  - concept: unit-of-measure
    how: stock and purchase units of the item
  - concept: make
    how: makes allowed for the item
  - concept: chapter-heading
    how: tariff chapter of the item
  - concept: hsn-sac-code
    how: GST HSN / SAC of the item
  tables:
  - Finance.ARDItemRule
  - masterdata.mItemHSNDetail
  - masterdata.mItemMakeDetail
  - masterdata.mItemMaster
  - masterdata.mItemMasterCompanyDetail
  - masterdata.mItemOtherInformation
  - masterdata.mItemTechnicalGrade
  - masterdata.mItemWarehouseDetail
  - masterdata.mBinCardItemDetail
  - masterdata.mItemChapterDetail
  - masterdata.mItemQCParameterDetail
  - masterdata.mItemSubstituteMaterialDetail
  - masterdata.mItemSupplementaryFieldsDetail
  - masterdata.mItemUnitConversionDetail
  - masterdata.mItemVendorPartDetail
- key: material-request
  name: Material Request
  module: MM
  synonyms:
  - Indent Requisition
  summary: The Material Request screen lets a department raise an internal request for stock items, either for issue from
    the store or as the first step towards procurement.
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Request screen lets a department raise an internal request for stock items, either for issue from the store or as the first step towards procurement. Each request carries a document number and date, a Request Type (Capital, Revenue or RawMaterial), the requesting Department and person, an optional Cost Center, and a list of items with make, unit, required quantity, delivery schedule and optional size, quality, specification and technical parameter details. A request can be raised directly or against an authorised Maintenance Order, in which case the item list is taken from the order's balance. When the request is for a material issue, the screen also records whether the material is returnable and chargeable, and to whom it will be issued (employee, contractor or vendor). The request moves through Initial, Release and Authorized stages; once authorised it can no longer be changed. Stores and purchase users downstream rely on the request to prepare purchase indents and material issues, and deletion is blocked once either exists.
  tables:
  - Inventory.IndentRequisitionItemDetail
  - Inventory.IndentRequisitionMain
  - Inventory.IndentRequisitionItemQCDetail
  - Inventory.IndentRequisitionItemScheduleDetail
  - Inventory.IndentRequisitionItemSpecificationDetail
  - Inventory.IndentRequisitionItemTechSpecificationDetail
  - Inventory.IndentRequisitionNotesDetail
  - Inventory.IndentRequistionItemSizeDetail
- key: material-sub-group
  name: Material Sub Group
  module: MM
  synonyms:
  - Item Sub Group
  summary: The Material Sub Group screen maintains material sub groups, the third level of the material classification (Category,
    then Group, then Sub Group, then Item).
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Sub Group screen maintains material sub groups, the third level of the material classification (Category, then Group, then Sub Group, then Item). Each sub group belongs to one material group and carries a 2-character code that, together with the category and group codes, forms the first six characters of every item code beneath it. Beyond the name and code, the screen captures default GST category and HSN/SAC code, bin applicability, an optional dispatch negative tolerance, and several default lists for the items of the sub group: the warehouses where they are held, approved makes, the stock, purchase, sales and production units, approved suppliers and bin cards. Sub groups are governed centrally: existing sub groups can only be changed or deleted from the head-office company, and every new sub group is made available to all companies and authorised on save. The item master and inventory, purchasing and planning processes rely on these defaults.
  parent_of:
  - material-item
  related_to:
  - concept: vendor
    how: approved vendors of the sub group
  - concept: make
    how: approved makes of the sub group
  - concept: unit-of-measure
    how: units allowed for items of the sub group
  - concept: qc-parameter
    how: sub group level QC parameters
  - concept: hsn-sac-code
    how: HSN / SAC code that drives GST of the sub group
  tables:
  - masterdata.mBinCardSubgroupDetail
  - masterdata.mSubGroupDivisionDetail
  - masterdata.mSubGroupMakeDetail
  - masterdata.mSubGroupMaster
  - masterdata.mSubGroupMasterCompanyDetail
  - masterdata.mSubGroupQCParameterDetail
  - masterdata.mSubGroupUnitDetail
  - masterdata.mSubGroupVendorDetail
- key: payment-plan
  name: Payment Plan
  module: FI
  summary: The Payment Plan screen lets Finance decide, for a given due date, which outstanding payables will be paid, how
    much of each, and by which payment mode.
  description: |
    Evidence: code + ERP domain (inferred)
    The Payment Plan screen lets Finance decide, for a given due date, which outstanding payables will be paid, how much of each, and by which payment mode. The user filters open items by Source Document, Payee Type and Payee Name, ticks the items to pay (open references, sundry payments, supplier advances, freight invoices, TDS and other statutory payables), sets the passing amount and splits it across payment modes such as cheque, DD, RTGS/NEFT or cash. Direct account payments can be added in a separate account grid. The plan then groups amounts per payee, mode and currency on the Cheque, DD, RTGS/NEFT, RTGS/NEFT Through Cheque and Cash tabs, where bank and instrument details are completed. Each plan has a document number, date, finance book and approval status; authorising the plan locks it and posts cash lines to the cash counter. Saving reserves the planned amounts against the open references and, where the company uses payment advices, consumes payment advice balances. Treasury and payment teams benefit downstream because bank payment, cash payment, DD posting and cheque printing work from the authorised plan.
  tables:
  - Finance.CashCounterMain
  - Finance.PaymentPlanAccountReferenceDetail
  - Finance.PaymentPlanPaymentDetail
  - Finance.PaymentPlanReferenceDetail
