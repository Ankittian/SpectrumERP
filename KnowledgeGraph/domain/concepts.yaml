    The Sales Organization screen maintains the sales organisations of the group and assigns to each the companies, or company divisions, that it covers. Each sales organisation has an automatically generated code, a unique name and an inactive flag. A company or division can belong to only one sales organisation, so the selection grid offers only units not already taken by another organisation. Whether divisions are listed depends on the head office's division setting. An organisation that is already used on a sales order cannot be changed. Sales enquiries, quotations, agreements, orders, dispatch, invoicing, CRM leads and many sales reports use the sales organisation downstream.
