- key: general-proforma-invoice-receipt
  name: General Proforma Invoice Receipt
  module: FI
  summary: The General Proforma Invoice Receipt screen records money received from a customer in advance against one or more
    authorized proforma invoices, before the goods or services are billed.
  description: |
    Evidence: code + ERP domain (inferred)
    The General Proforma Invoice Receipt screen records money received from a customer in advance against one or more authorized proforma invoices, before the goods or services are billed. The user chooses a Customer Name and Location, optionally an Order No., a Receipt Mode, the Bank Account that received the money, the cheque, demand draft or UTR details and the Cheque Amount. The user then ticks the proforma invoices the money pays for. The screen spreads the amount over the ticked invoices and their items, carries the invoice taxes with each item, and checks that the amounts agree [fGeneralPIReceipt.vb:596-646; fGeneralPIReceipt.vb:1409-1440; fGeneralPIReceipt.vb:1975-2020].
  tables:
