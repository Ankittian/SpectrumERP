- key: store-inward-note
  name: Store Inward Note
  module: DRM
  summary: The Store Inward Note (SIN) screen records the stores receipt of discrete raw material that has already passed
    the gate as a discrete raw material gate entry.
  description: |
    Evidence: code + ERP domain (inferred)
    The Store Inward Note (SIN) screen records the stores receipt of discrete raw material that has already passed the gate as a discrete raw material gate entry. The user picks a source document type (purchase order, stock transfer, dispatch challan or sales order), the vendor and vendor location, and one unused gate entry; the screen then lists the orders linked to that gate entry and the items that arrived. For each item the user confirms the received quantity, warehouse and BIN, and optionally splits the quantity across order and indent lines on the Lot Detail tab. Header details such as weighment slip, vendor bill, excise challan, freight and inspection flags are captured, together with quality "other details", notes and custom fields. When an SIN without "Maintain Lot" is authorized, the screen creates stock lots for the received material and can post a journal voucher to finance in the same transaction. Stores, quality and finance teams downstream depend on the SIN for stock, inspection and vendor bill matching.
  tables:
