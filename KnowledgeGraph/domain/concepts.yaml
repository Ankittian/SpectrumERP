  - masterdata.mMiscCharges
  - masterdata.mMiscChargesCompanyDetail
  - masterdata.mTaxCodeMiscChargesDetail
- key: tdc-group
  name: Tax / Duty / Charge Group
  module: FI
  synonyms:
  - TDC Group
  - Tax Group
  summary: The TDC Group screen maintains groups of taxes, duties and charges (TDC, Inferred expansion).
  description: 'Evidence: code + ERP domain (inferred)

    The TDC Group screen maintains groups of taxes, duties and charges (TDC, Inferred expansion). Each group has a six-character
    code, a name, a tax category (for example VAT, TDS, GST, Freight or Other Charges) and a rounding method. Groups are shared
    across the whole enterprise; codes and names must be unique. Groups that belong to system-controlled tax categories are
    locked against changes to code, category and name, while the rounding method stays editable. Tax and charge masters and
    documents that apply taxes or charges group their lines by these groups (Inferred).

    '
  related_to:
  - concept: tdc-charge
    how: charges in the group
  tables:
