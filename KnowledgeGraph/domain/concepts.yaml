- key: change-consumption-pattern
  name: Change Consumption Pattern
  module: MM
  summary: The Change Consumption Pattern screen lets a planner revise, item by item, the planning figures that were approved
    in the most recent Material Consumption Pattern entry of an Optimization Unit.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Consumption Pattern screen lets a planner revise, item by item, the planning figures that were approved in the most recent Material Consumption Pattern entry of an Optimization Unit. The user picks an Optimization Unit, optionally narrows the list by Category, Group and Subgroup, and presses Show. The grid lists every item of that unit's latest authorized pattern with its Consumption Pattern, Source Type, Consumption Rate, Safety Days, Lead Days, Reorder Point, Reorder Qty, Max Stock and Safety Stock. The user ticks the items to change, edits the figures, and saves. The screen recalculates Reorder Point and Max Stock when days or rate change. Purchasing and stock planning benefit because their reorder figures stay current without a new full consumption-pattern run. The window caption reads "Item Supplies Source" while the menu entry is "Change Consumption Pattern" (see Section 13). The related creation screen is [Material Consumption Pattern](Functional_Doc_fItemConsumptionPattern.md).
- key: dispatch-planning-amendment
  name: Dispatch Planning Amendment
  module: SD
  summary: The Dispatch Planning Amendment screen is a variant of the [Dispatch Planning](Functional_Doc_fDispatchPlanning.md)
    screen (window caption "DispatchPlanningAmendment").
  description: |
    Evidence: code + ERP domain (inferred)
    The Dispatch Planning Amendment screen is a variant of the [Dispatch Planning](Functional_Doc_fDispatchPlanning.md) screen (window caption "DispatchPlanningAmendment"). It does not create plannings. It lets a user reopen a planning that has already been Authorized, which the base screen locks, and change its Planning Period, remarks, order lines, shipment lines, notes and custom fields [fDispatchPlanningAmendment.vb:331-392; Sales.SDDPFillValues:134-156]. The order grid, shipment popup, quantity rules and eligible-line selection are shared with the base screen, so this document describes only what differs. The main differences are an Amendment Date instead of a Document Date, no status or numbering control, and a safeguard that stops the amendment from cutting a quantity below what Dispatch Advice has already drawn [Sales.SDDPValidate:76-135]. Saving does not version the planning. It deletes every order line, shipment, note and custom field of the planning and writes them again from the screen, and the planning stays Authorized [Sales.SDPASave:23-35]. Dispatch Advice, Picking and Dispatch Challan continue to rely on the amended planning.
- key: fmaterialagreementvalidity
  name: fMaterialAgreementValidity
  module: MM
  summary: This screen is a variant of the base [Material Agreement](Functional_Doc_fVendorAgreement.md) screen.
  description: |
    Evidence: code + ERP domain (inferred)
    This screen is a variant of the base [Material Agreement](Functional_Doc_fVendorAgreement.md) screen. It does not create an agreement; it extends or shortens the validity period of an existing material agreement and, for recurring agreements, redistributes the delivery schedule inside the new period. The user picks an agreement, sees its vendor, location, current period and items, enters a new From and To date, and, for a recurring agreement, adjusts the quantity schedule of each item. The change is a numbered document with the usual Initial / Release / Authorized status. Nothing in the agreement changes until the change document is authorized; authorization then writes the new period and schedule into the agreement. Purchase orders already raised against the agreement are protected: the new period must still cover them and schedule quantities cannot fall below what was ordered. Only the differences from the base screen are described below; for the agreement's own fields, items, taxes and terms, see the [Material Agreement](Functional_Doc_fVendorAgreement.md) document. [fMaterialAgreementValidityChange.vb:381-467; Purchase.PCPAAuthorize:20-25]
  tables:
  - Purchase.AgreementValidityChangeItemScheduleDetail
  - Purchase.AgreementValidityChangeMain
- key: gate-in-outward
  name: Gate In - Outward
  module: MM
  summary: The Gate In - Outward screen records the arrival of a vehicle at the factory gate for an outward (customer) movement.
  description: |
    Evidence: code + ERP domain (inferred)
    The Gate In - Outward screen records the arrival of a vehicle at the factory gate for an outward (customer) movement. The security user captures the transporter, vehicle type and number, driver, loading condition, in time and, where the business uses them, the customer, delivery location and agent. A gate-in can be entered directly or raised against an existing Dispatch Advice, in which case the vehicle, driver and customer details are copied from that advice. The document is numbered, dated and carries an Initial / Release / Authorized status like other gate documents, and an optional list of items the vehicle is expected to carry. The screen refuses blacklisted vehicles and, by configuration, a second entry of the same vehicle on the same day. The record is the starting point for weighment and for [Vehicle Gate Out](Functional_Doc_fVehicleGateOut.md); security, weighbridge and dispatch staff rely on it. Inward vehicles are handled on [Gate Entry](Functional_Doc_fGateEntry.md). A restricted correction screen exists as [Gate In - Outward Amendment](Functional_Doc_fVehicleGateInAmendment.md).
  tables:
  - GateEntry.VehicleGateEntryItemDetail
  - GateEntry.VehicleGateEntryMain
- key: gate-in-outward-amendment
  name: Gate In - Outward Amendment
  module: MM
  summary: This screen is a variant of the base [Gate In - Outward](Functional_Doc_fVehicleGateIn.md) screen and describes
    only what differs.
  description: |
    Evidence: code + ERP domain (inferred)
    This screen is a variant of the base [Gate In - Outward](Functional_Doc_fVehicleGateIn.md) screen and describes only what differs. It lets a user correct an already authorized gate-in without reopening it: the customer, customer location, agent and the expected item list can be changed, while vehicle, transporter, driver, loading condition, dates and number are shown read-only. The user picks the gate-in from a list of recently authorized gate-ins that are not yet finally weighed. Security and dispatch benefit because a wrongly captured customer or load list can be fixed without cancelling the gate-in that weighment and gate-out depend on. Window caption: "Gate In - Outward Amendment" (form register).
  tables:
  - GateEntry.VehicleGateEntryItemDetail
- key: go-a-head-live
  name: Go A-Head Live
  module: MM
  summary: The Go A-Head Live screen (menu name "Go-Ahead") takes one or more authorized Consumption Patterns of a Procurement
    Unit and puts their items live for planning.
  description: |
    Evidence: code + ERP domain (inferred)
    The Go A-Head Live screen (menu name "Go-Ahead") takes one or more authorized Consumption Patterns of a Procurement Unit and puts their items live for planning. The user chooses the Procurement Unit and a Go Live Date, ticks the Consumption Patterns to release, and the screen sorts the items into those already live ("Existing"), those newly coming in ("New") and those that appear in both ("Overlap"). The user ticks the items to release and decides per item whether the system may raise indents for it automatically ("Auto Indent"). Impact tabs show, per group, subgroup and item, how today's stock compares with the stock the chosen patterns would hold. The document has a number, date and status that can be advanced to Released or Authorized; an Authorized Go-Ahead is locked. Downstream, the automatic indent job, inventory optimization reports and rate contract suggestions read the authorized Go-Ahead. [fGoAheadLive.vb:251-332; Optimization.GAHLItemDetail:36-97; Optimization.JobForAutoIndent:46-48]
