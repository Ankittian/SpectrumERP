    The Vehicle Gate Out screen records the departure of a vehicle from the factory gate. The security user picks the vehicle's earlier gate-in record, either an outward vehicle gate-in or an inward Gate Entry, and the screen shows the customer or supplier, transporter, driver, vehicle and weighment details captured at entry. The user records the gate-out time, whether the vehicle leaves loaded or empty, and, for outward vehicles, the sales invoices the vehicle carries. A reason is required when no invoice is listed. The document is numbered, dated and carries a Initial / Release / Authorized status like other gate documents. The record closes the gate-in, so the vehicle reports as departed and cannot be given a second gate-out. Security, dispatch and logistics staff benefit from the vehicle in/out register and the pending gate-in notifications.
