  module: MM
  synonyms:
  - Store
  - Warehouse
  summary: The Warehouse screen maintains the stores in which inventory is held.
  description: 'Evidence: code + ERP domain (inferred)

    The Warehouse screen maintains the stores in which inventory is held. Each warehouse has a name, a location description,
    a type (Inhouse or External), an ownership (Own or Party, with the owning party), an address and an inactive flag. The
    user assigns the warehouse to one or more companies and divisions of the group and selects which item groups, sub groups
    and items may be stocked there. Warehouse names are unique across the enterprise, and type and ownership are locked once
    goods receipts or stock transfers exist. Saving also prepares stock valuation settings for each assigned company and division.
    Stores, purchasing and inventory transactions depend on this master.

    '
