    The Service RFQ screen creates and maintains the request for quotation that a buying company sends to subcontractors and service vendors to invite prices for services, conversion (job work) or activities. An RFQ is raised either directly, by typing the services, or against selected subcontract requisitions (service requests), whose lines are pulled into the RFQ. Each RFQ is of one subcontract type (Service, Conversion or Activity), carries the vendors invited, the dates by which quotations are to be submitted, opened and kept valid, notes and custom fields, and, where the work is process driven, the material the company will issue and the output it expects back. The screen also tracks the document status (Initial, Release, Authorized). Purchasing staff use it to put the same requirement in front of several vendors; quotation entry and comparison downstream rely on the RFQ it records.
