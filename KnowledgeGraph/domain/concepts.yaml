  description: |
    Evidence: code + ERP domain (inferred)
    The SIN Make Update screen lets stores staff assign a Make (brand or manufacturer) to received Stores Inward Note (SIN) items that were received without one. The user lists authorized SIN items by date range and vendor, ticks the rows to correct, picks a Make per row (or one Make to copy to all ticked rows) and saves a numbered update document. On save, the chosen Make is written back to the SIN, its gate entry, lot records, stock lots, order links and the related purchase bill and excise posting lines. The screen is a correction utility: it creates a document that records who changed the Make and when. Stores, purchase and finance users benefit because stock, bills and excise records then agree on the Make of the material.
