- key: qda-in-stock-transfer
  name: QDA in Stock Transfer
  module: MM
  summary: The QDA in Stock Transfer screen (menu caption "QDA in Stock Transfer"; window caption "QDAStocktransfer") records
    a quantity and value adjustment (QDA) at the end of a stock movement chain [fQDAStocktransfer.Designer.vb:372].
  description: |
    Evidence: code + ERP domain (inferred)
    The QDA in Stock Transfer screen (menu caption "QDA in Stock Transfer"; window caption "QDAStocktransfer") records a quantity and value adjustment (QDA) at the end of a stock movement chain [fQDAStocktransfer.Designer.vb:372]. The user picks a source document, either a closed purchase order whose goods moved through several freight legs or a direct warehouse-to-warehouse stock transfer, and the screen calculates, item by item, what was received, transferred onward, consumed, returned, short or excess and still in stock, together with the rate difference to apply to the received lots (BR-03 to BR-09). The lines are read-only. When the document is saved as Authorized, the rate difference is written to the affected stock lots and the moving average rate is recalculated, the linked purchase order records are marked, and, when finance is enabled, a journal voucher for the value difference is posted and reconciled with the lot values (BR-16 to BR-24). Stores and costing staff use the screen to bring stock values into line with the real landed cost of goods moved through freight routes or transfers. The review found that authorized adjustments can be deleted, that the return amount is saved as the return quantity, and that custom fields and notes are shown but never saved (Section 13).
