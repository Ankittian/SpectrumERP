  description: 'Evidence: code + ERP domain (inferred)

    The Location Detail screen maintains the addresses (locations) of business partners already set up as vendor cards, such
    as suppliers, customers, contractors, transporters, agents and group companies. For each location it captures the communication
    address, tax registrations (GST, PAN, TAN, MSME and older excise and sales tax numbers), payment and tax defaults, contact
    persons, bank accounts, custom fields, vendor groups, per-company availability, Tally account names and, for inter-company
    partners, applicable divisions. Locations can be entered one at a time, copied from an existing location, created from
    an open vendor master request, or bulk-loaded through a fast entry grid and Excel import. Each new location receives a
    system code and is made available to all companies; deletion is reserved to the head office. Purchase, sales, logistics
    and finance documents select these locations as bill-to, ship-to, consignee and party locations, and some of them lock
    the location''s identity once used.

