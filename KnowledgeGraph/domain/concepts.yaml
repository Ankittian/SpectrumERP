- key: material-issue-fmaterialissuedrm
  name: Material Issue
  module: DRM
  summary: The Material Issue (Discrete Raw Material) screen records the issue of one discrete raw material item (for example
    bars, plates or pipes tracked by heat, cast and test-certificate number) from a warehouse to an employee, a contractor
    or a vendor.
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Issue (Discrete Raw Material) screen records the issue of one discrete raw material item (for example bars, plates or pipes tracked by heat, cast and test-certificate number) from a warehouse to an employee, a contractor or a vendor. An issue can be made directly, or against one or more Job Cards or Subcontract (SC) Orders, and for every stock lot drawn the user can split the issued quantity across the selected Job Cards or SC Orders. The screen controls who receives the material, whether the issue is chargeable, which department and cost centre bear it, and whether own or party-owned material is issued. Issues move through the shared document statuses; only an Authorized issue moves stock out of the lots and, for own material with a value, posts a journal voucher to finance. Before authorization the issue holds the stock as a pending issue so that other issues cannot draw the same quantity. The window caption is "Material Issue" [fMaterialIssueDRM.Designer.vb:1725]. Behaviour shared with the standard stores issue is described in [Material Issue](Functional_Doc_fMaterialIssue.md); this document covers the discrete raw material variant only.
