    The screen, captioned "Bank Guarantee" and known as Bank Guarantee Mapping, links a vendor bank guarantee, recorded in [Bank Guarantee](Functional_Doc_fBankGuarantee.md), to the purchase documents it secures: purchase orders, service orders, material agreements and service agreements. The user picks a guarantee, sees its bank, branch, amount, validity and purpose, and ticks the eligible documents of the guarantee's vendors. A second tab shows the documents already mapped to the same guarantee in other mappings. For guarantees held as a running balance, the screen compares the ordered value, less what has been paid, with the guarantee balance and refuses a mapping that exceeds it. The mapping is a numbered document with the usual Initial / Release / Authorized status. Purchasing and finance benefit because guarantee cover per order is visible and cannot be over-committed. [fBankGuaranteeMapping.vb:238-325; fBankGuaranteeMapping.vb:443-510]
