    The Stock Transfer screen moves discrete raw material, lot by lot, out of the issuing warehouses and into receiving warehouses. A transfer goes to another company of the group, to another division, between warehouses of the same division, or converts the material into a different item. The user picks the item, the stock lots to send, and the quantity of each, and the screen builds the receipt side from them. For transfers outside the company it also records the transport details (challan, transporter, driver, vehicle, LR) and the excise challan. When the transfer is authorized, the lots are issued from stock, the receipt lots are created, and a journal voucher is posted where finance books differ. Stores staff enter the transfer, and stock control and accounts use the result.
