    The Update DR Opening Balance screen lets stores staff correct raw material opening stock that was already entered on the [Rawmaterial Opening](Functional_Doc_fDiscreteRMOpening.md) screen. The user picks an item by Item Code or Item Description, and the screen lists every opening lot of that item with its warehouse, quantity, pieces, rate, ownership, party, bin, cost center, dimensions and the issued quantity so far. The user changes quantity, pieces, rate, party, location, bin or cost center, or attaches the original SIN, invoice and tax details, then saves. A lot can also be deleted from the grid. The screen protects stock that has already been issued by locking most columns and by refusing a quantity below the issued quantity. Stores and finance users rely on it to fix opening mistakes without re-keying the opening.
