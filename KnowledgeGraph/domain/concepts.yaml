    The Multi Item Opening screen records the opening stock of many items in one session. The user fixes the stock combination (division, warehouse, ownership, stock nature, stock type); the screen then lists every item eligible for that combination, one row per item and per make, and the user ticks the items that have opening stock and enters Quantity, Rate or Total Amount and, where required, Expiry Date [fInvOpeningBalance .vb:25; fInvOpeningBalance .vb:1061-1142; Inventory.IMIOFillValuesDependent:37-91]. A line can be split into several lots by department, cost center, BIN card, party, party location, batch and bill using the Other Details panel. Opening quantities can also be loaded from an Excel sheet with the Import button. Saving creates the opening lots and, when finance is applicable and the stock is own stock of stock nature 1, updates the finance opening balances [fInvOpeningBalance .vb:259-266]. Opening entries can be searched, reopened and deleted. The window caption is "Inventory Opening Balance" and the menu name is Multi Item Opening [fInvOpeningBalance .Designer.vb:304]. The one-item counterpart with tax and serial number detail is [Single Item Opening](Functional_Doc_fItemOpening.md).
