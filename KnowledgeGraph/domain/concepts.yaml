    The Bank Branch Detail screen maintains the list of bank branches. Each branch belongs to one bank from the Bank Master and carries a name, a postal address, a city, state and country, and an IFSC code. A branch code is generated automatically. Branches are created and changed centrally by the head office company. The finance, purchase and vendor screens that record bank accounts, payment instruments or bank guarantees pick their branch from this list, so every document refers to one agreed description of the branch. The screen saves each branch as one record and does not keep company-wise availability or an authorization stamp.
