    pieces.
  description: 'Evidence: code + ERP domain (inferred)

    The Unit Master screen maintains the units of measure used across the application, such as kilograms, litres or pieces.
    For each unit it captures a name, a short alias, a unit category (weight, volume, area, time, length or others) and an
    optional GST unit quantity code (UQC) used for tax reporting. It also records standard conversion factors between this
    unit and other units, and which material sub groups use this unit as their stock, purchase, sales or production unit.
    Units are shared by every company: a new unit is made available to all companies at once and is authorised on save. Items,
    sub groups and practically every inventory, purchase, sales, production and finance document depend on the units defined
    here.

    '
