  module: SD
  summary: The Dispatch Planning Bulk Amendment screen (window caption "DispatchPlanningBulkAmendment") is a bulk companion
    to [Dispatch Planning](Functional_Doc_fDispatchPlanning.md) and [Dispatch Planning Amendment](Functional_Doc_fDispatchPlanningAmendment.md)
    [fDispatchPlanningBulkAmendment.Designer.vb:128].
  description: |
    Evidence: code + ERP domain (inferred)
    The Dispatch Planning Bulk Amendment screen (window caption "DispatchPlanningBulkAmendment") is a bulk companion to [Dispatch Planning](Functional_Doc_fDispatchPlanning.md) and [Dispatch Planning Amendment](Functional_Doc_fDispatchPlanningAmendment.md) [fDispatchPlanningBulkAmendment.Designer.vb:128]. Instead of opening one planning, the user picks a date range and sees every planning line in that range that has already been partly invoiced and still carries an unused balance [Sales.SDBAFillValues:139-145]. The user ticks the lines to close and saves. For each ticked line the planned quantity is cut down to the quantity already covered by Tax Invoices, so the open balance disappears from the plan [Sales.SDBAFillValues:43; fDispatchPlanningBulkAmendment.vb:576-578]. The matching Dispatch Advice quantities are brought in line with the invoices in the same save. Several plannings can be amended in one save, and one failure rolls the whole save back. The screen has no per-planning editing, no numbering and no status control. Sales and dispatch planners benefit because stale balances no longer inflate planned or advised quantities.
  tables:
  - Sales.DispatchPlanningBulkAmendmentMain
- key: material-planning-method
  name: Material Planning Method
  module: MM
  summary: The Material Planning Method screen decides, for each Material Planning Unit, which planning type applies to each
    of its critical items.
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Planning Method screen decides, for each Material Planning Unit, which planning type applies to each of its critical items. The user chooses a Planning Unit, sees the critical items stocked in that unit's warehouses, and assigns a Planning Type to each item, either row by row or to all rows at once. Items that already have min/max or reorder quantities set are locked so their method cannot change underneath those quantities. The screen is a save-only maintenance screen: it has no search, no delete and no record numbers; re-selecting a unit shows its current choices. The choices drive the Material Planning Setting screen, which lists only the items given a method here and lets the user enter quantities that match each item's type.
  tables:
  - Inventory.MaterialPlanningMethod
  - Inventory.MaterialPlanningMethodItemDetail
- key: material-planning-setting
  name: Material Planning Setting
  module: MM
  summary: 'The Material Planning Setting screen records, for a Material Planning Unit and an Effective From date, the stock
    control quantities of each critical item: Minimum Qty.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Planning Setting screen records, for a Material Planning Unit and an Effective From date, the stock control quantities of each critical item: Minimum Qty. and Maximum Qty. for items planned by min/max, Reorder Level and Reorder Qty. for items planned by reorder point, and an optional Lead Time. The item list comes from the Material Planning Method screen, so each item shows its Planning Type and only the quantities that fit that type are editable. When a new effective date is chosen, the grid starts from the item's most recent earlier values and shows the Last Effective Date, so planners adjust rather than retype. A Copy Item button is provided to pull values from another saved setting. The saved quantities feed the min/max and reorder listings and notifications used by purchasing and stores.
  tables:
  - Inventory.MaterialPlanningSetting
  - Inventory.MaterialPlanningSettingItemDetail
- key: material-planning-unit
  name: Material Planning Unit
  module: MD
  summary: The Material Planning Unit screen defines a named planning unit for one company and decides which division and
    warehouse combinations belong to it.
  description: |
    Evidence: code + ERP domain (inferred)
    The Material Planning Unit screen defines a named planning unit for one company and decides which division and warehouse combinations belong to it. A planning unit is the grouping against which material planning is later configured: the Material Planning Method and Material Planning Setting screens both start by choosing a planning unit. The user enters a Planning Unit name, picks the Company Name, ticks the warehouses that belong to the unit and marks one of them as the Execution Unit. The screen assigns a running Code automatically. Warehouses already taken by another planning unit of the same company are not offered, so each warehouse sits in at most one planning unit. Planning, min/max and reorder reporting rely on this grouping.
  tables:
  - masterdata.mMaterialPlanningUnit
  - masterdata.mMaterialPlanningWarehouseDetail
- key: other-information
  name: Other Information
  module: MD
  summary: 'The Other Information screen defines reusable "Other Information" headers: free-form tables that can be attached
    to a sales document, such as a block of terms or notes.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Other Information screen defines reusable "Other Information" headers: free-form tables that can be attached to a sales document, such as a block of terms or notes. For each header the user enters a Header Name and a Description, chooses how many columns the table has (one to four), names each column and, optionally, supplies default rows of text. The screen assigns a running Code automatically. A new header is made available to all companies at once, and each company's list and Inactive flag are kept separately. Sales users later pick a header on the Sales Other Information screen and start from its column names and default rows. The master is therefore central, with sales staff as the main downstream users.
  tables:
  - masterdata.mOtherInformationColumnDetail
  - masterdata.mOtherInformationDefaultValue
  - masterdata.mOtherInformationMain
  - masterdata.mOtherInformationMainCompanyDetail
- key: sales-other-information
  name: Sales Other Information
  module: SD
  summary: The Sales Other Information screen attaches extra, configurable information to a sales source document, such as
    a quotation.
  description: |
    Evidence: code + ERP domain (inferred)
    The Sales Other Information screen attaches extra, configurable information to a sales source document, such as a quotation. The user picks a Source Document and a Reference Document, then picks a Header Name from the Other Information Header master. The Header defines how many columns (up to four) the grid shows and what each column is called. The user fills the rows, gives the block a Sequence No. and saves. If the same Header was already filled for another reference document, the user can copy those rows with a button instead of retyping them. The information is later read by quotation printouts and by the quotation revision routines, which carry it to the revised document. The window caption reads "SalesOtherInformation" [fSalesOtherInformation.Designer.vb:303].
  tables:
  - Sales.SalesOtherInformationDetail
  - Sales.SalesOtherInformationMain
- key: asset-tag-lot-mapping
  name: Asset Tag Lot Mapping
  module: ADM
  summary: The Asset Tag Lot Mapping screen links fixed asset tags to the inventory lots they were created from.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Tag Lot Mapping screen links fixed asset tags to the inventory lots they were created from. The user picks a Depreciation Book and the screen shows two lists side by side: authorised asset tags with quantity, and received stock lots with their balance. Ticking a tag allocates its quantity automatically across lots of the same item and serial number, and ticking a lot allocates its balance across matching tags. The user can fine-tune either allocation in a small popup. On save, each tag and lot pair is stored with its quantity. The screen is used by fixed asset accountants and stores staff who need each asset traced to the purchase lots, with their rate and value, that supplied it.
  tables:
  - Inventory.InvLotSerialAssetDetail
- key: bank-account-commission
  name: Bank Account Commission
  module: ADM
  summary: The Bank Account Commission screen defines the bank charges the company bears when it pays through selected bank
    accounts and payment modes.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Account Commission screen defines the bank charges the company bears when it pays through selected bank accounts and payment modes. A setting has a Description, a From Date and an optional To Date, one Payment Mode, and an optional Time Basis switch. It lists the bank accounts it covers, the finance books it applies to, and a scale of commission amounts by payment amount band (and by time of day when Time Basis is ticked). It can also name a Bank Commission Account and SAC Code, and the GST charges and ledger accounts used to book tax on the commission, as input or expense tax. Bank payments read the setting to work out the commission and its tax. The screen prevents overlapping settings for the same bank accounts and enforces consistent state and chart of accounts across the selected books and accounts.
  tables:
  - Config.BankCommissionAccountDetail
  - Config.BankCommissionDetail
  - Config.BankCommissionFBDetail
  - Config.BankCommissionMain
  - Config.BankCommissionTaxDetail
- key: company-update
  name: Company Update
  module: ADM
  summary: The Company Update screen lets a user correct the contact and tax-registration details of the company they are
    logged into.
  description: |
    Evidence: code + ERP domain (inferred)
    The Company Update screen lets a user correct the contact and tax-registration details of the company they are logged into. It shows five fields: GSTIN No., Phone No., Fax No., Email and Web Site. The user edits any of them and saves. The screen never creates or removes a company. It changes only the logged-in company's own record, so each company maintains its own details. Other parts of the application that print or validate company identity read these values from the same company record. No field is mandatory.
- key: depreciation-book
  name: Depreciation Book
  module: MD
  summary: The Depreciation Book screen defines a named depreciation book for the fixed asset module.
  description: |
    Evidence: code + ERP domain (inferred)
    The Depreciation Book screen defines a named depreciation book for the fixed asset module. A book has a Book Type, a COD (the chart of depreciation that supplies the asset group and class structure) and three calculation options: Depreciation On 30 Days, Include Capitalization Date For Depreciation and Include Processing Date For Depreciation. The user also ticks the finance books that belong to the depreciation book. The screen shows the structure of the chosen COD as a read-only reference. The screen assigns a running Code automatically. Fixed asset set-up, asset numbering, opening balances and depreciation reports select a depreciation book, so the book is the anchor for depreciation accounting.
  tables:
  - FixedAsset.DepreciationBookFBDetail
  - FixedAsset.DepreciationBookMain
- key: discreterm-setting
  name: DiscreteRM Setting
  module: ADM
  summary: The DiscreteRM Setting screen holds one set of company-wide defaults for discrete raw material handling.
  description: |
    Evidence: code + ERP domain (inferred)
    The DiscreteRM Setting screen holds one set of company-wide defaults for discrete raw material handling. It records which gate entry source document applies, the tolerance percentages allowed on store inward notes (SIN) and on SIN challans, whether inspection is required, the units used for sections and section dimensions, the raw material managing unit and the stock adjustment tolerance. The screen shows a single settings panel for the logged-in company; there is no search, no list and no delete. When the user saves, the screen creates the company's setting row on first use and overwrites it afterwards. After a successful save the screen reloads the saved values. Receipt, inspection and stock adjustment activities for discrete raw material read these defaults.
  tables:
  - DiscreteRM.Setting
- key: first-weighment
  name: First Weighment
  module: WB
  summary: The First Weighment screen records the first weight of a vehicle at the weigh bridge and creates the Weighment
    Slip that the Second Weighment screen later completes.
  description: |
    Evidence: code + ERP domain (inferred)
    The First Weighment screen records the first weight of a vehicle at the weigh bridge and creates the Weighment Slip that the Second Weighment screen later completes. The clerk chooses the direction (Inward, Outward or General), the document the vehicle is carrying or collecting against, the vendor or customer, the vehicle and driver, and the weight type. The weight itself is not typed: it is read from the weighing machine connected to the PC and copied into the slip with the Capture button. The screen can also fire the IP cameras at the weigh bridge and attach the pictures to the slip, and it prints the slip after saving. Each weigh bridge machine is tied to one PC, so a clerk always works on the machine configured as the default for that PC. Store, dispatch and gate staff rely on the slip for the vehicle's tare or gross weight and for the slip number.
  tables:
  - WeighBridge.WeighmentSlip
- key: form-exchange-rate-type
  name: Form Exchange Rate Type
  module: ADM
  summary: The Form Exchange Rate Type screen defines, for each application form, which kinds of exchange rate the form may
    use and which kind it uses by default.
  description: |
    Evidence: code + ERP domain (inferred)
    The Form Exchange Rate Type screen defines, for each application form, which kinds of exchange rate the form may use and which kind it uses by default. A grid lists every visible form with its Module, Form name and Form Code. For each form the user ticks Standard Rate, Buying Rate and Selling Rate, and picks the Default rate type. The setting is not tied to a company: it applies to the whole installation. Forms that convert foreign currency use this list to offer and preselect an exchange rate type. Users can filter the grid by typing in the filter row.
  tables:
  - GlobalData.FormExchangeRateTypeDetail
- key: generate-e-way-bill
  name: Generate E Way Bill
  module: ADM
  summary: The Generate E Way Bill screen lets a user create government E Way Bills for authorised sales tax invoices in bulk.
  description: |
    Evidence: code + ERP domain (inferred)
    The Generate E Way Bill screen lets a user create government E Way Bills for authorised sales tax invoices in bulk. The user picks a date range and a GSP API (the service provider connection), clicks Show to list the invoices that still have no E Way Bill, ticks the invoices to process and clicks Generate E Way Bill. For each ticked invoice the screen sends a ready-built request to the provider, writes the provider's message into the Remarks column and, on success, shows the E Way Bill number and date and stores them on the invoice. Every attempt is logged. The screen also shows data problems on each invoice, such as a missing pin code or GSTIN, before the user sends it. Dispatch and finance teams benefit because goods can move legally without keying invoices into the government portal.
  tables:
  - Utility.EWayBillAPIRequest
- key: head-definition
  name: Head Definition
  module: MD
  summary: The Head Definition screen maintains the list of Terms and Conditions heads, such as the headings under which clauses
    are written on orders and quotations.
  description: |
    Evidence: code + ERP domain (inferred)
    The Head Definition screen maintains the list of Terms and Conditions heads, such as the headings under which clauses are written on orders and quotations. The user enters a Head Description, ticks the forms on which the head may be used, and saves. The screen assigns a running Code automatically. A Fast Entry mode lets the user type or import many head descriptions at once, all sharing the same ticked forms. Only the head office company can change data here; other companies see the screen locked. Purchase and sales document screens read the form ticks to decide which heads they offer.
  tables:
  - masterdata.mTermsNConditionHead
  - masterdata.mTermsNConditionHeadCompanyDetail
  - masterdata.mTermsNConditionHeadFormDetail
- key: inter-unit-sco-setting
  name: Inter Unit SCO Setting
  module: ADM
  summary: The Inter Unit SCO Setting screen holds a single list of production unit pairs that may subcontract to each other.
  description: |
    Evidence: code + ERP domain (inferred)
    The Inter Unit SCO Setting screen holds a single list of production unit pairs that may subcontract to each other. Each row names a first production unit and a second production unit. The list is enterprise-wide: it is not filtered by company and it is replaced as a whole whenever the user saves. The screen has no header fields, no search and no separate delete; the user edits the grid and saves. Production units that are planning units are not offered. Subcontract requisition and service order screens read this list to decide whether work that is to be done at another unit of the group may be taken up for a subcontract order.
  tables:
  - Production.InterUnitSCOSetting
- key: interunit-material-transfer-setting
  name: InterUnit Material Transfer Setting
  module: ADM
  summary: The InterUnit Material Transfer Setting screen defines which item in one business unit corresponds to which item
    in another business unit.
  description: |
    Evidence: code + ERP domain (inferred)
    The InterUnit Material Transfer Setting screen defines which item in one business unit corresponds to which item in another business unit. A business unit is a company, or a company and division where divisions are used. The user chooses an Effective From date, Business Unit I and Business Unit II, then lists item pairs in a grid. One save creates both directions of the arrangement, so the same pairs also work in reverse from Business Unit II to Business Unit I. Existing pairs for the same units and date are loaded back for editing. Inter-unit transfers between companies or divisions rely on this mapping to know what an item becomes on the receiving side.
  tables:
  - Inventory.InterUnitMaterialTransferSetting
  - Inventory.InterUnitMaterialTransferSettingDetail
- key: po-booking
  name: PO Booking
  module: ADM
  summary: The PO Booking screen is a small dialog opened from the Comparative Statement screen ([Functional_Doc_fCS.md](Functional_Doc_fCS.md)).
  description: |
    Evidence: code + ERP domain (inferred)
    The PO Booking screen is a small dialog opened from the Comparative Statement screen ([Functional_Doc_fCS.md](Functional_Doc_fCS.md)). It lets a buyer reserve a quantity of an item with the chosen supplier offer at an agreed rate, so that a purchase order can later be raised against it. The buyer enters the Booking Qty., the Booking Rate and optional Remarks. The dialog opens in two modes, "Book For PO" for a new booking and "Edit Booking" for an existing one. It enforces limits against the enquiry quantity and against any quantity already ordered. After saving, the Comparative Statement cell shows the booked and ordered quantities and changes colour. Buyers benefit because the supplier decision is recorded on the statement and drives the status colours.
  tables:
  - Purchase.CSBooking
- key: resource-master
  name: Resource Master
  module: MD
  summary: The Resource Master screen defines the resources (people, machines and similar) that production work can be assigned
    to and planned against.
  description: |
    Evidence: code + ERP domain (inferred)
    The Resource Master screen defines the resources (people, machines and similar) that production work can be assigned to and planned against. Each resource has a Resource Type, a Resource Nature (Own or Rent), a Resource Category, a Classification, the number of identical resources, a capacity in hours with its unit, a Calendar, a Resource Capacity Level and the Workshop where it sits. Optional details are a Cost Center, a Location, Queue Time and Wait Time buffers, a Description, and, for a person, the Employee or Contractor. The screen assigns a running Code automatically and offers a Fast Entry mode with Excel import for many resources at once. Only the head office company can change data. Production job cards, planning and activity screens select resources from this master.
  tables:
  - masterdata.mResourceMaster
  - masterdata.mResourceMasterCompanyDetail
- key: search
  name: Search
  module: ADM
  summary: The Search screen is a shared popup that almost every transaction and master screen opens when the user clicks
    Search or Open on the toolbar.
  description: |
    Evidence: code + ERP domain (inferred)
    The Search screen is a shared popup that almost every transaction and master screen opens when the user clicks Search or Open on the toolbar. The calling screen runs its own search query and hands the result to this popup, which shows it as a read-only grid with a filter row above the column headings. The user types in the filter row to narrow the list, then selects a row with the "&Ok" button, a double-click or the keyboard. The popup returns the identifier of the chosen row to the calling screen and closes, and the caller then loads that record. The popup holds no business data of its own and does not decide what is searchable: each caller decides the columns, their widths and formats through the data it supplies. Every user of every screen that offers search benefits from one consistent way of finding records.
- key: second-weighment
  name: Second Weighment
  module: WB
  summary: The Second Weighment screen completes a weigh bridge trip that was started on the First Weighment screen.
  description: |
    Evidence: code + ERP domain (inferred)
    The Second Weighment screen completes a weigh bridge trip that was started on the First Weighment screen. The clerk picks the open slip by vehicle number, and the screen shows the first weighment date, source document, reference document, transporter and driver. The clerk then weighs the vehicle again; each capture adds an item row with gross weight, tare weight and net weight, taken from the weighing machine and from the first weight on the slip. When the clerk marks the weighment Final, the slip totals are fixed and, if the company has switched it on, the quantities on the linked gate, dispatch or invoice document are updated with the net weight. The screen can also fire the IP cameras and print the finished slip. Stores, dispatch and billing staff use the result as proof of delivered or received quantity.
  tables:
  - WeighBridge.WeighmentSlipDetail
- key: service-tax-abatement-rule
  name: Service Tax Abatement Rule
  module: ADM
  summary: The Service Tax Abatement Rule screen defines a rule that reduces the taxable value of a service.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Tax Abatement Rule screen defines a rule that reduces the taxable value of a service. A rule has a Description, an Effective From date, a Service Category, a Min. Basic Value and an Abatement %. The user then lists the accounts and charges through which the tax is booked in the Account Detail grid (Account Type, Account Name, Charge Name) and lists the basic charges to which the rule applies in the "Basic Charges for Service Tax" grid. Rules are kept for the whole installation, with no company on the record. Service bills, purchase bills, vouchers and other documents that carry an abatement rule number use these rules. Users can find, change and delete existing rules.
  tables:
  - Finance.ServiceTaxAbatementRuleAccountDetail
  - Finance.ServiceTaxAbatementRuleChargeDetail
  - Finance.ServiceTaxAbatementRuleMain
- key: service-tax-advance-account
  name: Service Tax Advance Account
  module: ADM
  summary: The Service Tax Advance Account screen maps each service tax charge to the ledger account in which advance service
    tax is booked.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Tax Advance Account screen maps each service tax charge to the ledger account in which advance service tax is booked. The user picks a Charge Name from the service tax charges, sees its Percentage, and picks the Account Name. Each charge can appear only once. Saving replaces the whole mapping with the rows on screen. The setting is a single list for the installation, not one per company. Finance screens that handle advance payments and receipts read this mapping to find the advance tax account for a charge.
  tables:
  - Config.ServiceTaxAdvanceAccountSetting
- key: trading-item-type-setting
  name: Trading Item Type Setting
  module: ADM
  summary: The Trading Item Type Setting screen decides which item types a company trades in and, for each of them, whether
    stock is checked on sale.
  description: |
    Evidence: code + ERP domain (inferred)
    The Trading Item Type Setting screen decides which item types a company trades in and, for each of them, whether stock is checked on sale. It lists every item type in a grid with a Select tick and a Stock Sale tick. The user ticks the types the company trades and saves. An item type that has already been used on a Dispatch Challan cannot be unticked. The screen has no search, new-record entry or delete: it is one configuration list per logged-in company. Sales documents that offer or validate trading items rely on this list.
  tables:
  - Sales.TradingItemTypeSetting
- key: transaction-account-mapping
  name: Transaction Account Mapping
  module: ADM
  summary: The Transaction Account Mapping screen tells the finance posting engine which ledger account to use for a given
    transaction (form) in given finance books, from a given date.
  description: |
    Evidence: code + ERP domain (inferred)
    The Transaction Account Mapping screen tells the finance posting engine which ledger account to use for a given transaction (form) in given finance books, from a given date. It works at two levels. At Transaction Level, the user picks a transaction and one Account Name that applies to the selected finance books. At TDC Level, the user picks a transaction and a Tax Category, lists tax and duty charge (TDC) names with the account each posts to, and may mark the account mapping as compulsory. The user ticks the finance books the mapping applies to and gives an Effective From date. Duplicate mappings for the same transaction, date and finance book are refused. Finance posting, tax posting and cash/bank default account lookups read these mappings.
  tables:
  - Finance.TransactionAccountMappingFB
  - Finance.TransactionAccountMappingMain
  - Finance.TransactionAccountMappingTDCDetail
- key: voucher-account-modify
  name: Voucher Account Modify
  module: ADM
  summary: The Voucher Account Modify screen lets a finance user correct the account posted on individual voucher lines after
    the voucher exists.
  description: |
    Evidence: code + ERP domain (inferred)
    The Voucher Account Modify screen lets a finance user correct the account posted on individual voucher lines after the voucher exists. The user picks a Finance Book and the screen lists the eligible voucher lines of that book. The user ticks the lines to correct, chooses a replacement in the Change Account Name column and can edit the Narration. One save applies all ticked lines together. The screen is a utility: it works on lines that were generated by other documents and that carry no onward references or payments. Accountants benefit because mis-posted ledger accounts can be fixed without cancelling and re-entering the source document.
- key: weigh-bridge-default-machine-setting
  name: Weigh Bridge Default Machine Setting
  module: WB
  summary: The Weigh Bridge Default Machine Setting screen tells the application which weigh bridge machine the current computer
    is connected to.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weigh Bridge Default Machine Setting screen tells the application which weigh bridge machine the current computer is connected to. The user picks one Machine Name from the machines available to the logged-in company and saves. The choice is remembered on that computer for that Windows user, not in the central database, so every workstation can have its own machine. As soon as the choice is saved, the application loads the machine's port and reading settings for use by the weighment screens. Without this setting the first and second weighment screens refuse to proceed. Weigh bridge operators and administrators use it once per workstation.
- key: weigh-bridge-item-setting
  name: Weigh Bridge Item Setting
  module: WB
  summary: The Weigh Bridge Item Setting screen lets the user choose which items take part in weigh bridge processing and
    record, for each chosen item, the weight of its packing material.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weigh Bridge Item Setting screen lets the user choose which items take part in weigh bridge processing and record, for each chosen item, the weight of its packing material. The screen lists every item of the logged-in company with its code, description, unit, group, sub group, category and item type. The user ticks the items to include and, where needed, enters a Packing Material Weight. Items already chosen come first in the list. Saving replaces the whole selection in one operation, so the screen always reflects the complete list rather than additions. A head office applies its choice to all companies; a branch applies it to itself. Weighment screens and stock receipt logic rely on the list (Inferred).
  tables:
  - WeighBridge.WeighBridgeItemSetting
- key: weighment-delete
  name: Weighment Delete
  module: WB
  summary: The Weighment Delete screen lets an authorised user remove weighment slips in bulk.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weighment Delete screen lets an authorised user remove weighment slips in bulk. The user chooses a Weighment Type and a date range and presses Show. The screen lists the matching weighments of the logged-in company with vehicle, driver, gross, tare and net weights and times. The user ticks the weighments to remove and uses the toolbar Delete action. The screen then deletes each ticked weighment together with its detail lines. It exists to clear wrongly captured or test weighments that normal weighment screens cannot remove. It has no Save, Search or New function of its own. Because deletion is permanent, it is a high-risk administrative tool.
- key: weighment-direct-entry
  name: Weighment Direct Entry
  module: WB
  summary: The Weighment Direct Entry screen lets a clerk record a complete weighment in one step, typing the gross and tare
    weights and their times for each item instead of reading them from the weighing machine.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weighment Direct Entry screen lets a clerk record a complete weighment in one step, typing the gross and tare weights and their times for each item instead of reading them from the weighing machine. It is used when a vehicle was weighed without the normal two-step flow, for example when the machine, PC or cameras were unavailable or when a past weighment must be entered. The clerk chooses the weighing machine the slip belongs to, the direction, the party, the vehicle and the item rows; the slip is saved as Final immediately. It can also detach the slip from an invoice or dispatch challan that points to it. Store, dispatch and billing staff then see the slip like any other, and the quantities of the linked document are updated by the same routine that the Second Weighment screen uses.
- key: weighment-machine-master
  name: Weighment Machine Master
  module: WB
  summary: The Weighment Machine Master screen registers each weigh bridge machine (scale indicator) that the plant connects
    to the application.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weighment Machine Master screen registers each weigh bridge machine (scale indicator) that the plant connects to the application. For every machine the user records a Machine Name, an optional Location, the Unit of measure it reads in, and the serial-port settings the application needs to read the scale: COM Port, Baud Rate, Data Bits, Stop Bits, Parity Bits, Reading Type and Reading Pattern. An optional input delay can be set for slow indicators. The screen assigns a running Code automatically. A machine is created once and is available to every company. The weighment screens read these settings to talk to the scale, and the Default Machine Setting screen picks one machine per workstation.
  tables:
  - WeighBridge.mWeighmentMachine
  - WeighBridge.mWeighmentMachineCompanyDetail
- key: weighment-setting
  name: Weighment Setting
  module: WB
  summary: The Weighment Setting screen holds the company-level options that govern how weighments behave.
  description: |
    Evidence: code + ERP domain (inferred)
    The Weighment Setting screen holds the company-level options that govern how weighments behave. The visible option, Update Qty. from Weighment, decides whether a completed weighment pushes its weight into the reference document quantity. A second group, Capture Shortcut Key, defines the keyboard combination used to capture a weight; this group is hidden and opened only by a secret key combination. The screen keeps one set of values per company and, when saved by a head office, applies the same values to its branch companies. There is no list of records and no delete: the user opens the screen, changes the options and saves. Weigh bridge operators and administrators are the users.
  tables:
  - WeighBridge.Setting
- key: consumption-detail
  name: Consumption Detail
  module: DRM
  summary: The Consumption Detail screen records which production Job Cards consumed the discrete raw material that was issued
    to the shop floor on an authorized Material Issue.
  description: |
    Evidence: code + ERP domain (inferred)
    The Consumption Detail screen records which production Job Cards consumed the discrete raw material that was issued to the shop floor on an authorized Material Issue. The user picks an Issue No. and the screen shows the issue header (date, division, issue to, item, warehouse, issue weight and return weight). The user then splits the issued material across Job Cards and lots, stating the pieces or weight each Job Card consumed. For lots issued as pieces, the user can also tick the drawing marks produced from that lot. The screen totals the consumption by Job Card and by lot so that the user can see the remaining balance of each. Once the document is Authorized, the consumed weight must equal the issued weight less the returned weight. Stores and production planning use the result to see what each Job Card has used.
  tables:
  - DiscreteRM.MaterialIssueConsumptionMain
- key: discrete-stock-adjustment
  name: Discrete Stock Adjustment
  module: DRM
  summary: The Discrete Stock Adjustment screen corrects the book stock of one discrete raw material Section in one Warehouse
    so that it matches what is physically counted.
  description: |
    Evidence: code + ERP domain (inferred)
    The Discrete Stock Adjustment screen corrects the book stock of one discrete raw material Section in one Warehouse so that it matches what is physically counted. The user picks a Stock Type, Warehouse and Section, and the screen lists the lots held in that Warehouse with the quantity the system believes is there. For each lot the user enters the actual pieces or quantity found, and may split the actual quantity into pieces of different length and width in a Lot Detail pop-up. The user can also add lots that the system does not know. Once the document is Authorized, the system replaces the system stock of each adjusted lot with the counted pieces, books any remaining weight as scrap, and, where finance is in use, creates a journal voucher for the value difference. Stores staff count and enter, an authorizer approves, and finance and inventory reporting then rely on the corrected balances.
  tables:
