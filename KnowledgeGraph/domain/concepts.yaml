  description: 'Evidence: code + ERP domain (inferred)

    The Technical Specification Head Master screen maintains specification heads: named technical attributes (for example
    a dimension or property) grouped under a technical specification category, together with the list of items the head applies
    to. Each head receives an automatic code. The user enters the head name, picks a category and ticks the applicable items
    of the current company. New heads are made available to every company and are saved directly as authorised. Item technical
    specification entry relies on these heads to know which attributes apply to which items (Inferred).

    '
