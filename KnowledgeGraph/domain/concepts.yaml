    The Single Item Opening screen records the opening stock of one item at a time, for one combination of division, warehouse, ownership (own or party stock), stock nature and stock type (capital or non-capital) [fItemOpening.vb:20; fItemOpening.vb:157-165]. The user picks the item, and the screen loads whatever opening stock already exists for that combination. The user can then either type a single Opening Qty. and Opening Amount, or enter detail lines by make, technical grade, bill number, party, batch, department, cost center and BIN card, with optional tax charges and serial numbers per line [fItemOpening.vb:315-330; fItemOpening.vb:226-314]. Saving replaces the opening stock of that combination with what is on the screen, and, when finance is applicable and the stock is own stock of the first stock nature, also updates the finance opening balance for the item's stock accounts [fItemOpening.vb:167-192]. The opening date is the company's inventory start date and cannot be changed here. It is the single-item counterpart of the [Multi Item Opening](Functional_Doc_fInvOpeningBalance.md) screen.
