  module: FI
  synonyms:
  - TDC
  - Misc Charge
  summary: The TDC Master screen maintains miscellaneous charges and tax charges (TDC, read as taxes, duties and charges (Inferred))
    that are added to, subtracted from or shown alongside purchase and sales documents.
  description: 'Evidence: code + ERP domain (inferred)

    The TDC Master screen maintains miscellaneous charges and tax charges (TDC, read as taxes, duties and charges (Inferred))
    that are added to, subtracted from or shown alongside purchase and sales documents. Each charge belongs to a tax group
    and carries a default value, a charge nature (Misc Charge or Taxes), a calculation nature (Add, Subtract, Neutral), a
    display name and flags saying whether it forms part of the basic sales or basic purchase value. The user can also reuse
    account posting rules already defined for other charges of the same tax group. Charges can be entered one at a time, in
    a fast entry grid, or imported from Excel. A new charge is made available to every company; the basic sales and purchase
    flags are kept per company but are updated for all companies together.

    '
  tables:
