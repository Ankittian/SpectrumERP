  module: DRM
  summary: The SIN Lot Entry screen records the physical lot detail of one item received against a Stores Inward Note (SIN).
  description: |
    Evidence: code + ERP domain (inferred)
    The SIN Lot Entry screen records the physical lot detail of one item received against a Stores Inward Note (SIN). Where an item is stocked lot-wise, the store enters each received piece group with its length, width, piece count, certificate, heat, cast and serial numbers and its weight. The user then spreads those lots across the open purchase, stock transfer, dispatch or sales order lines that the receipt covers, and splits the challan weight across the same orders. The screen checks the lot weight against the order weight and the challan weight within the tolerances set for the company. When the entry is authorized, the lots enter stock in the chosen warehouses and, where finance is in use, a journal voucher is posted. Stores staff enter the data. Purchasing, stock control and accounts rely on the result.
