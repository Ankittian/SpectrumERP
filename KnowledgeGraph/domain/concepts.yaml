  module: MD
  summary: The Sales Order Custom Status screen maintains the user-defined statuses that can be recorded against sales orders
    to track their progress beyond the system's own document statuses.
  description: |
    Evidence: code + ERP domain (inferred)
    The Sales Order Custom Status screen maintains the user-defined statuses that can be recorded against sales orders to track their progress beyond the system's own document statuses. Each status has an automatically generated code, a name and a status category taken from the Sales Order Status Category master. New statuses are made available in every company. Users can create, search, modify and delete statuses, and status names must be unique. Sales order follow-up, the sales register, the production and dispatch summary and the production dashboard use these statuses downstream.
  tables:
