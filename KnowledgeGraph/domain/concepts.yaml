- key: account-ledger
  name: Account Ledger
  module: RPT
  summary: The Account Ledger screen is a read-only Finance report that shows the postings of one ledger account for a period,
    with opening balance, running debit and credit totals and closing balance.
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Ledger screen is a read-only Finance report that shows the postings of one ledger account for a period, with opening balance, running debit and credit totals and closing balance. The same screen is opened from two menu entries under Finance Reports: "Account Ledger" (form code FMAL) and "Group Summary" (form code FAGS). Opened as Account Ledger, it reports one account at a time; opened as Group Summary, it reports the balances of an account group, its sub-groups and its accounts. From either mode the user can drill down from a group to an account, from an account to its monthly or daily break-up, and from a ledger line to the source voucher. Finance users, auditors and branch accountants use it to check balances and trace entries. The screen saves nothing; every figure comes from authorised vouchers already posted.
- key: day-book
  name: Day Book
  module: RPT
  summary: The Day Book screen is a read-only finance report that lists vouchers posted in a chosen period, one block per
    voucher, for a selected Finance Book and chart of accounts (COA).
  description: |
    Evidence: code + ERP domain (inferred)
    The Day Book screen is a read-only finance report that lists vouchers posted in a chosen period, one block per voucher, for a selected Finance Book and chart of accounts (COA). Each voucher shows its date, voucher number, voucher type and the debit and credit amounts of the book's cash and bank style ledger, with the counter ledgers, cost centres, narration and bill references available underneath. The user chooses the Finance Book (or Profit Center), the COA, the period, a range filter and the display options. Vouchers can be opened from the report for review in their own screens, and the report can be printed, previewed or exported to Excel, PDF, XPS or CSV. The screen saves nothing. Accountants and auditors use it to review daily postings.
- key: driver-information
  name: Driver Information
  module: MD
  summary: The Driver Information screen maintains the master list of drivers.
  description: |
    Evidence: code + ERP domain (inferred)
    The Driver Information screen maintains the master list of drivers. Each driver has a name, address, contact number, salary, driving licence details and identity numbers (Aadhar and Voter ID). A driver can optionally be linked to an existing employee, in which case the employee's name, joining date, address and salary are copied onto the screen. The screen generates a driver Code automatically on first save and makes the driver available to every company. The list is used wherever a driver has to be chosen on equipment, trip, fuel, maintenance and incident documents. The screen is a single-page master with no child grids.
  tables:
  - masterdata.mDriverInformation
  - masterdata.mDriverInformationCompanyDetail
- key: mis-from-excel
  name: MIS From Excel
  module: RPT
  summary: The MIS From Excel screen lets a user open an Excel workbook, pick one of its worksheets and view that sheet as
    a report inside the application.
  description: |
    Evidence: code + ERP domain (inferred)
    The MIS From Excel screen lets a user open an Excel workbook, pick one of its worksheets and view that sheet as a report inside the application. The user chooses the file with a browse button, selects a sheet from the list of sheets found in the file and clicks Show. The sheet is then displayed in the generic MIS report viewer, where the viewer's own tools can be used on the data. The screen does not write to the database and has no save, delete or search. It is a small utility for people who want to look at spreadsheet data with the report viewer's grid features.
- key: mis-report
  name: MIS Report
  module: RPT
  summary: The MIS Report screen is a generic report viewer.
  description: |
    Evidence: code + ERP domain (inferred)
    The MIS Report screen is a generic report viewer. It does not maintain business data. A user normally reaches it from the report-selection screen (Reports > MIS Report): the user chooses a report, sets its filter criteria and presses Run, and this screen opens and shows the result in a read-only grid. Which report runs, which filter fields it offers and how its columns look are all defined by report setup data, so one screen serves many reports. On top of the grid the user can build a pivot, summary or period-wise analysis, draw a chart, hide or show columns, print or preview, export to Excel, PDF, XPS or CSV, and email the grid as an Excel file. The only things the screen stores are personal and report-level display preferences (default graph settings, default analysis settings, the list of columns offered for graphs). Reports managers, finance, stores, sales and payroll users read the results; the screen has no create, edit or delete of business records.
- key: trial-balance
  name: Trial Balance
  module: RPT
  summary: The Trial Balance screen is a read-only Finance report, opened from Finance Reports with form code FMTB, that lists
    the account groups of a Chart Of Account with their opening balance, period debit, period credit and closing balance for
    a chosen Finance Book and date range.
  description: |
    Evidence: code + ERP domain (inferred)
    The Trial Balance screen is a read-only Finance report, opened from Finance Reports with form code FMTB, that lists the account groups of a Chart Of Account with their opening balance, period debit, period credit and closing balance for a chosen Finance Book and date range. It is the group-level sibling of the [Account Ledger](Functional_Doc_fAccountLedgerReport.md) screen: it uses the same report engine, the same Explorer bar and the same drill-down, but it always starts in group summary mode. Finance managers use it at period end to check that the books balance and to see where balances sit; they can open a group into its sub-groups and accounts, step into an account's monthly break-up and ledger, and print or export the result. A company setting decides whether the report loads at once or only after a configuration dialog. The screen saves nothing.
- key: autogenerate-service-call-equipment
  name: Autogenerate Service Call Equipment
  module: PM
  summary: The Autogenerate Service Call Equipment screen creates equipment records in bulk for service calls that were raised
    for an item but have no equipment attached.
  description: |
    Evidence: code + ERP domain (inferred)
    The Autogenerate Service Call Equipment screen creates equipment records in bulk for service calls that were raised for an item but have no equipment attached. The user enters a From Date and a To Date and presses Show to list the calls in that period. For each call the user can complete the Serial No., the invoice reference, the Service Contract Setup and its date, and the spare parts list (BOM Detail), then ticks the calls and presses Generate Equipment. Each ticked call gets its own new equipment record, linked back to the call, and the Remarks column reports the result row by row. Service administrators use it to put the installed base of a customer on record without creating each equipment by hand, so that contract coverage and maintenance can follow.
- key: axle-wheel-configuration
  name: Axle–Wheel Configuration
  module: PM
  summary: 'The Axle–Wheel Configuration screen defines a reusable vehicle axle layout: a named template stating how many
    axles and tyres a vehicle type has and where each tyre sits.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Axle–Wheel Configuration screen defines a reusable vehicle axle layout: a named template stating how many axles and tyres a vehicle type has and where each tyre sits. The user enters a layout name, description, alias, number of axles and number of tyres, then lists every tyre position in a grid with its position type, axle number, position alias and sort sequence. The screen checks that the grid agrees with the header totals and that aliases and sequences are not repeated. A code is generated automatically on first save, and the layout is made available to every active company at once. There is no approval workflow; a saved layout is final. The layouts feed the Equipment Master and the tyre fitting, movement and inspection screens (Inferred from procedures that read the layout tables). [fVehicleAxleLayout.vb:318-474; masterdata.TVLMSave:28; masterdata.TVLMSave:61-62]
  tables:
  - masterdata.mTyreLayoutCompanyDetail
  - masterdata.mTyreLayoutMaster
  - masterdata.mTyreLayoutPositionDetail
- key: change-equipment-driver
  name: Change Equipment Driver
  module: PM
  summary: The Change Equipment Driver screen records a change of driver on a vehicle.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Equipment Driver screen records a change of driver on a vehicle. The user picks the equipment, sees the driver, contact number, licence number, shift and effective date currently on record, then chooses a new driver, an optional shift and the date and time from which the change applies. Each save adds a dated entry to the equipment's driver history rather than overwriting the past. The screen only offers active automobile equipment of the logged-in company and active drivers of that company. It refuses a change dated on or before an existing entry for the same equipment. The history it builds tells trip sheets, maintenance orders and driver reports who was driving a vehicle at a given time (Inferred).
  tables:
  - EAM.EquipmentDriverHistory
- key: change-equipment-location
  name: Change Equipment Location
  module: PM
  summary: The Change Equipment Location screen is a document that moves one or more pieces of equipment to a new functional
    location.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Equipment Location screen is a document that moves one or more pieces of equipment to a new functional location. For each equipment the user records the new location, the new address, the custodian and contact number, the division, the relocation reason and whether the child parts of the equipment move with it. The document carries a responsible person and an optional duration of movement. It follows the standard document life cycle of Initial, Release and Authorized, with numbering and division handled by the shared document header. The equipment's location, custodian and division are changed only when the document is authorized. Until then the equipment is locked against any other pending change. Maintenance, service and asset users rely on the resulting location and custody history.
  tables:
  - EAM.ChangeEquipmentLocationEquipmentDetail
  - EAM.ChangeEquipmentLocationMain
- key: change-equipment-owner
  name: Change Equipment Owner
  module: PM
  summary: The Change Equipment Owner screen records a change of the customer who owns customer-owned equipment.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Equipment Owner screen records a change of the customer who owns customer-owned equipment. The user chooses a source: either a single customer-owned equipment, or a service contract whose covered equipment all move together. The screen shows the old customer and location, and the user picks the new customer and one of that customer's locations. The document follows the standard Initial, Release and Authorized life cycle with numbering, date and division handled by the shared document header. When it is authorized, the customer location of each equipment is updated, and for a service contract the contract's customer location is updated too. The screen refuses back-dated changes, equipment with a pending change, and (for the single equipment source) equipment under an active service contract. Service and maintenance users rely on the equipment's customer location.
  tables:
  - CustomerService.ChangeEquipmentOwnerDetail
  - CustomerService.ChangeEquipmentOwnerMain
- key: change-maintenance-request-status
  name: Change Maintenance Request Status
  module: PM
  summary: 'The Change Maintenance Request Status screen lets a user move an authorized maintenance request, fault by fault,
    to a new status: Hold, Cancel, In Progress, Short Close, Authorized again or Completed.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Maintenance Request Status screen lets a user move an authorized maintenance request, fault by fault, to a new status: Hold, Cancel, In Progress, Short Close, Authorized again or Completed. The user picks the request, sees its current status and the asset it concerns, and either sets one status for all open faults or sets a status and a reason on each fault separately. The change is recorded as its own document with a yearly number, a division, a date and a document status. The request itself is updated only when this document is saved as Authorized. Maintenance planners and supervisors use it to keep the request list honest: faults that will not be worked are held or cancelled with a reason, and requests under work are marked In Progress.
  tables:
  - EAM.ChangeMaintenanceRequestFaultDetail
  - EAM.ChangeMaintenanceRequestStatusMain
- key: change-service-contract-period
  name: Change Service Contract Period
  module: PM
  summary: The Change Service Contract Period screen lets a user move the end date of an authorised service contract.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Service Contract Period screen lets a user move the end date of an authorised service contract. The user picks a Service Contract No., sees the current From Date and To Date under "Previous", and enters a new To Date under "New". The From Date cannot be changed. The screen also lists the contract's time-based triggers so the user can adjust the End Date of each trigger to fit the new contract period. A set of checks stops the new To Date from falling before billing, invoices, expected occurrences, service calls or service orders that already exist for the contract. On Save, the contract end date, the end date of each contract equipment/item line and the trigger end dates are updated together. Maintenance and service teams benefit because they can extend or shorten a running contract without re-creating it.
- key: change-tyre-status
  name: Change Tyre Status
  module: PM
  summary: 'The Change Tyre Status screen moves tyres that are waiting after removal to their next decision: awaiting repair,
    awaiting retread or scrapped, and finishes the case of a rejected retread.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Tyre Status screen moves tyres that are waiting after removal to their next decision: awaiting repair, awaiting retread or scrapped, and finishes the case of a rejected retread. The user lists the tyres, sees each tyre's make and current status, picks the New Status from the few that the business allows from that status, and gives a Reason For Status Change. The document follows the usual draft, released and authorized life cycle. When it is authorized, each tyre's status is changed and the change is recorded in the tyre history; a scrapped tyre also closes its current life stage and moves to the scrap stage. The screen gives maintenance control a formal, reasoned record of how tyres leave the usable pool.
  tables:
  - EAM.ChangeTyreStatusMain
  - EAM.ChangeTyreStatusTyreDetails
- key: clearance-permit
  name: Clearance Permit
  module: PM
  summary: The Clearance Permit screen records a work permit for one piece of equipment or one functional location before
    maintenance work starts.
  description: |
    Evidence: code + ERP domain (inferred)
    The Clearance Permit screen records a work permit for one piece of equipment or one functional location before maintenance work starts. The user chooses a Permit Name, and the screen brings in the permit's type, its lockout/tagout method, the open maintenance orders that need the permit, a check list and the safety instructions. The user names the Permit Holder and the person who gave approval, sets the permit period, and records tags when the method is Tagout. The permit is a controlled document with a document number, a division and a status; once Authorized it cannot be changed. Maintenance orders and their closing rely on these permits, so safety clearance is traceable to the work done.
  tables:
  - EAM.ClearancePermit
  - EAM.ClearancePermitCheckLists
  - EAM.ClearancePermitCustomFieldDetail
  - EAM.ClearancePermitMODetail
  - EAM.ClearancePermitNotesDetail
  - EAM.ClearancePermitSafetyInstructions
  - EAM.ClearancePermitTagsDetail
- key: customer-feedback-parameter
  name: Customer Feedback Parameter
  module: MD
  summary: The Customer Feedback Parameter screen maintains the questions or measures that a service engineer records as customer
    feedback on a service call.
  description: |
    Evidence: code + ERP domain (inferred)
    The Customer Feedback Parameter screen maintains the questions or measures that a service engineer records as customer feedback on a service call. Each parameter has a name, a Data Type that tells how the answer is captured (for example Numeric, Yes/No or Date) and, optionally, a list of items for which the parameter applies. The screen assigns a running Code automatically and keeps one parameter for the whole enterprise, visible to every company. Users can search for a parameter, change it and delete it. The service call screens read the list of parameters when feedback is entered.
  tables:
  - masterdata.mCustomerFeedbackParameter
  - masterdata.mCustomerFeedbackParameterCompanyDetail
  - masterdata.mCustomerFeedbackParameterItemDetail
- key: customer-service-invoice
  name: Customer Service Invoice
  module: PM
  summary: The Customer Service Invoice screen raises a bill to a customer for service work.
  description: |
    Evidence: code + ERP domain (inferred)
    The Customer Service Invoice screen raises a bill to a customer for service work. The invoice can be raised directly on a time-and-material basis, against a Service Contract (fixed contract value or billing schedule), or against a Service Order and the reportings made on it. The user captures customer, bill-to party, payment mode, due date, currency, service lines, parts, resources with their time lines, taxes, custom fields, notes and optional adjustment of customer advances. The basic amount is built from the lines (or taken from the contract or schedule) and taxes are added on it. When the invoice is Authorized and finance is applicable, the screen creates a journal voucher for the invoice and, if advances are adjusted, a second journal voucher for the adjustment, and links both to the invoice. For a cash payment mode it also creates a cash counter entry. The window caption reads "CustomerServiceInvoice" [fCustomerServiceInvoice.designer.vb:985]. Receivables, tax reporting and customer statements depend on the vouchers it creates.
  tables:
  - CustomerService.CustomerServiceInvoice
  - CustomerService.CustomerServiceInvoiceAdvanceDetail
  - CustomerService.CustomerServiceInvoiceCustomFieldDetail
  - CustomerService.CustomerServiceInvoiceNotesDetail
  - CustomerService.CustomerServiceInvoicePartsList
  - CustomerService.CustomerServiceInvoiceReportingDetail
  - CustomerService.CustomerServiceInvoiceResourceAmountDetail
  - CustomerService.CustomerServiceInvoiceResourceDetail
  - CustomerService.CustomerServiceInvoiceServiceDetail
  - CustomerService.CustomerServiceInvoiceTaxDetail
  - Finance.CashCounterMain
- key: document-type
  name: Document Type
  module: MD
  summary: The Document Type screen maintains the kinds of documents that can be recorded against equipment and functional
    locations, such as certificates or permits.
  description: |
    Evidence: code + ERP domain (inferred)
    The Document Type screen maintains the kinds of documents that can be recorded against equipment and functional locations, such as certificates or permits. The user enters a Document Type and a Description, decides whether several entries of the type are allowed for one equipment and whether the same document number may repeat, and lists any Additional Field that the entry of that type should capture. The screen assigns a running Code automatically and makes the type available to every company. Equipment document entry screens, expiry notifications and document reports rely on these types.
  tables:
  - masterdata.mEAMDocumentType
  - masterdata.mEAMDocumentTypeAdditionalField
  - masterdata.mEAMDocumentTypeCompanyDetail
- key: eam-resource-master
  name: EAM Resource Master
  module: MD
  summary: The EAM Resource Master screen defines the resources that maintenance work can draw on, such as a crew or a class
    of workers.
  description: |
    Evidence: code + ERP domain (inferred)
    The EAM Resource Master screen defines the resources that maintenance work can draw on, such as a crew or a class of workers. For each resource the user enters a Resource Name, picks a Resource Group, Resource Type and Resource Nature, states the No. Of Resources and an hourly rate, and may name a Notification User. A grid of skills lists what the resource can do. For resources of the employee type a second grid names the employees who make up the resource. A third grid decides which companies and divisions may use the resource. The screen assigns a running Code automatically. Equipment, work log, shutdown work list and resource reports offer only the resources saved here.
  tables:
  - masterdata.mEAMResourceMaster
  - masterdata.mEAMResourceMasterCompanyDetail
  - masterdata.mEAMResourceMasterEmployeeDetail
  - masterdata.mEAMResourceMasterSkillDetail
- key: equipment-category
  name: Equipment Category
  module: MD
  summary: The Equipment Category screen maintains the classification of equipment.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Category screen maintains the classification of equipment. The user enters an Equipment Category name and may pick a Parent Category, so categories can form a two-level or deeper tree. The screen assigns a running Code automatically. A new category is made available to every company at creation. Equipment masters, reading and performance screens and several maintenance reports group equipment by this category. Plant maintenance and production users benefit from one consistent equipment classification.
  tables:
  - masterdata.mEquipmentCategory
  - masterdata.mEquipmentCategoryCompanyDetail
- key: equipment-document-entry
  name: Equipment Document Entry
  module: PM
  summary: The Equipment Document Entry screen records the statutory and commercial documents that belong to a piece of equipment
    or to a functional location, such as a road tax receipt, a pollution certificate or a tracking subscription.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Document Entry screen records the statutory and commercial documents that belong to a piece of equipment or to a functional location, such as a road tax receipt, a pollution certificate or a tracking subscription. The user picks whether the document refers to equipment or to a location, chooses the object, the Document Type and the document details: number, date, issuer, validity date, amount, renewal alert days and remarks. Extra fields defined for the document type appear in an Additional Fields grid. The screen shows the previous entry of the same type for the same object, so the user can see what is being renewed and whether it has expired. Compliance and maintenance teams use the entries to track validity and renewals.
  tables:
  - EAM.EquipmentDocumentEntryAdditionalFields
  - EAM.EquipmentDocumentEntryMain
- key: equipment-down-period
  name: Equipment Down Period
  module: PM
  summary: The Equipment Down Period screen records the time during which equipment or a functional location is out of service.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Down Period screen records the time during which equipment or a functional location is out of service. The user chooses whether the document refers to equipment or to functional locations, picks the down type, states the reason and enters estimated start and end dates and, later, the actual dates. A grid lists all equipment (or locations) of the company and the user ticks those that are down. The document follows the standard Initial, Release and Authorized life cycle with numbering, date and division handled by the shared document header. Once authorized it becomes available to maintenance orders as the down period they work against. Actual dates are taken from authorized maintenance order closings when such closings exist, and an authorization requires an actual end date.
  tables:
  - EAM.EquipmentDownPeriodEquipmentDetail
  - EAM.EquipmentDownPeriodMain
- key: equipment-master
  name: Equipment Master
  module: PM
  summary: 'The Equipment Master screen maintains every piece of equipment that the business owns, hires or services for customers:
    machines, vehicles, tools and installed components.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Master screen maintains every piece of equipment that the business owns, hires or services for customers: machines, vehicles, tools and installed components. For each unit it captures the identity (name, make, model, part and serial number, item, category and type), ownership and source, where it is installed, who holds custody, financial references and, for vehicles, the driver, fuel and tyre layout. Alongside the header the user keeps supplementary information, measurement readings, a bill of materials, tools, spares with serial numbers, safety instructions, skills, resources, certificates, warranties, service centers, utilization categories and permits. The screen assigns a running Code, builds the Equipment Description from the entered attributes and stores each record as authorized. Fast entry and Excel import allow many pieces of equipment to be created at once. Maintenance, customer service, meter readings and equipment documents rely on the records kept here.
  tables:
  - EAM.EquipmentMaster
  - EAM.EquipmentMasterBOMDetail
  - EAM.EquipmentMasterCertificateDetail
  - EAM.EquipmentMasterLotDetail
  - EAM.EquipmentMasterMeasurementDetail
  - EAM.EquipmentMasterResourceDetail
  - EAM.EquipmentMasterSafetyDetail
  - EAM.EquipmentMasterServiceCenterDetail
  - EAM.EquipmentMasterSkillDetail
  - EAM.EquipmentMasterSparesSerialNoDetail
  - EAM.EquipmentMasterSupplementalDetail
  - EAM.EquipmentMasterToolsDetail
  - EAM.EquipmentMasterUtalizationDetail
  - EAM.EquipmentMasterWarrantyDetail
  - EAM.EquipmentSupplementalChangeHistory
  - masterdata.mPermitMasterEquipmentDetail
- key: equipment-replacement
  name: Equipment Replacement
  module: PM
  summary: The Equipment Replacement screen records the actual replacement of one equipment by another, following an authorized
    replacement request.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Replacement screen records the actual replacement of one equipment by another, following an authorized replacement request. The user picks the equipment being replaced and the request it belongs to, names the responsible person, chooses the new equipment, and states where each equipment, the old and the new, goes next, with custodian, address and contact details. The new equipment starts with the location and custodian of the old one. The document follows the standard Initial, Release and Authorized life cycle with numbering, date and division handled by the shared document header. When it is authorized, the location and custodian histories of both equipment are updated. The screen refuses equipment that is already involved in another open replacement or location change.
  tables:
  - EAM.EquipmentReplacementMain
- key: equipment-replacement-request
  name: Equipment Replacement Request
  module: PM
  summary: The Equipment Replacement Request screen is where a user asks for one or more pieces of equipment to be replaced.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Replacement Request screen is where a user asks for one or more pieces of equipment to be replaced. The request can be raised directly, or from a maintenance order, in which case the equipment of that order and all its sub-equipment are offered. The user records who requests the replacement, the reason, remarks, and a list of equipment with their location, custodian and per-equipment remarks. Custom fields and print notes can be attached. The request follows the standard Initial, Release and Authorized life cycle with numbering, date and division handled by the shared document header. The screen refuses equipment that already sits on another open request or replacement. An authorized request is what the Equipment Replacement screen later acts on.
  tables:
  - EAM.EquRepRequest
  - EAM.EquRepRequestCustomFieldDetail
  - EAM.EquRepRequestEquipmentDetail
  - EAM.EquRepRequestNotesDetail
- key: equipment-running-hour
  name: Equipment Running Hour
  module: PM
  summary: The Equipment Running Hour screen records how many hours each piece of equipment ran on a given day and shift.
  description: |
    Evidence: code + ERP domain (inferred)
    The Equipment Running Hour screen records how many hours each piece of equipment ran on a given day and shift. The user sets the document date and an optional shift, optionally types a default running time, ticks the equipment that ran and enters the running hours for each. The document follows the standard Initial, Release and Authorized life cycle with numbering, date and division handled by the shared document header. The screen refuses a second entry for the same equipment on the same date and shift. Authorized documents feed the equipment card, the maintenance analysis report and the plant maintenance dashboard, which use the hours to judge usage and maintenance need.
  tables:
  - EAM.EquipmentRunningHourEquipmentDetail
  - EAM.EquipmentRunningHourMain
- key: fuel-consumption
  name: Fuel Consumption
  module: PM
  summary: The Fuel Consumption screen records how much fuel a vehicle used on a given day and where the fuel came from.
  description: |
    Evidence: code + ERP domain (inferred)
    The Fuel Consumption screen records how much fuel a vehicle used on a given day and where the fuel came from. The user picks an Entry Date and a Vehicle Name; the screen shows the vehicle's cost center, fuel type, fuel item and unit. The user then states whether the fuel was drawn from Stock or bought at a Fuel Station. For stock the user either enters consumption directly (date, quantity, rate) or picks the Material Issues of fuel that were issued to the vehicle's cost center and states how much of each was consumed. For a fuel station the user enters station, driver, bill, quantity and rate. Fleet and stores staff use it; fuel cost and fuel-efficiency reports benefit. The screen has no document number, status or authorization step.
  tables:
  - EAM.FuelConsumptionMain
  - EAM.FuelConsumptionRefDetail
- key: functional-location
  name: Functional Location
  module: PM
  summary: 'The Functional Location screen maintains the places in a plant where equipment sits and work is done: a building,
    a line, a station or a bay.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Functional Location screen maintains the places in a plant where equipment sits and work is done: a building, a line, a station or a bay. Each location has a name, an optional alias, a location type, an optional parent location (so locations form a hierarchy), and optional links to an asset, a cost center, a work center, a division and a department. It also records the custodian responsible for the location, its address, and whether it is critical or inactive. Beside the header, the user keeps supplementary fields, measurement readings, safety instructions, skills, tools and spares, resources, warranties and certificates for the location. The screen assigns a running Code automatically and stores every saved location as authorized. A fast entry mode and an Excel import let users create many locations at once. Equipment, work orders and maintenance planning use the locations maintained here (Inferred).
  tables:
  - EAM.FunctionalLocation
  - EAM.FunctionalLocationCertificateDetails
  - EAM.FunctionalLocationMeasurementDetails
  - EAM.FunctionalLocationResourceGroupDetails
  - EAM.FunctionalLocationSafetyDetail
  - EAM.FunctionalLocationSkillDetail
  - EAM.FunctionalLocationSupplementalDetail
  - EAM.FunctionalLocationToolsSpareDetail
  - EAM.FunctionalLocationWarrantyDetail
- key: incident-entry
  name: Incident Entry
  module: PM
  summary: The Incident Entry screen records an incident that happened to a vehicle or equipment item.
  description: |
    Evidence: code + ERP domain (inferred)
    The Incident Entry screen records an incident that happened to a vehicle or equipment item. The user states when it happened, which equipment and driver were involved, who reported it, who is in charge, the narration, the cause, the action taken, remarks and a witness statement. Three lists capture the employees involved with what each one reported, the damaged parts, and the review types that must follow. Every incident is a numbered document that moves through statuses. The screen is the starting point of the incident chain: reviews are recorded on the Incident Review screen and insurance claims are raised on the Insurance Claim screen. The window caption reads "IncidentEntry" [fIncidentEntry.Designer.vb:685].
  tables:
  - EAM.IncidentEntryEmpDetail
  - EAM.IncidentEntryMain
  - EAM.IncidentEntryPartDetail
  - EAM.IncidentEntryReviewDetail
- key: incident-review
  name: Incident Review
  module: PM
  summary: The Incident Review screen records one department's review of an authorized incident.
  description: |
    Evidence: code + ERP domain (inferred)
    The Incident Review screen records one department's review of an authorized incident. The incident lists the review types it needs (for example Operation Team, Fleet Department, Technical, Management and HR reviews, as defined in the shared review type list). The user chooses a Review Type, then an incident that is waiting for that review, and records who is reviewing, their view of the cause and action, and the findings that review type is entitled to enter, such as damage detail, recovery decision, estimated expenses or the final management decision. The screen also lets the reviewer remark on each damaged part and maintain damage amount, deduction and the "Insurance Claim" flag of the incident. Reviews must follow the order listed on the incident. The window caption reads "IncidentReview" [fIncidentReview.designer.vb:651]. Insurance claims are later raised only for incidents flagged here.
  tables:
  - EAM.IncidentReviewDetail
  - EAM.IncidentReviewMain
- key: insurance-claim
  name: Insurance Claim
  module: PM
  summary: The Insurance Claim screen records an insurance claim raised against a vehicle or equipment item for a reported
    incident.
  description: |
    Evidence: code + ERP domain (inferred)
    The Insurance Claim screen records an insurance claim raised against a vehicle or equipment item for a reported incident. The user picks the Vehicle No., then an Incident No. that was flagged as needing an insurance claim, and then the Insurance Document No. (the equipment's insurance policy document). The screen shows the incident details, the policy details, the policy's validity against the claim date and the previous claim on the same policy for reference. The user enters the amount paid by the insurer and the company's own liability. Each claim is a numbered document that moves through statuses; once Authorized it is locked. The window caption reads "InsuranceClaim" [fInsuranceClaim.designer.vb:652]. The record supports finance and maintenance follow-up of incident losses.
  tables:
  - EAM.InsuranceClaim
- key: lionsconsumptionentry
  name: LionsConsumptionEntry
  module: PM
  summary: The LionsConsumptionEntry screen records which materials issued from stores were actually consumed on a piece of
    equipment.
  description: |
    Evidence: code + ERP domain (inferred)
    The LionsConsumptionEntry screen records which materials issued from stores were actually consumed on a piece of equipment. The user picks an Equipment Name; the screen lists the authorized Material Issues of items that the equipment's bill of materials marks as needing a consumption entry. The user ticks the issue lines consumed, types the Qty. consumed, and then opens the component breakdown of each line to spread that quantity over the equipment's components. Each entry carries a document number, date, status and division from the shared document control and an optional Remark. Stores and maintenance staff use it. The screen shows how much of each issue was issued, consumed earlier and returned, but does not stop the user consuming more than the balance (Section 13).
  tables:
  - Customize.LionsConsumptionEntryBOMDetail
  - Customize.LionsConsumptionEntryIssueDetail
  - Customize.LionsConsumptionEntryMain
- key: maintenance-category-task
  name: Maintenance Category Task
  module: PM
  summary: The Maintenance Category Task screen defines a standard task list for one Maintenance Category.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Category Task screen defines a standard task list for one Maintenance Category. The user picks a Maintenance Category, ticks the equipment to which the list applies, and enters the tasks to perform, each with Estimated Hrs and a Priority. The screen works within the logged-in company: only that company's active equipment, categories and tasks are offered. One piece of equipment can belong to only one active task list, so the standard work for a given machine is unambiguous. Maintenance planners benefit because the list gives a reusable template of what work a category of maintenance involves and how long it takes.
  tables:
  - EAM.MaintenanceCategoryTask
  - EAM.MaintenanceCategoryTaskDetail
  - EAM.MaintenanceCategoryTaskEquipmentDetail
- key: maintenance-order
  name: Maintenance Order
  module: PM
  summary: The Maintenance Order screen is where a maintenance planner turns a need for maintenance into a planned job.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Order screen is where a maintenance planner turns a need for maintenance into a planned job. The planner picks an asset (an equipment or a functional location), the type of work (Preventive, Corrective or Inspection) and where the work comes from: nothing in particular (Direct), faults on authorized Maintenance Requests, or occurrences of a Maintenance Schedule. The planner then lays out the job: tasks with priorities, assignees and dates, the people and machines needed, the skills, tools and spare items needed, inspection check points, meter readings to take, other assets affected, safety permits, linked work logs, notes and custom fields. The order is saved as a document with a yearly number, a division, a date and a status of Draft, Released or Authorized. Saving an order also moves the source requests and schedule occurrences forward, so they are not planned twice. Maintenance supervisors, planners and plant managers use it as the master plan that reporting, closing and amendments later work against.
  tables:
  - EAM.MaintenanceOrderAffectedObjectDetail
  - EAM.MaintenanceOrderCheckPoints
  - EAM.MaintenanceOrderCustomFieldDetail
  - EAM.MaintenanceOrderItemRequired
  - EAM.MaintenanceOrderLogDetail
  - EAM.MaintenanceOrderMain
  - EAM.MaintenanceOrderMeterReadingDetail
  - EAM.MaintenanceOrderNotesDetail
  - EAM.MaintenanceOrderPermitDetail
  - EAM.MaintenanceOrderRefDetail
  - EAM.MaintenanceOrderResourceDetail
  - EAM.MaintenanceOrderSkillRequired
  - EAM.MaintenanceOrderTaskDetail
  - EAM.MaintenanceOrderToolsRequired
- key: maintenance-order-amendment
  name: Maintenance Order Amendment
  module: PM
  summary: The Maintenance Order Amendment screen lets a planner change the plan of a maintenance order that has already been
    authorized, without creating a new order.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Order Amendment screen lets a planner change the plan of a maintenance order that has already been authorized, without creating a new order. The planner picks an authorized or in-progress order that is not yet closed, the screen loads the whole plan, and the planner edits the header, source rows, tasks, resources, skills, tools, items, check points, meter readings, affected assets, permits, work logs, notes and custom fields. Saving writes the changed plan back to the same order and keeps it Authorized. The screen is a close copy of the [Maintenance Order](Functional_Doc_fMaintenanceOrder.md) screen: it shares the layout, the grids, most validations and the same save routine, so this document describes only what is different. Maintenance supervisors and planners use it when scope, dates or needs change after authorization.
  tables:
  - EAM.MaintenanceOrderAffectedObjectDetail
  - EAM.MaintenanceOrderCheckPoints
  - EAM.MaintenanceOrderCustomFieldDetail
  - EAM.MaintenanceOrderItemRequired
  - EAM.MaintenanceOrderLogDetail
  - EAM.MaintenanceOrderMain
  - EAM.MaintenanceOrderMeterReadingDetail
  - EAM.MaintenanceOrderNotesDetail
  - EAM.MaintenanceOrderPermitDetail
  - EAM.MaintenanceOrderRefDetail
  - EAM.MaintenanceOrderResourceDetail
  - EAM.MaintenanceOrderSkillRequired
  - EAM.MaintenanceOrderTaskDetail
  - EAM.MaintenanceOrderToolsRequired
- key: maintenance-order-closing
  name: Maintenance Order Closing
  module: PM
  summary: The Maintenance Order Closing screen is where a maintenance order is finished.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Order Closing screen is where a maintenance order is finished. The user picks an authorized maintenance order that has no closing yet, and the screen brings in the order's faults, tasks, resources, permits, check points, issued items and external services. The user confirms the closing Status (for example completed, cancelled, short-closed or in progress), the actual Start Time and End Time, the Duration and any delay with its reason. The user then records the actual times, progress and status of each task, the resources used, any shutdown periods, the root cause of each fault and, for inspections, the result of each check point. The closing is a numbered document that moves through document statuses up to Authorized, optionally with multi-level authorization. Saving a closing updates the status of the order's tasks and of the order itself. Maintenance managers, planners and stores and finance staff rely on it for actual duration, delay, root cause and cost data.
  tables:
  - EAM.MOClosing
  - EAM.MOClosingResourceDetail
  - EAM.MOClosingShutDownDetail
  - EAM.MOClosingTaskDetail
- key: maintenance-reporting
  name: Maintenance Reporting
  module: PM
  summary: The Maintenance Reporting screen records the actual work done, shift by shift, against open maintenance orders
    or maintenance requests.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Reporting screen records the actual work done, shift by shift, against open maintenance orders or maintenance requests. For a maintenance order the user reports each task with start and end time, total duration, progress percentage and status, and any delay with its reason; resources used are reported with quantity and time. For both orders and requests the user records the root cause (RCA) and the action performed for each fault. The screen works in one company and, where divisions are used, in one division. Saving updates the status of the order's tasks and of the order itself, so planners see how far each job has progressed. The records also supply actual hours and resource usage to maintenance order closing.
  tables:
  - EAM.MaintenanceReporting
  - EAM.MaintenanceReportingResourceDetail
  - EAM.MaintenanceReportingTaskDetail
- key: maintenance-request
  name: Maintenance Request
  module: PM
  summary: The Maintenance Request screen lets a user report that a piece of equipment or a functional location needs maintenance
    work.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Request screen lets a user report that a piece of equipment or a functional location needs maintenance work. The user records who asked for it and who approved it, what is wrong (a list of faults, or a list of request descriptions), how urgent each item is, and when it must be attended to. A request can be marked as a breakdown, linked to earlier work logs of the same equipment, enriched with custom fields and print notes, and sent through multi-level authorization when the company has set that up. The request is a document with a yearly document number, a division, a date and a document status (Draft, Released, Authorized). Once authorized, it cannot be changed. Maintenance planners use authorized requests as the starting point for maintenance orders and for follow-up on each fault, and the Change Maintenance Request Status screen later moves faults to Hold, Cancel, In Progress, Short Close or Completed.
  tables:
  - EAM.MaintenanceRequestMain
  - EAM.RequestLogDetails
- key: maintenance-schedule
  name: Maintenance Schedule
  module: PM
  summary: The Maintenance Schedule screen defines recurring or one-off preventive and inspection maintenance for a piece
    of equipment or a functional location.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Schedule screen defines recurring or one-off preventive and inspection maintenance for a piece of equipment or a functional location. A planner records what to do (tasks or inspection check points), what it needs (resources, skills, tools, items) and when it falls due (time-based or meter-reading triggers, fixed or recurring). The screen also lists the dated occurrences of each trigger and can calculate them from the trigger rules. A schedule is created in Initial, Release or Authorized document status; once Authorized, the system starts generating further occurrences automatically for the schedule's triggers and the schedule becomes read-only. A planner can also copy one schedule to other equipment or locations of the same kind in one save. Maintenance Orders, the occurrence maintenance screen and the Change Status screen all rely on the schedules, triggers and occurrences saved here.
  tables:
  - EAM.MaintenanceScheduleCheckPoints
  - EAM.MaintenanceScheduleCustomFieldDetail
  - EAM.MaintenanceScheduleItemDetail
  - EAM.MaintenanceScheduleMain
  - EAM.MaintenanceScheduleMeterReadingDetail
  - EAM.MaintenanceScheduleNotesDetail
  - EAM.MaintenanceScheduleOccurrenceDetail
  - EAM.MaintenanceScheduleOtherEquipmentDetail
  - EAM.MaintenanceScheduleResourceDetail
  - EAM.MaintenanceScheduleSkillDetail
  - EAM.MaintenanceScheduleTaskDetail
  - EAM.MaintenanceScheduleToolsDetail
  - EAM.MaintenanceScheduleTriggerDetail
- key: maintenance-schedule-change-status
  name: Maintenance Schedule Change Status
  module: PM
  summary: The Maintenance Schedule Change Status screen is a controlled document that puts a maintenance schedule, and its
    pending occurrences, on hold, cancels them, short-closes them, or releases them back into progress.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Schedule Change Status screen is a controlled document that puts a maintenance schedule, and its pending occurrences, on hold, cancels them, short-closes them, or releases them back into progress. The planner picks an active schedule, chooses the new status and a reason, and decides per occurrence which status it should get. A "Close Maint. Schedule" option also moves the schedule itself to the chosen status and stops automatic generation of future occurrences. The document has its own number, date and Initial, Release or Authorized status, and its effect on the schedule and occurrences is applied only when it is saved as Authorized. Maintenance planners and managers use it to keep the plan truthful; Maintenance Orders and the occurrence generator then skip schedules and occurrences that are no longer active.
  tables:
  - EAM.MSChangeStatus
  - EAM.MSChangeStatusOccurrenceDetail
- key: maintenance-schedule-occurrence
  name: Maintenance Schedule Occurrence
  module: PM
  summary: The Maintenance Schedule Occurrence screen lets a maintenance planner add, correct or remove a single dated occurrence
    of a trigger on an authorized Maintenance Schedule.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Schedule Occurrence screen lets a maintenance planner add, correct or remove a single dated occurrence of a trigger on an authorized Maintenance Schedule. The planner picks the schedule and the trigger; the screen proposes the next Occurrence No. and shows, per trigger, the expected, previous and current due date or reading so the planner can judge whether the occurrence is really due. The planner sets the Occurrence Date, a status (Authorized, Completed or Cancel) and remarks. This is the manual counterpart to the automatic occurrence generation that runs when a schedule is authorized. Maintenance Orders are raised against these occurrences, so the screen is used to fix gaps or mistakes in the planned series without editing the whole schedule.
  tables:
  - EAM.MaintenanceScheduleOccurrenceDetail
- key: maintenance-service-order
  name: Maintenance Service Order
  module: PM
  summary: The Maintenance Service Order screen records a work order that a company raises to repair or maintain a customer's
    equipment.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Service Order screen records a work order that a company raises to repair or maintain a customer's equipment. The user names the customer and location, the equipment or item to be serviced, and the document that triggered the work (a service call, a service contract occurrence or an earlier service order). The order then lists the services to be performed, the spare parts to be used, the resources (people or assets) to be engaged, the meter readings taken, and the faults reported. It also carries billing details (who is billed, due days, payment terms), terms and conditions, notes and the accounts that will be used for posting. A document moves through Draft, Released and Authorized statuses, and once Authorized it is locked. The order total is the sum of the service, parts and resource amounts. Downstream, service order reporting, amendments, closing, material issue and customer service invoicing work from the saved order. The window caption reads "MaintenanceServiceOrder" and the menu entry is EAM > Maintenance Service Order [fMaintenanceServiceOrder.designer.vb:1226].
  tables:
  - CustomerService.ServiceOrderFaultDetail
  - CustomerService.ServiceOrderMain
  - CustomerService.ServiceOrderMeterReadingDetail
  - CustomerService.ServiceOrderNotesDetail
  - CustomerService.ServiceOrderPartsList
  - CustomerService.ServiceOrderPaymentTermDetail
  - CustomerService.ServiceOrderResourceDetail
  - CustomerService.ServiceOrderServiceDetail
  - CustomerService.ServiceOrderTermsNConditionDetail
- key: maintenance-service-order-amendment
  name: Maintenance Service Order Amendment
  module: PM
  summary: The Maintenance Service Order Amendment screen lets a user revise the service, item (parts) and resource lines
    of a Maintenance Service Order after the order has been authorized.
  description: |
    Evidence: code + ERP domain (inferred)
    The Maintenance Service Order Amendment screen lets a user revise the service, item (parts) and resource lines of a Maintenance Service Order after the order has been authorized. The user picks an existing service order; its header details are shown read-only for reference, and its three line grids are loaded for editing. The screen protects work already done: a line cannot be deleted once reporting or an invoice exists for it, a quantity cannot fall below the quantity already reported, and an amount cannot fall below the amount already invoiced. Parts cannot be reduced below the quantity already issued from stores. Saving rewrites the three line collections and recalculates the order's total amount. The screen does not change header data, payment terms, terms and conditions, notes, meter readings, faults or account assignment. The window caption reads "Maintenance Service Order Amendment" and the menu entry is EAM > Maintenance Service Order Amendment [fMaintenanceServiceOrderAmendment.designer.vb:734]. It shares most of its line rules with [Maintenance Service Order](Functional_Doc_fMaintenanceServiceOrder.md).
  tables:
  - CustomerService.ServiceOrderPartsList
  - CustomerService.ServiceOrderResourceDetail
  - CustomerService.ServiceOrderServiceDetail
- key: measurement-parameter-group
  name: Measurement Parameter Group
  module: MD
  summary: The Measurement Parameter Group screen bundles measurement parameters (such as temperature, pressure or running
    hours) into named groups.
  description: |
    Evidence: code + ERP domain (inferred)
    The Measurement Parameter Group screen bundles measurement parameters (such as temperature, pressure or running hours) into named groups. The user enters a Group Name and lists, in a grid, the Measurement Parameters that belong to the group; the grid shows each parameter's Code. The screen assigns a running Code to the group and keeps one group for the whole enterprise, visible to every company. Users can search for a group, change it and delete it. The Equipment Master and Functional Location screens offer these groups, so that an asset or location is measured against a ready-made set of parameters.
  tables:
  - masterdata.mMPGroup
  - masterdata.mMPGroupCompanyDetail
  - masterdata.mMPGroupParameterDetail
- key: meter-reading
  name: Meter Reading
  module: PM
  summary: The Meter Reading screen records dated readings of measurement parameters (for example running hours, kilometres
    or fuel) for equipment or for functional locations.
  description: |
    Evidence: code + ERP domain (inferred)
    The Meter Reading screen records dated readings of measurement parameters (for example running hours, kilometres or fuel) for equipment or for functional locations. A user picks the object type (Equipment or Location), either one object or several at once ("Multiple Objects"), and the screen lists every measurement parameter set up for the chosen objects with the previous reading beside it. The user enters the current reading, chooses whether it is an actual or a difference reading, and the screen works out the net and total running values. For equipment the screen also shows the fuel issued that day and captures daily utilization (work done, value, operator). A reading can be raised on its own or against a Maintenance Order that asks for readings. When the document reaches Authorized status, the readings feed the meter-reading history that maintenance scheduling relies on. The screen is used by plant and maintenance staff of each company, and divisions where the company works division-wise.
  tables:
  - EAM.MeterReading
- key: meter-reading-simplified
  name: Meter Reading Simplified
  module: PM
  summary: The Meter Reading Simplified screen is a fast, one-grid way to record the daily odometer and hour-meter readings
    of all vehicles or machines at a location.
  description: |
    Evidence: code + ERP domain (inferred)
    The Meter Reading Simplified screen is a fast, one-grid way to record the daily odometer and hour-meter readings of all vehicles or machines at a location. The user picks a Location Name, a Measurement Date and a single Reading Type, and the screen lists every equipment of that location that has a kilometre (Milo) or hour (Hr) meter set up, with the previous reading shown beside each. For every ticked equipment the user types the Milo and/or Hr reading and, where the equipment has a utilization work assigned, a Trip/Load count and a Driver. The screen works out net and total readings and saves one Meter Reading document for the whole group. It produces the same documents as [Meter Reading](Functional_Doc_fMeterReading.md) and uses the same stored readings and checks. Transport and plant supervisors use it; maintenance scheduling and later readings benefit.
- key: production-entry
  name: Production Entry
  module: PM
  summary: The Production Entry screen is a simplified process-production entry.
  description: |
    Evidence: code + ERP domain (inferred)
    The Production Entry screen is a simplified process-production entry. For a work center, shift and warehouse it records what was produced: primary outputs, secondary outputs and semi-finished products, each with item, quantity and value. The user also gives the shift incharge, an optional contractor, a process description, remarks and any custom fields the company has configured. Unlike the full production entry it has no consumption, expense or formula sections. When the document is saved as Authorized, each produced item is received into stock in the chosen warehouse at its value-based rate, so the output becomes available to inventory. Production supervisors use it; stores and costing rely on the stock it creates.
  tables:
  - ProcessProduction.ProductionEntryCustomFieldDetail
  - ProcessProduction.ProductionEntryItemAttributeDetail
  - ProcessProduction.ProductionEntryMain
  - ProcessProduction.ProductionEntryProductionDetail
- key: production-formula
  name: Production Formula
  module: MD
  summary: The Production Formula screen defines a standard recipe for producing a primary item at a work center.
  description: |
    Evidence: code + ERP domain (inferred)
    The Production Formula screen defines a standard recipe for producing a primary item at a work center. The user names the formula, picks the Work Center, chooses whether the formula is based on a Stock Item Group or on individual Items, and states the primary Item Type (Primary Input or Primary Output), the primary Item or Stock Item Group and the Quantity of the batch. Three grids then list what the batch consumes (Consumption Detail), what it produces (Production Detail) and which production expenses it carries (Expense Detail). Percentages and quantities are linked automatically to the header Quantity. The screen assigns a running Code and keeps one formula for the whole enterprise, visible to every company. Production entry relies on these formulas to pre-fill consumption, output and expenses.
  tables:
  - masterdata.mProductionFormula
  - masterdata.mProductionFormulaCompanyDetail
  - masterdata.mProductionFormulaConsumptionDetail
  - masterdata.mProductionFormulaExpenseDetail
  - masterdata.mProductionFormulaProductionDetail
- key: rename-item-description
  name: Rename Item Description
  module: MD
  summary: The Rename Item Description screen changes the name, size and grade of an existing item, and with them its Item
    Description, without creating a new item.
  description: |
    Evidence: code + ERP domain (inferred)
    The Rename Item Description screen changes the name, size and grade of an existing item, and with them its Item Description, without creating a new item. The user picks the item by Code or by Item Description, sees the current Item Name, Size and Grade under "Old Item", and types the new values under "Rename As"; the new Item Description is built automatically from name, size and grade. Before renaming, a grid lists, for the chosen item, how many documents of each kind (requisitions, orders, invoices, stock adjustments and so on) already use it. On saving, the item master is updated and the old and new values are kept as a rename history. The change applies to the item for the whole enterprise.
  tables:
  - masterdata.mItemMasterRenameDetail
- key: reset-measurement-parameter
  name: Reset Measurement Parameter
  module: PM
  summary: The Reset Measurement Parameter screen records the moment a meter on an equipment or a functional location is reset
    or replaced, for example an odometer or hour meter that goes back to zero.
  description: |
    Evidence: code + ERP domain (inferred)
    The Reset Measurement Parameter screen records the moment a meter on an equipment or a functional location is reset or replaced, for example an odometer or hour meter that goes back to zero. For the chosen object and Reset Date the screen lists its measurement parameters with the previous reading and the latest reading date. The user ticks the parameters that were reset and enters the reading just before the reset and the reading just after it. Once the document is Authorized, both readings are posted to the shared meter-reading history so that running totals continue correctly across the reset. Maintenance staff use it; the meter-reading screens and maintenance scheduling, which depend on those totals, benefit.
  tables:
  - EAM.ResetMeterReadingMain
  - EAM.ResetMeterReadingParaDetail
- key: safety-instruction-group
  name: Safety Instruction Group
  module: MD
  summary: The Safety Instruction Group screen maintains named bundles of safety instructions.
  description: |
    Evidence: code + ERP domain (inferred)
    The Safety Instruction Group screen maintains named bundles of safety instructions. The user types a Group Name and lists the safety instructions that belong to the group in a grid; the screen assigns a running Code. A group lets maintenance users attach a whole set of instructions to a piece of work or an asset with one choice instead of picking each instruction separately. The group is created once and is made available to every company at creation. Only authorized, active groups are offered on the downstream maintenance screens. Safety, permit and equipment users benefit from consistent instruction sets.
  tables:
  - masterdata.mSafetyInstructionGroup
  - masterdata.mSafetyInstructionGroupCompanyDetail
  - masterdata.mSafetyInstructionGroupDetail
- key: service-call
  name: Service Call
  module: PM
  summary: The Service Call screen records a customer's request for service and follows it until it is fixed.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Call screen records a customer's request for service and follows it until it is fixed. The user picks the Customer Name and Customer Location, names the contact person, optionally selects the Equipment Description, Item Description and Serial No., and describes the problem with a Subject, Origin, Call Type, Problem Type and Priority. The screen assigns a running Call ID, lets the user assign a resource, and lists the service contracts and tax invoices that cover the item on the call date. When a call is Fixed, the solution applied and the customer's feedback are recorded, and solutions can be added to the shared knowledge base. The screen also keeps notification users, company-specific custom fields and a history of earlier calls and service orders for the same equipment. Service desks use it daily; supervisors, resource planners and the monitoring board depend on what it stores.
  tables:
  - CustomerService.ServiceCallContractDetail
  - CustomerService.ServiceCallCustomFieldDetail
  - CustomerService.ServiceCallCustomerFeedbackDetail
  - CustomerService.ServiceCallMain
  - CustomerService.ServiceCallNotificationUserDetail
  - CustomerService.ServiceCallSolutionDetail
  - masterdata.mSolutionKnowledge
  - masterdata.mSolutionKnowledgeCompanyDetail
- key: service-call-change-status
  name: Service Call Change Status
  module: PM
  summary: The Service Call Change Status screen moves a service call from its current status to the next permitted one and
    records why.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Call Change Status screen moves a service call from its current status to the next permitted one and records why. The user picks a Call ID, sees the call's customer, contact, equipment, problem and assignee details as read-only information, chooses the new Status and optionally a Reason. When a call is marked Fixed, the screen also captures the solution applied, the customer's feedback and the service contracts that covered the work. Solutions can be added to the shared knowledge base at the same time. Each status change is stored as its own dated entry, the call itself takes the new status, and a status history is kept. Service engineers and supervisors use it to close the life cycle of a call.
  tables:
  - CustomerService.ServiceCallChangeStatus
- key: service-call-monitoring
  name: Service Call Monitoring
  module: PM
  summary: The Service Call Monitoring screen is a live, read-only board of customer service calls.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Call Monitoring screen is a live, read-only board of customer service calls. It lists every call with its customer, location, contact, equipment, subject, priority, assignee, status, origin, call type, problem type and completion date, plus any custom fields configured for service calls. A branch user sees the calls of the own company; the head office sees the calls of all companies and an extra Company Name column. Each row is coloured by its priority, and every user can choose personal colours for the priorities. The board refreshes itself when service calls change in the database. Service desk supervisors and resource planners use it to watch the open workload without opening each call.
- key: service-call-resource-allocation
  name: Service Call Resource Allocation
  module: PM
  summary: The Service Call Resource Allocation screen lets a dispatcher assign a service resource to many service calls in
    one pass.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Call Resource Allocation screen lets a dispatcher assign a service resource to many service calls in one pass. The screen lists the company's open and in-progress calls with customer, location, equipment, item, serial number, subject, status and the resource currently assigned. The user picks a resource in the Assign To column for every call to reassign and saves once. Each change is recorded in an assignment history that the user can open from the Current Assign To column. Dispatchers and service coordinators use it to balance work between resources without opening every call.
- key: service-call-resource-reporting
  name: Service Call Resource Reporting
  module: PM
  summary: The Service Call Resource Reporting screen lets a service resource record the time spent on a service call.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Call Resource Reporting screen lets a service resource record the time spent on a service call. For each entry the user confirms the Resource Name, picks the Service Call Id, sets the Entry Date, enters the Duration in hours and minutes and writes a Remark. The screen gives every entry a running Call Log ID. Only calls that are in one of two closing statuses can be reported against, and the Resource Name list is limited to the resource linked to the logged-in user. The screen warns when the same resource has already reported on the same call on the same date. Service managers use the entries to see how much effort each call consumed and who spent it.
  tables:
  - CustomerService.ServiceCallResourceReportingDetail
- key: service-contract
  name: Service Contract
  module: PM
  summary: The Service Contract screen records a service contract between the company and a party.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Contract screen records a service contract between the company and a party. The contract covers a warranty, a free maintenance period, a maintenance contract or an annual maintenance contract (AMC), and runs for a fixed period. A contract is either Outbound (the company serves its customers) or Inbound (a vendor serves the company). It holds the party, the source document it comes from, the covered equipment and items, warranty and coverage terms, response and resolution times, billing and payment terms, preventive maintenance triggers with the expected occurrence dates, and the services, spare parts and resources that the contract promises [fServiceContract.vb:112-390; fServiceContract.vb:2770-3038]. A contract can be started from a standard template defined on [Service Contract Setup](Functional_Doc_fServiceContractSetup.md) [fServiceContract.vb:5878-6061]. The screen follows the Initial, Released, Authorized document workflow and locks the contract once it is authorised (BR-01).
  tables:
  - CustomerService.ServiceContractBillingDetail
  - CustomerService.ServiceContractItemDetail
  - CustomerService.ServiceContractMain
  - CustomerService.ServiceContractMeasurementParameters
  - CustomerService.ServiceContractNotesDetail
  - CustomerService.ServiceContractOccuranceDetail
  - CustomerService.ServiceContractPaymentTermDetail
  - CustomerService.ServiceContractResourceDetail
  - CustomerService.ServiceContractServiceDetail
  - CustomerService.ServiceContractServicePricingDetail
  - CustomerService.ServiceContractSparePartDetail
  - CustomerService.ServiceContractTermsNConditionDetail
  - CustomerService.ServiceContractTriggerDetail
- key: service-contract-coverage-term
  name: Service Contract Coverage Term
  module: MD
  summary: The Service Contract Coverage Term screen defines named coverage schedules for service contracts.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Contract Coverage Term screen defines named coverage schedules for service contracts. A term has a Description and a weekly timetable: for each day from Sunday to Saturday the user marks a Weekly Off or enters the Start Time and End Time during which service is covered, and the screen shows the Total Hrs. for the day. An Include Holiday tick is also shown. The screen assigns a running Code automatically and keeps one term for the whole enterprise, visible to every company. Service contract screens let the user pick one of these terms for a contract.
  tables:
  - masterdata.mServiceContractCoverageTerm
  - masterdata.mServiceContractCoverageTermCompanyDetail
  - masterdata.mServiceContractCoverageTermDetail
- key: service-contract-occurrence
  name: Service Contract Occurrence
  module: PM
  summary: The Service Contract Occurrence screen lets a user add, change or delete one scheduled service visit (an occurrence)
    of an authorised service contract.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Contract Occurrence screen lets a user add, change or delete one scheduled service visit (an occurrence) of an authorised service contract. The user picks a Service Contract No., sees the contract's party, nature, type, category and reference document as read-only information, then picks the Trigger No., optionally an Equipment Description or an Item Description, an Occurrence Date, a Status and Remarks. The screen proposes the next Occurrence No. for the chosen trigger and equipment or item. It also shows the trigger's type, description and the previous and current occurrence values for reference. Maintenance planners use it to add an extra visit by hand, re-date a visit, mark it Completed or Cancel, or remove it. Service orders and the contract schedule later read these occurrences.
- key: service-contract-setup
  name: Service Contract Setup
  module: PM
  summary: The Service Contract Setup screen defines reusable service contract templates for one company.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Contract Setup screen defines reusable service contract templates for one company. A template holds the standard terms of a kind of contract: service nature (Inbound or Outbound), contract type, contract category, warranty rules, coverage term, response and resolution times, billing and payment terms, preventive maintenance triggers, covered services, spare parts, resources, terms and conditions, notes, and a contract rule that says which items, customers or locations the template applies to. The user can mark a template as the default for the items or sub groups in its contract rule. Templates follow a document workflow (Initial, Released, Authorized) and an authorised template can no longer be changed. When a user raises a service contract, the Template field of the [Service Contract](Functional_Doc_fServiceContract.md) screen copies a template's values into the new contract, so contracts are created quickly and consistently.
  tables:
  - CustomerService.ServiceContractSetupContractRuleDetail
  - CustomerService.ServiceContractSetupMain
  - CustomerService.ServiceContractSetupMeasurementParameters
  - CustomerService.ServiceContractSetupNotesDetail
  - CustomerService.ServiceContractSetupPaymentTermDetail
  - CustomerService.ServiceContractSetupResourceDetail
  - CustomerService.ServiceContractSetupServiceDetail
  - CustomerService.ServiceContractSetupServicePricingDetail
  - CustomerService.ServiceContractSetupSparePartDetail
  - CustomerService.ServiceContractSetupTermsNConditionDetail
  - CustomerService.ServiceContractSetupTriggerDetail
- key: service-order-reporting
  name: Service Order Reporting
  module: PM
  summary: The Service Order Reporting screen records what was actually done against an authorized Maintenance Service Order.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Order Reporting screen records what was actually done against an authorized Maintenance Service Order. For the chosen order the user states the actual start and end dates, an outcome status and a reason. The user then reports each service performed (dates, time, quantity, status), the replacement items consumed together with the stores issues they come from, the time each resource worked and its detailed schedule, the solutions applied, the customer's feedback, the root cause of each reported fault, and any equipment bill-of-material parts whose serial numbers were swapped. A reporting document moves through Draft, Released and Authorized statuses and is locked once Authorized. Saving also pushes the chosen outcome status onto the service order itself. Each service order can have only one reporting document. Invoicing and amendment screens read the reported quantities. The window caption reads "ServiceOrderReporting" and the menu entry is EAM > Service Order Reporting [fServiceOrderReporting.Designer.vb:967].
  tables:
  - CustomerService.ServiceOrderCustomerFeedbackDetail
  - CustomerService.ServiceOrderReportingBOMDetail
  - CustomerService.ServiceOrderReportingIssueDetail
  - CustomerService.ServiceOrderReportingItemDetail
  - CustomerService.ServiceOrderReportingMain
  - CustomerService.ServiceOrderReportingResourceDetail
  - CustomerService.ServiceOrderReportingServiceDetail
  - CustomerService.ServiceOrderResourceReportingDetail
  - CustomerService.ServiceOrderSolutionDetail
- key: service-order-resource-reporting-detail
  name: Service Order Resource Reporting Detail
  module: PM
  summary: The Service Order Resource Reporting Detail screen records the time that an individual resource (a technician,
    crew or machine from the EAM resource master) worked against a Maintenance Service Order.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Order Resource Reporting Detail screen records the time that an individual resource (a technician, crew or machine from the EAM resource master) worked against a Maintenance Service Order. Each grid row names the customer, location, service order, resource and task, the start and end times, the quantity and the total time. The screen has no header, no document number and no approval stages: every saved row becomes its own independent time entry [fResourceReporting.vb:682-727; CustomerService.CSRRSave:32-65]. Entries can be searched, opened one at a time and deleted. The screen blocks entries that overlap another entry of the same resource on the same order and entries for orders that still have an unauthorized Service Order Reporting document [CustomerService.CSRRValidate:17-42]. Several defects (re-saving an opened entry creates a duplicate, whole-number totals of 60 or more are rejected) are listed in Section 13.
  tables:
  - CustomerService.ServiceOrderResourceReportingDetail
- key: shutdown-work-list
  name: Shutdown Work List
  module: PM
  summary: The Shutdown Work List screen defines a reusable plan of the work done when a group of equipment is shut down.
  description: |
    Evidence: code + ERP domain (inferred)
    The Shutdown Work List screen defines a reusable plan of the work done when a group of equipment is shut down. The user describes the shutdown, picks the equipment it covers, lists the tasks to perform and then attaches the resources and the spare items each task needs. Each task carries a duration, an assignee, a work center, a cost center and a subcontract flag. The list gets an automatic code and belongs to one company. Maintenance planners benefit because, when equipment goes down, the standard work list for that equipment is available to build the maintenance order.
  tables:
  - EAM.ShutdownWorkListEquipmentDetail
  - EAM.ShutdownWorkListItemDetail
  - EAM.ShutdownWorkListMain
  - EAM.ShutdownWorkListResourceDetail
  - EAM.ShutdownWorkListTaskDetail
- key: skill-master
  name: Skill Master
  module: MD
  summary: The Skill Master screen maintains the list of skills that maintenance and quality work can require, such as a trade
    or a certification.
  description: |
    Evidence: code + ERP domain (inferred)
    The Skill Master screen maintains the list of skills that maintenance and quality work can require, such as a trade or a certification. For each skill the user enters a Skill Name and picks a Skill Type and a Skill Group; the screen assigns a running Code automatically. A new skill is made available to every company at creation. Resource definitions, equipment records, maintenance orders and quality screens offer these skills, so the same skill vocabulary is used across planning and execution.
  tables:
  - masterdata.mSkillMaster
  - masterdata.mSkillMasterCompanyDetail
- key: solution-knowledge
  name: Solution Knowledge
  module: MD
  summary: The Solution Knowledge screen maintains a library of known problems and their remedies.
  description: |
    Evidence: code + ERP domain (inferred)
    The Solution Knowledge screen maintains a library of known problems and their remedies. Each entry names an Item, describes the Symptom, gives a short Solution and a longer Solution Description, optionally records the Cause, and carries a Status of Internal, Publish or Review. The screen assigns a running Code automatically and keeps one entry for the whole enterprise, visible to every company. Users can search for an entry, change it and delete it. Service call and service order screens offer these entries as a knowledge base when a fault is being resolved.
  tables:
  - masterdata.mSolutionKnowledge
  - masterdata.mSolutionKnowledgeCompanyDetail
- key: supplementary-field
  name: Supplementary Field
  module: MD
  summary: The Supplementary Field screen maintains the extra data items that can be recorded against equipment, for example
    a registration number.
  description: |
    Evidence: code + ERP domain (inferred)
    The Supplementary Field screen maintains the extra data items that can be recorded against equipment, for example a registration number. For each item the user enters a Field Name and chooses its Data Type, Nature and Unit; the screen assigns a running Code automatically. A new field is made available to every company at creation. Fields that were supplied centrally are protected from edits to their definition. Equipment masters, the supplementary field groups and several vehicle and tyre screens use these fields, so asset data can be extended without changing the equipment screen itself.
  tables:
  - masterdata.mSupplementaryField
  - masterdata.mSupplementaryFieldCompanyDetail
- key: supplementary-field-group
  name: Supplementary Field Group
  module: MD
  summary: The Supplementary Field Group screen maintains named bundles of supplementary fields.
  description: |
    Evidence: code + ERP domain (inferred)
    The Supplementary Field Group screen maintains named bundles of supplementary fields. The user types a Group Name and lists the supplementary fields that belong to the group in a grid; the screen assigns a running Code. A group lets equipment and functional location users load a ready-made set of extra data fields with one choice instead of adding each field by hand. The group is made available to every company at creation. Asset data owners benefit from consistent sets of extra attributes across similar assets.
  tables:
  - masterdata.mSFGroup
  - masterdata.mSFGroupCompanyDetail
  - masterdata.mSFGroupFieldDetail
- key: tripsheet
  name: TripSheet
  module: PM
  summary: 'The TripSheet screen records the journeys of a vehicle for a day or shift: which driver drove, when the vehicle
    left and arrived, between which locations, and what the meters read.'
  description: |
    Evidence: code + ERP domain (inferred)
    The TripSheet screen records the journeys of a vehicle for a day or shift: which driver drove, when the vehicle left and arrived, between which locations, and what the meters read. The user picks a Document Date and a Vehicle Name; the screen shows the vehicle's initial milometer and hour reading taken from its meter history and the details of the previous trip sheet. The user then lists the trips with driver, departure and arrival date and time, readings or hours, locations and remarks, and may name a Shift and Shift Incharge and add print notes. The document carries a number, status and division from the shared document control. When the trip sheet is authorized, its closing readings are posted to the vehicle's meter history, so fleet, maintenance scheduling and fuel-efficiency users depend on it.
  tables:
  - EAM.TripSheetDetail
  - EAM.TripSheetMain
  - EAM.TripSheetNotesDetail
- key: tyre-category-master
  name: Tyre Category Master
  module: PM
  summary: The Tyre Category Master screen defines the categories into which tyres are classified, for example by construction
    or application.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Category Master screen defines the categories into which tyres are classified, for example by construction or application. For each category the user enters a Category Name, optional default Original and Threshold NSD (new-surface depth, in tyre-tread terms) values, and a grid of tyre makes with their own Original NSD and Threshold NSD. The screen assigns a running Code automatically. These values later act as the starting and replacement-warning tread depths for tyres of that category and make. The master is created once for the whole enterprise and is made available to every company. Tyre masters, inspections and repairs read the category to default and judge tread readings.
  tables:
  - masterdata.mTyreCategoryCompanyDetail
  - masterdata.mTyreCategoryMakeDetail
  - masterdata.mTyreCategoryMaster
- key: tyre-expense-entry
  name: Tyre Expense Entry
  module: PM
  summary: The Tyre Expense Entry screen records money spent on individual tyres, such as fitting charges, balancing or other
    costs that are not part of a purchase or a repair document.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Expense Entry screen records money spent on individual tyres, such as fitting charges, balancing or other costs that are not part of a purchase or a repair document. For each document the user lists the tyres concerned, either vehicle by vehicle or tyre by tyre, with an Expense Description and an Expense Amount. The screen shows the tyre's current stage and status as read-only context and adds up a Total Amount. The document follows the usual draft, released and authorized life cycle. The expenses build up the cost history of each tyre: tyre cost reports read them, and when a retread is completed the expenses booked in that life stage are added into the stage's total cost.
  tables:
  - EAM.TyreExpenseEntryDetail
  - EAM.TyreExpenseEntryMain
- key: tyre-inspection-entry
  name: Tyre Inspection Entry
  module: PM
  summary: The Tyre Inspection Entry screen records tread-depth inspections of tyres.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Inspection Entry screen records tread-depth inspections of tyres. For one inspection date, shift and inspector, the user lists the tyres inspected, either vehicle by vehicle (the tyre fitted at the chosen wheel position is picked up automatically) or tyre by tyre. For each tyre the user enters the kilometre reading and up to five tread depth (NSD) readings in a small pop-up; the screen averages them. A tyre condition note and remarks can be added per line. The document is a plain record: it does not change tyre status, position or master readings. Maintenance planners and the tyre inspection and life reports use these readings to judge wear and decide on repair, rotation or replacement.
  tables:
  - EAM.TyreInspectionEntryDetail
  - EAM.TyreInspectionEntryMain
- key: tyre-master
  name: Tyre Master
  module: PM
  summary: The Tyre Master screen registers every individual tyre the company owns, whether it is in stock, fitted to a vehicle,
    or in any other stage of its life.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Master screen registers every individual tyre the company owns, whether it is in stock, fitted to a vehicle, or in any other stage of its life. The user records what the tyre is (serial number, make, model, size, category, pattern, ply rating), where it came from (supplier, purchase order, invoice, amount, or a material issue), its tread depth and running readings when it enters the system, its expected life and warranty, and where it is now (a warehouse, or a vehicle and wheel position). The screen assigns a running Code automatically and writes the first entry of the tyre's status history. Tyres can be entered one at a time, by copying an existing tyre, or in bulk through a grid or an Excel import. The Tyre Movement, Inspection, Expense, Repair and Change Status screens all act on tyres registered here, and tyre cost and life reports read this master.
  tables:
  - EAM.TyreMaster
- key: tyre-movement
  name: Tyre Movement
  module: PM
  summary: The Tyre Movement screen records tyre fitment and removal work on vehicles.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Movement screen records tyre fitment and removal work on vehicles. For one Fitment/Removal Date and optional Shift, the user lists one line per vehicle wheel position and picks the Action: Install, Remove, Replace, Swap within the same vehicle or Swap with another vehicle. Each line captures the tread depth, kilometre and hour readings of the tyres taken off and put on, why a tyre was removed, what status and warehouse the removed tyre goes to, and who the work is assigned to. The document follows the usual draft, released and authorized life cycle. Only when it is saved as authorized does it move the tyres: statuses, vehicle positions and the tyre history are then updated for every tyre involved. Reversal on delete is possible while no later document has used the tyres. Maintenance planners, workshop staff and tyre cost reports rely on the resulting history.
  tables:
  - EAM.TyreMovementCustomFieldDetail
  - EAM.TyreMovementDetail
  - EAM.TyreMovementMain
- key: tyre-repair-category
  name: Tyre Repair Category
  module: PM
  summary: The Tyre Repair Category screen defines the categories of repair work that can be carried out on a tyre, such as
    one particular kind of repair.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Repair Category screen defines the categories of repair work that can be carried out on a tyre, such as one particular kind of repair. For each category the user enters a Category name, chooses the Repair Type, optionally links a Service Item (the service charged for the repair) and ticks the roles that may work with the category. The screen assigns a running Code automatically. The master is created once for the whole enterprise and is made available to every company. Tyre repair requests and tyre repair entries use these categories to classify the work and to link it to a billable service.
  tables:
  - masterdata.mTyreRepairCategory
  - masterdata.mTyreRepairCategoryCompanyDetail
  - masterdata.mTyreRepairCategoryRoleDetail
- key: tyre-repair-entry
  name: Tyre Repair Entry
  module: PM
  summary: 'The Tyre Repair Entry screen records the outcome of repair and retread work on tyres: for each tyre it captures
    the repair status reached (repair completed, retread completed, rejected and so on), the tread depth and kilometres at
    that time, the repair cost, who the work is assigned to and, for retreads, the new tread depth, threshold and expected
    life.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Repair Entry screen records the outcome of repair and retread work on tyres: for each tyre it captures the repair status reached (repair completed, retread completed, rejected and so on), the tread depth and kilometres at that time, the repair cost, who the work is assigned to and, for retreads, the new tread depth, threshold and expected life. An entry is either raised against an authorized [Tyre Repair Request](Functional_Doc_fTyreRepairRequest.md) (the user ticks the tyres that came back) or entered directly for tyres chosen on the screen. For work done by an outside supplier the database insists on proof that the tyres were received back or sent back (BR-12). On authorization the tyres take the new repair status in the tyre history, a completed retread moves the tyre into its next life stage, and the originating request is marked in progress or completed (BR-15; BR-16) [fTyreRepairEntry.vb:645-735; EAM.TTRESaveTyreRepairEntryDetail:75-152; EAM.TyreChangeStatus:1079-1087]. The window caption is "MiningTyreRepairEntry" [fTyreRepairEntry.Designer.vb:443].
  tables:
  - EAM.TyreRepairEntryCustomFieldDetail
  - EAM.TyreRepairEntryDetail
  - EAM.TyreRepairEntryMain
- key: tyre-repair-request
  name: Tyre Repair Request
  module: PM
  summary: The Tyre Repair Request screen is where a user asks for tyres to be repaired or retreaded.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tyre Repair Request screen is where a user asks for tyres to be repaired or retreaded. The user picks a Repair Location and a Repair Category, optionally names who requested the work, and lists the tyres, either by vehicle and wheel position or directly by tyre, with a repair description and the current tread depth (NSD) for each. The document is saved as a draft, released or authorized, and can be searched, reopened, changed (until authorized) and deleted. When the category is a retread category and the document is authorized, each tyre moves from Awaiting Retread to Under Retread and the change is written to the tyre history; for other repair categories the request is recorded without changing the tyre status (BR-10) [fTyreRepairRequest.vb:493-574; EAM.TyreChangeStatus:49-56; EAM.TyreChangeStatus:441-443]. The window caption is "MiningTyreRepairRequest" [fTyreRepairRequest.Designer.vb:294].
  tables:
  - EAM.TyreRepairRequestDetail
  - EAM.TyreRepairRequestMain
- key: utalization-description
  name: Utalization Description
  module: MD
  summary: The Utalization Description screen maintains a list of utilization descriptions, each tied to a Unit of measure.
  description: |
    Evidence: code + ERP domain (inferred)
    The Utalization Description screen maintains a list of utilization descriptions, each tied to a Unit of measure. A description such as an operating-hours or output measure is recorded once, given an automatic Code, and linked to the Unit in which that utilization is counted. The user enters a Description, picks a Unit and saves. The list is shared by all companies: one record is created for the enterprise, and a per-company availability row is created for every company at the same time. Users can search, reopen, modify and delete descriptions. Asset and maintenance screens that record utilization draw on this list.
  tables:
  - masterdata.mAssetUtalizationWork
  - masterdata.mAssetUtalizationWorkCompanyDetail
- key: wbs-task-reporting
  name: WBS Task Reporting
  module: PM
  summary: The WBS Task Reporting screen is meant to let a user report progress and resource usage against the tasks of a
    project work breakdown structure (WBS), using the same layout as the Maintenance Reporting screen.
  description: |
    Evidence: code + ERP domain (inferred)
    The WBS Task Reporting screen is meant to let a user report progress and resource usage against the tasks of a project work breakdown structure (WBS), using the same layout as the Maintenance Reporting screen. The user picks an Entry Date, a Project and a WBS, and sees a Task Detail grid and a Resource Detail grid. In the source as delivered the screen is an unfinished copy of Maintenance Reporting: its project and WBS selections do nothing, and its Save, Delete and Load routines are switched off in the code. No data entered on it is stored. This document records what the screen does today and what is missing, so that users do not rely on it for reporting.
- key: work-center
  name: Work Center
  module: MD
  summary: The Work Center screen maintains the work centers where production and maintenance work is carried out.
  description: |
    Evidence: code + ERP domain (inferred)
    The Work Center screen maintains the work centers where production and maintenance work is carried out. The user enters a Work Center Name and, optionally, lists default production expenses for it in the Expense Detail grid, each with an Expense Type, an Expense Value and Remarks. The screen assigns a running Code automatically and makes the work center available to every company. A second grid titled Formula Detail is shown but is always empty. Production entries, production formulas, shutdown work lists and the equipment master offer the work centers saved here, so production cost and maintenance planning share one list of work centers.
  tables:
  - masterdata.mWorkCenter
  - masterdata.mWorkCenterCompanyDetail
  - masterdata.mWorkCenterExpenseDetail
- key: work-log-category
  name: Work Log Category
  module: MD
  summary: The Work Log Category screen maintains the categories under which maintenance and asset work logs are recorded.
  description: |
    Evidence: code + ERP domain (inferred)
    The Work Log Category screen maintains the categories under which maintenance and asset work logs are recorded. Each category has a Category Name and, optionally, a Parent Category, so categories can be arranged in a hierarchy. The screen shows a Code that is a running number held with the category, and keeps one category for the whole enterprise, visible to every company. Users can search for a category, change it and delete it. The Work Log screen offers these categories when a work log is entered.
  tables:
  - masterdata.mWorkLogCategoryCompanyDetail
  - masterdata.mWorkLogCategoryMaster
- key: worklog
  name: WorkLog
  module: PM
  summary: The WorkLog screen is the maintenance shift diary.
  description: |
    Evidence: code + ERP domain (inferred)
    The WorkLog screen is the maintenance shift diary. For a date and shift the user records what was done on which equipment or location, who was responsible, which tasks were planned with the resources and spare items they need, who was involved and what the different departments commented. A document is either an equipment log (timed entries per equipment or location) or a daily log (tasks done per equipment with time spent and status, optionally pre-filled from a maintenance category). Costing details (repair cost, days to resolve, recovery, company liability) can be added. A previous log can be repeated as the starting point of a new one. Maintenance supervisors and planners use it; the tasks, resources and items it lists feed planning of the next shutdown or maintenance. The document carries a number, status and division from the shared document control.
  tables:
  - EAM.WorkLogCommentDetail
  - EAM.WorkLogDailyTaskLogDetail
  - EAM.WorkLogEmployeeInvolved
  - EAM.WorkLogEquipmentDetail
  - EAM.WorkLogItemDetail
  - EAM.WorkLogMain
  - EAM.WorkLogResourceDetail
  - EAM.WorkLogTaskDetail
- key: account-opening
  name: Account Opening
  module: FI
  summary: The Account Opening screen (window caption "Set Opening Balance") captures the opening balance of each ledger account
    for a Finance Book (or Profit Center when that company option is on).
  description: |
    Evidence: code + ERP domain (inferred)
    The Account Opening screen (window caption "Set Opening Balance") captures the opening balance of each ledger account for a Finance Book (or Profit Center when that company option is on). The user picks the book, ticks the accounts to set, and enters quantity, amount, Dr/Cr type and currency per account. Accounts that track references or cost centers get opening reference rows and cost center splits through pop-up editors. The screen shows total debit, total credit and the difference, so the user can see whether the opening balances agree. It writes the opening balance records directly; it does not create a voucher. Finance teams use it when a book goes live or when balances are carried into the opening year. The saved balances feed account balances, reference outstanding and financial statements (Inferred).
  tables:
  - Finance.ReferenceDetail
  - Finance.ReferenceMain
  - Finance.accVoucherReferenceDetail
- key: asset-capitalization
  name: Asset Capitalization
  module: FI
  summary: The Asset Capitalization screen turns purchases and other costs into fixed assets.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Capitalization screen turns purchases and other costs into fixed assets. The user chooses a source (Purchase Order, Subcontract Order, Purchase Requisition, Subcontract Requisition or Voucher), a reference document or account, an Asset Group and an Asset Account, and then selects the lots or voucher lines to capitalize. The screen lists them in the Transaction Detail tab, builds the assets and tags in the Other Detail tab, and, when the document is authorized, creates the assets and tags with their depreciation values, an asset register transaction per tag, and a journal voucher that debits the Asset Account and credits the clearing account(s) [fAssetCapitalization.vb:1322-1433; fAssetCapitalization.vb:2677-2749; FixedAsset.AMCAFillValuesRefDoc:102-228].
  tables:
  - FixedAsset.AssetCapitalizationAssetDetail
  - FixedAsset.AssetCapitalizationMain
- key: asset-class
  name: Asset Class
  module: MD
  summary: The Asset Class screen maintains the asset classes of a chart of depreciation (COD).
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Class screen maintains the asset classes of a chart of depreciation (COD). A class has a Class Name, an optional Parent Class, an Asset Type, a Class Nature (Inventory or Non Inventory), an Asset Class Group and a Depreciable tick. The screen assigns a running Code automatically. An Asset Number Generation grid lists every corporate depreciation book of the COD and, where a book numbers assets by class or subclass, collects the starting number for this class. Users can enter one class at a time or use a fast-entry grid with Excel import. Asset groups, depreciation rule mapping, account mapping and capitalization all build on the classes defined here.
  tables:
  - FixedAsset.AssetClassMain
  - FixedAsset.AssetNumberStructureClassDetail
  - FixedAsset.CODClassDetail
- key: asset-disposal
  name: Asset Disposal
  module: FI
  summary: The Asset Disposal screen records the sale of fixed asset tags to a customer account.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Disposal screen records the sale of fixed asset tags to a customer account. The user picks an Asset Group, ticks the tags to dispose, enters the sale rate and amount for each, adds taxes, and saves. When the document is authorized the screen posts a sales journal voucher, a depreciation and profit-or-loss voucher, a cash counter entry for cash receipts, and a zero-value reduction of the tag in the asset register [fAssetDisposal.vb:589-716; FixedAsset.AMDASaveMain:206-231].
  tables:
  - Finance.CashCounterMain
  - Finance.accVoucherChildDetail
  - FixedAsset.AssetDisposalAssetDetail
  - FixedAsset.AssetDisposalMain
  - FixedAsset.AssetDisposalTaxDetail
  - FixedAsset.AssetTransactionDetail
- key: asset-group
  name: Asset Group
  module: MD
  summary: The Asset Group screen maintains asset groups, the level at which individual fixed assets are classified under
    an asset class.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Group screen maintains asset groups, the level at which individual fixed assets are classified under an asset class. A group belongs to one chart of depreciation (COD) and one Asset Class of that chart, may sit under a Parent Group of the same class, and has a Group Name. The screen assigns a running Code automatically. An Asset Number Generation grid lists every corporate depreciation book of the chosen COD and, where a book numbers assets by Asset Group, collects the Prefix and Starts From value for this group. Users can enter one group at a time or use a fast-entry grid with Excel import. Asset capitalization and depreciation use the groups defined here when assets are created and numbered.
  tables:
  - FixedAsset.AssetGroupMain
  - FixedAsset.AssetNumberStructureGroupDetail
  - FixedAsset.CODGroupDetail
- key: asset-location
  name: Asset Location
  module: MD
  summary: The Asset Location screen maintains the list of physical locations where fixed assets are kept.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Location screen maintains the list of physical locations where fixed assets are kept. Each location has a Location Name, an optional Parent Location, which lets locations form a hierarchy (for example a building under a site), and a Location Type chosen from a shared list. The screen assigns a running Code automatically. Users can enter one location at a time or switch to a fast-entry grid, where many locations are typed or imported from an Excel sheet and saved row by row. Fixed asset administrators maintain the list; asset registers, tag transfers and asset reports later use it to say where an asset is.
  tables:
  - FixedAsset.AssetLocationMain
- key: asset-number-structure
  name: Asset Number Structure
  module: MD
  summary: The Asset Number Structure screen defines, for each corporate depreciation book, how asset numbers are built.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Number Structure screen defines, for each corporate depreciation book, how asset numbers are built. The user picks a Depreciation Book, enters a one-digit Padding, chooses what the numbering is based on (Class Wise, Asset Subclass, Asset Group or Depreciation Book) and, only for the Depreciation Book basis, enters the number the series Starts From. Each depreciation book can have only one structure. Fixed asset administrators maintain it once when the book is set up. The Asset Class and Asset Group screens later read it to decide whether they must collect a starting number (and, for groups, a prefix) for each book.
  tables:
  - FixedAsset.AssetNumberStructureMain
- key: asset-opening
  name: Asset Opening
  module: FI
  summary: The Asset Opening screen loads the opening balances of fixed assets for a Finance Book and a Depreciation Book
    on the date the books start.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Opening screen loads the opening balances of fixed assets for a Finance Book and a Depreciation Book on the date the books start. The user chooses the Depreciation Book and enters, per asset tag, the Asset Group, supplier, asset number and description, tag number and description, location, quantity, in-service date, acquisition value, salvage value and accumulated depreciation. The screen derives the asset class and the asset and cumulative depreciation accounts from the group, and shows a Summary that compares the opening per ledger account with the opening per asset register. Rows can also be imported from Excel. The screen creates the assets and tags in the register but posts no voucher; the ledger opening comes from the account opening of the Finance Book. The register it creates feeds depreciation, disposal and bifurcation.
  tables:
  - FixedAsset.AssetOpeningMain
- key: asset-tag-bifurcation
  name: Asset Tag Bifurcation
  module: FI
  summary: The Asset Tag Bifurcation screen splits one asset tag into two or more new tags.
  description: |
    Evidence: code + ERP domain (inferred)
    The Asset Tag Bifurcation screen splits one asset tag into two or more new tags. The user picks an Asset No. and one of its Tag No. values, and the screen shows the asset and tag values (acquisition value, salvage value, accumulated depreciation, in-service date, location, last depreciation processing date). The user then enters the new tags in a grid with description, item, reference, serial number, quantity and values, and the totals must equal the values of the tag being split. For books other than the main depreciation book, values per new tag are entered in a pop-up. When the document is authorized, the new tags are created as children of the original tag and start carrying depreciation, while the original tag drops out of depreciation and lists. Fixed asset accountants use it when one physical or accounting unit has to be tracked as several.
  tables:
  - FixedAsset.AssetTagBifurcationDetail
  - FixedAsset.AssetTagBifurcationMain
- key: balance-sheet
  name: Balance Sheet
  module: FI
  summary: The Balance Sheet screen (window caption "BalanceSheet") prepares a balance sheet as a stored, versioned statement
    for a layout, a document date and a Finance Book (or Profit Center).
  description: |
    Evidence: code + ERP domain (inferred)
    The Balance Sheet screen (window caption "BalanceSheet") prepares a balance sheet as a stored, versioned statement for a layout, a document date and a Finance Book (or Profit Center). The user picks the FSL Name and the book, enters a Description and Document Date, and presses "Show". The screen builds the statement from the layout's sections, groups and mapped accounts, using ledger balances up to the document date. The user then saves it with a Document Status of Initial, Release or Authorized. Each save for the same date, layout and book gets the next Version number. For consolidated books the screen instead links each underlying book to a balance sheet already prepared for display. The saved statements are read by the balance sheet reports (Inferred). The screen does not post vouchers.
  tables:
  - Finance.BalanceSheetAccountDetail
  - Finance.BalanceSheetFBDetail
  - Finance.BalanceSheetFSGroupDetail
  - Finance.BalanceSheetMain
- key: bank-journal
  name: Bank Journal
  module: FI
  summary: The Bank Journal screen turns approved payables and receivables into bank payment or bank receipt vouchers in bulk.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Journal screen turns approved payables and receivables into bank payment or bank receipt vouchers in bulk. The user chooses a Paying Unit, a Finance Book (or Profit Center), a Bank Account Name, a Transaction Type (Payment or Receipt) and a Transaction Date, optionally narrows the list by Source Document and Ref. No., and presses Show. The screen lists the pending items grouped by payee, with the underlying documents shown as child rows. The user selects the payees to settle, enters the cheque, DD, NEFT, RTGS or other reference, date and in-favour-of name, and saves. One save creates the accounting vouchers, links them to the source documents, relieves the amounts held "in process" on the payables, and offers to print the voucher, cheque advice and DD advice. Finance operators use it daily; the ledger, party balances and bank reconciliation depend on its output.
  tables:
  - Finance.BankPaymentDetail
  - Finance.BankPaymentMain
- key: bank-limit
  name: Bank Limit
  module: MD
  summary: The Bank Limit screen records the credit limit a bank has granted to the company from a given date, and, for each
    finance book, the ledger accounts that letters of credit with that bank are to be posted to.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Limit screen records the credit limit a bank has granted to the company from a given date, and, for each finance book, the ledger accounts that letters of credit with that bank are to be posted to. The user picks a Bank Name, an Applicable Date and a Limit Amount, then ticks the finance books the limit applies to and chooses five accounts per ticked book: Bank Account, Opening Charges Account, Interest Charges Account, Discounting & Negotiation Account and Payable Account. Only one limit may exist for a bank on a given date. The Letter Of Credit and Bill Of Exchange screens read these accounts to propose the accounts for their vouchers, using the most recent limit in force on the document date. The screen is a master: it posts no voucher itself.
  tables:
  - Finance.BankLimitFBDetail
  - Finance.BankLimitMain
- key: bank-reconciliation
  name: Bank Reconciliation
  module: FI
  summary: The Bank Reconciliation screen matches the company's bank ledger with the bank's statement for one bank account
    on one Reconciliation Date.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Reconciliation screen matches the company's bank ledger with the bank's statement for one bank account on one Reconciliation Date. The user chooses the bank account and date, presses Show, and the screen lists every bank item of the selected Finance Books that is still open or was cleared on that date: vouchers, cheque, DD and transfer references, and opening items entered in [Bank Reconciliation Opening](Functional_Doc_fOpeningBankReconciliation.md). The user ticks the items the bank has cleared and gives each a Clearing Date, or imports a bank statement file that ticks them automatically. Charges and interest shown on the statement but not yet in the books are entered in a second grid. The screen works out the balance as per the reconciliation and compares it with the Balance as per Bank Book keyed from the statement [fBankReconciliation.vb:905-922; fBankReconciliation.vb:1044-1059]. When the Document Status is Authorized, each charge or interest row is posted as a voucher on the spot, a Payment or a Receipt against the bank account (BR-14). Saved reconciliations can be reopened, changed until authorized, printed, exported and e-mailed.
  tables:
  - Finance.BankReconciliationChargeDetail
  - Finance.BankReconciliationDetail
  - Finance.BankReconciliationMain
- key: bank-reconciliation-opening
  name: Bank Reconciliation Opening
  module: FI
  summary: The Bank Reconciliation Opening screen records, for one bank account of one Finance Book, the bank items that were
    still uncleared on the day bank reconciliation starts.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bank Reconciliation Opening screen records, for one bank account of one Finance Book, the bank items that were still uncleared on the day bank reconciliation starts. The user picks the Finance Book (labelled Profit Center when the company runs that way), the Bank Account Name and the Reconciliation Start Date, then lists each uncleared item with its account, payment mode, reference number, reference date, transaction type (Receipt or Payment) and amount [fOpeningBankReconciliation.vb:11-19; fOpeningBankReconciliation.Designer.vb:52-90]. The screen posts no voucher; it only stores the opening list, which [Bank Reconciliation](Functional_Doc_fBankReconciliation.md) later picks up (BR-14). Existing records can be opened from a search list, changed and deleted.
  tables:
  - Finance.OpeningBankReconciliationAccountDetail
  - Finance.OpeningBankReconciliationMain
- key: bill-entry
  name: Bill Entry
  module: FI
  summary: The Bill Entry screen (form code BNME, EROS client variant) books a supplier, subcontractor or expense bill against
    a customer sales order so that the cost is charged to the right cost head of that order and the payee is credited in the
    books.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bill Entry screen (form code BNME, EROS client variant) books a supplier, subcontractor or expense bill against a customer sales order so that the cost is charged to the right cost head of that order and the payee is credited in the books. A bill is raised directly against a sales order and cost head, against a pay code of an authorized EROS subcontract, or against overheads of authorized MDNs. The user captures the payee and its location, the vendor bill number, date and amount, payment mode, cost center, cost head, service (expense account) lines with HSN / SAC codes, taxes and service tax or GST rules. The screen compares the bill with the pre-calculated estimate for the cost head and can notify an approver when the estimate is exceeded. On authorization it proposes and saves a journal voucher (expense accounts and input taxes debited, payee credited), statutory and GST posting detail, and regenerates the order's post-calculation. Each bill belongs to one company, financial year and finance book; payables, job costing and GST returns rely on it.
  tables:
  - Customize.BillEntryMainEROS
  - Customize.BillEntryServiceDetailEROS
  - Customize.BillEntryTaxDetailEROS
- key: bill-of-exchange
  name: Bill of Exchange
  module: FI
  summary: The Bill of Exchange screen (window caption "BillOfExchange") records a draft drawn under an Authorized, usance
    Letter of Credit.
  description: |
    Evidence: code + ERP domain (inferred)
    The Bill of Exchange screen (window caption "BillOfExchange") records a draft drawn under an Authorized, usance Letter of Credit. The user picks the LC No., optionally the Draft Issue Date, ticks the source documents (invoices, bills or advances) the draft settles and enters the Utilize Amount for each. The screen shows the LC details, calculates the Interest Period, the Interest Amount, the Negotiating and Discounting Amount and the Net Amount, and carries the document through the status flow from Initial to Authorized. For a Payable LC, Authorizing the draft creates two vouchers: a journal that moves the utilized amount from the supplier account to the LC Payable account, and a payment voucher for interest and negotiating and discounting charges against the bank account. For a Receivable LC no voucher is posted. The screen is built on the [Letter Of Credit](Functional_Doc_fLC.md) and its [amendments](Functional_Doc_fLCAmendment.md).
  tables:
  - Finance.BillOfExchangeCustomFieldDetail
  - Finance.BillOfExchangeInvoiceDetail
  - Finance.BillOfExchangeMain
  - Finance.BillOfExchangeNotesDetail
- key: cash-flow
  name: Cash Flow
  module: FI
  summary: The Cash Flow screen (window caption "Cash Flow") prepares and stores a cash flow statement for a layout, a Finance
    Book and a date range (From Date to To Date).
  description: |
    Evidence: code + ERP domain (inferred)
    The Cash Flow screen (window caption "Cash Flow") prepares and stores a cash flow statement for a layout, a Finance Book and a date range (From Date to To Date). The user picks the FSL Name, the Finance Book and the period, presses "Show", and ticks the books to include. The screen builds the statement from the layout: opening and closing cash and bank balances, and the movement of other accounts that went through cash or bank in authorized vouchers. The description is generated from the dates. The user saves it as Initial, Release or Authorized. Only the head office company may save or delete. For a consolidated book, authorizing creates one cash flow per selected book and ties them to the consolidated one. The screen posts no voucher.
  tables:
  - Finance.CashFlowAccountDetail
  - Finance.CashFlowFBDetail
  - Finance.CashFlowFSGroupDetail
  - Finance.CashFlowMain
- key: cash-journal
  name: Cash Journal
  module: FI
  summary: The Cash Journal screen settles one pending item at a time in cash.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cash Journal screen settles one pending item at a time in cash. The user selects a Paying Unit, a Finance Book (or Profit Center), a Transaction Type (Payment or Receipt) and a Due Date, and the screen lists the items that can be settled in cash: open party references, cash counter documents, salary and settlement dues. The user selects one item, confirms the cash Account Name, the Paying/Receiving Amount, the Payment Nature and the name of the person paid or received from, and saves. The screen builds and posts an authorized cash voucher, applies the cash limits set for the payment nature, and records a cash journal entry linking the voucher to the settled item. Cashiers and finance staff use it; the cash book, party balances and payment plans depend on it.
  tables:
  - Finance.CashJournalMain
- key: cash-reconcilation
  name: Cash Reconcilation
  module: FI
  summary: The Cash Reconcilation screen records a physical cash count against the cash ledger.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cash Reconcilation screen records a physical cash count against the cash ledger. The user picks the Division (Finance Book), the date and a Cash Account, then enters, for each note denomination, how many notes are in hand. The screen multiplies each denomination by its count, totals the amounts, shows the ledger Closing Amount of the account beside it, and shows the Difference [fCashReconcilation.vb:364-377; fCashReconcilation.vb:441-466]. The record is saved with the Document No., status (Initial, Released or Authorized) and the closing amount at the time of saving. When the absolute Difference is above 0.99 the screen sends an e-mail alert after saving (BR-12). The screen posts no voucher and does not require the Difference to be zero. Saved counts can be opened, changed until authorized, and deleted.
  tables:
  - Customize.CashReconcilationDetailStarWire
  - Customize.CashReconcilationMainStarWire
- key: cenvat-utilization
  name: Cenvat Utilization
  module: FI
  summary: The Cenvat Utilization screen settles the legacy excise and service tax credit position for a month.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cenvat Utilization screen settles the legacy excise and service tax credit position for a month. For a chosen tax book and month, the screen shows the credit balances available (excise duty receivable and service tax credit), the duty payable, and the balance of each credit account as on the month end. The user enters how much of each credit account is utilized, and the total utilized for each finance book must equal the duty payable of that book. When the document is authorized, the screen posts a journal per finance book that debits the duty payable accounts and credits the credit accounts used, and records the excise register entries for the utilization. Finance and excise users maintain the screen and it supports indirect tax compliance.
  tables:
  - Finance.CenvatUtilizationBalanceUtilization
  - Finance.CenvatUtilizationMain
- key: change-in-depreciation-provision
  name: Change In Depreciation Provision
  module: FI
  summary: The Change In Depreciation Provision screen revises the remaining life and depreciation rate of asset tags after
    the depreciation rule for their class has changed.
  description: |
    Evidence: code + ERP domain (inferred)
    The Change In Depreciation Provision screen revises the remaining life and depreciation rate of asset tags after the depreciation rule for their class has changed. The user chooses a Finance Book and a Depreciation Book, and the screen lists the eligible asset tags with their values, the depreciation rate and useful life under the previous rule and under the new rule, the remaining life and the balance still to be depreciated. The user ticks the tags, may adjust the Remaining Life, Depreciation Rate and Remark, and saves. When the document is authorized, the screen creates a journal voucher for the balance of tags whose life has run out, and a reversal journal for tags that were over-depreciated. Fixed asset accountants use it; later depreciation runs read the stored rate and write-off values.
  tables:
  - FixedAsset.ChgInDepreciationProvisionMain
  - FixedAsset.ChgInDepreciationProvisionTag
- key: change-voucher-status
  name: Change Voucher Status
  module: FI
  summary: 'The Change Voucher Status screen lets an authorised person move many unapproved Payment vouchers of one finance
    book through the approval steps in a single save: Release, Accept, Reject or Authorized.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Change Voucher Status screen lets an authorised person move many unapproved Payment vouchers of one finance book through the approval steps in a single save: Release, Accept, Reject or Authorized. The user picks the Finance Book, and the grid lists every Payment voucher of that book that is not yet authorised, with its number, date, accounts, amount, source document, creator and releaser. The user ticks the vouchers, chooses the new status for each, adds remarks and saves. Every change is logged with date, status, remarks and user, and a pop-up shows the history of a voucher. Authorizing a voucher here makes it a posted voucher and moves its reference balances from in-process to actual. The screen exists for approvers who handle payments in bulk instead of opening each voucher on [Payment Voucher](Functional_Doc_fPaymentVoucher.md).
  tables:
  - Finance.ChangeVoucherStatusMain
- key: chart-of-depreciation
  name: Chart of Depreciation
  module: MD
  summary: The Chart of Depreciation screen (COD) maintains the named charts that organise fixed assets into asset classes,
    subclasses and groups.
  description: |
    Evidence: code + ERP domain (inferred)
    The Chart of Depreciation screen (COD) maintains the named charts that organise fixed assets into asset classes, subclasses and groups. The user enters a COD Name, and the screen assigns a running Code. When creating a new COD, the user may pick a Copy of COD so that the new chart starts with the same classes and groups as an existing one. For an existing COD the screen displays two read-only grids: the depreciation books that use the chart and the chart's structure of classes, subclasses and groups. The classes and groups themselves are created on the Asset Class and Asset Group screens. Fixed asset administrators use it once per depreciation structure; depreciation books, asset classes and asset groups all hang from it.
- key: cheque-print
  name: Cheque Print
  module: FI
  summary: The Cheque Print screen prepares and prints the cheques and other payment instruments for approved payables before
    the bank payment vouchers are posted.
  description: |
    Evidence: code + ERP domain (inferred)
    The Cheque Print screen prepares and prints the cheques and other payment instruments for approved payables before the bank payment vouchers are posted. The user chooses a Finance Book (or Profit Center), a Bank Account Name and a Payment Date, optionally narrows the list by Source Document, Ref. No. and reference date range, and enters a range of cheque numbers. After Show, the screen lists payees with the documents due to them. When the user ticks a payee, the next cheque number is assigned, the cheque amount is worked out, bank commission and its taxes are added, and the user can print, preview, export or e-mail the cheque on the bank's own print format. Saving records the cheque register entry. No accounting voucher is created here; the register is later used by Bank Journal so the same cheque number reaches the voucher. Finance staff use it; the bank payment run and cheque control depend on it.
- key: class-account-item-mapping
  name: Class Account/ Item Mapping
  module: MD
  summary: The Class Account/ Item Mapping screen links a depreciation book and an asset class to the ledger accounts and
    the capital items that belong to that class.
  description: |
    Evidence: code + ERP domain (inferred)
    The Class Account/ Item Mapping screen links a depreciation book and an asset class to the ledger accounts and the capital items that belong to that class. The user chooses a corporate Depreciation Book and an Asset Class; the screen shows the book's Finance Book(s) and the class's Parent Class. On the Item tab the user ticks the capital items that belong to the class. On the Account tab the user picks one account for each of four account types: Asset A/c, Depreciation A/c, Cumulative Depreciation A/c and Profit & Loss on Sale A/c. Each account must be linked to every finance book of the depreciation book. Asset capitalization, depreciation, opening balances and disposal use these accounts to post asset vouchers, and the screen is the setup that decides which accounts those postings hit.
  tables:
  - FixedAsset.ClassMappingAccountDetail
  - FixedAsset.ClassMappingItemDetail
  - FixedAsset.ClassMappingMain
- key: commission-invoice
  name: Commission Invoice
  module: FI
  summary: The Commission Invoice screen records the commission payable to a sales agent (or sub-agent) for a chosen period.
  description: |
    Evidence: code + ERP domain (inferred)
    The Commission Invoice screen records the commission payable to a sales agent (or sub-agent) for a chosen period. The user picks the Agent Name and a From Date and To Date; the screen lists the agent's authorized sales invoice lines and commercial invoice lines in that period that have not yet been billed. The user selects the lines, enters the commission quantity and chooses a commission term for each; the screen works out the basic commission per term, lets the user add a bonus or a deduction, and applies taxes and charges to the total. The bill carries the agent's own bill number and date, a due date, a payment mode, a currency and custom fields. A bill moves through document statuses; on Authorization the screen builds a journal voucher that debits the commission expense and credits the agent's payable, records GST posting detail and, for cash payment, a cash counter entry. Once authorized the bill is locked. Accounts payable and payment processing rely on the voucher it produces. The window caption reads "CommissionBill" [fCommissionBill.Designer.vb:885].
  tables:
  - Finance.CashCounterMain
  - Finance.CommissionBillCommissionDetail
  - Finance.CommissionBillInvoiceDetail
  - Finance.CommissionBillMain
  - Finance.CommissionBillNotesDetail
  - Finance.CommissionBillTaxDetail
- key: contra-voucher
  name: Contra Voucher
  module: FI
  summary: The Contra Voucher screen records a transfer between two cash or bank accounts of the same company, such as depositing
    cash into a bank or moving money between bank accounts.
  description: |
    Evidence: code + ERP domain (inferred)
    The Contra Voucher screen records a transfer between two cash or bank accounts of the same company, such as depositing cash into a bank or moving money between bank accounts. The grid opens with a credit line (the account money leaves) and a debit line (the account money enters), and only cash and bank accounts can be chosen. The screen keeps debit equal to credit, allows only one debit line and one credit line, and shows a payment detail grid for the cheque, draft or transfer particulars when the credit side is a bank account. The voucher is numbered from a numbering setting and can be saved as Initial, Release or Authorized. Treasury and accounts staff use it to keep cash and bank ledgers in step with real transfers. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Contra Voucher.
- key: credit-note
  name: Credit Note
  module: FI
  summary: 'The Credit Note screen records a credit note as an accounting voucher: an entry that credits an account (typically
    a customer or supplier) and debits the related accounts.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Credit Note screen records a credit note as an accounting voucher: an entry that credits an account (typically a customer or supplier) and debits the related accounts. The first line is a credit line, further lines can be either side, and the entry must balance. The user chooses the finance book, date and Voucher Type, adds reference, cost center, quantity or tax-rule detail where the accounts demand it, and saves the voucher as Initial, Release or Authorized. The screen numbers the voucher from a numbering setting and checks the finance book period and the user's authorisation limit. Accounts staff use it for price corrections, returns and write-downs, and the ledgers and party balances read the authorised notes. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Credit Note.
- key: dd-posting
  name: DD Posting
  module: FI
  summary: The DD Posting screen completes a bank payment made by demand draft, NEFT or RTGS.
  description: |
    Evidence: code + ERP domain (inferred)
    The DD Posting screen completes a bank payment made by demand draft, NEFT or RTGS. In Bank Journal, such a payment is first posted against a holding account. On this screen the user picks the Paying Unit, Finance Book and Bank Account Name, optionally a date range, and then one pending instrument by Cheque No. The screen shows the instrument's payment mode and amount and lists the payees covered, with their bank details, payable-at place and in-favour-of name. The user enters the actual DD, NEFT or RTGS reference and date for each payee. When every payee has a reference, saving posts a contra voucher that moves the amount from the actual bank account to the holding account, links the payee vouchers to it, and records the references and narration. Finance staff use it; the bank ledger and the payee vouchers depend on it.
- key: debit-credit-note
  name: Debit/ Credit Note
  module: FI
  summary: The Debit/ Credit Note screen records a numbered note that raises or reduces an amount owed by or to a business
    partner after the original document was posted.
  description: |
    Evidence: code + ERP domain (inferred)
    The Debit/ Credit Note screen records a numbered note that raises or reduces an amount owed by or to a business partner after the original document was posted. The user chooses the note type (Debit Note or Credit Note), the source document type (Purchase Bill, Tax Invoice, Commercial Invoice, Service Bill, Service Invoice, Freight Invoice, Outward Bill Entry, or a direct note against a vendor or customer), the partner and location, a reason and a nature (Percentage, Amount, Rate Difference, Fix Rate, Manual or Auto from quality inspection). The screen then lists the partner's posted, open bills, lets the user select bills and item lines, calculates the note amount per line, applies taxes or a GST tax rule, and, when the note is Authorized, builds an accounting voucher that is adjusted against the open bill references. Saving also writes the GST posting and, for purchase-side notes, maps the note to stock lots. Finance and purchase accountants use it; the GST returns, e-invoice utility, ledger, outstanding reports and the [VTPL Debit Credit Note](Functional_Doc_fVTPLDrCrNote.md) copy screen read the result. The screen is form 362 under the code FIDC [fDrCrNote.vb:161-181; fDrCrNote.vb:1581-1842].
  tables:
  - Finance.DrCrNoteBillDetail
  - Finance.DrCrNoteItemDetail
  - Finance.DrCrNoteItemTaxDetail
  - Finance.DrCrNoteMain
  - Finance.DrCrNoteNotesDetail
  - Finance.DrCrNoteQCParameterDetail
  - Finance.DrCrNoteTaxConcessionFormDetail
  - Finance.DrCrNoteTaxDetail
- key: debit-note
  name: Debit Note
  module: FI
  summary: 'The Debit Note screen records a debit note as an accounting voucher: an entry that debits an account (typically
    a supplier or customer) and credits the related accounts.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Debit Note screen records a debit note as an accounting voucher: an entry that debits an account (typically a supplier or customer) and credits the related accounts. The first line is a debit line, further lines can be either side, and the entry must balance. The user chooses the finance book, date and Voucher Type, adds reference, cost center, quantity or tax-rule detail where the accounts demand it, and saves the voucher as Initial, Release or Authorized. The voucher is numbered from a numbering setting and is checked against the finance book period and the user's authorisation limit. Accounts staff use it for returns to suppliers, rate differences and other debit adjustments, and ledgers and party balances read the authorised notes. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Debit Note.
- key: depreciation
  name: Depreciation
  module: FI
  summary: The Depreciation screen runs a depreciation calculation for the assets of one depreciation book over a period and
    stores the result as a document.
  description: |
    Evidence: code + ERP domain (inferred)
    The Depreciation screen runs a depreciation calculation for the assets of one depreciation book over a period and stores the result as a document. The user picks a Finance Book (through the document block), a Depreciation Book and a Depreciation Purpose (Posting, Provisional or Projection), sets the period and ticks the assets to depreciate. The screen shows the calculated depreciation per asset and per tag, and a summary per asset class. When the document is authorized and the purpose is Posting or Provisional, the screen also creates a journal voucher that charges the depreciation expense and credits the cumulative depreciation. A Provisional run also creates a reversal journal on a Reversal Date. Finance and fixed asset accountants use the screen at period end; the books, ledgers and asset registers use the stored result.
  tables:
  - FixedAsset.DepreciationMain
- key: depreciation-rule
  name: Depreciation Rule
  module: MD
  summary: The Depreciation Rule screen defines the named rules that say how a fixed asset loses value.
  description: |
    Evidence: code + ERP domain (inferred)
    The Depreciation Rule screen defines the named rules that say how a fixed asset loses value. A rule has a Depreciation Method (Straight Line, Written Down Value or Sum of the Year Digit), a Rate Type (Yearly Fixed, Year Variance or Period Variance), a Depreciation Basis (Acquisition Cost, or the difference between acquisition and salvage value), an optional Salvage Value with its type, and an Inactive tick. For a fixed yearly rate the user enters one Depreciation Rate; for variable rates the user enters a Useful Life and, for period variance, a Period Type, and the screen builds a grid of years and periods where a rate, minimum and maximum depreciation are entered. The screen assigns a running Code. Rules are later mapped to asset classes and applied when assets are capitalized and depreciated.
  tables:
  - FixedAsset.DepreciationRuleMain
  - FixedAsset.DepreciationRuleRateVarianceDetail
- key: depreciation-rule-class-mapping
  name: Depreciation Rule Class Mapping
  module: MD
  summary: The Depreciation Rule Class Mapping screen decides which depreciation rule applies to each asset class of a depreciation
    book, for a stated period.
  description: |
    Evidence: code + ERP domain (inferred)
    The Depreciation Rule Class Mapping screen decides which depreciation rule applies to each asset class of a depreciation book, for a stated period. The user picks a Depreciation Book, sets Effective From and optionally Effective To, and the screen lists every asset class of the book's chart of depreciation with its parent class. For each class the user chooses a Depreciation Rule from the active rules. A new mapping automatically closes the book's earlier open-ended mapping the day before it starts, so each book keeps a dated history of rule assignments. Once depreciation has been run for a class, its rule can no longer be changed. Asset capitalization and the depreciation run read these mappings to pick the rule for each asset.
  tables:
  - FixedAsset.DepreciationRuleClassMappingDetail
  - FixedAsset.DepreciationRuleClassMappingMain
- key: document-cancellation
  name: Document Cancellation
  module: FI
  summary: The Document Cancellation screen cancels an authorised document by posting its opposite accounting entry.
  description: |
    Evidence: code + ERP domain (inferred)
    The Document Cancellation screen cancels an authorised document by posting its opposite accounting entry. The user picks a Source Document type (a voucher type such as Payment or Journal, or another document type that creates vouchers), the Financial Year, a date range and then a Ref Doc No. from the list of authorised documents of that type. The screen then shows up to four reversal vouchers, one per voucher the document created, each with the debit and credit sides swapped, the same accounts, amounts, cost centers, quantities and references (as adjusting references), and a narration naming the cancelled voucher. When the cancellation itself is saved as Authorized, the reversal vouchers are saved, each is linked to the voucher it cancels, and an audit record is written. Nothing is changed in the source document itself. Auditors and finance controllers use it to correct approved postings without deleting them. Voucher entry mechanics are shared with [Payment Voucher](Functional_Doc_fPaymentVoucher.md); the related one-document reversal is [Reverse Voucher](Functional_Doc_fReverseVoucher.md).
  tables:
  - Finance.AuditTrailMain
  - Finance.AuditTrailVoucherDetail
- key: expense-advance
  name: Expense Advance
  module: FI
  summary: The Expense Advance screen records money advanced to an employee ahead of expenses.
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Advance screen records money advanced to an employee ahead of expenses. The user enters the document details, the employee, the advance description, the payment mode, the amount and an optional reference document. The document passes through the Initial, Release and Authorized stages. When it is authorised and finance is in use, a Journal voucher is built on the Finance Posting tab: the employee's Imprest account is debited and the employee's Payable account is credited for the amount. For a payment mode of 1 the authorisation also creates a cash counter entry for the payee. An authorised advance can no longer be edited. The advance is later set off on the [Expense Approval](Functional_Doc_fExpenseApproval.md) screen.
  tables:
  - ExpenseMgmt.ExpenseAdvance
  - Finance.CashCounterMain
- key: expense-approval
  name: Expense Approval
  module: FI
  summary: The Expense Approval screen is where an approver settles an employee's [Expense Entry](Functional_Doc_fExpenseEntry.md).
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Approval screen is where an approver settles an employee's [Expense Entry](Functional_Doc_fExpenseEntry.md). The user chooses the employee and one of that employee's authorised entries, sees its lines, taxes and supplementary values (all read-only), sets a payment mode, due date and status, and optionally adjusts the employee's open advances (see [Expense Advance](Functional_Doc_fExpenseAdvance.md)) against the claim. The document passes through Initial, Release and Authorized. On authorisation the screen shows the accounting voucher it will post: a Journal voucher that debits each expense category account and credits the employee Payable account, and, when an advance is adjusted, a second Journal voucher that debits the Payable account and credits the Imprest account. For payment mode 1 a cash counter entry is also created. An authorised approval cannot be edited, but it can be deleted, which reverses both vouchers [fExpenseApproval.vb:648-769; ExpenseMgmt.EXAPSave:35-225].
  tables:
  - ExpenseMgmt.ExpenseApprovalAdvanceDetail
  - ExpenseMgmt.ExpenseApprovalMain
  - ExpenseMgmt.ExpenseApprovalNotesDetail
  - Finance.CashCounterMain
- key: expense-category
  name: Expense Category
  module: MD
  summary: The Expense Category screen maintains the list of categories under which employee expenses are claimed, such as
    travel or lodging (Inferred from the screen's use in expense claims).
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Category screen maintains the list of categories under which employee expenses are claimed, such as travel or lodging (Inferred from the screen's use in expense claims). Each category has an automatically generated Code, a Category Name and a list of Supplementary Fields that the employee must or may fill when claiming under that category. The category is one enterprise-wide record: a new category is made available to every company at the moment it is created. The screen saves the category and its supplementary field list together as one unit. Expense Policy, Expense Advance, Expense Entry and Expense Approval later pick from this list. The Inactive tick is shown but cannot be edited on this screen.
  tables:
  - masterdata.mExpenseCategory
  - masterdata.mExpenseCategoryCompanyDetail
  - masterdata.mExpenseCategorySupplementaryField
- key: expense-category-supplementary-field
  name: Expense Category Supplementary Field
  module: MD
  summary: The Expense Category Supplementary Field screen defines the extra data fields that can be attached to expense categories,
    such as a reference number or a date.
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Category Supplementary Field screen defines the extra data fields that can be attached to expense categories, such as a reference number or a date. Each field has an automatically generated Code, a Field Name, a Data Type and a Value Type. A field is either Fixed, with a predefined list of allowed values, or Variable, where the employee types the value when claiming. The field is one enterprise-wide record made available to every company when it is created. Fields defined here are chosen per category on the [Expense Category](Functional_Doc_fExpenseCategory.md) screen and are then captured on claims. The screen saves the field and its value list together as one unit.
  tables:
  - masterdata.mExpenseCategorySuppField
  - masterdata.mExpenseCategorySuppFieldCompanyDetail
  - masterdata.mExpenseCategorySuppFieldValueDetail
- key: expense-entry
  name: Expense Entry
  module: FI
  summary: The Expense Entry screen is where an employee's expenses are recorded as a claim.
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Entry screen is where an employee's expenses are recorded as a claim. The user picks the employee and a Reporting Type, describes the claim and then lists expense lines. Each line names an Expense Category, optional Location, Expense Date, Payment Mode, quantity and amount. The screen looks up the policy that applies to the employee for that category, place and date, and fills the rate and unit from it. It then checks the line against the policy allowance, tolerance and validation type. Category-specific supplementary details and taxes are captured per line. The claim moves through Initial, Release and Authorized, and an authorised claim can be taken to [Expense Approval](Functional_Doc_fExpenseApproval.md). This screen posts no accounting voucher.
  tables:
  - ExpenseMgmt.ExpenseEntryCategoryDetail
  - ExpenseMgmt.ExpenseEntryCategoryTaxDetail
  - ExpenseMgmt.ExpenseEntryMain
  - ExpenseMgmt.ExpenseEntryNotesDetail
  - ExpenseMgmt.ExpenseEntrySupplementaryField
  - ExpenseMgmt.ExpenseEntryTaxDetail
- key: expense-policy
  name: Expense Policy
  module: FI
  summary: The Expense Policy screen defines the rules under which employees may claim expenses.
  description: |
    Evidence: code + ERP domain (inferred)
    The Expense Policy screen defines the rules under which employees may claim expenses. A policy has a name, a description, a currency and a list of category rules. Each rule says which Expense Category (and optionally which Location) it covers, for what dates, what daily allowance applies, what tolerance is accepted and whether a rate and unit are used. A rule is either General or Per Diem; Per Diem rules carry a second level of rates per category. Each rule also states how a breach is treated: Warning, Validation or Justification. The policy belongs to one company and one financial year. Employees are tied to policies on the [Policy Employee Mapping](Functional_Doc_fPolicyEmployeeMapping.md) screen, and [Expense Entry](Functional_Doc_fExpenseEntry.md) applies the policy when claims are keyed.
  tables:
  - ExpenseMgmt.ExpensePolicyCategoryDetail
  - ExpenseMgmt.ExpensePolicyDiemDetail
  - ExpenseMgmt.ExpensePolicyMain
  - ExpenseMgmt.ExpensePolicyNotesDetail
- key: finance-posting
  name: Finance Posting
  module: FI
  summary: The Finance Posting screen creates an accounting voucher for a business document that has been authorized but has
    no voucher yet.
  description: |
    Evidence: code + ERP domain (inferred)
    The Finance Posting screen creates an accounting voucher for a business document that has been authorized but has no voucher yet. The user chooses a Transaction Type, picks one source document from the list that appears, reviews the proposed debit and credit lines and the narration, and saves. The screen then writes the voucher and links it back to the source document. The posting lines are proposed by the system from the document's amounts, items and charges, and the user can change the account on lines that allow it. A saved posting cannot be edited; it can only be deleted, which removes the voucher. Finance users benefit because documents that were authorized without posting can still reach the books. In the source, only the Purchase Bill transaction type fills the document list; the other types return an empty list. The window caption reads "Finance Posting" [fFinancePosting.Designer.vb:116].
- key: financial-period
  name: Financial Period
  module: MD
  summary: The Financial Period screen divides a financial year into reporting periods for either the Financial Calendar or
    the Depreciation Calendar.
  description: |
    Evidence: code + ERP domain (inferred)
    The Financial Period screen divides a financial year into reporting periods for either the Financial Calendar or the Depreciation Calendar. The user picks a calendar type, an open financial year and a period frequency (Monthly, Quaterly, Halfyearly, Yearly or Manual). The screen then proposes the period rows (name, start date, end date) automatically. The user can correct the names and, for Manual frequency, the end dates. Each year can have one period set per calendar type. The result is the period calendar that finance and depreciation processes use to group transactions. The record is not company-specific in the data it stores (see Section 13).
  tables:
  - masterdata.mFPeriodDetail
  - masterdata.mFPeriodMain
- key: finish-goods-valuation
  name: Finish Goods Valuation
  module: FI
  summary: The Finish Goods Valuation screen revalues the closing stock of a finished-goods stock account as on a chosen date.
  description: |
    Evidence: code + ERP domain (inferred)
    The Finish Goods Valuation screen revalues the closing stock of a finished-goods stock account as on a chosen date. For one Finance Book (or Profit Center) and one stock account, it shows the closing quantity and the book balance, then values that quantity at the selling prices of authorized sales invoices raised after the as-on date (net realisable value), falling back to the last valuation or the opening rate when invoices run out. With a Ratio Analysis Category it can instead take the lower of a gross-profit-based cost and the net realisable value. The user can add tax charges on the valuation. When the document is authorized, the screen posts a journal that moves the stock account to the valued amount against a Change in Inventory account, and a reversal-type tax voucher that is reversed again on the next day. Finance and costing teams use it to carry finished goods at the lower of cost and realisable value at period end. The window caption reads "FinishedGoodValuation" [fFinishGoodsValuation.Designer.vb:671].
  tables:
  - Finance.FinishedGoodValuationDetail
  - Finance.FinishedGoodValuationMain
  - Finance.FinishedGoodValuationTaxDetail
- key: freight-invoice
  name: Freight Invoice
  module: FI
  summary: The Freight Invoice screen records a transporter's bill for carrying goods into or out of the company and turns
    it into a payable.
  description: |
    Evidence: code + ERP domain (inferred)
    The Freight Invoice screen records a transporter's bill for carrying goods into or out of the company and turns it into a payable. The user picks the transporter, the freight nature (Inward or Outward), the advice type (Invoice, On Behalf of Party or Advance) and the kind of movement document (gate entry, gate pass, dispatch challan, GRN, sales return and others), and the screen lists the authorized movement documents of that transporter that are not yet billed. For each selected document it captures freight quantity, rate and amount, shortage deductions, other deductions and advances, and then applies taxes, a service tax or GST tax rule, currency, payment mode, credit days and due date. On authorization it posts a freight journal voucher (expense, stock, price variance or clearing accounts debited, transporter payable credited), an optional advance adjustment voucher, GST posting detail, a cash counter entry for cash bills, and loads the freight cost into the stock lots of the goods received so that landed cost is correct. Each invoice belongs to one company, financial year and finance book; numbering, posting accounts and optional validations come from central settings. Accounts payable, payment processing, GST compliance and inventory valuation all depend on the data written here.
  tables:
  - Finance.CashCounterMain
  - Finance.FreightInvoiceAdvanceAdjustment
  - Finance.FreightInvoiceAdvanceDetail
  - Finance.FreightInvoiceCustomFieldDetail
  - Finance.FreightInvoiceDocumentDetail
  - Finance.FreightInvoiceDocumentDetails
