- key: rawmaterial-opening
  name: Rawmaterial Opening
  module: DRM
  summary: The Rawmaterial Opening screen loads the opening stock of discrete raw material when a company starts using the
    stores module.
  description: |
    Evidence: code + ERP domain (inferred)
    The Rawmaterial Opening screen loads the opening stock of discrete raw material when a company starts using the stores module. For one division and warehouse, the user lists each item with its make, quantity (or dimensions, pieces and length for sheet and bar items), rate, amount, ownership (own or party), traceability numbers (heat, cast, test certificate, serial), bin and cost center. Optionally, each row can carry the supplier challan details and the tax or charge lines of the original receipt. The date is fixed to the raw material start date of the company and cannot be edited. Each row becomes an opening stock lot, and where finance is in use, the opening value of owned stock is also posted to the stock and clearing accounts. Stores and finance teams benefit because stock and ledger balances begin in agreement.
