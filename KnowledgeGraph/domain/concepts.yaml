- key: sales-order-change-status
  name: Sales Order Change Status
  module: SD
  summary: The Sales Order Change Status screen records a numbered, dated "change status" document that moves an authorized
    sales order, line by line, to Hold, Cancel, Short Close, In Progress or back to Authorized.
  description: |
    Evidence: code + ERP domain (inferred)
    The Sales Order Change Status screen records a numbered, dated "change status" document that moves an authorized sales order, line by line, to Hold, Cancel, Short Close, In Progress or back to Authorized. The user selects a sales order, sees its customer, agent, current status and every item line with ordered, dispatched, returned, cancelled and balance quantities, and sets a new status and reason either for the whole order or for individual lines. Only permitted status moves are offered, and cancelling or short-closing a line is refused while production planning, batch orders or dispatch planning without a tax invoice are still open for it. When the document is saved with Authorized document status, the new line statuses are applied to the sales order itself, the order header status is recalculated, and, for orders raised against a sales agreement, the agreement's status is recalculated with optional release of the cancelled balance back to the agreement. Documents follow the company's document numbering, division and authorization conventions; an authorized document can no longer be changed.
  tables:
