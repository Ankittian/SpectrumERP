- key: gst-advance-adjustment
  name: GST Advance Adjustment
  module: FI
  summary: The GST Advance Adjustment screen adjusts customer or supplier advances against the invoice or bill that finally
    supplies the goods or service.
  description: |
    Evidence: code + ERP domain (inferred)
    The GST Advance Adjustment screen adjusts customer or supplier advances against the invoice or bill that finally supplies the goods or service. The user chooses a source document type (such as Sales Invoice or Purchase Bill), the account, and the invoice or bill reference. The screen then lists the open advances of that party, and the user states how much of each advance is adjusted, manually or by an automatic fill. When the document is authorized, the screen creates two journal vouchers: one that clears the invoice or bill against the advances, and one that moves the GST that was booked on the advance into the accounts that apply on the invoice. It also records the GST return detail for the adjustment. Finance users maintain it, and tax reporting and party balances depend on it.
  tables:
  - Finance.GSTAdvanceAdjustmentDetail
  - Finance.GSTAdvanceAdjustmentMain
- key: gst-advance-receipt
  name: GST Advance Receipt
  module: FI
  summary: The GST Advance Receipt screen records the GST that is contained in an advance received from a customer.
  description: |
    Evidence: code + ERP domain (inferred)
    The GST Advance Receipt screen records the GST that is contained in an advance received from a customer. The user picks a month, a receipt-type voucher, the customer account and one party reference (the advance that was booked), then states, per item or per line, the net amount received and the HSN and SAC code that governs it. The screen calculates the tax inside the net amount, derives the basic amount, and, once the document is authorized, posts a journal voucher that moves the tax out of the party account into the GST accounts. It also records the GST detail needed for GST return reporting. Finance users maintain it, and the GST liability on advances becomes visible in the books before the final invoice is raised. The advance reference is later used by the invoice side to adjust the advance.
  tables:
  - Finance.GSTAdvanceReceiptDetail
  - Finance.GSTAdvanceReceiptItemTaxDetail
  - Finance.GSTAdvanceReceiptMain
  - Finance.GSTAdvanceReceiptTaxDetail
- key: gst-credit-utilization
  name: GST Credit Utilization
  module: FI
  summary: The GST Credit Utilization screen settles the monthly GST liability against the input tax credit.
  description: |
    Evidence: code + ERP domain (inferred)
    The GST Credit Utilization screen settles the monthly GST liability against the input tax credit. For a chosen tax book and month it shows the output tax and advance tax collected (R1 Summary, with the invoice detail underneath), and lists the purchase invoices that carry unused input tax credit (R2 Detail). The user selects the purchase documents whose credit is used, the screen fills the credit amount per tax (CGST, SGST, IGST, Cess) up to the output tax, and shows the totals. When the document is authorized, the screen posts a journal that clears the output and advance tax accounts against the input credit accounts and leaves the net amount in the payable accounts, and it marks the used credit on each purchase document so that it cannot be used twice. The screen is maintained by Finance users and feeds the GST payment and return preparation.
  tables:
  - Finance.GSTUtilizationMain
  - Finance.GSTUtilizationVoucherDetail
- key: gst-itc-reversal
  name: GST ITC Reversal
  module: FI
  summary: The GST ITC Reversal screen reverses input tax credit that was used against a supplier invoice that the company
    has not paid within 180 days.
  description: |
    Evidence: code + ERP domain (inferred)
    The GST ITC Reversal screen reverses input tax credit that was used against a supplier invoice that the company has not paid within 180 days. For a chosen tax book and document date, the screen lists the credit already used in authorized utilizations for purchase documents whose supplier balance is still open after 180 days. The user ticks the rows to reverse. The reversed tax equals the credit that was used, and interest at 18 percent a year is calculated from the utilization date to the document date. When the document is authorized, the screen posts a journal that reverses the input credit into the payable accounts and books the interest as an expense and a payable. The reversed credit can then be used again by another credit utilization. Finance users maintain the screen and it supports GST return and compliance work.
  tables:
  - Finance.GSTITCReversalMain
  - Finance.GSTITCReversalVoucherDetail
- key: input-excise-invoice-posting
  name: Input Excise Invoice Posting
  module: FI
  summary: The Input Excise Invoice Posting screen records a supplier's excise duty invoice (called a DFT in the screen's
    narration) so that the company can take input credit for the excise duty it paid.
  description: |
    Evidence: code + ERP domain (inferred)
    The Input Excise Invoice Posting screen records a supplier's excise duty invoice (called a DFT in the screen's narration) so that the company can take input credit for the excise duty it paid. A posting is raised directly with items keyed in, or against authorized Material Receipt Notes (GRNs) and inward notes of the supplier location, against earlier excise postings (supplementary DFT), or against authorized supplementary invoices. The user captures the vendor and its location, the manufacturer or dealer the goods were shipped from with its ECC number, the vendor invoice number, date and amount, item-wise DFT quantities, rates and duties, notes and custom fields. When the posting is authorized the screen proposes and saves a journal voucher that debits the duty accounts and credits the CENVAT clearing account, and writes the excise RG Part I (quantity) and Part II (duty credit) registers. Each posting belongs to one company, financial year and finance book; numbering and status come from the shared document number control. Excise registers, DFT reports, the general ledger and the receipt documents (DFT closure on GRN lines) rely on the data written here.
  tables:
  - Finance.InExcisePostingItemDetail
  - Finance.InExcisePostingItemTaxDetail
  - Finance.InExcisePostingMain
  - Finance.InExcisePostingNotesDetail
  - Finance.InExcisePostingSummary
- key: insurance-declaration
  name: Insurance Declaration
  module: FI
  summary: The Insurance Declaration screen (window caption "InsuranceDeclaration", form code FIND) declares, for one Transit
    Insurance Policy and one date range, the sales invoices (or, for export policies, commercial invoices) that were dispatched
    under that policy [fInsuranceDeclaration.Designer.vb:797-800; Finance.FINDFillValuesDependent:61-98; Finance.FINDFillValuesDependent:136-178].
  description: |
    Evidence: code + ERP domain (inferred)
    The Insurance Declaration screen (window caption "InsuranceDeclaration", form code FIND) declares, for one Transit Insurance Policy and one date range, the sales invoices (or, for export policies, commercial invoices) that were dispatched under that policy [fInsuranceDeclaration.Designer.vb:797-800; Finance.FINDFillValuesDependent:61-98; Finance.FINDFillValuesDependent:136-178]. The user picks the policy and the period, presses Show, ticks the invoices to be covered and saves. The screen then works out the insured amount, the premium at the policy rate, the tax on the premium, and the policy balance left after the declaration (opening balance plus add-ons less this declaration) [fInsuranceDeclaration.vb:704-725; fInsuranceDeclaration.vb:827-847]. It is a document with number, date, finance book and status. An authorized declaration is locked. The screen does not post an accounting voucher; the "Account Detail" tab holds only the tax charges on the premium [fInsuranceDeclaration.Designer.vb:164-174; fInsuranceDeclaration.Designer.vb:366-368].
  tables:
  - Finance.InsuranceDeclarationMain
  - Finance.InsuranceDeclarationTaxDetail
  - Finance.InsuranceDeclarationVoucherDetail
- key: interest-calculator
  name: Interest Calculator
  module: FI
  summary: The Interest Calculator screen (window caption "Interest Calculator") works out the interest earned or charged
    on a bank account for a period and, once Authorized, books it as a journal voucher.
  description: |
    Evidence: code + ERP domain (inferred)
    The Interest Calculator screen (window caption "Interest Calculator") works out the interest earned or charged on a bank account for a period and, once Authorized, books it as a journal voucher. The user chooses the Account Name from the accounts that have a bank interest rate, the From Date and To Date, and presses Show. The screen lists the opening balance and then one row per day with the day's debits and credits, the closing balance, the interest rate in force and the interest for that day. The total is the Interest Amount. Tax or other charges can be applied to it. The document goes through the status flow from Initial to Authorized. When it is Authorized and finance is applicable, a Finance Posting tab shows the journal voucher, which is saved with the document. Deleting the document deletes its voucher. This is a posting document; its voucher rules are in BR-09 and BR-10.
  tables:
  - Finance.InterestCalculatorMain
  - Finance.InterestCalculatorNotesDetail
  - Finance.InterestCalculatorSDDetail
  - Finance.InterestCalculatortaxDetail
- key: journal-voucher
  name: Journal Voucher
  module: FI
  summary: The Journal Voucher screen records an accounting entry that moves value between ledger accounts without any cash
    or bank movement.
  description: |
    Evidence: code + ERP domain (inferred)
    The Journal Voucher screen records an accounting entry that moves value between ledger accounts without any cash or bank movement. The user picks the finance book and document date, enters debit and credit lines against any account that is not a cash or bank account, and saves the entry as Initial, Release or Authorized. The screen keeps total debit equal to total credit, offers reference, cost center, quantity and tax-rule detail on each line, and numbers the voucher from a numbering setting. For an Inter FB journal, an authorised entry also creates the counterpart journal in the other finance book. Accountants use it for adjustments, accruals, transfers and corrections, and the finance team's ledgers and reports rely on the authorised journals saved here. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Journal Voucher.
- key: layout
  name: Layout
  module: MD
  summary: The Layout screen (window caption "FSLayoutMaster") creates the named financial statement layouts, called FSL Names,
    that the statement screens use.
  description: |
    Evidence: code + ERP domain (inferred)
    The Layout screen (window caption "FSLayoutMaster") creates the named financial statement layouts, called FSL Names, that the statement screens use. Each layout is tied to one Chart of Accounts (COA) and to the Finance Books that use that chart. The user enters a name, picks the COA and ticks the Finance Books the layout applies to. The layout code is generated automatically. Section and group structure of a layout is built on the Layout Design screen. The statements, such as the Balance Sheet, Cash Flow and Ratio Analysis, pick a layout when they are prepared.
  tables:
  - masterdata.FSLayoutMasterFBDetail
  - masterdata.FSLayoutMasterMain
- key: layout-opening
  name: Layout Opening
  module: FI
  summary: The Layout Opening screen (window caption "FSLayoutOpening") lets the user enter opening amounts against the sections
    and groups of a financial statement layout, for one Finance Book (or Profit Center).
  description: |
    Evidence: code + ERP domain (inferred)
    The Layout Opening screen (window caption "FSLayoutOpening") lets the user enter opening amounts against the sections and groups of a financial statement layout, for one Finance Book (or Profit Center). The user picks an FSL Name; the screen shows its Chart of Accounts and the books that use the layout. After a book is chosen, the sections and groups of the layout appear as an indented list. The user types an opening amount and a Dr/Cr side against any line. The amounts are saved as a set for the layout and book, replacing the earlier set. Management reports for the balance sheet and cash flow read these amounts as opening figures (Inferred from their use of the stored data). The screen has no search, reopen or delete.
  tables:
  - Finance.FSLayoutOpeningMain
- key: layout-schedule
  name: Layout Schedule
  module: MD
  summary: The Layout Schedule screen (window caption "Single Field Master") maintains the list of schedule names used to
    group the lines of a financial statement layout, for example the notes to a balance sheet.
  description: |
    Evidence: code + ERP domain (inferred)
    The Layout Schedule screen (window caption "Single Field Master") maintains the list of schedule names used to group the lines of a financial statement layout, for example the notes to a balance sheet. Each schedule has a name, a sequence number that sets its order, and an automatically generated code. The screen offers a single-entry mode and a fast-entry grid with Excel import for bulk creation. Only the head office company can create or delete schedules; other companies can only view and change existing ones. The schedules are chosen on the Layout Design screen and drive the order of statement notes.
- key: letter-of-credit
  name: Letter Of Credit
  module: FI
  summary: The Letter Of Credit screen records a letter of credit (LC) opened with a bank for a supplier (payable) or received
    from a customer (receivable).
  description: |
    Evidence: code + ERP domain (inferred)
    The Letter Of Credit screen records a letter of credit (LC) opened with a bank for a supplier (payable) or received from a customer (receivable). The user enters the opening bank and its country, the nature and trade type, the category and type of LC, the supplier or customer and location, the shipment and expiry dates, the currency, the LC Amount, the percentage charges, the other banks involved, the documents required, remarks, notes and custom fields. The screen calculates the money value of interest, margin money and negotiating and discounting charges from the LC Amount. When the document is Authorized, it can also post two vouchers: a journal that moves the LC amount from the party's prepayment account to the LC payable account, and a payment voucher that books the bank charges. Finance, purchase and sales users rely on the record, and the Letter Of Credit Amendment and Order Mapping screens work on authorized LCs.
  tables:
  - Finance.LCAmendmentCustomFieldDetail
  - Finance.LCAmendmentDocumentDetail
  - Finance.LCAmendmentMain
  - Finance.LCAmendmentNotesDetail
  - Finance.LCCustomFieldDetail
  - Finance.LCDocumentDetail
  - Finance.LCMain
  - Finance.LCNotesDetail
- key: letter-of-credit-amendment
  name: Letter of Credit Amendment
  module: FI
  summary: The Letter of Credit Amendment screen records a numbered revision of an Authorized letter of credit (LC).
  description: |
    Evidence: code + ERP domain (inferred)
    The Letter of Credit Amendment screen records a numbered revision of an Authorized letter of credit (LC). The user picks the LC No., and the screen loads the current terms of that LC. Most terms are locked; the user changes the Document Date of the amendment, the Last Date of Shipment, the Expiry Date, the LC Amount, remarks, documents required, notes and custom fields. When the amendment is Authorized, it replaces the terms held on the LC and, if the LC Amount or charges rise, posts vouchers for the increase only. The screen shares its structure, fields and voucher rules with the [Letter Of Credit screen](Functional_Doc_fLC.md); this document describes what is the same only briefly and spells out the differences. Finance users rely on it to keep the LC register and its ledger entries aligned with what the bank has agreed.
  tables:
  - Finance.LCAmendmentCustomFieldDetail
  - Finance.LCAmendmentDocumentDetail
  - Finance.LCAmendmentMain
  - Finance.LCAmendmentNotesDetail
  - Finance.LCCustomFieldDetail
  - Finance.LCDocumentDetail
  - Finance.LCMain
  - Finance.LCNotesDetail
- key: order-account-assignment
  name: Order Account Assignment
  module: FI
  summary: The Order Account Assignment screen lets Finance review and change the ledger accounts that an existing order will
    use when it is later invoiced, received or booked.
  description: |
    Evidence: code + ERP domain (inferred)
    The Order Account Assignment screen lets Finance review and change the ledger accounts that an existing order will use when it is later invoiced, received or booked. The user chooses an Order Type and an Order No.; the screen shows the order date and Finance Book, and lists one line per accounting purpose of the order, for example stock account per item, tax account per charge, expense account, freight and payment-term accounts, each with the account currently proposed. The user picks a different account for any line and saves; the saved set replaces the earlier assignment of that order. Finance staff use it to correct account mapping after an order is created without amending the order itself. The accounts assigned here are read when downstream documents post their vouchers (Inferred). The window caption reads "OrderAccountAssignment" [fOrderAccountAssignment.Designer.vb:153].
- key: order-mapping
  name: Order Mapping
  module: FI
  summary: The Order Mapping screen links an Authorized letter of credit (LC) to the purchase orders or sales orders it pays
    for, and records how much of the LC is allocated to each order.
  description: |
    Evidence: code + ERP domain (inferred)
    The Order Mapping screen links an Authorized letter of credit (LC) to the purchase orders or sales orders it pays for, and records how much of the LC is allocated to each order. The user picks an LC No.; the screen shows the LC's bank, party and amount and lists the orders of that party in the same currency that are payable by LC. For each order the screen shows the Order Amount, the amount already covered by other LCs, the balance and the LC Amount to allocate. The user ticks the orders and enters allocations that stay within each order's balance and within the total LC Amount. Bill of exchange and sales dispatch screens and the LC register later use the mapping to relate LCs to orders. The screen holds no search or delete: it always starts from an LC.
  tables:
  - Finance.LCOrderDetail
- key: outward-bill-entry
  name: Outward Bill Entry
  module: FI
  summary: The Outward Bill Entry screen books a vendor's bill for services on the outward (export) side, such as freight,
    clearing or inspection, against cost heads that were estimated on export sales orders.
  description: |
    Evidence: code + ERP domain (inferred)
    The Outward Bill Entry screen books a vendor's bill for services on the outward (export) side, such as freight, clearing or inspection, against cost heads that were estimated on export sales orders. The user picks the type of outward reference (Tax Invoice, Dispatch Challan or Commercial Invoice), the customer, period and optionally a sales order and cost head, ticks the outward documents covered by the bill, and enters the vendor ("Bill From Party"), vendor bill number, date, amount, due date and payment mode. For each cost head the screen shows the estimated quantity, rate and amount from the sales orders, what was billed before, and the balance; the user enters billing quantity and rate and splits the quantity across sales orders. Taxes are applied through the shared tax control. On authorization the screen builds a journal voucher that releases the cost provision booked at invoicing, posts any difference to the expense account, posts taxes and credits the vendor's supplier payable account; it also saves the GST posting and records the provision quantity consumed. Accounts staff of each company and financial year use it; export cost control and payables depend on it.
  tables:
  - Finance.OutwardBillEntryMain
  - Finance.OutwardBillEntryReferenceDetail
  - Finance.OutwardBillEntryServiceDetail
  - Finance.OutwardBillEntryTaxDetail
  - Finance.OutwardEntrySalesOrderDetail
- key: payment-plan-partial-cancellation
  name: Payment Plan Partial Cancellation
  module: FI
  summary: The Payment Plan Partial Cancellation screen lets Finance withdraw individual reference lines from existing payment
    plans without cancelling the whole plan.
  description: |
    Evidence: code + ERP domain (inferred)
    The Payment Plan Partial Cancellation screen lets Finance withdraw individual reference lines from existing payment plans without cancelling the whole plan. The user searches by Payee Type, Payee Name or Payment Plan No., presses Show, and ticks the plan lines to cancel; only lines that have not yet been paid (no cash journal, no printed cheque and no bank payment) are offered. Saving removes the ticked lines with their payment splits, tax and account details, gives back the amount that the lines had reserved on the underlying references, and deletes a payment plan together with its cash counter entry when no lines remain. Finance staff use it to correct a plan before payment, for example when a vendor bill is to be held back. The released references and documents become available for a new payment plan. The window caption reads "PaymentPlanPartialCancellation" [fPaymentPlanPartialCancellation.Designer.vb:162].
- key: policy-employee-mapping
  name: Policy Employee Mapping
  module: FI
  summary: The Policy Employee Mapping screen decides which employees fall under which Expense Policy.
  description: |
    Evidence: code + ERP domain (inferred)
    The Policy Employee Mapping screen decides which employees fall under which Expense Policy. The user picks a policy and ticks the employees it applies to from a list of all employees, shown with employee code, name, department and designation. Saving stores the list of ticked employees for that policy and replaces any earlier list. Employees who have already claimed expenses under the policy are shown ticked and locked so that their link cannot be removed. The mapping is the bridge between the [Expense Policy](Functional_Doc_fExpensePolicy.md) rules and the claims keyed on [Expense Entry](Functional_Doc_fExpenseEntry.md). There is one mapping list per policy, and the screen holds no other business data.
  tables:
  - ExpenseMgmt.ExpensePolicyEmpDetail
- key: proforma-invoice-receipt-voucher
  name: Proforma Invoice Receipt Voucher
  module: FI
  summary: The Proforma Invoice Receipt Voucher screen is the client specific (EROS) version of the advance receipt screen
    described in [General Proforma Invoice Receipt](Functional_Doc_fGeneralPIReceipt.md).
  description: |
    Evidence: code + ERP domain (inferred)
    The Proforma Invoice Receipt Voucher screen is the client specific (EROS) version of the advance receipt screen described in [General Proforma Invoice Receipt](Functional_Doc_fGeneralPIReceipt.md). It has the same layout for customer, location, order, receipt mode, bank account, cheque details, proforma invoice selection, item lines, taxes and notes, and the same voucher proposal at authorization [fPIReceipt.vb:77-140; fPIReceipt.vb:1376-1392]. It differs by splitting every receipt between goods (Item %) and services (Service %), by a tax-deducted-at-source amount that is added back to the basic amount, and by having no party bank, no HSN and SAC code and no GST posting tab [fPIReceipt.vb:124-131; fPIReceipt.vb:437-441; fPIReceipt.vb:1173-1258; fPIReceipt.Designer.vb:429-447; fPIReceipt.Designer.vb:530-538].
  tables:
  - Customize.EROSPIReceiptInvoiceDetail
  - Customize.EROSPIReceiptItemDetail
  - Customize.EROSPIReceiptItemTaxDetail
  - Customize.EROSPIReceiptMain
  - Customize.EROSPIReceiptNotesDetail
  - Customize.EROSPIReceiptTaxDetail
- key: purchase-voucher
  name: Purchase Voucher
  module: FI
  summary: 'The Purchase Voucher screen records a purchase as a direct accounting voucher, outside the purchase bill process:
    it debits purchase or expense accounts and credits the supplier or other accounts.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Purchase Voucher screen records a purchase as a direct accounting voucher, outside the purchase bill process: it debits purchase or expense accounts and credits the supplier or other accounts. The first line is a debit line, further lines can be either side, and the entry must balance. The user chooses the finance book, date and Voucher Type, adds reference, cost center, quantity or tax-rule detail where the accounts demand it, and saves the voucher as Initial, Release or Authorized. When the company's custom validation is active the voucher must include a purchase account. Accounts staff use it for purchases that need only a ledger entry, and supplier balances and purchase reports read the authorised vouchers. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Purchase Voucher.
- key: ratio-analysis
  name: Ratio Analysis
  module: FI
  summary: The Ratio Analysis screen (window caption "RatioAnalysis") calculates a financial ratio for a layout and Finance
    Book, using the recipe defined on [Ratio Analysis Setting](Functional_Doc_fRatioAnalysisSetting.md).
  description: |
    Evidence: code + ERP domain (inferred)
    The Ratio Analysis screen (window caption "RatioAnalysis") calculates a financial ratio for a layout and Finance Book, using the recipe defined on [Ratio Analysis Setting](Functional_Doc_fRatioAnalysisSetting.md). The user gives the entry a status, a description, a date, a layout (FSL Name), a Finance Book (or Profit Center) and a Ratio Analysis Category. The screen then lists each section of the ratio with its amount and lets the user adjust it with a Less (%) and Add/Deduct amounts. A summary grid shows the final ratio value. The user may tie the entry to a saved [Balance Sheet](Functional_Doc_fBalanceSheet.md) so the amounts come from it. The screen saves its own entry (header, section rows, add/deduct rows and description rows) and posts no voucher.
  tables:
  - Finance.RatioAnalysisAddDeductDetail
  - Finance.RatioAnalysisDescriptionDetail
  - Finance.RatioAnalysisDetail
  - Finance.RatioAnalysisMain
- key: ratio-analysis-setting
  name: Ratio Analysis Setting
  module: MD
  summary: The Ratio Analysis Setting screen (window caption "RatioAnalysisSetting") defines how a financial ratio is calculated.
  description: |
    Evidence: code + ERP domain (inferred)
    The Ratio Analysis Setting screen (window caption "RatioAnalysisSetting") defines how a financial ratio is calculated. The user picks a statement layout (FSL Name), a ratio Category and the Finance Books it applies to, then lists the ratio's building blocks as Sections, such as numerator and denominator items. Each section line has a name, and the amounts behind it come from Descriptions (accounts, layout groups, layout schedules or asset classes) with optional Add/Deduct items. The user then builds a Formula over the section names with a formula builder. The saved setting is the recipe the Ratio Analysis screen uses to compute the ratio. It posts nothing.
  tables:
  - masterdata.RatioAnalysisSettingDescription
  - masterdata.RatioAnalysisSettingFBDetail
  - masterdata.RatioAnalysisSettingMain
  - masterdata.RatioAnalysisSettingOtherAddDeduct
  - masterdata.RatioAnalysisSettingSectionDetail
- key: receipt-request
  name: Receipt Request
  module: FI
  summary: The Receipt Request screen records a request to receive money from a customer, vendor, employee or other payer
    before the receipt itself is booked.
  description: |
    Evidence: code + ERP domain (inferred)
    The Receipt Request screen records a request to receive money from a customer, vendor, employee or other payer before the receipt itself is booked. The user states the Request Type, who the payer is (Payer Type, Payer Name and, for vendors and customers, Payer Location), an optional reference number and date, the Amount, the Cost Center and how the money will arrive (Receipt Mode, with cheque, draft or transfer number and date when it is not cash). Taxes can be added on the amount through the embedded tax grid. The document goes through the usual statuses and, once Authorized, is locked and becomes selectable as the source of a Sundry Receipt. Finance staff and the people who ask for receipts benefit, because every receipt booked from a request carries an approved, traceable basis. The window caption reads "ReceiptRequest" [fReceiptRequest.Designer.vb:410].
  tables:
  - Finance.ReceiptRequestMain
  - Finance.ReceiptRequestTaxDetail
- key: receipt-voucher
  name: Receipt Voucher
  module: FI
  summary: The Receipt Voucher screen records money received into a cash or bank account.
  description: |
    Evidence: code + ERP domain (inferred)
    The Receipt Voucher screen records money received into a cash or bank account. The user chooses the finance book, date and Voucher Type, then fills the voucher grid with credit lines for the accounts the money came from and debit lines for the cash or bank account that received it. When a bank account is on the voucher a payment detail grid appears for the cheque, draft or transfer particulars. The screen builds the narration automatically, keeps debit equal to credit, and checks the finance book period, account rules and authorisation limit before saving as Initial, Release or Authorized. Finance teams use it to record collections, and party balances and cash and bank books read the authorised receipts. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Receipt Voucher.
- key: received-issue-concession-form
  name: Received/Issue Concession Form
  module: FI
  summary: The Received/Issue Concession Form screen records statutory concession forms that the company issues to its suppliers
    or receives from its customers, and ties each form to the invoices it covers.
  description: |
    Evidence: code + ERP domain (inferred)
    The Received/Issue Concession Form screen records statutory concession forms that the company issues to its suppliers or receives from its customers, and ties each form to the invoices it covers. The user chooses the direction (Issue or Receive), tax book, form type, party and optional location, and the period of invoice dates. The screen lists the authorized purchase bills, sales invoices and commercial invoices of that party that were booked with the same form type and direction and are not yet covered by another entry. The user ticks the invoices that the form covers, enters the form number and dates, and saves. The entry creates no voucher; it is an evidence register that supports sales tax or VAT assessments. Finance and tax users maintain it.
  tables:
  - Finance.ConcessionFormEntryInvoiceDetail
  - Finance.ConcessionFormEntryMain
- key: recurring-voucher
  name: Recurring Voucher
  module: FI
  summary: The Recurring Voucher screen sets up a voucher that repeats on a schedule, such as monthly rent, a standing payment
    or a regular accrual.
  description: |
    Evidence: code + ERP domain (inferred)
    The Recurring Voucher screen sets up a voucher that repeats on a schedule, such as monthly rent, a standing payment or a regular accrual. The user fills in a template voucher (Journal, Payment or Receipt) with its accounts and amount, picks the Effective From date, the number of executions, the duration and the period (days, weeks or months), and chooses the status in which each generated voucher should appear. The screen lists the generated dates with an Active flag and the amount, and the user can switch individual dates off. When the schedule is saved as Authorized, a voucher is created for each date; each one is held back until its date and is then turned into a real voucher by a daily background job. Accounts staff use it to avoid retyping routine entries, and the ledgers and payment processes read the vouchers once they come into existence. The entry grid and checks are the shared voucher control described in [Payment Voucher](Functional_Doc_fPaymentVoucher.md).
  tables:
  - Finance.RecurringVoucherDetail
  - Finance.RecurringVoucherMain
- key: reference-hold-release
  name: Reference Hold/ Release
  module: FI
  summary: The Reference Hold/ Release screen lets a finance user place part of an open payable reference on Hold, or Release
    an amount that was held earlier.
  description: |
    Evidence: code + ERP domain (inferred)
    The Reference Hold/ Release screen lets a finance user place part of an open payable reference on Hold, or Release an amount that was held earlier. The user picks a Finance Book (or Profit Center), an Account Name, a Status (Hold or Release) and a Date. The screen then lists the open references of that account and the user ticks the ones to act on and enters an amount and a reason for each. Held amounts are excluded from what can be paid, and the reasons are kept as a running note on the reference. The screen creates one record per ticked reference and does not post any accounting voucher. A saved record cannot be edited; it can only be deleted, and deleting is refused when the amount has already been released. The window caption reads "ReferenceHoldReleaseDetail" [fReferenceHoldReleaseDetail.Designer.vb:151].
  tables:
  - Finance.ReferenceHoldReleaseDetail
- key: reference-reconciliation
  name: Reference Reconciliation
  module: FI
  summary: The Reference Reconciliation screen matches open items of one account against each other so that bills, advances
    and unallocated postings are cleared bill by bill.
  description: |
    Evidence: code + ERP domain (inferred)
    The Reference Reconciliation screen matches open items of one account against each other so that bills, advances and unallocated postings are cleared bill by bill. The user chooses a Finance Book (or Profit Center), an Account Nature (Creditors, Debtors, Other Debtor, Other Creditor), an Account Name and a date range, and presses Show. The screen lists two sets of open items: the items to be adjusted and the items that adjust them. The user ticks the items to adjust, then either lets the screen allocate amounts automatically (oldest due date first) or allocates by hand. On Save the screen links unallocated voucher lines to the chosen references and, where a bill is matched against another bill-type item, posts a system Journal Voucher that debits one reference account and credits the other. The matching can be undone on [Functional_Doc_fReferenceReconciliationReversal.md](Functional_Doc_fReferenceReconciliationReversal.md). The window caption reads "ReferenceReconciliation" [fReferenceReconciliation.Designer.vb:402].
- key: reference-reconciliation-reverse
  name: Reference Reconciliation Reverse
  module: FI
  summary: The Reference Reconciliation Reverse screen undoes matches that were made earlier between vouchers and open references,
    for example a payment that was set against a vendor bill.
  description: |
    Evidence: code + ERP domain (inferred)
    The Reference Reconciliation Reverse screen undoes matches that were made earlier between vouchers and open references, for example a payment that was set against a vendor bill. The user chooses a Finance Book, an Account Nature and an Account Name, and a date range. The screen shows the account's balance and its total adjusted amounts, and lists every voucher line that is currently matched to a reference of that account. The user ticks the matches to undo and saves. Each undone match returns the voucher line to the unreferenced state and restores the reference balance. No accounting voucher is created, changed or deleted by this screen; only the matching is removed. The window caption reads "ReferenceReconciliation", the same as the matching screen [fReferenceReconciliationReversal.Designer.vb:199].
- key: reverse-voucher
  name: Reverse Voucher
  module: FI
  summary: The Reverse Voucher screen records a temporary accounting entry that must be undone on a later date, such as an
    accrual booked at month end and reversed at the start of the next month.
  description: |
    Evidence: code + ERP domain (inferred)
    The Reverse Voucher screen records a temporary accounting entry that must be undone on a later date, such as an accrual booked at month end and reversed at the start of the next month. The user enters the debit and credit lines, the finance book, the document date and a Reversal Date. When the voucher is saved as Authorized, the screen also creates a second Journal voucher dated on the Reversal Date with every debit and credit swapped, and links the two. Before that, the entry stands only as a Reverse Voucher. Accountants use it for accruals, provisions and prepayments, and the ledgers show both legs once authorised. Entry grid, checks and saving are shared with [Payment Voucher](Functional_Doc_fPaymentVoucher.md); this document covers what is specific to reversal.
  tables:
  - Finance.accVoucherChildDetail
- key: salary-payment-plan
  name: Salary Payment Plan
  module: FI
  summary: The Salary Payment Plan screen groups generated salary lines of employees into one payment document so that Finance
    can pay them through the normal payment planning process.
  description: |
    Evidence: code + ERP domain (inferred)
    The Salary Payment Plan screen groups generated salary lines of employees into one payment document so that Finance can pay them through the normal payment planning process. The user sets a document date and Finance Book, chooses a Transaction Type and Payment Mode, optionally narrows the employees by salary month range, salary generation date range, Division and Department, and presses Show. The grid lists the employees whose net salary is not yet part of another plan; the user ticks the employees to pay and the screen totals their Net Amount as the Payable Amount. Saving stores the plan with the chosen employees, and authorizing it also prepares the accounting lines for each employee. Finance and payroll teams benefit because one authorized plan appears in the Payment Plan screen as a single "Salary Payable" item for payment. The window caption reads "SalaryPaymentPlan" [fSalaryPaymentPlan.Designer.vb:328].
  tables:
  - Finance.SalaryPaymentPlanDetail
  - Finance.SalaryPaymentPlanMain
- key: sales-voucher
  name: Sales Voucher
  module: FI
  summary: 'The Sales Voucher screen records a sale as a direct accounting voucher, outside the invoicing process: it credits
    sales accounts and debits the customer or other accounts.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Sales Voucher screen records a sale as a direct accounting voucher, outside the invoicing process: it credits sales accounts and debits the customer or other accounts. The first line is a credit line, further lines can be either side, and the entry must balance. The user chooses the finance book, date and Voucher Type, adds reference, cost center, quantity or tax-rule detail where the accounts demand it, and saves the voucher as Initial, Release or Authorized. When the company's custom validation is active the voucher must include a sales account. Accounts staff use it for sales that need only a ledger entry, and customer balances and sales reports read the authorised vouchers. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Sales Voucher.
- key: service-invoice
  name: Service Invoice
  module: FI
  summary: The Service Invoice screen (window caption "Service Bill") records a vendor's bill for services or subcontract
    work and turns it into a payable.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Invoice screen (window caption "Service Bill") records a vendor's bill for services or subcontract work and turns it into a payable. The user picks the source document (Direct, SC Receipt or Production Receipt), the vendor, the vendor location and the pay-to vendor, then links the vendor bill (either a document receipt entry or a typed bill number, date and amount). For SC Receipt the screen lists the vendor's authorized, unbilled subcontract receipts; for Production Receipt it lists the authorized, chargeable production entries of the vendor's job cards; for Direct the user types service lines. Each service line carries HSN/SAC code, quantity, rate, basic amount, taxes and an optional GST tax rule, and the bill carries taxes, a service tax or GST tax rule, place of state, currency, payment mode, narration and a payment schedule. Earlier vendor advances (against purchase or subcontract orders) and an imprest account can be adjusted against the bill. On authorization the screen posts a journal voucher proposed by the finance posting control, an advance adjustment voucher, statutory and GST posting detail, a cash counter entry for cash bills, and loads the service cost into the stock lots or intermediate lots of the goods received. Each bill belongs to one company, financial year and finance book.
  tables:
  - Finance.CashCounterMain
  - Finance.ServiceBillAdvanceDetail
  - Finance.ServiceBillItemDetail
  - Finance.ServiceBillItemTaxDetail
  - Finance.ServiceBillMain
  - Finance.ServiceBillNotesDetail
  - Finance.ServiceBillSummary
- key: service-tax-challan
  name: Service Tax Challan
  module: FI
  summary: The Service Tax Challan screen records the payment of service tax that the company owes for a month.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Tax Challan screen records the payment of service tax that the company owes for a month. For a chosen tax book, service tax category, month and document date, the screen collects the service tax, education cess and secondary and higher education cess that were booked on vouchers up to the month end and are not yet on a challan, grouped by tax book and service tax rule. For vouchers whose due date for challan payment has passed, it also calculates interest per voucher month at the interest rate of the service tax setting. The user records the bank challan reference and the payment mode and saves. When the challan is authorized, a cash payment entry is created if the payment mode is number 1, and otherwise the challan becomes available to the Payment Plan screen. The screen builds no voucher itself. Finance and tax users maintain it each month.
  tables:
  - Finance.CashCounterMain
  - Finance.ServiceTaxChallanInterestDetail
  - Finance.ServiceTaxChallanMain
- key: service-tax-data-verification
  name: Service Tax Data Verification
  module: FI
  summary: The Service Tax Data Verification screen lets finance users complete and correct the service tax details that vouchers
    carry before the tax is paid by challan.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Tax Data Verification screen lets finance users complete and correct the service tax details that vouchers carry before the tax is paid by challan. For a chosen tax book, month and service tax rule filter, the screen lists the service tax details of the vouchers of that month: document, party, vendor bill, amounts and the service tax payable and input or expense amounts. The user ticks the lines to correct, picks the vendor account and, where the voucher has no rule yet, the service tax abatement rule, and may change the vendor bill amount. The taxable and abatement amounts follow the rule. Saving updates the service tax details of the selected vouchers. The screen is a correction utility: it has no document number, status, search, open or delete, and it creates no voucher. Finance and tax users run it before preparing the [Service Tax Challan](Functional_Doc_fServiceTaxChallan.md).
- key: stock-difference-adjustment
  name: Stock Difference Adjustment
  module: FI
  summary: The Stock Difference Adjustment screen compares, for a Finance Book and a period, what the ledger holds against
    what the stock records hold for each stock account, and posts a journal that removes the difference.
  description: |
    Evidence: code + ERP domain (inferred)
    The Stock Difference Adjustment screen compares, for a Finance Book and a period, what the ledger holds against what the stock records hold for each stock account, and posts a journal that removes the difference. The period runs from the start of the financial year to the document date. For every stock account with a difference, the screen shows the account, the adjustment amount, whether the ledger needs a debit or a credit, and the consumption account that takes the other side. The user ticks the accounts to correct and checks the adjustment account. When the document is authorized, a journal is posted and the document is locked. The accounts team uses it at period end so that the stock accounts in the books agree with the stock valuation. The window caption reads "StockDifferenceAdjustment" [fStockDifferenceAdjustment.Designer.vb:217].
  tables:
  - Finance.StockDiffAdjustmentDetail
  - Finance.StockDiffAdjustmentMain
- key: stock-journal
  name: Stock Journal
  module: FI
  summary: The Stock Journal screen records an accounting voucher that adjusts stock accounts, such as a transfer or correction
    between stock account heads.
  description: |
    Evidence: code + ERP domain (inferred)
    The Stock Journal screen records an accounting voucher that adjusts stock accounts, such as a transfer or correction between stock account heads. The first line is a debit line, further lines can be either side, and only stock accounts can be chosen. The user picks the finance book and date, enters balanced lines, adds cost center or quantity detail where the account demands it, and saves as Initial, Release or Authorized. The screen numbers the voucher from a numbering setting and checks the finance book period and authorisation limit, using the Other Voucher form code for numbering and limits. Stores accountants use it to correct stock values in the ledger, and stock account balances read the authorised journals. The screen is a thin wrapper: the entry grid, checks and saving are shared with the other voucher screens such as [Payment Voucher](Functional_Doc_fPaymentVoucher.md), and this document describes what is specific to Stock Journal.
- key: stock-monthly-locking
  name: Stock Monthly Locking
  module: FI
  summary: The Stock Monthly Locking screen closes a month for one stock account.
  description: |
    Evidence: code + ERP domain (inferred)
    The Stock Monthly Locking screen closes a month for one stock account. For the chosen Finance Book, Stock Account and Locking Month, it lists the closing stock quantity and value by warehouse and division, next to the "actual" closing value recomputed from the stock lots, and shows the difference. When the document is authorized, the screen posts a journal for the difference between the two values and the system re-prices the stock lots of that account to the actual rate. A month can be locked only after the account's earlier locked months, and only the latest locking of an account can be deleted. Finance and stores teams use it to bring moving-average stock valuation and the ledger into agreement at month end. The window caption reads "Stock Monthly Locking" [fStockMonthlyLocking.Designer.vb:255].
  tables:
  - Finance.StockMonthlyLockingItemDetail
  - Finance.StockMonthlyLockingMain
- key: sundry-payment
  name: Sundry Payment
  module: FI
  summary: 'The Sundry Payment screen records a payment obligation that does not come from a purchase bill: an employee salary
    advance, an authorized payment request, or a direct payment to a vendor, a ledger account, an employee or a one-time payee.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Sundry Payment screen records a payment obligation that does not come from a purchase bill: an employee salary advance, an authorized payment request, or a direct payment to a vendor, a ledger account, an employee or a one-time payee. The user identifies the source, the payee and the payee location, enters the vendor bill reference, amount, payment mode, cost center and bill period, and optionally breaks the amount into service lines charged to expense accounts with HSN/SAC codes and GST tax rules. Taxes such as GST or TDS are applied through the shared tax control. When the document is authorized and has service lines for a payee other than "Others", the screen builds and saves a finance voucher that debits the expense lines and taxes and credits the payee's account; it also saves the GST posting and the statutory tax detail. Authorized cash payments also create a cash counter entry, and authorized non-cash payments without a voucher are later picked up by payment planning and payment advice. Accounts staff of each company and financial year use the screen; finance, cash and treasury functions rely on its output.
  tables:
  - Finance.CashCounterMain
  - Finance.SundryPaymentMain
  - Finance.SundryPaymentServiceDetail
  - Finance.SundryPaymentTaxDetail
- key: sundry-receipt
  name: Sundry Receipt
  module: FI
  summary: 'The Sundry Receipt screen records money received from a payer for reasons other than a normal sales invoice: a
    customer''s advance against a proforma invoice, a return of earnest money deposit or security deposit, an employee''s
    advance receipt, a response to a receipt request, or a direct receipt from a named party.'
  description: |
    Evidence: code + ERP domain (inferred)
    The Sundry Receipt screen records money received from a payer for reasons other than a normal sales invoice: a customer's advance against a proforma invoice, a return of earnest money deposit or security deposit, an employee's advance receipt, a response to a receipt request, or a direct receipt from a named party. The user states the source document, the payer, the amount, the vendor reference (the payer's own document), the receipt mode and, where applicable, the service descriptions and taxes that make up the amount. The document moves through statuses, and once Authorized it is locked. At authorization the screen builds an accounting Journal Voucher that debits the payer's account for the net amount and credits the service accounts and taxes, links it to a reference for bill-by-bill matching, and, for cash receipts, creates an entry for the cash counter. Finance, tax and cash-counter staff rely on the result. The window caption reads "Sundry Receipt" [fSundryReceipt.Designer.vb:736].
  tables:
  - Finance.CashCounterMain
  - Finance.SundryReceiptMain
  - Finance.SundryReceiptServiceDetail
  - Finance.SundryReceiptTaxDetail
- key: supplementary-invoice
  name: Supplementary Invoice
  module: FI
  summary: The Supplementary Invoice screen records an additional charge billed by a vendor (typically a subcontractor or
    service vendor) over and above the original subcontract receipt.
  description: |
    Evidence: code + ERP domain (inferred)
    The Supplementary Invoice screen records an additional charge billed by a vendor (typically a subcontractor or service vendor) over and above the original subcontract receipt. The user picks a Source Document type, the Vendor Name and Location and, when the charge relates to a receipt, the Ref. Doc No. of an authorized subcontract material receipt. The vendor's own bill number, date and amount are entered, followed by item lines (item, make, technical grade, unit, quantity, rate, HSN and SAC code), item-level taxes, document-level taxes and charges, notes and custom fields. A document moves through statuses; once Authorized it is locked and, where GST applies, its GST posting detail is stored. The screen does not create an accounting voucher itself: the amounts are picked up later by the Service Bill. An Exclude From Valuation tick keeps a document out of that pick-up. The window caption reads "Supplementary Invoice" [fSupplementaryInvoice.Designer.vb:486]. The sales-side counterpart is described in [Sales Supplementary Invoice](Functional_Doc_fSalesSupplementaryInvoice.md).
  tables:
  - Finance.SupplementaryInvoiceItemDetail
  - Finance.SupplementaryInvoiceItemTaxDetail
  - Finance.SupplementaryInvoiceMain
  - Finance.SupplementaryInvoiceNotesDetail
  - Finance.SupplementaryInvoiceTaxDetail
- key: supplier-advance
  name: Supplier Advance
  module: FI
  summary: The Supplier Advance screen, captioned "Advance Passing", approves the amount of an authorized advance request
    that will actually be paid to a supplier.
  description: |
    Evidence: code + ERP domain (inferred)
    The Supplier Advance screen, captioned "Advance Passing", approves the amount of an authorized advance request that will actually be paid to a supplier. The user chooses a vendor and location, picks one of that location's open advance requests, and the screen shows the order, the payment term, the bank guarantee position and what has already been passed. The user states the passing percent or amount, which cannot exceed what is still unpassed. Tax is calculated on the passing amount, and a due date is taken from the payment term. The document moves through statuses and is locked once Authorized. At authorization the screen posts a Journal Voucher that records the advance against the supplier, links it to a reference for matching, and, for cash payments, creates a cash-counter entry. Payment screens and reference matching use the result. The window caption reads "Advance Passing" [fAdvancePassing.designer.vb:1507].
  tables:
  - Finance.AdvancePassingMain
  - Finance.AdvancePassingTaxDetail
  - Finance.CashCounterMain
- key: tax-concession-form
  name: Tax Concession Form
  module: MD
  summary: The Tax Concession Form screen is a master that defines which statutory concession forms (such as the forms a buyer
    issues to claim a lower tax rate) the company handles and which taxes each form covers.
  description: |
    Evidence: code + ERP domain (inferred)
    The Tax Concession Form screen is a master that defines which statutory concession forms (such as the forms a buyer issues to claim a lower tax rate) the company handles and which taxes each form covers. For each form type taken from the global list, the user records a description, the tax group it belongs to and the list of tax charges it covers. The master is then used by sales and purchase documents and by the [Received/Issue Concession Form](Functional_Doc_fConcessionFormEntry.md) screen to decide which forms apply to a document that carries those taxes. Finance and tax users maintain it, and it changes rarely.
  tables:
  - masterdata.mTaxConcessionForm
  - masterdata.mTaxConcessionFormCompanyDetail
  - masterdata.mTaxConcessionFormTaxDetail
- key: tds-data-verification
  name: TDS Data Verification
  module: FI
  summary: The TDS Data Verification screen lets Finance review and correct the TDS lines that were deducted on vendor bills
    and other vouchers, month by month, before the TDS payment and the quarterly return are prepared.
  description: |
    Evidence: code + ERP domain (inferred)
    The TDS Data Verification screen lets Finance review and correct the TDS lines that were deducted on vendor bills and other vouchers, month by month, before the TDS payment and the quarterly return are prepared. The user picks a Tax Book, a month and a TDS Rule (or all rules); the screen lists every deduction of that month with unit, document, party, PAN number, bill amount, TDS rate, taxable amount and the TDS, Edu Cess and SHE Cess amounts. The user ticks the lines to correct and edits the Vendor Bill Amount and Taxable Amount, then saves. The screen has no search, no document number and no delete, because it only amends existing deduction lines. Statutory reporting benefits, because the amounts and PAN data used by the return are checked in one place. The window caption reads "TDSDataVerify" [fTDSDataVerify.Designer.vb:127].
- key: tds-payment
  name: TDS Payment
  module: FI
  summary: The TDS Payment screen records the monthly remittance of Tax Deducted at Source (TDS) that the company has withheld
    on vendor bills and salary.
  description: |
    Evidence: code + ERP domain (inferred)
    The TDS Payment screen records the monthly remittance of Tax Deducted at Source (TDS) that the company has withheld on vendor bills and salary. The user picks a Tax Book, a month and a TDS Rule, and the screen lists every undeposited TDS line deducted up to that month, with the number of months of delay and the interest due for late payment. Saving links the listed deductions to one payment document, so a deduction cannot be paid twice. The user also states how the tax will be paid (Payment Mode) and may record a challan or reference number and date. When the document is Authorized, it becomes locked and the system prepares the accounting lines for the payment, and for a cash payment it creates the cash counter entry. Finance and statutory compliance teams use it, and the TDS return screens read the paid deductions. The window caption reads "TDS Payment" [fTDSPayment.Designer.vb:213].
  tables:
  - Finance.CashCounterMain
  - Finance.TDSPaymentMain
- key: tds-quarterly-return
  name: TDS Quarterly Return
  module: FI
  summary: The TDS Quarterly Return screen records that a quarterly TDS return has been filed with the tax authority and ties
    that filing to the TDS Payments it covers.
  description: |
    Evidence: code + ERP domain (inferred)
    The TDS Quarterly Return screen records that a quarterly TDS return has been filed with the tax authority and ties that filing to the TDS Payments it covers. The user enters the Acknowledgement No. and date received from the filing, picks the Tax Book, the return form type, the quarter of the financial year and the person responsible for TDS deduction. The screen then lists the authorized TDS Payments of that book, falling in that quarter and mapped to that form type, with their bank and challan details and amounts. Saving attaches those payments to the return, so a payment cannot appear in two returns. Finance and compliance staff use it to prove what was reported in each quarter, and later screens can see which payments are already returned. The window caption reads "TDSQuarterlyReturn" [fTDSQuarterlyReturn.Designer.vb:256].
  tables:
  - Finance.TDSQuarterlyReturnDetail
  - Finance.TDSQuarterlyReturnMain
- key: tds-return-bank-challan-detail
  name: 'TDS Return: Bank Challan Detail'
  module: FI
  summary: 'The TDS Return: Bank Challan Detail screen lets Finance record, for one Tax Book and one month, the bank challan
    number and challan date against each TDS Payment of that month.'
  description: |
    Evidence: code + ERP domain (inferred)
    The TDS Return: Bank Challan Detail screen lets Finance record, for one Tax Book and one month, the bank challan number and challan date against each TDS Payment of that month. Choosing a Tax Book and Month lists the TDS Payments of that book with their TDS Rule, reference, taxable amount, TDS, Edu Cess, SHE Cess and the paying bank name; the user types a Bank Challan No. and Bank Challan Date on each row. The set of rows is stored once per Tax Book and month, so the challan details of a month are entered in one sitting and can be revised or removed as a set. The challan details are needed to prepare the quarterly TDS return, which cites the bank challan of each payment. The window caption reads "TDSReturnBankChallanDetail" [fTDSReturnBankChallanDetail.designer.vb:113].
  tables:
  - Finance.TDSReturnBankChallanDetail
- key: vehicle-insurance-declaration
  name: Vehicle Insurance Declaration
  module: FI
  summary: The Vehicle Insurance Declaration screen (window caption "VehicleInsuranceDeclaration") declares to the insurer
    the sales invoices dispatched by vehicle on one route (From Location to To Location) in one date range, under one Transit
    Insurance Policy [fVehicleInsuranceDeclaration.Designer.vb:470-473; VTPL.VIDMFillValuesDependent:25-99].
  description: |
    Evidence: code + ERP domain (inferred)
    The Vehicle Insurance Declaration screen (window caption "VehicleInsuranceDeclaration") declares to the insurer the sales invoices dispatched by vehicle on one route (From Location to To Location) in one date range, under one Transit Insurance Policy [fVehicleInsuranceDeclaration.Designer.vb:470-473; VTPL.VIDMFillValuesDependent:25-99]. The user types a declaration number and date, chooses the policy, period, route and a goods description, presses Show, and ticks the invoices to include. The screen shows the policy balance (opening, additions in the period, closing) in insured amount. On save, each declared invoice is stamped with the policy number; the stamp is removed when the declaration is changed or deleted [VTPL.VIDMSaveDeclarationDetail:31-36; VTPL.VIDMSave:69-74; VTPL.VIDMDelete:31-36]. The screen has no document status, no finance book, no tax and no accounting voucher.
  tables:
  - VTPL.VehicleInsuranceDeclarationDetail
  - VTPL.VehicleInsuranceDeclarationMain
- key: vtpl-debit-credit-note
  name: VTPL Debit Credit Note
  module: FI
  summary: This screen is a variant of the [VTPL Invoices](Functional_Doc_fVTPLInvoices.md) screen, built the same way as
    the [VTPL Sales Return](Functional_Doc_fVTPLSalesReturn.md).
  description: |
    Evidence: code + ERP domain (inferred)
    This screen is a variant of the [VTPL Invoices](Functional_Doc_fVTPLInvoices.md) screen, built the same way as the [VTPL Sales Return](Functional_Doc_fVTPLSalesReturn.md). It uses the same document storage and the same save, search, validate and delete operations of that family, but its source is an Authorized note of the [Debit/ Credit Note](Functional_Doc_fDrCrNote.md) screen raised against a Tax Invoice. The user picks such a note in a date range; the screen copies its customer, location, number, date, reason, nature, vendor bill, lines and taxes, and the copy must keep the source's number, date, basic and net amount. When Authorized it builds its own voucher (Debit Note or Credit Note type, as the source), adjusts it against the source note's invoice references, saves the GST posting under the copy, and runs the voucher-versus-lot check. It has no e-mail, export, preview or print. The screen is registered as code VTDN, form 1500, under menu 362, although its designer still carries the VTPL Invoices tag and caption. [fVTPLDrCrNote.vb:510-690; fVTPLDrCrNote.Designer.vb:732-733]
  tables:
  - Sales.VTPLInvoiceItemTaxDetail
  - Sales.VTPLInvoiceMain
  - Sales.VTPLInvoiceTaxDetail
  - Sales.VTPLInvoicesItemDetail
