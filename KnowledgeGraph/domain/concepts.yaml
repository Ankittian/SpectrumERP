  name: Bank Guarantee
  module: MM
  summary: 'The screen, captioned "Bank Guarantee" and known as Bank Guarantee Mapping, links a vendor bank guarantee, recorded
    in [Bank Guarantee](Functional_Doc_fBankGuarantee.md), to the purchase documents it secures: purchase orders, service
