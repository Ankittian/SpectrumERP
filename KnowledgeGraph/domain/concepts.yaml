- key: service-receipt-note
  name: Service Receipt Note
  module: MM
  summary: The Service Receipt Note (SRN) screen records the receipt of services and of materials returned from a subcontractor
    or service provider.
  description: |
    Evidence: code + ERP domain (inferred)
    The Service Receipt Note (SRN) screen records the receipt of services and of materials returned from a subcontractor or service provider. The user chooses the kind of source document (a Service Order, a Purchase Order, a Gate Entry or an Inter-Unit Dispatch Challan), the vendor and vendor location, and ticks the orders being received against. The screen then lists the service lines of the order (with ordered, previously received and balance quantities and the rate) and the material lines (items returned, finished or repaired, rejected or replaceable), the requisitions behind them and, for expense-mapped orders, the Material Receipt Advice documents that must be matched. The user enters received, rejected and free-of-charge quantities, warehouse and serial numbers, vendor bill and challan details, and optionally an excise posting and an online finance voucher. Order line statuses (Service Order, Purchase Order, gate pass out, indent) are recalculated on every save, already at Initial status; when the document is Authorized the receipt is also posted to stock (lots) and the voucher proposed on the Online Posting tab is saved, all in one transaction. The screen reuses the Material Receipt Note data layer ([Material Receipt Note](Functional_Doc_fGRN.md)) for the header, authorization and deletion, with its own procedures for the service lines. Stores, purchase and accounts staff benefit from receiving services and subcontracted goods against the order balance with tolerance control.
