key: goods-receipt-quality-inspection
name: Goods Receipt & Quality Inspection
module: MM
status: active
summary: Received material is inspected against QC parameters and specifications before acceptance.
description: 'Evidence: code + ERP domain (inferred)

  QC and quality parameters and specifications are set up; the gate entry and GRN record the receipt; an inspection intimation
  sends the lots for inspection and the inspection entry records accepted and rejected quantities and readings.

  '
steps:
- order: 1
  name: Define QC parameters
  form: fQCParameter
- order: 2
  name: Define quality parameters
  form: fQualityParameter
- order: 3
  name: Define quality specifications
  form: fSpecification
- order: 4
  name: Group level QC defaults
  form: fMaterialGroup
- order: 5
  name: Sub group level QC parameters
  form: fMaterialSubGroupMaster
- order: 6
  name: Record the gate inward
  form: fGateEntry
- order: 7
  name: Receive the goods
  form: fGRN
- order: 8
  name: Send the receipt for inspection
  form: fInspectionIntimation
- order: 9
  name: Record the inspection result
  form: fInspectionEntry
