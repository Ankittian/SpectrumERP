key: finance-master-setup
name: Finance Master Data Setup
module: FI
status: active
summary: Charts of accounts, ledgers, books, periods, cost centers and account rules are set up before posting.
description: |
  Evidence: code + ERP domain (inferred)
  The chart of accounts and its groups come first, then ledger accounts, reporting mappings, finance books and their periods, cost centers, expense heads and the account determination rules that transactions post through.
steps:
- order: 1
  name: Define charts of accounts
  form: fChartOfAccount
- order: 2
  name: Define account groups
  form: fAccountGroupMaster
- order: 3
  name: Create ledger accounts
  form: fAccountMaster
- order: 4
  name: Map transaction accounts to the reporting chart
  form: fReportingCOASetup
- order: 5
  name: Define finance books
  form: fFinanceBook
- order: 6
  name: Map accounting periods to books
  form: fFBPeriodMapping
- order: 7
  name: Define cost centers
  form: fCostCenterMaster
- order: 8
  name: Define expense heads
  form: fExpenseHead
- order: 9
  name: Define account determination rules
  form: fAccountRuleDefinition
